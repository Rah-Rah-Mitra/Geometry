<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Affine Combination Slider</title>
  <desc id="desc">A triangle of three base points with coefficient bars that keep total weight one, including a point beyond an edge when one coefficient is negative.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect width="980" height="560" rx="10" fill="#ffffff"/>
  <g transform="translate(54 48)">
    <polygon points="162,390 425,100 694,382" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
    <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7">
      <line x1="162" y1="390" x2="738" y2="428"/>
      <line x1="425" y1="100" x2="738" y2="428"/>
      <line x1="694" y1="382" x2="738" y2="428"/>
    </g>
    <circle cx="162" cy="390" r="12" fill="#2563eb"/>
    <circle cx="425" cy="100" r="12" fill="#0f766e"/>
    <circle cx="694" cy="382" r="12" fill="#6d28d9"/>
    <circle cx="462" cy="295" r="14" fill="#b45309"/>
    <circle cx="738" cy="428" r="14" fill="#b45309" opacity="0.9"/>
    <text x="120" y="432" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">p1</text>
    <text x="402" y="74" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">p2</text>
    <text x="710" y="368" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">p3</text>
    <text x="480" y="292" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#b45309">inside: all weights nonnegative</text>
    <text x="468" y="468" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#b45309">outside but affine: one weight negative</text>
    <line x1="580" y1="442" x2="724" y2="430" stroke="#1e3a8a" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(88 470)" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#111827">
    <rect x="0" y="0" width="246" height="46" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="270" y="0" width="246" height="46" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <rect x="540" y="0" width="246" height="46" rx="6" fill="#f5f3ff" stroke="#6d28d9"/>
    <text x="24" y="31">lambda1 = 0.20</text>
    <text x="294" y="31">lambda2 = 0.35</text>
    <text x="564" y="31">lambda3 = 0.45</text>
    <text x="808" y="31" font-weight="700" fill="#1e3a8a">sum = 1</text>
  </g>
</svg>
