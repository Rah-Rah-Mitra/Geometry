<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Barycentric Affine Coordinates</title>
  <desc id="desc">Three anchor points form a coordinate frame for an affine hull. A target point is reconstructed from weights that sum to one.</desc>
  <rect width="980" height="560" rx="10" fill="#ffffff"/>
  <g transform="translate(54 34)">
    <polygon points="165,412 500,94 748,392" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <polygon points="165,412 458,275 748,392" fill="#eff6ff" opacity="0.82"/>
    <polygon points="165,412 500,94 458,275" fill="#f0fdfa" opacity="0.78"/>
    <polygon points="500,94 748,392 458,275" fill="#f5f3ff" opacity="0.78"/>
    <g stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8">
      <line x1="458" y1="275" x2="165" y2="412"/>
      <line x1="458" y1="275" x2="500" y2="94"/>
      <line x1="458" y1="275" x2="748" y2="392"/>
    </g>
    <circle cx="165" cy="412" r="13" fill="#2563eb"/>
    <circle cx="500" cy="94" r="13" fill="#0f766e"/>
    <circle cx="748" cy="392" r="13" fill="#6d28d9"/>
    <circle cx="458" cy="275" r="15" fill="#b45309"/>
    <text x="110" y="452" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">p1</text>
    <text x="482" y="62" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">p2</text>
    <text x="768" y="402" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">p3</text>
    <text x="478" y="270" font-family="STIX Two Text, Georgia, serif" font-size="32" fill="#b45309">x</text>
    <text x="90" y="62" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Relative coordinates ignore where the origin was drawn.</text>
  </g>
  <g transform="translate(124 482)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="720" height="44" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="144" height="44" rx="7" fill="#2563eb" opacity="0.18"/>
    <rect x="144" y="0" width="252" height="44" fill="#0f766e" opacity="0.18"/>
    <rect x="396" y="0" width="324" height="44" rx="7" fill="#6d28d9" opacity="0.18"/>
    <text x="24" y="30" font-size="24" fill="#2563eb" font-weight="700">0.20 p1</text>
    <text x="174" y="30" font-size="24" fill="#0f766e" font-weight="700">0.35 p2</text>
    <text x="426" y="30" font-size="24" fill="#6d28d9" font-weight="700">0.45 p3</text>
    <text x="744" y="30" font-size="24" fill="#1e3a8a" font-weight="700">sum = 1</text>
  </g>
</svg>
