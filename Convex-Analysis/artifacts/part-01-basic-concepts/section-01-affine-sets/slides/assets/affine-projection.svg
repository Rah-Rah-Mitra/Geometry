<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Projection To An Affine Hull</title>
  <desc id="desc">A point above an affine plane projects orthogonally to the plane; the residual vector is normal to the direction subspace.</desc>
  <defs>
    <marker id="arrow-normal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#b45309"/>
    </marker>
    <marker id="arrow-dir" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="980" height="560" rx="10" fill="#ffffff"/>
  <polygon points="142,414 436,222 812,284 514,476" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
  <g stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8">
    <line x1="234" y1="358" x2="622" y2="424"/>
    <line x1="322" y1="300" x2="706" y2="364"/>
    <line x1="426" y1="232" x2="506" y2="476"/>
    <line x1="546" y1="252" x2="616" y2="408"/>
  </g>
  <line x1="348" y1="280" x2="558" y2="318" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow-dir)"/>
  <line x1="558" y1="318" x2="614" y2="150" stroke="#b45309" stroke-width="7" marker-end="url(#arrow-normal)"/>
  <line x1="614" y1="150" x2="558" y2="318" stroke="#b45309" stroke-width="4" stroke-dasharray="9 7"/>
  <circle cx="614" cy="150" r="14" fill="#b45309"/>
  <circle cx="558" cy="318" r="14" fill="#0f766e"/>
  <circle cx="348" cy="280" r="11" fill="#2563eb"/>
  <text x="632" y="146" font-family="STIX Two Text, Georgia, serif" font-size="32" fill="#111827">x</text>
  <text x="574" y="334" font-family="STIX Two Text, Georgia, serif" font-size="32" fill="#111827">P_A x</text>
  <text x="364" y="270" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#2563eb">direction L</text>
  <text x="626" y="238" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#b45309">residual normal to L</text>
  <text x="132" y="510" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">Projection certificate: x - P_A x is orthogonal to every direction vector in L.</text>
</svg>
