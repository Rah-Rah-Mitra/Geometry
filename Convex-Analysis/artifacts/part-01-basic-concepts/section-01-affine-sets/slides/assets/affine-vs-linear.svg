<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Affine Set Versus Linear Subspace</title>
  <desc id="desc">A blue line through the origin is contrasted with a parallel teal affine translate that does not pass through the origin.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#0f766e"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="980" height="560" rx="10" fill="#ffffff"/>
  <rect x="28" y="26" width="924" height="508" rx="10" fill="url(#grid)" opacity="0.72"/>
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="86" y1="460" x2="900" y2="460"/>
    <line x1="160" y1="505" x2="160" y2="70"/>
  </g>
  <text x="884" y="494" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#64748b">x</text>
  <text x="128" y="82" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#64748b">y</text>
  <circle cx="160" cy="460" r="8" fill="#111827"/>
  <text x="128" y="493" font-family="STIX Two Text, Georgia, serif" font-size="26" fill="#111827">0</text>
  <line x1="90" y1="512" x2="832" y2="122" stroke="#2563eb" stroke-width="7" marker-end="url(#arrow-blue)"/>
  <line x1="176" y1="514" x2="918" y2="124" stroke="#0f766e" stroke-width="7" marker-end="url(#arrow-teal)"/>
  <g fill="#2563eb">
    <circle cx="160" cy="475" r="10"/>
    <circle cx="388" cy="355" r="10"/>
  </g>
  <g fill="#0f766e">
    <circle cx="244" cy="478" r="10"/>
    <circle cx="472" cy="358" r="10"/>
    <circle cx="706" cy="235" r="10"/>
  </g>
  <path d="M160 460 C202 410, 218 410, 244 478" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="340" y="292" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#2563eb">linear subspace L</text>
  <text x="502" y="204" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f766e">affine translate a + L</text>
  <text x="270" y="510" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#b45309">same direction, shifted origin</text>
  <text x="64" y="48" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Test: linear means closed under scaling and contains 0; affine means closed under coefficients summing to 1.</text>
</svg>
