<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Perspective transform and epigraph cone</title>
  <desc id="desc">Scaling epigraphs through lambda produces the perspective lambda f(x over lambda).</desc>
  <defs>
    <marker id="arr" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#1E3A8A"/></marker>
    <style>
      .axis{stroke:#94A3B8;stroke-width:3}
      .ray{stroke:#1E3A8A;stroke-width:5;marker-end:url(#arr)}
      .slice{fill:#EFF6FF;stroke:#2563EB;stroke-width:4}
      .slice2{fill:#F0FDFA;stroke:#0F766E;stroke-width:4}
      .slice3{fill:#F5F3FF;stroke:#6D28D9;stroke-width:4}
      .cone{fill:#B45309;opacity:.10;stroke:#B45309;stroke-width:4}
      .ink{font:700 26px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 20px 'Source Sans 3',Arial,sans-serif;fill:#64748B}
      .math{font:400 27px 'STIX Two Text',Georgia,serif;fill:#111827}
    </style>
  </defs>
  <rect width="1100" height="640" fill="#fff"/>
  <rect x="72" y="60" width="956" height="430" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <line x1="156" y1="438" x2="880" y2="438" class="axis"/>
  <line x1="156" y1="438" x2="156" y2="106" class="axis"/>
  <line x1="156" y1="438" x2="326" y2="536" class="axis"/>
  <path class="cone" d="M156 438 L374 214 C500 102 660 132 820 310 L932 374 L326 536 Z"/>
  <path class="slice" d="M270 420 C336 334 416 304 506 340 C575 368 648 420 720 430 L710 468 C620 452 542 420 478 394 C390 358 322 378 260 454 Z"/>
  <path class="slice2" d="M338 352 C418 248 524 210 640 260 C722 294 800 350 876 358 L862 396 C760 380 676 342 604 312 C486 262 402 296 326 388 Z"/>
  <path class="slice3" d="M420 278 C512 164 650 124 806 198 C870 228 920 262 974 272 L958 312 C872 302 802 264 736 236 C604 178 506 208 400 318 Z"/>
  <line x1="156" y1="438" x2="420" y2="278" class="ray"/>
  <line x1="156" y1="438" x2="338" y2="352" class="ray" opacity=".72"/>
  <line x1="156" y1="438" x2="270" y2="420" class="ray" opacity=".55"/>
  <text x="92" y="42" class="ink">right scalar multiplication / perspective</text>
  <text x="740" y="124" class="math">g(lambda,x)=lambda f(x/lambda)</text>
  <text x="740" y="160" class="small">for lambda &gt; 0, with epigraph cone closure at lambda = 0</text>
  <text x="220" y="512" class="small">lambda axis</text>
  <text x="850" y="456" class="small">x</text>
  <text x="118" y="122" class="small">mu</text>
  <g transform="translate(732 335)">
    <rect width="236" height="104" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="18" y="36" class="small">same shape, scaled:</text>
    <text x="18" y="70" class="math">(f lambda)(x)</text>
  </g>
  <circle cx="156" cy="438" r="8" fill="#111827"/>
</svg>
