<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Functional operations ledger for convexity preservation</title>
  <desc id="desc">A central convex function certificate with eight surrounding operation cards and epigraph bookkeeping cues.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1E3A8A"/>
    </marker>
    <style>
      .bg{fill:#fff}
      .grid{stroke:#E2E8F0;stroke-width:1}
      .card{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:2}
      .blue{fill:#EFF6FF;stroke:#2563EB}
      .teal{fill:#F0FDFA;stroke:#0F766E}
      .amber{fill:#FFFBEB;stroke:#B45309}
      .violet{fill:#F5F3FF;stroke:#6D28D9}
      .ink{font:700 24px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 18px 'Source Sans 3',Arial,sans-serif;fill:#64748B}
      .math{font:400 23px 'STIX Two Text',Georgia,serif;fill:#111827}
      .accent{font:700 31px 'Source Sans 3',Arial,sans-serif;fill:#1E3A8A}
    </style>
  </defs>
  <rect class="bg" width="1100" height="640"/>
  <g opacity="0.68">
    <path class="grid" d="M60 60H1040M60 120H1040M60 180H1040M60 240H1040M60 300H1040M60 360H1040M60 420H1040M60 480H1040M60 540H1040"/>
    <path class="grid" d="M100 40V600M180 40V600M260 40V600M340 40V600M420 40V600M500 40V600M580 40V600M660 40V600M740 40V600M820 40V600M900 40V600M980 40V600"/>
  </g>
  <rect x="390" y="225" width="320" height="190" rx="10" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="4"/>
  <text x="444" y="294" class="accent">convexity certificate</text>
  <text x="432" y="338" class="math">f((1-t)x+ty) &lt;= (1-t)f(x)+t f(y)</text>
  <text x="458" y="376" class="small">track domains, epigraphs, and coefficients</text>

  <g stroke="#1E3A8A" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity="0.85">
    <path d="M390 258 C316 210 275 176 240 145"/>
    <path d="M548 225 C548 184 548 150 548 119"/>
    <path d="M710 258 C780 207 820 176 862 145"/>
    <path d="M390 354 C311 374 258 391 210 420"/>
    <path d="M710 354 C790 374 842 393 892 420"/>
    <path d="M480 415 C450 476 428 511 386 546"/>
    <path d="M620 415 C650 476 672 511 714 546"/>
  </g>

  <g transform="translate(60 70)">
    <rect class="card blue" width="260" height="105" rx="8"/>
    <text x="18" y="35" class="ink">weighted sums</text>
    <text x="18" y="67" class="math">alpha_i >= 0</text>
    <text x="18" y="92" class="small">add function values; intersect domains</text>
  </g>
  <g transform="translate(420 30)">
    <rect class="card teal" width="260" height="105" rx="8"/>
    <text x="18" y="35" class="ink">affine precompose</text>
    <text x="18" y="67" class="math">g(Ax+b)</text>
    <text x="18" y="92" class="small">pull back the epigraph inequality</text>
  </g>
  <g transform="translate(780 70)">
    <rect class="card violet" width="260" height="105" rx="8"/>
    <text x="18" y="35" class="ink">pointwise sup</text>
    <text x="18" y="67" class="math">sup_i f_i(x)</text>
    <text x="18" y="92" class="small">epigraph intersection</text>
  </g>
  <g transform="translate(55 385)">
    <rect class="card amber" width="300" height="110" rx="8"/>
    <text x="18" y="36" class="ink">partial minimization</text>
    <text x="18" y="70" class="math">inf_z h(y,z)</text>
    <text x="18" y="96" class="small">project an epigraph downward</text>
  </g>
  <g transform="translate(745 385)">
    <rect class="card teal" width="300" height="110" rx="8"/>
    <text x="18" y="36" class="ink">infimal convolution</text>
    <text x="18" y="70" class="math">inf_y f(x-y)+g(y)</text>
    <text x="18" y="96" class="small">epigraph Minkowski sum</text>
  </g>
  <g transform="translate(245 525)">
    <rect class="card violet" width="300" height="90" rx="8"/>
    <text x="18" y="34" class="ink">perspective</text>
    <text x="18" y="65" class="math">lambda f(x/lambda)</text>
  </g>
  <g transform="translate(555 525)">
    <rect class="card blue" width="300" height="90" rx="8"/>
    <text x="18" y="34" class="ink">limits and max</text>
    <text x="18" y="65" class="math">max(f,g), lim f_k</text>
  </g>
  <g transform="translate(384 444)">
    <rect class="card" width="332" height="55" rx="8"/>
    <text x="24" y="36" class="small">question for every row: which epigraph operation proves it?</text>
  </g>
</svg>
