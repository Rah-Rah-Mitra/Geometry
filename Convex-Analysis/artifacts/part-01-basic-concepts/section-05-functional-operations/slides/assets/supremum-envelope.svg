<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Pointwise supremum as an upper envelope</title>
  <desc id="desc">Several convex functions share a pointwise upper envelope whose epigraph is the intersection of epigraphs.</desc>
  <defs>
    <style>
      .axis{stroke:#94A3B8;stroke-width:3}
      .grid{stroke:#E2E8F0;stroke-width:1}
      .blue{stroke:#2563EB}
      .teal{stroke:#0F766E}
      .violet{stroke:#6D28D9}
      .amber{stroke:#B45309}
      .curve{fill:none;stroke-width:4;opacity:.72}
      .env{fill:none;stroke:#B45309;stroke-width:8;stroke-linecap:round}
      .epi{fill:#B45309;opacity:.10}
      .ink{font:700 27px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 20px 'Source Sans 3',Arial,sans-serif;fill:#64748B}
      .math{font:400 27px 'STIX Two Text',Georgia,serif;fill:#111827}
    </style>
  </defs>
  <rect width="1100" height="640" fill="#fff"/>
  <rect x="64" y="52" width="972" height="480" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <g opacity=".75">
    <path class="grid" d="M130 480H980M130 420H980M130 360H980M130 300H980M130 240H980M130 180H980M130 120H980"/>
    <path class="grid" d="M180 82V490M260 82V490M340 82V490M420 82V490M500 82V490M580 82V490M660 82V490M740 82V490M820 82V490M900 82V490"/>
  </g>
  <path class="axis" d="M120 480H994M130 500V82"/>
  <path class="curve blue" d="M140 430 C260 250 400 186 540 198 C700 210 830 304 960 430"/>
  <path class="curve teal" d="M140 282 C280 358 398 382 524 334 C668 280 798 164 960 126"/>
  <path class="curve violet" d="M140 196 C276 210 422 260 552 312 C708 374 840 382 960 270"/>
  <path class="epi" d="M140 282 C208 245 276 230 344 231 C416 233 478 252 540 278 C606 302 686 267 766 210 C846 153 900 138 960 126 L960 82 L140 82 Z"/>
  <path class="env" d="M140 282 C208 245 276 230 344 231 C416 233 478 252 540 278 C606 302 686 267 766 210 C846 153 900 138 960 126"/>
  <circle cx="344" cy="231" r="11" fill="#B45309"/>
  <circle cx="766" cy="210" r="11" fill="#B45309"/>
  <text x="158" y="104" class="ink">upper envelope: f(x) = sup_i f_i(x)</text>
  <text x="604" y="568" class="math">epi f = intersection_i epi f_i</text>
  <text x="158" y="568" class="small">The active function can change with x; convexity comes from epigraph intersection.</text>
  <g transform="translate(710 334)">
    <rect width="238" height="116" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <line x1="22" y1="34" x2="72" y2="34" class="blue" stroke-width="5"/><text x="84" y="41" class="small">convex candidate</text>
    <line x1="22" y1="66" x2="72" y2="66" class="teal" stroke-width="5"/><text x="84" y="73" class="small">linear support</text>
    <line x1="22" y1="98" x2="72" y2="98" class="amber" stroke-width="7"/><text x="84" y="105" class="small">supremum</text>
  </g>
</svg>
