<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Epigraph arithmetic for sums and infimal convolution</title>
  <desc id="desc">Two epigraphs are combined by value addition or Minkowski addition, producing a new lower boundary.</desc>
  <defs>
    <marker id="arr" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#1E3A8A"/></marker>
    <style>
      .axis{stroke:#94A3B8;stroke-width:3}
      .grid{stroke:#E2E8F0;stroke-width:1}
      .curve1{fill:none;stroke:#2563EB;stroke-width:5}
      .curve2{fill:none;stroke:#0F766E;stroke-width:5}
      .curve3{fill:none;stroke:#B45309;stroke-width:6}
      .fill1{fill:#2563EB;opacity:.10}
      .fill2{fill:#0F766E;opacity:.10}
      .fill3{fill:#B45309;opacity:.10}
      .ink{font:700 24px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 18px 'Source Sans 3',Arial,sans-serif;fill:#64748B}
      .math{font:400 22px 'STIX Two Text',Georgia,serif;fill:#111827}
    </style>
  </defs>
  <rect width="1100" height="640" fill="#fff"/>
  <g transform="translate(60 68)">
    <rect width="285" height="300" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path class="grid" d="M35 250H260M35 200H260M35 150H260M35 100H260M85 40V265M135 40V265M185 40V265M235 40V265"/>
    <path class="axis" d="M35 265H265M55 280V40"/>
    <path class="fill1" d="M55 250 C88 205 118 176 150 150 C185 120 218 98 260 78 L260 40 L55 40 Z"/>
    <path class="curve1" d="M55 250 C88 205 118 176 150 150 C185 120 218 98 260 78"/>
    <text x="36" y="26" class="ink">epi f</text>
    <text x="96" y="292" class="small">x1</text>
    <text x="11" y="72" class="small">mu1</text>
  </g>
  <g transform="translate(405 68)">
    <rect width="285" height="300" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path class="grid" d="M35 250H260M35 200H260M35 150H260M35 100H260M85 40V265M135 40V265M185 40V265M235 40V265"/>
    <path class="axis" d="M35 265H265M55 280V40"/>
    <path class="fill2" d="M55 170 C92 120 122 98 158 94 C198 93 232 124 260 178 L260 40 L55 40 Z"/>
    <path class="curve2" d="M55 170 C92 120 122 98 158 94 C198 93 232 124 260 178"/>
    <text x="36" y="26" class="ink">epi g</text>
    <text x="96" y="292" class="small">x2</text>
    <text x="11" y="72" class="small">mu2</text>
  </g>
  <path d="M350 222H390" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arr)"/>
  <path d="M696 222H736" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arr)"/>
  <g transform="translate(755 68)">
    <rect width="285" height="300" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
    <path class="grid" d="M35 250H260M35 200H260M35 150H260M35 100H260M85 40V265M135 40V265M185 40V265M235 40V265"/>
    <path class="axis" d="M35 265H265M55 280V40"/>
    <path class="fill3" d="M55 220 C92 165 132 124 172 104 C210 86 238 98 260 132 L260 40 L55 40 Z"/>
    <path class="curve3" d="M55 220 C92 165 132 124 172 104 C210 86 238 98 260 132"/>
    <text x="30" y="26" class="ink">epi(f square g)</text>
    <text x="96" y="292" class="small">x = x1 + x2</text>
    <text x="11" y="72" class="small">mu</text>
  </g>
  <g transform="translate(74 438)">
    <rect x="0" y="0" width="952" height="132" rx="10" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="24" y="42" class="ink">Epigraph rule</text>
    <text x="24" y="78" class="math">epi(f square g) = epi f + epi g, then take the lower boundary at x.</text>
    <text x="24" y="108" class="small">For ordinary addition f+g, the x-coordinate is shared; for infimal convolution, x is split into x1+x2.</text>
  </g>
</svg>
