<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Infimal convolution splitting lab</title>
  <desc id="desc">A fixed x is split into x-y and y; the value of f square g is the best split.</desc>
  <defs>
    <marker id="arr" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#1E3A8A"/></marker>
    <style>
      .axis{stroke:#94A3B8;stroke-width:3}
      .grid{stroke:#E2E8F0;stroke-width:1}
      .f{fill:none;stroke:#2563EB;stroke-width:5}
      .g{fill:none;stroke:#0F766E;stroke-width:5}
      .sum{fill:none;stroke:#B45309;stroke-width:6}
      .ink{font:700 25px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 19px 'Source Sans 3',Arial,sans-serif;fill:#64748B}
      .math{font:400 24px 'STIX Two Text',Georgia,serif;fill:#111827}
    </style>
  </defs>
  <rect width="1100" height="640" fill="#fff"/>
  <g transform="translate(70 70)">
    <rect width="430" height="340" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path class="grid" d="M45 285H390M45 230H390M45 175H390M45 120H390M100 55V300M160 55V300M220 55V300M280 55V300M340 55V300"/>
    <path class="axis" d="M44 286H396M55 306V54"/>
    <path class="f" d="M60 250 C128 154 194 122 258 152 C306 175 348 214 390 270"/>
    <path class="g" d="M60 240 C120 292 184 294 246 230 C302 170 348 104 390 84"/>
    <circle cx="248" cy="157" r="10" fill="#2563EB"/>
    <circle cx="248" cy="228" r="10" fill="#0F766E"/>
    <line x1="248" y1="157" x2="248" y2="228" stroke="#B45309" stroke-width="4" stroke-dasharray="9 7"/>
    <text x="24" y="34" class="ink">try a split y</text>
    <text x="114" y="324" class="small">same horizontal coordinate represents the split variable</text>
  </g>
  <g transform="translate(600 70)">
    <rect width="430" height="340" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
    <path class="grid" d="M45 285H390M45 230H390M45 175H390M45 120H390M100 55V300M160 55V300M220 55V300M280 55V300M340 55V300"/>
    <path class="axis" d="M44 286H396M55 306V54"/>
    <path class="sum" d="M60 262 C124 198 184 168 242 166 C304 165 356 202 390 258"/>
    <circle cx="242" cy="166" r="12" fill="#B45309"/>
    <line x1="242" y1="166" x2="242" y2="286" stroke="#B45309" stroke-width="4" stroke-dasharray="9 7"/>
    <text x="24" y="34" class="ink">best split gives lower boundary</text>
    <text x="146" y="324" class="small">minimize over y after x is fixed</text>
  </g>
  <path d="M512 240H582" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arr)"/>
  <g transform="translate(112 480)">
    <rect width="876" height="100" rx="10" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="24" y="40" class="math">(f square g)(x) = inf_y { f(x-y) + g(y) }</text>
    <text x="24" y="74" class="small">Convexity is inherited from epigraph addition; the optimizer y is a decomposition certificate, not a decoration.</text>
  </g>
</svg>
