<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 720" role="img" aria-labelledby="title desc">
  <title id="title">Gallery of convex function examples</title>
  <desc id="desc">Four original mini diagrams for affine functions, indicator functions, norms, and quadratic functions.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1380" height="680" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">
    <text x="76" y="72">Affine</text>
    <text x="430" y="72">Indicator</text>
    <text x="780" y="72">Norm</text>
    <text x="1110" y="72">Quadratic</text>
  </g>
  <g transform="translate(58 104)">
    <rect x="0" y="0" width="292" height="520" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M36 448 H258 M58 474 V40" stroke="#1e3a8a" stroke-width="4" marker-end="url(#axisArrow)"/>
    <path d="M52 362 L254 132" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <path d="M80 330 L228 162" stroke="#0f766e" stroke-width="4" stroke-dasharray="12 10"/>
    <text x="60" y="490" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">f(x)=a x+b</text>
    <text x="56" y="90" font-size="22" font-weight="600" fill="#64748b">equality on every chord</text>
  </g>
  <g transform="translate(408 104)">
    <rect x="0" y="0" width="292" height="520" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M36 448 H258 M58 474 V40" stroke="#1e3a8a" stroke-width="4" marker-end="url(#axisArrow)"/>
    <rect x="98" y="142" width="104" height="306" fill="rgba(15,118,110,.12)" stroke="#0f766e" stroke-width="5"/>
    <path d="M98 448 H202" stroke="#0f766e" stroke-width="8"/>
    <path d="M98 142 V448 M202 142 V448" stroke="#0f766e" stroke-width="5"/>
    <text x="70" y="490" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#111827">delta_C</text>
    <text x="54" y="90" font-size="22" font-weight="600" fill="#64748b">zero over C, infinity outside</text>
  </g>
  <g transform="translate(758 104)">
    <rect x="0" y="0" width="292" height="520" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M36 448 H258 M146 474 V40" stroke="#1e3a8a" stroke-width="4" marker-end="url(#axisArrow)"/>
    <path d="M52 448 L146 184 L240 448" fill="rgba(37,99,235,.10)" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/>
    <path d="M84 358 L208 358" stroke="#b45309" stroke-width="5" stroke-dasharray="12 10"/>
    <text x="74" y="490" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#111827">f(x)=|x|</text>
    <text x="52" y="90" font-size="22" font-weight="600" fill="#64748b">positive homogeneous cone</text>
  </g>
  <g transform="translate(1108 104)">
    <rect x="0" y="0" width="292" height="520" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M36 448 H258 M58 474 V40" stroke="#1e3a8a" stroke-width="4" marker-end="url(#axisArrow)"/>
    <path d="M62 420 C106 250 178 250 236 420" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 354 L220 354" stroke="#0f766e" stroke-width="5" stroke-dasharray="12 10"/>
    <text x="42" y="490" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#111827">x^T Q x / 2</text>
    <text x="52" y="90" font-size="22" font-weight="600" fill="#64748b">PSD Hessian certificate</text>
  </g>
</svg>
