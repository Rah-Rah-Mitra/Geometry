<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">Maximum and supremum convexity visual</title>
  <desc id="desc">Several affine functions form a convex upper envelope, interpreted as a supremum.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect x="26" y="26" width="1248" height="668" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <g stroke="#e2e8f0" stroke-width="2">
    <path d="M110 132 H1180"/>
    <path d="M110 232 H1180"/>
    <path d="M110 332 H1180"/>
    <path d="M110 432 H1180"/>
    <path d="M110 532 H1180"/>
    <path d="M230 104 V596"/>
    <path d="M430 104 V596"/>
    <path d="M630 104 V596"/>
    <path d="M830 104 V596"/>
    <path d="M1030 104 V596"/>
  </g>
  <path d="M92 560 H1196" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arr)"/>
  <path d="M110 584 V92" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arr)"/>
  <g fill="none" stroke-width="5" stroke-linecap="round" opacity=".58">
    <path d="M126 488 L1110 168" stroke="#94a3b8"/>
    <path d="M126 256 L1110 430" stroke="#94a3b8"/>
    <path d="M126 382 L1110 306" stroke="#94a3b8"/>
    <path d="M126 198 L1110 538" stroke="#94a3b8"/>
  </g>
  <path d="M126 256 L338 293 L612 332 L823 262 L1110 168" fill="none" stroke="#2563eb" stroke-width="10" stroke-linejoin="round"/>
  <g fill="#2563eb">
    <circle cx="338" cy="293" r="10"/>
    <circle cx="612" cy="332" r="10"/>
    <circle cx="823" cy="262" r="10"/>
  </g>
  <rect x="174" y="94" width="430" height="76" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="204" y="144" font-family="STIX Two Text, Georgia, serif" font-size="34" fill="#111827">f(x)=sup_i (a_i x+b_i)</text>
  <rect x="738" y="498" width="360" height="82" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="3"/>
  <text x="768" y="548" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f766e">pointwise upper envelope</text>
  <text x="962" y="634" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#64748b">x</text>
  <text x="56" y="112" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#64748b">value</text>
</svg>
