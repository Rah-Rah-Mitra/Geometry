<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">Convex and strongly convex bowls</title>
  <desc id="desc">A comparison between a flat convex valley and a bowl with quadratic curvature margin.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect x="24" y="26" width="1272" height="668" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <g transform="translate(70 92)">
    <rect x="0" y="0" width="550" height="510" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M56 438 H500 M84 462 V48" stroke="#1e3a8a" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M90 360 C172 338 226 334 280 334 C336 334 394 338 478 360" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
    <path d="M132 324 L442 324" stroke="#b45309" stroke-width="5" stroke-dasharray="12 10"/>
    <text x="118" y="78" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">Convex but flat</text>
    <text x="118" y="122" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="600" fill="#64748b">chords stay above, curvature may vanish</text>
    <text x="166" y="420" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">f(x)</text>
  </g>
  <g transform="translate(700 92)">
    <rect x="0" y="0" width="550" height="510" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M56 438 H500 M84 462 V48" stroke="#1e3a8a" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M96 410 C172 220 346 220 470 410" fill="none" stroke="#0f766e" stroke-width="9" stroke-linecap="round"/>
    <path d="M128 346 C208 244 354 244 438 346" fill="none" stroke="#b45309" stroke-width="5" stroke-dasharray="12 10"/>
    <path d="M128 346 L438 346" stroke="#2563eb" stroke-width="5"/>
    <text x="118" y="78" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">Strongly convex</text>
    <text x="118" y="122" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="600" fill="#64748b">a quadratic bowl fits under every chord</text>
    <text x="146" y="420" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">f(x) - m ||x||^2 / 2</text>
  </g>
  <text x="294" y="656" font-family="Source Sans 3, Arial, sans-serif" font-size="31" font-weight="700" fill="#1e3a8a">Strong convexity is convexity plus a curvature budget.</text>
</svg>
