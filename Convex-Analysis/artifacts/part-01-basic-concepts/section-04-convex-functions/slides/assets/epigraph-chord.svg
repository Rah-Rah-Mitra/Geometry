<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Epigraph and chord certificate for a convex function</title>
  <desc id="desc">A convex curve, its epigraph, a chord above the graph, and a Jensen mixture point.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <linearGradient id="epiFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".17"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <rect x="30" y="34" width="1140" height="680" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <g stroke="#e2e8f0" stroke-width="2">
    <path d="M122 114 H1088"/>
    <path d="M122 214 H1088"/>
    <path d="M122 314 H1088"/>
    <path d="M122 414 H1088"/>
    <path d="M122 514 H1088"/>
    <path d="M122 614 H1088"/>
    <path d="M220 94 V648"/>
    <path d="M360 94 V648"/>
    <path d="M500 94 V648"/>
    <path d="M640 94 V648"/>
    <path d="M780 94 V648"/>
    <path d="M920 94 V648"/>
  </g>
  <g stroke="#1e3a8a" stroke-width="5">
    <path d="M106 640 H1094" marker-end="url(#arrow)"/>
    <path d="M122 654 V92" marker-end="url(#arrow)"/>
  </g>
  <text x="1076" y="690" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">x</text>
  <text x="76" y="106" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">r</text>
  <path d="M142 548 C260 466 336 438 430 420 C535 400 610 350 700 292 C798 228 934 248 1058 314 L1058 104 L142 104 Z"
        fill="url(#epiFill)" stroke="none"/>
  <path d="M142 548 C260 466 336 438 430 420 C535 400 610 350 700 292 C798 228 934 248 1058 314"
        fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <path d="M260 466 L934 248" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
  <path d="M260 466 C450 410 616 340 934 248" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="16 12"/>
  <circle cx="260" cy="466" r="13" fill="#2563eb"/>
  <circle cx="934" cy="248" r="13" fill="#2563eb"/>
  <circle cx="596" cy="358" r="14" fill="#b45309"/>
  <line x1="596" y1="358" x2="596" y2="389" stroke="#b45309" stroke-width="5" stroke-dasharray="10 8"/>
  <circle cx="596" cy="389" r="11" fill="#0f766e"/>
  <path d="M260 466 V640 M934 248 V640 M596 389 V640" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="196" y="440" font-family="STIX Two Text, Georgia, serif" font-size="34" fill="#111827">f(x)</text>
  <text x="910" y="218" font-family="STIX Two Text, Georgia, serif" font-size="34" fill="#111827">f(y)</text>
  <text x="514" y="322" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#b45309">chord value</text>
  <text x="620" y="424" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f766e">curve value</text>
  <text x="154" y="170" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#2563eb">epi f = points on or above the graph</text>
  <text x="292" y="690" font-family="STIX Two Text, Georgia, serif" font-size="32" fill="#111827">x</text>
  <text x="918" y="690" font-family="STIX Two Text, Georgia, serif" font-size="32" fill="#111827">y</text>
  <text x="462" y="690" font-family="STIX Two Text, Georgia, serif" font-size="32" fill="#111827">(1-lambda)x + lambda y</text>
</svg>
