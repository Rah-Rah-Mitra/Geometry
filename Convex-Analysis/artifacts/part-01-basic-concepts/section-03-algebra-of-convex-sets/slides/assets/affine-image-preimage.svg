<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Affine images and inverse images preserve convexity</title>
  <desc id="desc">A convex set is sheared and translated; another convex set has a convex inverse image under a linear map.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e3a8a"/>
    </marker>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <g transform="translate(54 58)">
    <rect x="0" y="0" width="500" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="28" y="32" width="190" height="230" fill="url(#grid)"/>
    <polygon points="66,220 172,212 130,92 78,118" fill="rgba(37,99,235,.14)" stroke="#2563eb" stroke-width="5"/>
    <text x="54" y="304" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#2563eb">C</text>
    <path d="M238 162 H302" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arr)"/>
    <text x="232" y="134" font-family="STIX Two Text, Georgia, serif" font-size="24" fill="#1e3a8a">x -> Ax + b</text>
    <rect x="326" y="32" width="140" height="230" fill="url(#grid)"/>
    <polygon points="358,224 452,186 396,90 344,132" fill="rgba(15,118,110,.16)" stroke="#0f766e" stroke-width="5"/>
    <text x="340" y="304" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f766e">A(C) + b</text>
  </g>
  <g transform="translate(646 58)">
    <rect x="0" y="0" width="500" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="34" y="34" width="238" height="230" fill="url(#grid)"/>
    <line x1="42" y1="226" x2="268" y2="226" stroke="#94a3b8" stroke-width="2"/>
    <line x1="82" y1="262" x2="82" y2="42" stroke="#94a3b8" stroke-width="2"/>
    <path d="M86 242 L242 92" stroke="#b45309" stroke-width="14" stroke-linecap="round" opacity=".16"/>
    <path d="M66 224 L222 74" stroke="#b45309" stroke-width="4"/>
    <path d="M106 260 L262 110" stroke="#b45309" stroke-width="4"/>
    <text x="54" y="304" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">preimage strip</text>
    <path d="M292 162 H346" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arr)"/>
    <text x="286" y="134" font-family="STIX Two Text, Georgia, serif" font-size="24" fill="#1e3a8a">T(x) in D</text>
    <rect x="372" y="74" width="78" height="156" rx="39" fill="rgba(37,99,235,.12)" stroke="#2563eb" stroke-width="5"/>
    <text x="390" y="304" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#2563eb">D</text>
  </g>
  <text x="108" y="476" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Image rule:</text>
  <text x="242" y="476" font-family="STIX Two Text, Georgia, serif" font-size="26" fill="#111827">x,y in C implies A((1-t)x+ty)+b = (1-t)(Ax+b)+t(Ay+b)</text>
  <text x="748" y="476" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Preimage rule:</text>
  <text x="918" y="476" font-family="STIX Two Text, Georgia, serif" font-size="26" fill="#111827">test after mapping</text>
</svg>
