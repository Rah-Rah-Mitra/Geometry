<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Scalar multiplication of a convex set</title>
  <desc id="desc">A convex polygon is shrunk, expanded, and reflected by scalar multiplication.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>
  <g transform="translate(44 44)">
    <rect x="0" y="0" width="250" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="30" y="32" width="190" height="190" fill="url(#grid)"/>
    <line x1="124" y1="220" x2="124" y2="32" stroke="#94a3b8" stroke-width="2"/>
    <line x1="30" y1="126" x2="220" y2="126" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="124,126 178,126 124,72 86,158" fill="rgba(37,99,235,.14)" stroke="#2563eb" stroke-width="4"/>
    <text x="28" y="264" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">C</text>
  </g>
  <g transform="translate(334 44)">
    <rect x="0" y="0" width="250" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="30" y="32" width="190" height="190" fill="url(#grid)"/>
    <line x1="124" y1="220" x2="124" y2="32" stroke="#94a3b8" stroke-width="2"/>
    <line x1="30" y1="126" x2="220" y2="126" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="124,126 151,126 124,99 105,142" fill="rgba(15,118,110,.16)" stroke="#0f766e" stroke-width="4"/>
    <text x="28" y="264" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f766e">0.5C</text>
  </g>
  <g transform="translate(624 44)">
    <rect x="0" y="0" width="250" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="30" y="32" width="190" height="190" fill="url(#grid)"/>
    <line x1="124" y1="220" x2="124" y2="32" stroke="#94a3b8" stroke-width="2"/>
    <line x1="30" y1="126" x2="220" y2="126" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="124,126 216,126 124,34 59,181" fill="rgba(180,83,9,.14)" stroke="#b45309" stroke-width="4"/>
    <text x="28" y="264" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#b45309">1.7C</text>
  </g>
  <g transform="translate(914 44)">
    <rect x="0" y="0" width="250" height="300" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="30" y="32" width="190" height="190" fill="url(#grid)"/>
    <line x1="124" y1="220" x2="124" y2="32" stroke="#94a3b8" stroke-width="2"/>
    <line x1="30" y1="126" x2="220" y2="126" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="124,126 70,126 124,180 162,94" fill="rgba(109,40,217,.14)" stroke="#6d28d9" stroke-width="4"/>
    <text x="28" y="264" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#6d28d9">-C</text>
  </g>
  <rect x="178" y="378" width="844" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="206" y="404" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">Convexity survives every scalar; dimension collapses only when the scalar is zero.</text>
</svg>
