<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Minkowski sum of two polygons</title>
  <desc id="desc">Two convex polygons are added pointwise, producing a larger convex polygon with matching support values.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e3a8a"/>
    </marker>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <g transform="translate(54 68)">
    <rect x="0" y="0" width="310" height="410" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="30" y="36" width="250" height="260" fill="url(#grid)" opacity=".85"/>
    <line x1="32" y1="258" x2="278" y2="258" stroke="#94a3b8" stroke-width="2"/>
    <line x1="64" y1="294" x2="64" y2="42" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="64,258 208,258 64,150" fill="rgba(37,99,235,.13)" stroke="#2563eb" stroke-width="5"/>
    <circle cx="64" cy="258" r="7" fill="#2563eb"/>
    <circle cx="208" cy="258" r="7" fill="#2563eb"/>
    <circle cx="64" cy="150" r="7" fill="#2563eb"/>
    <text x="32" y="346" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Set A</text>
    <text x="32" y="382" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#475569">conv{(0,0),(2,0),(0,1)}</text>
  </g>
  <g transform="translate(445 68)">
    <rect x="0" y="0" width="310" height="410" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="30" y="36" width="250" height="260" fill="url(#grid)" opacity=".85"/>
    <line x1="32" y1="258" x2="278" y2="258" stroke="#94a3b8" stroke-width="2"/>
    <line x1="64" y1="294" x2="64" y2="42" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="64,258 136,258 64,186" fill="rgba(15,118,110,.14)" stroke="#0f766e" stroke-width="5"/>
    <circle cx="64" cy="258" r="7" fill="#0f766e"/>
    <circle cx="136" cy="258" r="7" fill="#0f766e"/>
    <circle cx="64" cy="186" r="7" fill="#0f766e"/>
    <text x="32" y="346" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f766e">Set B</text>
    <text x="32" y="382" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#475569">conv{(0,0),(1,0),(0,1)}</text>
  </g>
  <g transform="translate(836 68)">
    <rect x="0" y="0" width="310" height="410" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="30" y="36" width="250" height="260" fill="url(#grid)" opacity=".85"/>
    <line x1="32" y1="258" x2="278" y2="258" stroke="#94a3b8" stroke-width="2"/>
    <line x1="64" y1="294" x2="64" y2="42" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="64,258 280,258 208,186 64,114" fill="rgba(180,83,9,.12)" stroke="#b45309" stroke-width="5"/>
    <circle cx="64" cy="258" r="7" fill="#b45309"/>
    <circle cx="280" cy="258" r="7" fill="#b45309"/>
    <circle cx="208" cy="186" r="7" fill="#b45309"/>
    <circle cx="64" cy="114" r="7" fill="#b45309"/>
    <text x="32" y="346" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#b45309">A + B</text>
    <text x="32" y="382" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#475569">conv{(0,0),(3,0),(2,1),(0,2)}</text>
  </g>
  <text x="391" y="278" font-family="Source Sans 3, Arial, sans-serif" font-size="44" font-weight="700" fill="#1e3a8a">+</text>
  <path d="M770 278 H820" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(168 532)">
    <rect x="0" y="0" width="864" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="24" y="32" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Support check:</text>
    <text x="190" y="32" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">h<tspan baseline-shift="sub" font-size="18">A+B</tspan>(1,1) = 3 = h<tspan baseline-shift="sub" font-size="18">A</tspan>(1,1) + h<tspan baseline-shift="sub" font-size="18">B</tspan>(1,1)</text>
  </g>
</svg>
