<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Products and slices of convex sets</title>
  <desc id="desc">The Cartesian product of two intervals is convex, and affine slices remain convex.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1120" height="560" fill="#ffffff"/>
  <g transform="translate(66 78)">
    <rect x="0" y="0" width="440" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="78" y="54" width="288" height="202" fill="url(#grid)"/>
    <rect x="132" y="96" width="180" height="112" fill="rgba(37,99,235,.12)" stroke="#2563eb" stroke-width="5"/>
    <line x1="132" y1="158" x2="312" y2="158" stroke="#b45309" stroke-width="5"/>
    <line x1="226" y1="96" x2="226" y2="208" stroke="#0f766e" stroke-width="5"/>
    <text x="138" y="288" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#2563eb">C x D</text>
    <text x="92" y="322" font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#64748b">horizontal and vertical slices are convex</text>
  </g>
  <g transform="translate(616 78)">
    <rect x="0" y="0" width="440" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="70" y="56" width="300" height="204" fill="url(#grid)"/>
    <polygon points="120,226 326,226 242,116 156,100" fill="rgba(15,118,110,.12)" stroke="#0f766e" stroke-width="5"/>
    <path d="M102 188 L336 118" stroke="#b45309" stroke-width="5"/>
    <circle cx="164" cy="169" r="8" fill="#b45309"/>
    <circle cx="252" cy="143" r="8" fill="#b45309"/>
    <text x="72" y="288" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f766e">slice of E by an affine plane</text>
    <text x="72" y="322" font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#64748b">intersecting a convex set with a line gives a convex interval</text>
  </g>
  <rect x="172" y="464" width="776" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="202" y="495" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">(x1,y1),(x2,y2) in C x D  =>  ((1-t)x1+t x2, (1-t)y1+t y2) in C x D</text>
</svg>
