<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
  <title id="title">Closure warning for projections and sums</title>
  <desc id="desc">A closed epigraph can project to an open ray because the boundary value is approached but never attained.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect width="1160" height="560" fill="#ffffff"/>
  <g transform="translate(70 64)">
    <rect x="0" y="0" width="500" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="72" y1="302" x2="438" y2="302" stroke="#94a3b8" stroke-width="3"/>
    <line x1="250" y1="322" x2="250" y2="54" stroke="#94a3b8" stroke-width="3"/>
    <path d="M82 286 C128 282 172 276 206 260 C244 242 272 206 300 148 C318 110 338 78 376 62" fill="none" stroke="#2563eb" stroke-width="6"/>
    <path d="M82 286 C128 282 172 276 206 260 C244 242 272 206 300 148 C318 110 338 78 376 62 L438 62 L438 302 L82 302 Z" fill="rgba(37,99,235,.10)"/>
    <line x1="72" y1="302" x2="438" y2="302" stroke="#b45309" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="44" y="342" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#2563eb">closed epigraph of exp(x)</text>
    <text x="108" y="52" font-family="STIX Two Text, Georgia, serif" font-size="24" fill="#475569">y >= exp(x)</text>
  </g>
  <path d="M594 244 H672" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arr)"/>
  <text x="604" y="214" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">project</text>
  <g transform="translate(706 64)">
    <rect x="0" y="0" width="370" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="108" y1="306" x2="108" y2="58" stroke="#94a3b8" stroke-width="3"/>
    <line x1="94" y1="302" x2="318" y2="302" stroke="#94a3b8" stroke-width="3"/>
    <line x1="108" y1="290" x2="108" y2="84" stroke="#b45309" stroke-width="12" stroke-linecap="round"/>
    <circle cx="108" cy="302" r="9" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <text x="144" y="108" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#111827">{ y : y > 0 }</text>
    <text x="44" y="342" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">not closed: 0 is missing</text>
  </g>
  <rect x="172" y="470" width="816" height="44" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="202" y="500" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">Convexity is preserved by projection; closedness may be lost without extra hypotheses.</text>
</svg>
