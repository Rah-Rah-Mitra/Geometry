<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Segment Test Gallery</title>
  <desc id="desc">Three convexity segment tests showing a polygon, a halfspace, and a cone with checked sample pairs.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0F766E"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#FFFFFF"/>
  <rect x="24" y="24" width="912" height="512" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <g transform="translate(54,70)">
    <text x="0" y="-22" fill="#1E3A8A" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700">1. polygon segment remains inside</text>
    <rect x="0" y="0" width="260" height="360" fill="url(#grid)" stroke="#E2E8F0"/>
    <polygon points="48,270 58,110 150,42 226,126 212,286 96,320" fill="#2563EB" opacity="0.12" stroke="#2563EB" stroke-width="4"/>
    <line x1="82" y1="250" x2="194" y2="104" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
    <circle cx="82" cy="250" r="9" fill="#1E3A8A"/>
    <circle cx="194" cy="104" r="9" fill="#1E3A8A"/>
    <circle cx="138" cy="177" r="10" fill="#B45309"/>
    <text x="63" y="282" fill="#111827" font-family="STIX Two Text, Georgia, serif" font-size="26" font-style="italic">x</text>
    <text x="205" y="96" fill="#111827" font-family="STIX Two Text, Georgia, serif" font-size="26" font-style="italic">y</text>
    <text x="148" y="185" fill="#B45309" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700">t = 0.5</text>
  </g>
  <g transform="translate(350,70)">
    <text x="0" y="-22" fill="#1E3A8A" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700">2. halfspace sign is preserved</text>
    <rect x="0" y="0" width="260" height="360" fill="url(#grid)" stroke="#E2E8F0"/>
    <polygon points="0,62 260,154 260,360 0,360" fill="#0F766E" opacity="0.12"/>
    <line x1="0" y1="62" x2="260" y2="154" stroke="#0F766E" stroke-width="5"/>
    <path d="M118 115 L154 30" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow-teal)"/>
    <line x1="48" y1="280" x2="202" y2="224" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
    <circle cx="48" cy="280" r="9" fill="#1E3A8A"/>
    <circle cx="202" cy="224" r="9" fill="#1E3A8A"/>
    <circle cx="125" cy="252" r="10" fill="#B45309"/>
    <text x="160" y="38" fill="#0F766E" font-family="STIX Two Text, Georgia, serif" font-size="25" font-style="italic">a</text>
    <text x="28" y="320" fill="#111827" font-family="Source Sans 3, Arial, sans-serif" font-size="22">a · z <= b</text>
  </g>
  <g transform="translate(646,70)">
    <text x="0" y="-22" fill="#1E3A8A" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700">3. cone segment follows addition</text>
    <rect x="0" y="0" width="260" height="360" fill="url(#grid)" stroke="#E2E8F0"/>
    <path d="M130 300 L214 78 A235 235 0 0 0 66 92 Z" fill="#6D28D9" opacity="0.13" stroke="#6D28D9" stroke-width="4"/>
    <line x1="130" y1="300" x2="214" y2="78" stroke="#6D28D9" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <line x1="130" y1="300" x2="66" y2="92" stroke="#6D28D9" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <line x1="84" y1="156" x2="184" y2="120" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
    <circle cx="84" cy="156" r="9" fill="#1E3A8A"/>
    <circle cx="184" cy="120" r="9" fill="#1E3A8A"/>
    <circle cx="134" cy="138" r="10" fill="#B45309"/>
    <text x="141" y="324" fill="#111827" font-family="STIX Two Text, Georgia, serif" font-size="25">0</text>
    <text x="50" y="72" fill="#6D28D9" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700">ray 1</text>
    <text x="196" y="65" fill="#6D28D9" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700">ray 2</text>
  </g>
  <text x="54" y="486" fill="#475569" font-family="Source Sans 3, Arial, sans-serif" font-size="24">Inspection rule: for each displayed pair, every point (1 - t)x + ty with 0 <= t <= 1 stays in the same blue/teal/violet region.</text>
</svg>
