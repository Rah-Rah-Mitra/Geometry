<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Polyhedral Cone From Generators</title>
  <desc id="desc">Two generator rays span a cone fan with a conic membership certificate and a dual inspection vector.</desc>
  <defs>
    <marker id="ray" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563EB"/>
    </marker>
    <marker id="dual" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#0F766E"/>
    </marker>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.42"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="#FFFFFF"/>
  <rect x="28" y="28" width="904" height="504" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <g transform="translate(64,58)">
    <rect x="0" y="0" width="568" height="430" fill="url(#grid)" stroke="#E2E8F0"/>
    <line x1="70" y1="354" x2="520" y2="354" stroke="#94A3B8" stroke-width="3"/>
    <line x1="96" y1="394" x2="96" y2="36" stroke="#94A3B8" stroke-width="3"/>
    <path d="M96 354 L496 214 A420 420 0 0 0 188 34 Z" fill="#2563EB" opacity="0.13" stroke="#2563EB" stroke-width="5"/>
    <line x1="96" y1="354" x2="496" y2="214" stroke="#2563EB" stroke-width="5" marker-end="url(#ray)"/>
    <line x1="96" y1="354" x2="188" y2="34" stroke="#2563EB" stroke-width="5" marker-end="url(#ray)"/>
    <line x1="96" y1="354" x2="384" y2="134" stroke="#B45309" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#ray)"/>
    <circle cx="384" cy="134" r="13" fill="#B45309"/>
    <path d="M96 354 L212 248" stroke="#0F766E" stroke-width="5" marker-end="url(#dual)"/>
    <text x="500" y="202" font-family="STIX Two Text, Georgia, serif" font-size="30" font-style="italic" fill="#2563EB">g1</text>
    <text x="196" y="34" font-family="STIX Two Text, Georgia, serif" font-size="30" font-style="italic" fill="#2563EB">g2</text>
    <text x="398" y="129" font-family="STIX Two Text, Georgia, serif" font-size="30" font-style="italic" fill="#B45309">y</text>
    <text x="218" y="258" font-family="STIX Two Text, Georgia, serif" font-size="28" font-style="italic" fill="#0F766E">c</text>
    <text x="108" y="383" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">0</text>
  </g>
  <g transform="translate(684,78)">
    <text x="0" y="0" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E3A8A">Generator certificate</text>
    <rect x="0" y="28" width="220" height="170" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="20" y="78" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">y = 1.4g1 + 0.8g2</text>
    <text x="20" y="125" font-family="Source Sans 3, Arial, sans-serif" font-size="25" fill="#0F766E">coefficients >= 0</text>
    <text x="20" y="162" font-family="Source Sans 3, Arial, sans-serif" font-size="25" fill="#0F766E">rank(G) = 2</text>
    <text x="0" y="250" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E3A8A">Dual inspection</text>
    <rect x="0" y="278" width="220" height="112" rx="8" fill="#F0FDFA" stroke="#0F766E"/>
    <text x="20" y="326" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#111827">c · g1 = 1.12</text>
    <text x="20" y="364" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#111827">c · g2 = 1.50</text>
  </g>
</svg>
