<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Nonconvex Failure Gallery</title>
  <desc id="desc">Three nonconvex examples where two feasible points have a midpoint or segment outside the set.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="#FFFFFF"/>
  <rect x="24" y="24" width="912" height="512" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <g transform="translate(58,80)">
    <text x="0" y="-26" fill="#1E3A8A" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700">missing middle</text>
    <rect x="0" y="0" width="250" height="330" fill="url(#grid)" stroke="#E2E8F0"/>
    <circle cx="82" cy="166" r="62" fill="#2563EB" opacity="0.18" stroke="#2563EB" stroke-width="4"/>
    <circle cx="172" cy="166" r="62" fill="#2563EB" opacity="0.18" stroke="#2563EB" stroke-width="4"/>
    <circle cx="127" cy="166" r="38" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="4"/>
    <line x1="82" y1="166" x2="172" y2="166" stroke="#B45309" stroke-width="5"/>
    <circle cx="82" cy="166" r="9" fill="#1E3A8A"/>
    <circle cx="172" cy="166" r="9" fill="#1E3A8A"/>
    <circle cx="127" cy="166" r="10" fill="#B45309"/>
    <text x="48" y="292" fill="#475569" font-family="Source Sans 3, Arial, sans-serif" font-size="23">midpoint exits the set</text>
  </g>
  <g transform="translate(356,80)">
    <text x="0" y="-26" fill="#1E3A8A" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700">two islands</text>
    <rect x="0" y="0" width="250" height="330" fill="url(#grid)" stroke="#E2E8F0"/>
    <ellipse cx="74" cy="182" rx="58" ry="78" fill="#0F766E" opacity="0.18" stroke="#0F766E" stroke-width="4"/>
    <ellipse cx="182" cy="146" rx="52" ry="72" fill="#0F766E" opacity="0.18" stroke="#0F766E" stroke-width="4"/>
    <line x1="74" y1="182" x2="182" y2="146" stroke="#B45309" stroke-width="5"/>
    <circle cx="74" cy="182" r="9" fill="#1E3A8A"/>
    <circle cx="182" cy="146" r="9" fill="#1E3A8A"/>
    <circle cx="128" cy="164" r="10" fill="#B45309"/>
    <text x="35" y="292" fill="#475569" font-family="Source Sans 3, Arial, sans-serif" font-size="23">segment crosses empty space</text>
  </g>
  <g transform="translate(654,80)">
    <text x="0" y="-26" fill="#1E3A8A" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700">curved equality graph</text>
    <rect x="0" y="0" width="250" height="330" fill="url(#grid)" stroke="#E2E8F0"/>
    <path d="M30 272 C78 226 94 60 126 82 C158 104 176 236 220 64" fill="none" stroke="#6D28D9" stroke-width="6"/>
    <line x1="62" y1="232" x2="194" y2="124" stroke="#B45309" stroke-width="5"/>
    <circle cx="62" cy="232" r="9" fill="#1E3A8A"/>
    <circle cx="194" cy="124" r="9" fill="#1E3A8A"/>
    <circle cx="128" cy="178" r="10" fill="#B45309"/>
    <text x="24" y="292" fill="#475569" font-family="Source Sans 3, Arial, sans-serif" font-size="23">chord leaves the curve</text>
  </g>
  <text x="58" y="492" fill="#B45309" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700">A single certified failure is enough: find x, y in S and one t with (1 - t)x + ty outside S.</text>
</svg>
