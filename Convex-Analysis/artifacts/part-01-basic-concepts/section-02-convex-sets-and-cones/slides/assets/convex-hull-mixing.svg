<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Convex Hull As Closure Under Mixing</title>
  <desc id="desc">A finite point cloud, its convex hull, and a four-weight mixing certificate for an interior point.</desc>
  <defs>
    <marker id="mix-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#B45309"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="#FFFFFF"/>
  <rect x="28" y="28" width="904" height="504" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <g transform="translate(70,56)">
    <rect x="0" y="0" width="520" height="432" fill="url(#grid)" stroke="#E2E8F0"/>
    <line x1="30" y1="350" x2="490" y2="350" stroke="#94A3B8" stroke-width="2"/>
    <line x1="260" y1="398" x2="260" y2="30" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="100,310 440,292 392,86 142,130" fill="#2563EB" opacity="0.14" stroke="#2563EB" stroke-width="5"/>
    <polyline points="132,292 210,244 270,202 326,170 392,116" fill="none" stroke="#B45309" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#mix-arrow)"/>
    <circle cx="100" cy="310" r="10" fill="#1E3A8A"/>
    <circle cx="440" cy="292" r="10" fill="#1E3A8A"/>
    <circle cx="392" cy="86" r="10" fill="#1E3A8A"/>
    <circle cx="142" cy="130" r="10" fill="#1E3A8A"/>
    <circle cx="304" cy="210" r="13" fill="#B45309"/>
    <text x="76" y="344" font-family="STIX Two Text, Georgia, serif" font-size="28" font-style="italic" fill="#111827">v1</text>
    <text x="452" y="300" font-family="STIX Two Text, Georgia, serif" font-size="28" font-style="italic" fill="#111827">v2</text>
    <text x="404" y="80" font-family="STIX Two Text, Georgia, serif" font-size="28" font-style="italic" fill="#111827">v3</text>
    <text x="118" y="118" font-family="STIX Two Text, Georgia, serif" font-size="28" font-style="italic" fill="#111827">v4</text>
    <text x="318" y="220" font-family="STIX Two Text, Georgia, serif" font-size="28" font-style="italic" fill="#B45309">x</text>
    <text x="22" y="426" font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#475569">The hull is the smallest convex region containing the point cloud.</text>
  </g>
  <g transform="translate(636,80)">
    <text x="0" y="0" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E3A8A">Mixing certificate</text>
    <rect x="0" y="28" width="246" height="284" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="24" y="80" font-family="STIX Two Text, Georgia, serif" font-size="32" fill="#111827">x = sum lambda_i v_i</text>
    <text x="24" y="130" font-family="Source Sans 3, Arial, sans-serif" font-size="26" fill="#111827">lambda = (0.18, 0.27,</text>
    <text x="24" y="166" font-family="Source Sans 3, Arial, sans-serif" font-size="26" fill="#111827">0.35, 0.20)</text>
    <text x="24" y="224" font-family="Source Sans 3, Arial, sans-serif" font-size="26" fill="#0F766E">lambda_i >= 0</text>
    <text x="24" y="264" font-family="Source Sans 3, Arial, sans-serif" font-size="26" fill="#0F766E">sum lambda_i = 1</text>
    <rect x="0" y="344" width="246" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text x="22" y="392" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#1E3A8A">closure under averages</text>
  </g>
</svg>
