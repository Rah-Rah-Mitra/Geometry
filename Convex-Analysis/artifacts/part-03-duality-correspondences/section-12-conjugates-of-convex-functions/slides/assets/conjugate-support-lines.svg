<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Fenchel conjugate as a support-line ledger</title>
  <desc id="desc">A convex curve with several affine minorants indexed by slope and a highlighted vertical gap defining the conjugate value.</desc>
  <defs>
    <linearGradient id="gapFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#B45309" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B45309" stop-opacity="0.03"/>
    </linearGradient>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .axis { stroke:#CBD5E1; stroke-width:3; }
      .grid { stroke:#E2E8F0; stroke-width:1.2; }
      .curve { fill:none; stroke:#2563EB; stroke-width:6; stroke-linecap:round; }
      .minor { fill:none; stroke-width:3.5; stroke-linecap:round; }
      .minor.blue { stroke:#1E3A8A; }
      .minor.teal { stroke:#0F766E; }
      .minor.violet { stroke:#6D28D9; }
      .minor.amber { stroke:#B45309; }
      .dash { stroke-dasharray:10 9; }
      .label { font:700 28px 'Source Sans 3', Arial, sans-serif; fill:#111827; }
      .small { font:600 23px 'Source Sans 3', Arial, sans-serif; fill:#64748B; }
      .math { font:400 31px 'STIX Two Text', Georgia, serif; fill:#111827; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="620" rx="18" fill="#FFFFFF"/>
  <g transform="translate(84 56)">
    <rect x="0" y="0" width="620" height="492" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <g opacity="0.85">
      <path class="grid" d="M 0 410 H 620 M 0 320 H 620 M 0 230 H 620 M 0 140 H 620 M 0 50 H 620"/>
      <path class="grid" d="M 86 0 V 492 M 172 0 V 492 M 258 0 V 492 M 344 0 V 492 M 430 0 V 492 M 516 0 V 492"/>
    </g>
    <path class="axis" d="M 58 436 H 585"/>
    <path class="axis" d="M 112 462 V 42"/>

    <path class="minor violet" d="M 72 278 C 192 235 334 192 570 120"/>
    <path class="minor teal" d="M 72 339 C 190 310 340 280 570 232"/>
    <path class="minor blue" d="M 72 436 C 190 436 340 436 570 436"/>
    <path class="minor amber dash" d="M 72 501 C 190 458 340 382 570 244"/>

    <path class="curve" d="M 66 413 C 133 412 190 386 236 340 C 290 286 340 229 406 164 C 459 112 520 87 582 82"/>

    <circle cx="372" cy="196" r="8" fill="#B45309"/>
    <line x1="458" y1="126" x2="458" y2="270" stroke="#B45309" stroke-width="5" marker-end="url(#arrowAmber)"/>
    <path d="M 458 126 L 505 126 L 505 270 L 458 270 Z" fill="url(#gapFill)" stroke="#B45309" stroke-width="2"/>
    <line x1="112" y1="204" x2="372" y2="196" stroke="#B45309" stroke-width="3" stroke-dasharray="8 8"/>
    <line x1="372" y1="196" x2="458" y2="126" stroke="#B45309" stroke-width="3" stroke-dasharray="8 8"/>

    <text class="label" x="402" y="77">f(x)</text>
    <text class="small" x="456" y="103">supporting line of slope p</text>
    <text class="math" x="356" y="318">gap = p x - f(x)</text>
    <text class="small" x="376" y="350">largest gap becomes f*(p)</text>
    <text class="small" x="522" y="459">x</text>
    <text class="small" x="79" y="54">height</text>
    <text class="math" x="102" y="486">0</text>
  </g>

  <g transform="translate(742 86)">
    <rect x="0" y="0" width="178" height="360" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text class="label" x="22" y="47">Slope ledger</text>
    <text class="small" x="22" y="92">choose price p</text>
    <path d="M 28 112 H 150" stroke="#CBD5E1" stroke-width="2"/>
    <text class="math" x="22" y="156">f*(p)</text>
    <text class="small" x="22" y="190">is the best</text>
    <text class="small" x="22" y="222">profit from</text>
    <text class="math" x="22" y="264">p x - f(x)</text>
    <path d="M 42 300 C 60 276 88 276 106 300 C 122 322 140 322 154 300" fill="none" stroke="#0F766E" stroke-width="4"/>
  </g>

  <path d="M 690 260 C 724 246 736 242 770 236" fill="none" stroke="#B45309" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <path d="M 690 198 C 724 184 736 180 770 174" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrowBlue)"/>
</svg>
