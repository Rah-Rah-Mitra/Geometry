<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Quadratic conjugate and reciprocal curvature</title>
  <desc id="desc">Two coordinate panels compare a primal quadratic f(x)=q x squared over two with its conjugate f star of p equals p squared over two q.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A8A"/>
    </marker>
    <style>
      .panel { fill:#FFFFFF; stroke:#CBD5E1; stroke-width:2; }
      .axis { stroke:#CBD5E1; stroke-width:3; }
      .grid { stroke:#E2E8F0; stroke-width:1.1; }
      .curve1 { fill:none; stroke:#2563EB; stroke-width:6; stroke-linecap:round; }
      .curve2 { fill:none; stroke:#0F766E; stroke-width:6; stroke-linecap:round; }
      .line { stroke:#B45309; stroke-width:4; stroke-dasharray:9 7; }
      .label { font:700 28px 'Source Sans 3', Arial, sans-serif; fill:#111827; }
      .small { font:600 22px 'Source Sans 3', Arial, sans-serif; fill:#64748B; }
      .math { font:400 31px 'STIX Two Text', Georgia, serif; fill:#111827; }
    </style>
  </defs>
  <rect x="0" y="0" width="1040" height="560" rx="18" fill="#F8FAFC"/>
  <g transform="translate(58 58)">
    <rect class="panel" x="0" y="0" width="420" height="400" rx="12"/>
    <path class="grid" d="M 60 80 H 380 M 60 160 H 380 M 60 240 H 380 M 60 320 H 380 M 140 45 V 350 M 220 45 V 350 M 300 45 V 350"/>
    <path class="axis" d="M 45 320 H 386"/>
    <path class="axis" d="M 210 350 V 45"/>
    <path class="curve1" d="M 74 314 C 119 304 151 278 177 220 C 196 177 208 149 210 144 C 214 154 225 180 244 220 C 271 278 304 304 348 314"/>
    <path class="line" d="M 82 352 L 358 102"/>
    <circle cx="276" cy="258" r="8" fill="#B45309"/>
    <line x1="276" y1="258" x2="341" y2="258" stroke="#B45309" stroke-width="4" marker-end="url(#arrow)"/>
    <text class="label" x="28" y="-18">Primal bowl</text>
    <text class="math" x="104" y="386">f(x)=q x^2 / 2</text>
    <text class="small" x="294" y="239">slope p = q x</text>
  </g>
  <g transform="translate(562 58)">
    <rect class="panel" x="0" y="0" width="420" height="400" rx="12"/>
    <path class="grid" d="M 60 80 H 380 M 60 160 H 380 M 60 240 H 380 M 60 320 H 380 M 140 45 V 350 M 220 45 V 350 M 300 45 V 350"/>
    <path class="axis" d="M 45 320 H 386"/>
    <path class="axis" d="M 210 350 V 45"/>
    <path class="curve2" d="M 78 302 C 126 293 164 272 188 230 C 204 202 212 180 220 158 C 229 180 236 202 252 230 C 276 272 315 293 362 302"/>
    <circle cx="306" cy="285" r="8" fill="#0F766E"/>
    <line x1="306" y1="285" x2="248" y2="285" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/>
    <text class="label" x="28" y="-18">Dual bowl</text>
    <text class="math" x="84" y="386">f*(p)=p^2 / (2q)</text>
    <text class="small" x="126" y="244">dual point records price p</text>
  </g>
  <g transform="translate(468 218)">
    <rect x="0" y="0" width="104" height="104" rx="52" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="3"/>
    <path d="M 24 53 H 80" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <text class="small" x="-16" y="134">maximize p x - f(x)</text>
  </g>
  <text class="small" x="341" y="514">Steep primal curvature q produces shallow dual curvature 1/q.</text>
</svg>
