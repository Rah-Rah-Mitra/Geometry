<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Norm and dual norm conjugacy</title>
  <desc id="desc">A primal unit ball and a dual unit ball show that the conjugate of a norm is the indicator of the dual unit ball.</desc>
  <defs>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <style>
      .panel { fill:#FFFFFF; stroke:#CBD5E1; stroke-width:2; }
      .axis { stroke:#CBD5E1; stroke-width:3; }
      .grid { stroke:#E2E8F0; stroke-width:1.1; }
      .label { font:700 28px 'Source Sans 3', Arial, sans-serif; fill:#111827; }
      .small { font:600 22px 'Source Sans 3', Arial, sans-serif; fill:#64748B; }
      .math { font:400 31px 'STIX Two Text', Georgia, serif; fill:#111827; }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="560" rx="18" fill="#FFFFFF"/>
  <g transform="translate(70 68)">
    <rect class="panel" x="0" y="0" width="388" height="384" rx="12"/>
    <path class="grid" d="M 54 192 H 334 M 194 52 V 332 M 92 92 L 296 296 M 296 92 L 92 296"/>
    <path class="axis" d="M 50 192 H 338 M 194 336 V 48"/>
    <polygon points="194,78 320,192 194,306 68,192" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="5"/>
    <line x1="194" y1="192" x2="300" y2="118" stroke="#0F766E" stroke-width="5" marker-end="url(#arrowTeal)"/>
    <path d="M 282 99 L 326 164" stroke="#B45309" stroke-width="4"/>
    <text class="label" x="48" y="-22">Primal norm ball</text>
    <text class="math" x="97" y="364">||x||_1 &lt;= 1</text>
    <text class="small" x="214" y="112">test x</text>
  </g>
  <g transform="translate(542 68)">
    <rect class="panel" x="0" y="0" width="388" height="384" rx="12"/>
    <path class="grid" d="M 54 192 H 334 M 194 52 V 332 M 92 92 L 296 296 M 296 92 L 92 296"/>
    <path class="axis" d="M 50 192 H 338 M 194 336 V 48"/>
    <rect x="86" y="84" width="216" height="216" fill="#0F766E" fill-opacity="0.10" stroke="#0F766E" stroke-width="5"/>
    <circle cx="264" cy="132" r="8" fill="#0F766E"/>
    <circle cx="330" cy="102" r="8" fill="#B45309"/>
    <text class="small" x="278" y="128">inside</text>
    <text class="small" x="305" y="85">outside</text>
    <text class="label" x="42" y="-22">Dual unit ball</text>
    <text class="math" x="88" y="364">||p||_infty &lt;= 1</text>
  </g>
  <g transform="translate(118 492)">
    <rect x="0" y="-42" width="764" height="70" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
    <text class="math" x="28" y="4">(||.||_1)*(p) = delta_{||p||_infty &lt;= 1}(p)</text>
  </g>
</svg>
