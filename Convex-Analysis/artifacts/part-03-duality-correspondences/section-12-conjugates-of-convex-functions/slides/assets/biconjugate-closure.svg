<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Biconjugate as closed convex recovery</title>
  <desc id="desc">A rough function sample is replaced by the lower closed convex envelope recovered by the biconjugate.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .panel { fill:#FFFFFF; stroke:#CBD5E1; stroke-width:2; }
      .axis { stroke:#CBD5E1; stroke-width:3; }
      .grid { stroke:#E2E8F0; stroke-width:1.1; }
      .raw { fill:none; stroke:#94A3B8; stroke-width:4; stroke-dasharray:9 8; }
      .env { fill:none; stroke:#2563EB; stroke-width:7; stroke-linecap:round; }
      .minor { stroke:#0F766E; stroke-width:3.5; stroke-dasharray:7 7; }
      .open { fill:#FFFFFF; stroke:#B45309; stroke-width:5; }
      .label { font:700 28px 'Source Sans 3', Arial, sans-serif; fill:#111827; }
      .small { font:600 22px 'Source Sans 3', Arial, sans-serif; fill:#64748B; }
      .math { font:400 31px 'STIX Two Text', Georgia, serif; fill:#111827; }
    </style>
  </defs>
  <rect x="0" y="0" width="1040" height="560" rx="18" fill="#F8FAFC"/>
  <g transform="translate(74 58)">
    <rect class="panel" x="0" y="0" width="892" height="390" rx="12"/>
    <path class="grid" d="M 70 80 H 840 M 70 160 H 840 M 70 240 H 840 M 70 320 H 840 M 178 50 V 340 M 326 50 V 340 M 474 50 V 340 M 622 50 V 340 M 770 50 V 340"/>
    <path class="axis" d="M 58 318 H 848"/>
    <path class="axis" d="M 118 344 V 44"/>
    <path class="raw" d="M 118 282 C 210 138 266 246 336 126 C 410 20 493 252 598 150 C 674 76 742 168 826 98"/>
    <path class="minor" d="M 102 312 L 826 106"/>
    <path class="minor" d="M 104 266 L 824 266"/>
    <path class="minor" d="M 112 346 L 820 52"/>
    <path class="env" d="M 118 282 C 242 240 334 218 418 196 C 536 165 638 130 826 98"/>
    <circle class="open" cx="336" cy="126" r="11"/>
    <circle cx="418" cy="196" r="9" fill="#2563EB"/>
    <line x1="430" y1="188" x2="540" y2="142" stroke="#2563EB" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text class="label" x="42" y="-20">Affine-minorant envelope</text>
    <text class="small" x="520" y="119">closed convex lower envelope</text>
    <text class="small" x="246" y="105">raw value is not what survives</text>
    <text class="math" x="252" y="372">f** = cl(conv f)</text>
  </g>
  <g transform="translate(118 482)">
    <rect x="0" y="-40" width="804" height="66" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text class="small" x="24" y="2">Conjugating twice keeps exactly the affine lower certificates and closes their supremum.</text>
  </g>
</svg>
