<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Directions selecting exposed faces</title>
  <desc id="desc">Several normal directions around a polygon select vertices or edges as exposed faces.</desc>
  <defs>
    <marker id="dirArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#1e3a8a"/>
    </marker>
    <style>
      .ring { fill:none; stroke:#e2e8f0; stroke-width:4; }
      .poly { fill:rgba(37,99,235,.12); stroke:#2563eb; stroke-width:6; stroke-linejoin:round; }
      .face { stroke:#b45309; stroke-width:12; stroke-linecap:round; }
      .face2 { stroke:#6d28d9; stroke-width:12; stroke-linecap:round; }
      .dir { stroke:#1e3a8a; stroke-width:5; marker-end:url(#dirArrow); }
      .dash { stroke:#94a3b8; stroke-width:4; stroke-dasharray:12 12; }
      .pt { fill:#2563eb; stroke:white; stroke-width:5; }
      .hot { fill:#b45309; stroke:white; stroke-width:6; }
      .violet { fill:#6d28d9; stroke:white; stroke-width:6; }
      .label { font:700 27px 'Source Sans 3', Arial, sans-serif; fill:#111827; }
      .small { font:600 21px 'Source Sans 3', Arial, sans-serif; fill:#64748b; }
      .math { font:400 27px 'STIX Two Text', Georgia, serif; fill:#111827; }
    </style>
  </defs>
  <rect width="980" height="620" fill="#fff"/>
  <g transform="translate(370 318)">
    <circle class="ring" r="244"/>
    <circle class="ring" r="168"/>
    <path class="dash" d="M-292 0 H292 M0 -270 V270"/>
    <polygon class="poly" points="-190,82 -40,150 160,70 218,-84 58,-194 -184,-120"/>
    <line class="face" x1="160" y1="70" x2="218" y2="-84"/>
    <line class="face2" x1="58" y1="-194" x2="-184" y2="-120"/>
    <circle class="pt" cx="-190" cy="82" r="10"/>
    <circle class="pt" cx="-40" cy="150" r="10"/>
    <circle class="hot" cx="160" cy="70" r="12"/>
    <circle class="hot" cx="218" cy="-84" r="12"/>
    <circle class="violet" cx="58" cy="-194" r="12"/>
    <circle class="violet" cx="-184" cy="-120" r="12"/>
    <line class="dir" x1="0" y1="0" x2="262" y2="-116"/>
    <line class="dir" x1="0" y1="0" x2="-238" y2="-152"/>
    <line class="dir" x1="0" y1="0" x2="-88" y2="262"/>
    <text class="math" x="273" y="-124">u_1</text>
    <text class="math" x="-298" y="-158">u_2</text>
    <text class="math" x="-78" y="304">u_3</text>
  </g>
  <g transform="translate(696 92)">
    <rect x="0" y="0" width="222" height="116" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <text class="label" x="20" y="40">edge face</text>
    <text class="small" x="20" y="76">same value along</text>
    <text class="small" x="20" y="100">one exposed side</text>
  </g>
  <g transform="translate(696 244)">
    <rect x="0" y="0" width="222" height="116" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
    <text class="label" x="20" y="40">another face</text>
    <text class="small" x="20" y="76">normal cone selects</text>
    <text class="small" x="20" y="100">the opposite side</text>
  </g>
  <g transform="translate(696 396)">
    <rect x="0" y="0" width="222" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text class="math" x="20" y="43">F_C(u)</text>
    <text class="small" x="20" y="78">argmax of x . u</text>
    <text class="small" x="20" y="102">over the set C</text>
  </g>
</svg>
