<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Support probe of a convex polygon</title>
  <desc id="desc">A linear direction probes a convex polygon and selects the farthest supporting line and exposed vertex.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrowAmber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#b45309"/>
    </marker>
    <style>
      .axis { stroke:#cbd5e1; stroke-width:3; }
      .grid { stroke:#e2e8f0; stroke-width:1.5; }
      .poly { fill:rgba(37,99,235,.13); stroke:#2563eb; stroke-width:6; stroke-linejoin:round; }
      .support { stroke:#b45309; stroke-width:7; stroke-linecap:round; }
      .parallel { stroke:#b45309; stroke-width:4; stroke-dasharray:15 13; opacity:.45; }
      .probe { stroke:#1e3a8a; stroke-width:7; marker-end:url(#arrow); }
      .normal { stroke:#b45309; stroke-width:6; marker-end:url(#arrowAmber); }
      .point { fill:#2563eb; stroke:white; stroke-width:5; }
      .max { fill:#b45309; stroke:white; stroke-width:6; }
      .label { font:700 27px 'Source Sans 3', Arial, sans-serif; fill:#111827; }
      .small { font:600 22px 'Source Sans 3', Arial, sans-serif; fill:#64748b; }
      .math { font:400 28px 'STIX Two Text', Georgia, serif; fill:#111827; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <g transform="translate(430 320)">
    <g opacity=".8">
      <path class="grid" d="M-320 -240 H320 M-320 -160 H320 M-320 -80 H320 M-320 80 H320 M-320 160 H320 M-320 240 H320"/>
      <path class="grid" d="M-320 -240 V240 M-240 -240 V240 M-160 -240 V240 M-80 -240 V240 M80 -240 V240 M160 -240 V240 M240 -240 V240 M320 -240 V240"/>
    </g>
    <path class="axis" d="M-360 0 H360"/>
    <path class="axis" d="M0 260 V-260"/>
    <polygon class="poly" points="-210,85 -44,145 162,72 230,-82 62,-198 -186,-124"/>
    <path class="parallel" d="M-270 25 L318 -236"/>
    <path class="parallel" d="M-250 110 L338 -151"/>
    <path class="support" d="M-230 190 L358 -71"/>
    <line class="probe" x1="-300" y1="190" x2="-132" y2="115"/>
    <line class="normal" x1="196" y1="-22" x2="280" y2="-59"/>
    <circle class="point" cx="-210" cy="85" r="10"/>
    <circle class="point" cx="-44" cy="145" r="10"/>
    <circle class="point" cx="162" cy="72" r="10"/>
    <circle class="max" cx="230" cy="-82" r="14"/>
    <circle class="point" cx="62" cy="-198" r="10"/>
    <circle class="point" cx="-186" cy="-124" r="10"/>
    <text class="label" x="247" y="-93">maximizer</text>
    <text class="math" x="-322" y="226">direction u</text>
    <text class="math" x="290" y="-72">support line</text>
    <text class="math" x="-300" y="-220">h_C(u) = max x . u</text>
  </g>
  <g transform="translate(72 62)">
    <rect x="0" y="0" width="292" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="small" x="22" y="36">Linear probe:</text>
    <text class="math" x="22" y="72">x -> x . u</text>
  </g>
</svg>
