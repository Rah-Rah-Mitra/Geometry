<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Norm balls and support functions</title>
  <desc id="desc">Three norm balls show how support functions encode dual norm geometry.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#1e3a8a"/>
    </marker>
    <style>
      .panel { fill:#f8fafc; stroke:#cbd5e1; stroke-width:3; }
      .axis { stroke:#cbd5e1; stroke-width:3; }
      .ball { fill:rgba(37,99,235,.14); stroke:#2563eb; stroke-width:6; }
      .ball2 { fill:rgba(15,118,110,.14); stroke:#0f766e; stroke-width:6; }
      .ball3 { fill:rgba(109,40,217,.12); stroke:#6d28d9; stroke-width:6; }
      .probe { stroke:#1e3a8a; stroke-width:6; marker-end:url(#arrow); }
      .support { stroke:#b45309; stroke-width:6; stroke-linecap:round; }
      .pt { fill:#b45309; stroke:white; stroke-width:5; }
      .label { font:700 26px 'Source Sans 3', Arial, sans-serif; fill:#111827; }
      .small { font:600 20px 'Source Sans 3', Arial, sans-serif; fill:#64748b; }
      .math { font:400 25px 'STIX Two Text', Georgia, serif; fill:#111827; }
    </style>
  </defs>
  <rect width="1040" height="620" fill="#fff"/>
  <g transform="translate(62 80)">
    <rect class="panel" x="0" y="0" width="286" height="450" rx="8"/>
    <g transform="translate(143 218)">
      <path class="axis" d="M-105 0 H105 M0 -105 V105"/>
      <circle class="ball" cx="0" cy="0" r="96"/>
      <line class="support" x1="-8" y1="-138" x2="138" y2="8"/>
      <line class="probe" x1="0" y1="0" x2="68" y2="-68"/>
      <circle class="pt" cx="68" cy="-68" r="10"/>
    </g>
    <text class="label" x="26" y="386">Euclidean ball</text>
    <text class="math" x="26" y="424">h_B(u) = ||u||_2</text>
  </g>
  <g transform="translate(378 80)">
    <rect class="panel" x="0" y="0" width="286" height="450" rx="8"/>
    <g transform="translate(143 218)">
      <path class="axis" d="M-105 0 H105 M0 -105 V105"/>
      <polygon class="ball2" points="0,-104 104,0 0,104 -104,0"/>
      <line class="support" x1="18" y1="-134" x2="134" y2="-18"/>
      <line class="probe" x1="0" y1="0" x2="70" y2="-70"/>
      <circle class="pt" cx="0" cy="-104" r="10"/>
      <circle class="pt" cx="104" cy="0" r="10"/>
    </g>
    <text class="label" x="26" y="386">l1 ball</text>
    <text class="math" x="26" y="424">h_B(u) = ||u||_infty</text>
  </g>
  <g transform="translate(694 80)">
    <rect class="panel" x="0" y="0" width="286" height="450" rx="8"/>
    <g transform="translate(143 218)">
      <path class="axis" d="M-105 0 H105 M0 -105 V105"/>
      <rect class="ball3" x="-96" y="-96" width="192" height="192" rx="0"/>
      <line class="support" x1="96" y1="-132" x2="132" y2="-96"/>
      <line class="probe" x1="0" y1="0" x2="82" y2="-82"/>
      <circle class="pt" cx="96" cy="-96" r="10"/>
    </g>
    <text class="label" x="26" y="386">linf ball</text>
    <text class="math" x="26" y="424">h_B(u) = ||u||_1</text>
  </g>
  <text class="small" x="84" y="572">A norm is a support function exactly when it probes the corresponding dual unit ball.</text>
</svg>
