<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Reconstructing a closed convex set from support halfspaces</title>
  <desc id="desc">A convex polygon is recovered as the intersection of all halfspaces determined by its support function.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#1e3a8a"/>
    </marker>
    <style>
      .grid { stroke:#e2e8f0; stroke-width:1.5; }
      .poly { fill:rgba(37,99,235,.18); stroke:#2563eb; stroke-width:7; stroke-linejoin:round; }
      .plane1 { fill:rgba(180,83,9,.10); stroke:#b45309; stroke-width:5; }
      .plane2 { fill:rgba(15,118,110,.10); stroke:#0f766e; stroke-width:5; }
      .plane3 { fill:rgba(109,40,217,.10); stroke:#6d28d9; stroke-width:5; }
      .line1 { stroke:#b45309; stroke-width:6; }
      .line2 { stroke:#0f766e; stroke-width:6; }
      .line3 { stroke:#6d28d9; stroke-width:6; }
      .normal { stroke:#1e3a8a; stroke-width:5; marker-end:url(#arrow); }
      .label { font:700 27px 'Source Sans 3', Arial, sans-serif; fill:#111827; }
      .small { font:600 21px 'Source Sans 3', Arial, sans-serif; fill:#64748b; }
      .math { font:400 27px 'STIX Two Text', Georgia, serif; fill:#111827; }
    </style>
  </defs>
  <rect width="980" height="620" fill="#fff"/>
  <g transform="translate(470 326)">
    <g opacity=".75">
      <path class="grid" d="M-360 -240 H360 M-360 -160 H360 M-360 -80 H360 M-360 80 H360 M-360 160 H360 M-360 240 H360"/>
      <path class="grid" d="M-320 -270 V270 M-240 -270 V270 M-160 -270 V270 M-80 -270 V270 M80 -270 V270 M160 -270 V270 M240 -270 V270 M320 -270 V270"/>
    </g>
    <path class="plane1" d="M210 -90 L370 -165 L370 280 L-370 280 L-370 170 Z"/>
    <path class="plane2" d="M-190 -122 L70 -208 L370 -208 L370 280 L-370 280 L-370 -64 Z"/>
    <path class="plane3" d="M-205 86 L-370 14 L-370 -280 L370 -280 L370 280 L-370 280 L-370 160 Z"/>
    <polygon class="poly" points="-205,86 -50,154 160,70 220,-86 58,-196 -190,-122"/>
    <line class="line1" x1="-248" y1="116" x2="324" y2="-150"/>
    <line class="line2" x1="-255" y1="-100" x2="140" y2="-232"/>
    <line class="line3" x1="-268" y1="58" x2="-92" y2="132"/>
    <line class="normal" x1="218" y1="-108" x2="294" y2="-143"/>
    <line class="normal" x1="-180" y1="-126" x2="-236" y2="-168"/>
    <line class="normal" x1="-214" y1="92" x2="-292" y2="58"/>
    <text class="math" x="248" y="-178">u_1</text>
    <text class="math" x="-315" y="-178">u_2</text>
    <text class="math" x="-330" y="42">u_3</text>
  </g>
  <g transform="translate(76 62)">
    <rect width="344" height="116" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text class="label" x="22" y="42">closed convex set</text>
    <text class="math" x="22" y="82">C = intersection of support halfspaces</text>
  </g>
</svg>
