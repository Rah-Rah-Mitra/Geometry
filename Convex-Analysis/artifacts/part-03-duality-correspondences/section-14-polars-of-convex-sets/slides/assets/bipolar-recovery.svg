<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bipolar recovery from polar halfspaces</title>
  <desc id="desc">A convex body containing the origin is transformed to its polar and then reconstructed as the intersection of all halfspaces indexed by polar vectors.</desc>
  <defs>
    <marker id="arr" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0 0L13 6.5L0 13Z" fill="#1e3a8a"/>
    </marker>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <style>
      .label{font:700 28px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 20px 'Source Sans 3',Arial,sans-serif;fill:#64748b}
      .math{font:400 25px 'STIX Two Text',Georgia,serif;fill:#111827}
      .axis{stroke:#cbd5e1;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="80" y="72" class="label">Bipolar Recovery: C -> C^o -> C^oo</text>

  <g transform="translate(210 366)">
    <rect x="-150" y="-165" width="300" height="330" rx="10" fill="url(#grid)" stroke="#cbd5e1"/>
    <line x1="-115" x2="115" y1="0" y2="0" class="axis"/>
    <line x1="0" x2="0" y1="115" y2="-115" class="axis"/>
    <polygon points="-94,70 -86,-78 62,-98 114,-8 50,98" fill="#dbeafe" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="7" fill="#111827"/>
    <text x="-32" y="-194" class="label">C</text>
    <text x="-121" y="197" class="small">closed, convex, origin inside</text>
  </g>

  <path d="M378 366H505" stroke="#1e3a8a" stroke-width="8" marker-end="url(#arr)"/>
  <text x="389" y="333" class="math">take tests</text>

  <g transform="translate(600 366)">
    <rect x="-150" y="-165" width="300" height="330" rx="10" fill="url(#grid)" stroke="#cbd5e1"/>
    <line x1="-115" x2="115" y1="0" y2="0" class="axis"/>
    <line x1="0" x2="0" y1="115" y2="-115" class="axis"/>
    <g stroke="#b45309" stroke-width="4" stroke-dasharray="9 8" opacity=".9">
      <line x1="-119" y1="-86" x2="112" y2="-58"/>
      <line x1="112" y1="-110" x2="-66" y2="128"/>
      <line x1="-130" y1="24" x2="92" y2="120"/>
    </g>
    <polygon points="-72,-74 62,-92 110,18 28,110 -96,54" fill="#ccfbf1" stroke="#0f766e" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="7" fill="#111827"/>
    <text x="-38" y="-194" class="label">C^o</text>
    <text x="-122" y="197" class="small">all y with sup_C &lt;x,y&gt; &le; 1</text>
  </g>

  <path d="M768 366H895" stroke="#1e3a8a" stroke-width="8" marker-end="url(#arr)"/>
  <text x="777" y="333" class="math">intersect back</text>

  <g transform="translate(990 366)">
    <rect x="-150" y="-165" width="300" height="330" rx="10" fill="url(#grid)" stroke="#cbd5e1"/>
    <line x1="-115" x2="115" y1="0" y2="0" class="axis"/>
    <line x1="0" x2="0" y1="115" y2="-115" class="axis"/>
    <g fill="#eff6ff" stroke="#2563eb" stroke-width="5" opacity=".35">
      <path d="M-130 -52H130V130H-130Z"/>
      <path d="M-130 -130H74L130 130H-130Z"/>
      <path d="M-130 -130H130V62L-106 130Z"/>
    </g>
    <polygon points="-94,70 -86,-78 62,-98 114,-8 50,98" fill="#dbeafe" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="7" fill="#111827"/>
    <text x="-47" y="-194" class="label">C^oo</text>
    <text x="-110" y="197" class="small">recovered by all polar inequalities</text>
  </g>

  <rect x="79" y="644" width="1042" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="103" y="678" class="small">The second polar is an intersection of halfspaces. Closure, convexity, and the origin condition decide what is recovered exactly.</text>
</svg>
