<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Gallery of ball polars</title>
  <desc id="desc">Three examples show Euclidean self-duality, square-to-diamond duality, and reciprocal axes for an ellipse.</desc>
  <defs>
    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#cbd5e1"/>
    </pattern>
    <style>
      .title{font:700 29px 'Source Sans 3',Arial,sans-serif;fill:#1e3a8a}
      .label{font:700 23px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 19px 'Source Sans 3',Arial,sans-serif;fill:#64748b}
      .math{font:400 22px 'STIX Two Text',Georgia,serif;fill:#111827}
      .axis{stroke:#cbd5e1;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <rect x="54" y="58" width="1092" height="642" rx="14" fill="url(#dotGrid)" stroke="#cbd5e1"/>
  <text x="84" y="103" class="title">Polars Of Familiar Unit Balls</text>

  <g transform="translate(230 383)">
    <rect x="-145" y="-185" width="290" height="350" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="-105" x2="105" y1="0" y2="0" class="axis"/>
    <line x1="0" x2="0" y1="105" y2="-105" class="axis"/>
    <circle cx="0" cy="0" r="92" fill="#dbeafe" stroke="#2563eb" stroke-width="7"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="9 9"/>
    <text x="-104" y="-138" class="label">Euclidean ball</text>
    <text x="-97" y="142" class="math">B_2^o = B_2</text>
    <text x="-115" y="178" class="small">same radius after pairing</text>
  </g>

  <g transform="translate(600 383)">
    <rect x="-145" y="-185" width="290" height="350" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="-115" x2="115" y1="0" y2="0" class="axis"/>
    <line x1="0" x2="0" y1="115" y2="-115" class="axis"/>
    <rect x="-92" y="-92" width="184" height="184" fill="#dbeafe" stroke="#2563eb" stroke-width="7"/>
    <polygon points="0,-92 92,0 0,92 -92,0" fill="#ccfbf1" stroke="#0f766e" stroke-width="7"/>
    <text x="-104" y="-138" class="label">Infinity ball</text>
    <text x="-100" y="142" class="math">B_infty^o = B_1</text>
    <text x="-113" y="178" class="small">square constraints become vertices</text>
  </g>

  <g transform="translate(970 383)">
    <rect x="-145" y="-185" width="290" height="350" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="-115" x2="115" y1="0" y2="0" class="axis"/>
    <line x1="0" x2="0" y1="115" y2="-115" class="axis"/>
    <ellipse cx="0" cy="0" rx="116" ry="54" fill="#dbeafe" stroke="#2563eb" stroke-width="7"/>
    <ellipse cx="0" cy="0" rx="54" ry="116" fill="#ccfbf1" stroke="#0f766e" stroke-width="7"/>
    <text x="-90" y="-138" class="label">Ellipse</text>
    <text x="-102" y="142" class="math">axes invert</text>
    <text x="-118" y="178" class="small">long primal axis gives short polar axis</text>
  </g>

  <text x="84" y="663" class="small">The polar is not a visual shadow. It is the set of linear tests whose largest value on the primal body is at most one.</text>
</svg>
