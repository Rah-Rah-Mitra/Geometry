<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Polygon and its polar by reciprocal halfspaces</title>
  <desc id="desc">A primal polygon containing the origin is paired with a polar polygon obtained from one halfspace inequality per primal vertex.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#0f766e"/>
    </marker>
    <style>
      .label{font:700 27px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 21px 'Source Sans 3',Arial,sans-serif;fill:#475569}
      .math{font:400 24px 'STIX Two Text',Georgia,serif;fill:#111827}
      .axis{stroke:#94a3b8;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect x="70" y="96" width="475" height="520" rx="10" fill="url(#grid)" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="655" y="96" width="475" height="520" rx="10" fill="url(#grid)" stroke="#cbd5e1" stroke-width="3"/>

  <text x="88" y="62" class="label">Primal body C</text>
  <text x="674" y="62" class="label">Polar body C^o</text>

  <g transform="translate(307.5 356)">
    <line x1="-205" x2="205" y1="0" y2="0" class="axis"/>
    <line x1="0" x2="0" y1="205" y2="-205" class="axis"/>
    <polygon points="-138,82 -122,-94 78,-132 156,-22 70,128" fill="#dbeafe" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="8" fill="#111827"/>
    <circle cx="78" cy="-132" r="8" fill="#2563eb"/>
    <circle cx="156" cy="-22" r="8" fill="#2563eb"/>
    <circle cx="70" cy="128" r="8" fill="#2563eb"/>
    <circle cx="-138" cy="82" r="8" fill="#2563eb"/>
    <circle cx="-122" cy="-94" r="8" fill="#2563eb"/>
    <path d="M0 0L78 -132" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <path d="M0 0L156 -22" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <text x="92" y="-141" class="small">x_i</text>
    <text x="-199" y="-173" class="math">&lt;x_i,y&gt; &le; 1</text>
  </g>

  <g transform="translate(892.5 356)">
    <line x1="-205" x2="205" y1="0" y2="0" class="axis"/>
    <line x1="0" x2="0" y1="205" y2="-205" class="axis"/>
    <g stroke="#b45309" stroke-width="4" stroke-dasharray="10 9" opacity=".8">
      <line x1="-170" y1="-126" x2="183" y2="-48"/>
      <line x1="170" y1="-128" x2="-112" y2="160"/>
      <line x1="166" y1="92" x2="-178" y2="102"/>
      <line x1="-180" y1="24" x2="76" y2="170"/>
      <line x1="-110" y1="-164" x2="-174" y2="132"/>
    </g>
    <polygon points="-98,-78 62,-118 132,20 44,130 -118,76" fill="#ccfbf1" stroke="#0f766e" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="8" fill="#111827"/>
    <circle cx="62" cy="-118" r="8" fill="#0f766e"/>
    <circle cx="132" cy="20" r="8" fill="#0f766e"/>
    <circle cx="44" cy="130" r="8" fill="#0f766e"/>
    <circle cx="-118" cy="76" r="8" fill="#0f766e"/>
    <circle cx="-98" cy="-78" r="8" fill="#0f766e"/>
    <path d="M0 0L62 -118" stroke="#0f766e" stroke-width="5" marker-end="url(#arrowTeal)"/>
    <text x="75" y="-127" class="small">active y</text>
    <text x="-181" y="-172" class="math">intersection of reciprocal slabs</text>
  </g>

  <g transform="translate(70 668)">
    <rect x="0" y="-44" width="1060" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="22" y="-8" class="small">Each primal vertex x_i contributes a polar halfspace. The polar polygon is where all those inequalities hold at once.</text>
  </g>
</svg>
