<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cone, dual cone, and polar cone</title>
  <desc id="desc">A pointed cone is shown with its dual cone of nonnegative pairings and its polar cone as the negative dual.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <style>
      .label{font:700 28px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 21px 'Source Sans 3',Arial,sans-serif;fill:#64748b}
      .math{font:400 24px 'STIX Two Text',Georgia,serif;fill:#111827}
      .axis{stroke:#94a3b8;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <rect x="70" y="72" width="1060" height="604" rx="14" fill="url(#grid)" stroke="#cbd5e1" stroke-width="3"/>
  <g transform="translate(600 382)">
    <line x1="-465" x2="465" y1="0" y2="0" class="axis"/>
    <line x1="0" x2="0" y1="245" y2="-245" class="axis"/>
    <path d="M0 0L318 -68A325 325 0 0 1 188 268Z" fill="#dbeafe" stroke="#2563eb" stroke-width="8" stroke-linejoin="round"/>
    <path d="M0 0L226 -225A324 324 0 0 1 318 68Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="8" stroke-linejoin="round" opacity=".92"/>
    <path d="M0 0L-226 225A324 324 0 0 1 -318 -68Z" fill="#ffedd5" stroke="#b45309" stroke-width="8" stroke-linejoin="round" opacity=".92"/>
    <line x1="0" y1="0" x2="318" y2="-68" stroke="#2563eb" stroke-width="6"/>
    <line x1="0" y1="0" x2="188" y2="268" stroke="#2563eb" stroke-width="6"/>
    <line x1="0" y1="0" x2="226" y2="-225" stroke="#0f766e" stroke-width="6"/>
    <line x1="0" y1="0" x2="318" y2="68" stroke="#0f766e" stroke-width="6"/>
    <line x1="0" y1="0" x2="-226" y2="225" stroke="#b45309" stroke-width="6"/>
    <line x1="0" y1="0" x2="-318" y2="-68" stroke="#b45309" stroke-width="6"/>
    <circle cx="0" cy="0" r="9" fill="#111827"/>
    <text x="224" y="205" class="label" fill="#2563eb">K</text>
    <text x="274" y="-151" class="label" fill="#0f766e">K*</text>
    <text x="-356" y="134" class="label" fill="#b45309">K^o = -K*</text>
    <text x="-435" y="-197" class="math">K* = { y : &lt;x,y&gt; &gt;= 0 for all x in K }</text>
    <text x="-435" y="-158" class="math">K^o = { y : &lt;x,y&gt; &lt;= 0 for all x in K }</text>
    <text x="-433" y="283" class="small">Cones erase the level 1 threshold: scaling x forces the sign condition.</text>
  </g>
</svg>
