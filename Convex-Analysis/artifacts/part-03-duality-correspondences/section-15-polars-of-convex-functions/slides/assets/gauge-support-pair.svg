<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Gauge And Support Pair</title>
  <desc id="desc">A convex unit set, its polar set, and the gauge-support pairing that turns a primal unit ball into a dual support function.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect width="1320" height="760" fill="#ffffff"/>
  <rect x="34" y="34" width="1252" height="692" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>

  <g transform="translate(84 86)">
    <text x="0" y="0" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">Primal Gauge</text>
    <text x="0" y="38" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748b">k = gamma_C measures the scale needed to absorb x</text>
    <rect x="0" y="76" width="510" height="470" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <g transform="translate(48 74)">
      <line x1="28" y1="232" x2="414" y2="232" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="221" y1="418" x2="221" y2="42" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M221 76 C294 92 358 154 376 231 C354 322 295 372 221 390 C128 368 78 307 58 231 C82 150 134 94 221 76 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="6"/>
      <path d="M221 232 L386 118" stroke="#b45309" stroke-width="5" marker-end="url(#arrow)"/>
      <circle cx="221" cy="232" r="8" fill="#111827"/>
      <circle cx="386" cy="118" r="10" fill="#b45309"/>
      <path d="M221 232 L328 158" stroke="#0f766e" stroke-width="6" opacity="0.65"/>
      <circle cx="328" cy="158" r="8" fill="#0f766e"/>
      <text x="194" y="224" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">0</text>
      <text x="340" y="151" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f766e">x/k(x)</text>
      <text x="398" y="122" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">x</text>
      <text x="82" y="94" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#2563eb">C = {x : k(x) &lt;= 1}</text>
      <text x="68" y="392" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">k(x) = inf{lambda &gt;= 0 : x in lambda C}</text>
    </g>
  </g>

  <g transform="translate(626 322)">
    <path d="M0 0 H84" stroke="#1e3a8a" stroke-width="8" marker-end="url(#arrow)"/>
    <text x="-22" y="-22" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">polar</text>
    <text x="-52" y="46" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="600" fill="#64748b">unit ball becomes tests</text>
  </g>

  <g transform="translate(760 86)">
    <text x="0" y="0" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f766e">Dual Support</text>
    <text x="0" y="38" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748b">k^o = gamma_{C^o} = sigma_C when C is closed and contains 0</text>
    <rect x="0" y="76" width="510" height="470" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <g transform="translate(48 74)">
      <line x1="28" y1="232" x2="414" y2="232" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="221" y1="418" x2="221" y2="42" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M221 114 C287 130 334 174 350 232 C330 306 284 350 221 364 C150 350 104 306 88 232 C104 166 152 126 221 114 Z" fill="#f0fdfa" stroke="#0f766e" stroke-width="6"/>
      <line x1="78" y1="122" x2="374" y2="122" stroke="#b45309" stroke-width="5"/>
      <path d="M226 232 L226 122" stroke="#b45309" stroke-width="5" stroke-dasharray="10 10"/>
      <circle cx="226" cy="122" r="9" fill="#b45309"/>
      <path d="M221 232 L306 164" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
      <text x="314" y="166" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#2563eb">x*</text>
      <text x="84" y="106" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#b45309">supporting line to C</text>
      <text x="82" y="94" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f766e">C^o = {x* : &lt;x,x*&gt; &lt;= 1 on C}</text>
      <text x="52" y="392" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">k^o(x*) = sup_{x in C} &lt;x,x*&gt;</text>
    </g>
  </g>

  <g transform="translate(178 648)">
    <rect x="0" y="0" width="964" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="24" y="38" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">&lt;x,x*&gt; &lt;= k(x) k^o(x*) is the gauge version of the support inequality.</text>
  </g>
</svg>
