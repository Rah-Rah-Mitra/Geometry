<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Fenchel Conjugate Versus Polar Function</title>
  <desc id="desc">A side-by-side comparison of the Fenchel conjugate and function polar, using the absolute value norm as a simple example.</desc>
  <style>
    .svg-label { font: 700 25px 'Source Sans 3', Arial, sans-serif; fill: #111827; }
    .svg-small { font: 600 21px 'Source Sans 3', Arial, sans-serif; fill: #64748b; }
  </style>
  <rect width="1320" height="760" fill="#ffffff"/>
  <rect x="34" y="34" width="1252" height="692" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="84" y="94" font-family="Source Sans 3, Arial, sans-serif" font-size="38" font-weight="700" fill="#1e3a8a">Two Dualities, Two Inequality Shapes</text>
  <text x="84" y="132" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748b">The same function can have a conjugate and a polar, but they answer different certificate questions.</text>

  <g transform="translate(84 182)">
    <rect x="0" y="0" width="548" height="448" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="0" y="0" width="548" height="72" rx="12" fill="#eef2ff" stroke="#1e3a8a" stroke-width="3"/>
    <text x="28" y="46" font-family="Source Sans 3, Arial, sans-serif" font-size="29" font-weight="700" fill="#1e3a8a">Fenchel Conjugate f*</text>
    <text x="30" y="118" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#111827">&lt;x,y&gt; &lt;= f(x) + f*(y)</text>
    <text x="30" y="162" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#64748b">Best additive affine bound.</text>
    <g transform="translate(34 196)">
      <line x1="26" y1="168" x2="446" y2="168" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="236" y1="196" x2="236" y2="24" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M102 168 L236 52 L370 168" fill="none" stroke="#2563eb" stroke-width="6"/>
      <text x="116" y="42" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#2563eb">f(x)=|x|</text>
      <rect x="128" y="224" width="216" height="58" rx="8" fill="#eef2ff" stroke="#1e3a8a" stroke-width="3"/>
      <text x="146" y="261" font-family="STIX Two Text, Georgia, serif" font-size="26" fill="#111827">f*(y)=delta_{[-1,1]}(y)</text>
    </g>
  </g>

  <g transform="translate(688 182)">
    <rect x="0" y="0" width="548" height="448" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="0" y="0" width="548" height="72" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
    <text x="28" y="46" font-family="Source Sans 3, Arial, sans-serif" font-size="29" font-weight="700" fill="#0f766e">Polar Function f^o</text>
    <text x="30" y="118" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#111827">&lt;x,y&gt; &lt;= 1 + f(x) f^o(y)</text>
    <text x="30" y="162" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#64748b">Best budgeted homogeneous-style bound.</text>
    <g transform="translate(34 196)">
      <line x1="26" y1="168" x2="446" y2="168" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="236" y1="196" x2="236" y2="24" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M102 168 L236 52 L370 168" fill="none" stroke="#0f766e" stroke-width="6"/>
      <text x="116" y="42" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f766e">f^o(y)=|y|</text>
      <rect x="112" y="224" width="248" height="58" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="130" y="261" font-family="STIX Two Text, Georgia, serif" font-size="26" fill="#111827">norm polar is a norm</text>
    </g>
  </g>

  <g transform="translate(220 662)">
    <rect x="0" y="0" width="880" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="24" y="31" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">Bridge in the closed nonnegative case: f^o and f* are obverses through an exchanged epigraph cone.</text>
  </g>
</svg>
