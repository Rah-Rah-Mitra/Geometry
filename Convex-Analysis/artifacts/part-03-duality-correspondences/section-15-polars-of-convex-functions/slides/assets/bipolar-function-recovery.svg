<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Bipolar Function Recovery</title>
  <desc id="desc">A pipeline showing a nonnegative convex function, its polar, and its bipolar recovering the closed epigraph.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <style>
    .svg-label { font: 700 25px 'Source Sans 3', Arial, sans-serif; fill: #111827; }
    .svg-small { font: 600 21px 'Source Sans 3', Arial, sans-serif; fill: #64748b; }
    .svg-big { font: 700 31px 'Source Sans 3', Arial, sans-serif; fill: #1e3a8a; }
  </style>
  <rect width="1320" height="760" fill="#ffffff"/>
  <rect x="36" y="38" width="1248" height="682" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="84" y="96" font-family="Source Sans 3, Arial, sans-serif" font-size="38" font-weight="700" fill="#1e3a8a">Bipolar Recovery Is Epigraph Closure</text>
  <text x="84" y="134" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748b">Apply polarity twice and the missing boundary data is restored.</text>

  <g transform="translate(92 188)">
    <rect x="0" y="0" width="318" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="26" y="42" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#2563eb">1. f</text>
    <line x1="46" y1="304" x2="278" y2="304" stroke="#94a3b8" stroke-width="3"/>
    <line x1="88" y1="320" x2="88" y2="84" stroke="#94a3b8" stroke-width="3"/>
    <path d="M88 304 C120 280 146 238 176 192 C206 146 238 120 268 108 L268 72 L88 72 Z" fill="#eff6ff" opacity="0.9"/>
    <path d="M88 304 C120 280 146 238 176 192 C206 146 238 120 268 108" fill="none" stroke="#2563eb" stroke-width="5"/>
    <circle cx="88" cy="304" r="8" fill="#111827"/>
    <circle cx="268" cy="108" r="8" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <text x="44" y="340" font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="700" fill="#64748b">possibly not closed</text>
  </g>

  <path d="M438 366 H548" stroke="#1e3a8a" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="438" y="332" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">polar</text>

  <g transform="translate(568 188)">
    <rect x="0" y="0" width="318" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="26" y="42" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f766e">2. f^o</text>
    <line x1="46" y1="304" x2="278" y2="304" stroke="#94a3b8" stroke-width="3"/>
    <line x1="88" y1="320" x2="88" y2="84" stroke="#94a3b8" stroke-width="3"/>
    <path d="M88 304 C126 222 160 172 212 150 C240 172 260 230 276 304 L276 72 L88 72 Z" fill="#f0fdfa"/>
    <path d="M88 304 C126 222 160 172 212 150 C240 172 260 230 276 304" fill="none" stroke="#0f766e" stroke-width="5"/>
    <line x1="90" y1="270" x2="268" y2="148" stroke="#b45309" stroke-width="4" stroke-dasharray="9 9"/>
    <text x="44" y="340" font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="700" fill="#64748b">closed certificates</text>
  </g>

  <path d="M914 366 H1024" stroke="#1e3a8a" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="914" y="332" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">polar again</text>

  <g transform="translate(1044 188)">
    <rect x="0" y="0" width="220" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="24" y="42" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#6d28d9">3. f^oo</text>
    <line x1="36" y1="304" x2="188" y2="304" stroke="#94a3b8" stroke-width="3"/>
    <line x1="64" y1="320" x2="64" y2="84" stroke="#94a3b8" stroke-width="3"/>
    <path d="M64 304 C88 280 106 238 126 192 C150 146 170 120 188 108 L188 72 L64 72 Z" fill="#f5f3ff"/>
    <path d="M64 304 C88 280 106 238 126 192 C150 146 170 120 188 108" fill="none" stroke="#6d28d9" stroke-width="5"/>
    <circle cx="188" cy="108" r="8" fill="#6d28d9"/>
    <text x="32" y="340" font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="700" fill="#64748b">equals cl f</text>
  </g>

  <g transform="translate(186 612)">
    <rect x="0" y="0" width="948" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="24" y="42" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">epi(f^oo) = cl(epi f), so f^oo = cl f. Closed functions are recovered exactly.</text>
  </g>
</svg>
