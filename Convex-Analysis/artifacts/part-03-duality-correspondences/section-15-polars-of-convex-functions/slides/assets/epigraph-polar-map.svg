<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Epigraph Polarity Map</title>
  <desc id="desc">A synthetic diagram showing a convex epigraph, its polar cone, and the vertical reflection that becomes the epigraph of the polar function.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <linearGradient id="epiFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="dualFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="760" fill="#ffffff"/>
  <rect x="36" y="36" width="1248" height="688" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>

  <g transform="translate(88 96)">
    <text x="0" y="0" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">Primal Epigraph</text>
    <text x="0" y="38" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748b">epi f = {(x, mu) : mu &gt;= f(x)}</text>
    <rect x="0" y="74" width="430" height="430" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <g transform="translate(38 34)">
      <line x1="18" y1="430" x2="360" y2="430" stroke="#94a3b8" stroke-width="3"/>
      <line x1="188" y1="462" x2="188" y2="92" stroke="#94a3b8" stroke-width="3"/>
      <path d="M48 430 C94 400 128 348 168 296 C202 252 238 246 274 294 C312 346 332 394 354 430 L354 114 L48 114 Z" fill="url(#epiFill)" stroke="none"/>
      <path d="M48 430 C94 400 128 348 168 296 C202 252 238 246 274 294 C312 346 332 394 354 430" fill="none" stroke="#2563eb" stroke-width="6"/>
      <circle cx="188" cy="430" r="7" fill="#111827"/>
      <circle cx="300" cy="236" r="8" fill="#b45309"/>
      <line x1="300" y1="236" x2="102" y2="430" stroke="#b45309" stroke-width="4" stroke-dasharray="10 10"/>
      <text x="358" y="424" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#475569">x</text>
      <text x="204" y="104" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#475569">mu</text>
      <text x="224" y="275" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">mu = f(x)</text>
      <text x="74" y="158" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#2563eb">all vertical points above the graph</text>
    </g>
  </g>

  <g transform="translate(555 286)">
    <rect x="-4" y="-42" width="210" height="116" rx="10" fill="#eef2ff" stroke="#1e3a8a" stroke-width="3"/>
    <path d="M18 15 H170" stroke="#1e3a8a" stroke-width="8" marker-end="url(#arrow)"/>
    <text x="0" y="-6" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">polar cone</text>
    <text x="0" y="54" font-family="Source Sans 3, Arial, sans-serif" font-size="21" font-weight="600" fill="#64748b">then reflect vertical</text>
  </g>

  <g transform="translate(802 96)">
    <text x="0" y="0" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f766e">Dual Epigraph</text>
    <text x="0" y="38" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748b">epi f^o = A((epi f)^o)</text>
    <rect x="0" y="74" width="430" height="430" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <g transform="translate(38 34)">
      <line x1="18" y1="430" x2="360" y2="430" stroke="#94a3b8" stroke-width="3"/>
      <line x1="188" y1="462" x2="188" y2="92" stroke="#94a3b8" stroke-width="3"/>
      <path d="M52 430 C100 356 132 280 188 246 C244 280 280 356 354 430 L354 114 L52 114 Z" fill="url(#dualFill)" stroke="none"/>
      <path d="M52 430 C100 356 132 280 188 246 C244 280 280 356 354 430" fill="none" stroke="#0f766e" stroke-width="6"/>
      <line x1="56" y1="382" x2="338" y2="220" stroke="#b45309" stroke-width="4" stroke-dasharray="10 10"/>
      <circle cx="268" cy="260" r="8" fill="#b45309"/>
      <text x="358" y="424" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#475569">x*</text>
      <text x="204" y="104" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#475569">mu*</text>
      <text x="204" y="281" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">mu* = f^o(x*)</text>
      <text x="60" y="158" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f766e">certificates that dominate every primal point</text>
    </g>
  </g>

  <g transform="translate(132 632)">
    <rect x="0" y="0" width="1056" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="28" y="40" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#111827">&lt;x,x*&gt; &lt;= 1 + mu* f(x) for every x  iff  (x*,mu*) lies above f^o</text>
  </g>
</svg>
