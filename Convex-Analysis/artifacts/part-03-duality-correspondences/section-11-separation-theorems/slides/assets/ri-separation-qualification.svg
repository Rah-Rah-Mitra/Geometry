<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Relative interior qualification for proper separation</title>
  <desc id="desc">Proper separation is governed by whether the relative interiors of two convex sets intersect.</desc>
  <rect width="1000" height="620" fill="#ffffff"/>
  <rect x="42" y="46" width="432" height="528" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="526" y="46" width="432" height="528" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="82" y="105" font-family="Source Sans 3, Arial, sans-serif" font-size="29" font-weight="700" fill="#1e3a8a">ri C and ri D disjoint</text>
  <polygon points="104,234 250,153 356,250 294,402 135,386" fill="#dbeafe" stroke="#2563eb" stroke-width="6"/>
  <polygon points="310,204 420,164 434,358 321,419 280,303" fill="#ccfbf1" stroke="#0f766e" stroke-width="6"/>
  <polygon points="146,252 247,198 316,263 274,363 161,352" fill="#2563eb" opacity="0.18"/>
  <polygon points="331,230 397,205 407,343 334,383 310,303" fill="#0f766e" opacity="0.18"/>
  <line x1="279" y1="124" x2="279" y2="455" stroke="#1e3a8a" stroke-width="7"/>
  <text x="144" y="476" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#2563eb">proper separator exists</text>
  <text x="78" y="528" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">ri C cap ri D = empty</text>
  <text x="566" y="105" font-family="Source Sans 3, Arial, sans-serif" font-size="29" font-weight="700" fill="#1e3a8a">relative interiors overlap</text>
  <polygon points="588,230 742,150 852,256 790,407 620,388" fill="#dbeafe" stroke="#2563eb" stroke-width="6"/>
  <polygon points="682,210 842,165 898,335 782,444 644,353" fill="#ccfbf1" stroke="#0f766e" stroke-width="6"/>
  <path d="M690 246 C746 216 813 240 830 301 C846 357 797 394 739 384 C685 375 646 318 690 246 Z" fill="#b45309" opacity="0.24" stroke="#b45309" stroke-width="4"/>
  <line x1="692" y1="130" x2="850" y2="480" stroke="#94a3b8" stroke-width="6" stroke-dasharray="13 13"/>
  <text x="683" y="476" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#b45309">no proper separator</text>
  <text x="566" y="528" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">ri C cap ri D not empty</text>
</svg>
