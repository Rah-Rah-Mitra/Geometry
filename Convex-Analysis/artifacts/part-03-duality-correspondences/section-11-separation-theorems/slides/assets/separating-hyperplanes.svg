<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Separating hyperplane certificate</title>
  <desc id="desc">Two convex bodies lie on opposite sides of a separating hyperplane with a positive margin slab.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1e3a8a"/>
    </marker>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <rect x="40" y="40" width="920" height="540" rx="18" fill="url(#grid)" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M402 72 L506 552" stroke="#bfdbfe" stroke-width="34" stroke-linecap="round" opacity="0.85"/>
  <line x1="360" y1="72" x2="464" y2="552" stroke="#93c5fd" stroke-width="5" stroke-dasharray="16 15"/>
  <line x1="444" y1="72" x2="548" y2="552" stroke="#93c5fd" stroke-width="5" stroke-dasharray="16 15"/>
  <line x1="402" y1="72" x2="506" y2="552" stroke="#1e3a8a" stroke-width="8"/>
  <polygon points="166,245 234,160 344,184 382,282 333,391 205,401 132,323" fill="#dbeafe" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="635,226 720,150 844,202 880,332 805,433 668,405 592,310" fill="#ccfbf1" stroke="#0f766e" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="342" cy="282" r="10" fill="#2563eb"/>
  <circle cx="635" cy="309" r="10" fill="#0f766e"/>
  <path d="M482 286 L612 258" fill="none" stroke="#1e3a8a" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="224" y="286" font-family="Source Sans 3, Arial, sans-serif" font-size="40" font-weight="700" fill="#2563eb">C</text>
  <text x="724" y="294" font-family="Source Sans 3, Arial, sans-serif" font-size="40" font-weight="700" fill="#0f766e">D</text>
  <text x="535" y="245" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">normal c</text>
  <text x="515" y="102" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">H: &lt;c,x&gt; = alpha</text>
  <text x="371" y="558" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#2563eb">margin slab</text>
  <text x="95" y="535" font-family="Source Sans 3, Arial, sans-serif" font-size="26" fill="#475569">sup_C &lt;c,x&gt; <= alpha <= inf_D &lt;c,x&gt;</text>
</svg>
