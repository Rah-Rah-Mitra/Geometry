<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Projection proof of point separation</title>
  <desc id="desc">The nearest point projection from an exterior point to a closed convex set provides the normal vector for a strong separator.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <rect x="45" y="42" width="910" height="536" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <ellipse cx="360" cy="338" rx="216" ry="137" transform="rotate(-12 360 338)" fill="#dbeafe" stroke="#2563eb" stroke-width="7"/>
  <line x1="545" y1="191" x2="668" y2="508" stroke="#1e3a8a" stroke-width="7"/>
  <circle cx="565" cy="285" r="14" fill="#2563eb"/>
  <circle cx="738" cy="176" r="15" fill="#b45309"/>
  <path d="M565 285 L738 176" stroke="#b45309" stroke-width="8" marker-end="url(#arrow-amber)"/>
  <path d="M565 285 L419 376" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow-blue)" opacity="0.65"/>
  <line x1="391" y1="242" x2="565" y2="285" stroke="#94a3b8" stroke-width="5" stroke-dasharray="12 12"/>
  <path d="M556 266 L573 257 L582 276" fill="none" stroke="#64748b" stroke-width="4"/>
  <text x="323" y="354" font-family="Source Sans 3, Arial, sans-serif" font-size="42" font-weight="700" fill="#2563eb">C</text>
  <text x="584" y="294" font-family="STIX Two Text, Georgia, serif" font-size="33" fill="#111827">p = P_C(y)</text>
  <text x="758" y="184" font-family="STIX Two Text, Georgia, serif" font-size="33" fill="#111827">y</text>
  <text x="600" y="226" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#b45309">c = y - p</text>
  <text x="96" y="104" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">Projection makes the certificate</text>
  <text x="96" y="145" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">&lt;y-p, x-p&gt; <= 0 for every x in C</text>
  <text x="96" y="538" font-family="Source Sans 3, Arial, sans-serif" font-size="25" fill="#475569">The nearest-point condition rotates into a supporting hyperplane through p.</text>
</svg>
