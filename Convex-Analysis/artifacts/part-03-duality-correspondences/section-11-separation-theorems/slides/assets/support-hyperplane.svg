<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Supporting hyperplane at a boundary point</title>
  <desc id="desc">A convex set is contained in a closed half-space whose boundary touches the set at a boundary point.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <rect x="44" y="42" width="912" height="536" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M188 382 C156 286 206 176 319 129 C441 80 593 119 694 218 C768 292 790 397 724 462 C649 537 500 535 369 501 C279 478 214 449 188 382 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="7"/>
  <line x1="585" y1="85" x2="848" y2="545" stroke="#1e3a8a" stroke-width="8"/>
  <path d="M682 255 L782 198" fill="none" stroke="#b45309" stroke-width="7" marker-end="url(#arrow)"/>
  <circle cx="682" cy="255" r="13" fill="#b45309"/>
  <path d="M690 312 C720 365 731 418 718 461" fill="none" stroke="#0f766e" stroke-width="5" stroke-dasharray="11 11"/>
  <text x="265" y="322" font-family="Source Sans 3, Arial, sans-serif" font-size="42" font-weight="700" fill="#2563eb">C</text>
  <text x="705" y="241" font-family="STIX Two Text, Georgia, serif" font-size="32" fill="#111827">x0</text>
  <text x="772" y="190" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#b45309">outward normal</text>
  <text x="615" y="560" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">&lt;c,x&gt; <= &lt;c,x0&gt;</text>
  <text x="88" y="104" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">Supporting hyperplane</text>
  <text x="88" y="145" font-family="Source Sans 3, Arial, sans-serif" font-size="25" fill="#475569">The set stays in one half-space and touches the boundary.</text>
</svg>
