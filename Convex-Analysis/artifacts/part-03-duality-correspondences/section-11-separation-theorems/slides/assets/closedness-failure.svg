<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Failure of strong separation without closedness</title>
  <desc id="desc">An open half-space and a boundary point are disjoint, but their distance is zero, so no positive margin separator exists.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <rect x="44" y="42" width="912" height="536" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="110" y="112" width="780" height="221" fill="#dbeafe" opacity="0.82"/>
  <line x1="110" y1="333" x2="890" y2="333" stroke="#2563eb" stroke-width="7" stroke-dasharray="18 14"/>
  <line x1="145" y1="490" x2="860" y2="490" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="185" y1="92" x2="185" y2="528" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="500" cy="333" r="14" fill="#b45309"/>
  <path d="M500 202 L500 321" stroke="#b45309" stroke-width="7" marker-end="url(#arrow)"/>
  <circle cx="500" cy="286" r="7" fill="#2563eb"/>
  <circle cx="500" cy="252" r="7" fill="#2563eb" opacity="0.82"/>
  <circle cx="500" cy="222" r="7" fill="#2563eb" opacity="0.65"/>
  <text x="245" y="216" font-family="Source Sans 3, Arial, sans-serif" font-size="40" font-weight="700" fill="#2563eb">C = {y &gt; 0}</text>
  <text x="528" y="343" font-family="STIX Two Text, Georgia, serif" font-size="32" fill="#111827">b</text>
  <text x="590" y="298" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#b45309">distance = 0</text>
  <text x="245" y="389" font-family="Source Sans 3, Arial, sans-serif" font-size="28" fill="#475569">The boundary line supports the closure, but the set itself never reaches it.</text>
  <text x="245" y="436" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">sup margin = inf margin, no positive slab</text>
</svg>
