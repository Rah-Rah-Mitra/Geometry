<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Lineality compared with a pointed recession cone</title>
  <desc id="desc">A strip contains opposite recession directions while a quadrant cone does not.</desc>
  <defs>
    <marker id="arr-teal" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto">
      <path d="M0,0 L15,7.5 L0,15 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-blue" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto">
      <path d="M0,0 L15,7.5 L0,15 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <g transform="translate(70 78)">
    <rect x="0" y="0" width="390" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="28" y="52" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">Lineal Strip</text>
    <path d="M46 190 H344 V286 H46 Z" fill="rgba(15,118,110,.13)" stroke="#0f766e" stroke-width="6"/>
    <path d="M80 238 H310" stroke="#0f766e" stroke-width="8" marker-end="url(#arr-teal)"/>
    <path d="M310 238 H80" stroke="#0f766e" stroke-width="8" marker-end="url(#arr-teal)"/>
    <circle cx="195" cy="238" r="11" fill="#111827"/>
    <text x="82" y="340" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">0+ C = L = span{(1,0)}</text>
    <text x="72" y="380" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748b">Both d and -d keep every ray inside.</text>
  </g>
  <g transform="translate(500 78)">
    <rect x="0" y="0" width="390" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="28" y="52" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">Pointed Cone</text>
    <line x1="78" y1="330" x2="318" y2="330" stroke="#94a3b8" stroke-width="4"/>
    <line x1="78" y1="330" x2="78" y2="90" stroke="#94a3b8" stroke-width="4"/>
    <path d="M78 330 H318 V90 H78 Z" fill="rgba(37,99,235,.12)" stroke="#2563eb" stroke-width="6"/>
    <path d="M96 312 L292 116" stroke="#2563eb" stroke-width="8" marker-end="url(#arr-blue)"/>
    <path d="M98 310 L34 374" stroke="#b45309" stroke-width="7" stroke-dasharray="14 10"/>
    <text x="92" y="380" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">L = 0+ C cap (-0+ C) = {0}</text>
    <text x="72" y="420" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748b">The opposite ray exits immediately.</text>
  </g>
  <text x="90" y="568" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Lineality is the reversible part of recession: directions that work forever in both signs.</text>
</svg>
