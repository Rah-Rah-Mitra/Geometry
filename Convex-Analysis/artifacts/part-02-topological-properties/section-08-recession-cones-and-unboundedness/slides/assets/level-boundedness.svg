<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Level boundedness compared across two convex functions</title>
  <desc id="desc">Quadratic level sets are bounded intervals, while exponential lower level sets extend without bound to the left.</desc>
  <defs>
    <marker id="arr-left" markerWidth="16" markerHeight="16" refX="3" refY="8" orient="auto">
      <path d="M16,0 L0,8 L16,16 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <g transform="translate(64 72)">
    <rect x="0" y="0" width="400" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="30" y="50" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">Level Bounded</text>
    <line x1="48" y1="346" x2="352" y2="346" stroke="#94a3b8" stroke-width="4"/>
    <line x1="200" y1="374" x2="200" y2="84" stroke="#94a3b8" stroke-width="4"/>
    <path d="M96 346 C128 292 160 160 200 112 C240 160 272 292 304 346" fill="none" stroke="#2563eb" stroke-width="7"/>
    <line x1="74" y1="226" x2="326" y2="226" stroke="#0f766e" stroke-width="5" stroke-dasharray="12 9"/>
    <line x1="146" y1="346" x2="254" y2="346" stroke="#0f766e" stroke-width="11" stroke-linecap="round"/>
    <text x="118" y="392" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#111827">{x : x^2 <= alpha}</text>
    <text x="94" y="424" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#64748b">No nonzero recession direction</text>
  </g>
  <g transform="translate(498 72)">
    <rect x="0" y="0" width="400" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="30" y="50" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">Escape Level Sets</text>
    <line x1="48" y1="346" x2="352" y2="346" stroke="#94a3b8" stroke-width="4"/>
    <line x1="200" y1="374" x2="200" y2="84" stroke="#94a3b8" stroke-width="4"/>
    <path d="M54 344 C118 342 176 330 222 286 C260 250 292 176 342 90" fill="none" stroke="#2563eb" stroke-width="7"/>
    <line x1="64" y1="226" x2="330" y2="226" stroke="#0f766e" stroke-width="5" stroke-dasharray="12 9"/>
    <path d="M202 346 H58" stroke="#b45309" stroke-width="11" stroke-linecap="round" marker-end="url(#arr-left)"/>
    <text x="74" y="392" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#111827">{x : exp(x) <= alpha}</text>
    <text x="66" y="424" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#64748b">Direction d = -1 never raises f</text>
  </g>
  <text x="92" y="562" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">For closed convex f, all nonempty lower level sets share the cone {d : f^{0+}(d) <= 0}.</text>
</svg>
