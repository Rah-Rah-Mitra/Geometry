<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Recession direction in an unbounded convex set</title>
  <desc id="desc">A half-strip convex set with a ray showing that adding a nonnegative multiple of a recession direction stays feasible.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#b45309"/>
    </marker>
    <linearGradient id="fade-right" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.7" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#eff6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <path d="M80 80 H880 M80 160 H880 M80 240 H880 M80 320 H880 M80 400 H880 M80 480 H880"/>
    <path d="M120 60 V520 M220 60 V520 M320 60 V520 M420 60 V520 M520 60 V520 M620 60 V520 M720 60 V520 M820 60 V520"/>
  </g>
  <line x1="92" y1="500" x2="880" y2="500" stroke="#94a3b8" stroke-width="4"/>
  <line x1="120" y1="520" x2="120" y2="84" stroke="#94a3b8" stroke-width="4"/>
  <text x="850" y="548" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#64748b">x1</text>
  <text x="74" y="98" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#64748b">x2</text>
  <path d="M260 260 H890 V410 H260 Z" fill="url(#fade-right)" stroke="#2563eb" stroke-width="7"/>
  <path d="M260 260 H890" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M260 410 H890" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <text x="284" y="238" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">C = {x1 >= 0, 0 <= x2 <= 2}</text>
  <circle cx="355" cy="340" r="13" fill="#0f766e"/>
  <text x="328" y="380" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">x</text>
  <path d="M355 340 H760" fill="none" stroke="#b45309" stroke-width="9" stroke-linecap="round" stroke-dasharray="18 12" marker-end="url(#arrow-amber)"/>
  <circle cx="545" cy="340" r="10" fill="#b45309"/>
  <text x="514" y="313" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">x + t d</text>
  <text x="618" y="374" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">same vertical slice</text>
  <g transform="translate(122 92)">
    <rect x="0" y="0" width="210" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="38" y1="78" x2="174" y2="78" stroke="#2563eb" stroke-width="7" marker-end="url(#arrow-blue)"/>
    <circle cx="38" cy="78" r="8" fill="#1e3a8a"/>
    <text x="24" y="38" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">0+ C</text>
    <text x="52" y="108" font-family="STIX Two Text, Georgia, serif" font-size="22" fill="#475569">d = (1,0)</text>
  </g>
  <rect x="260" y="260" width="26" height="150" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="298" y="455" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#64748b">starting wall</text>
  <text x="110" y="574" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Certificate: for every feasible x and every t >= 0, the point x + t d remains in C.</text>
</svg>
