<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Recession function through the epigraph horizon</title>
  <desc id="desc">The epigraph of exp(x) has a horizontal recession direction to the left, giving a zero recession value for negative directions.</desc>
  <defs>
    <marker id="arr-amber" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#b45309"/>
    </marker>
    <clipPath id="epi-clip"><rect x="66" y="70" width="500" height="420"/></clipPath>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <g transform="translate(54 56)">
    <rect x="0" y="0" width="560" height="492" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="66" y1="420" x2="526" y2="420" stroke="#94a3b8" stroke-width="4"/>
    <line x1="300" y1="456" x2="300" y2="56" stroke="#94a3b8" stroke-width="4"/>
    <g clip-path="url(#epi-clip)">
      <path d="M66 420 C146 414 222 390 292 318 C354 254 410 172 526 84 L526 70 L66 70 Z" fill="rgba(37,99,235,.12)"/>
      <path d="M66 420 C146 414 222 390 292 318 C354 254 410 172 526 84" fill="none" stroke="#2563eb" stroke-width="7"/>
      <path d="M432 166 H142" fill="none" stroke="#b45309" stroke-width="8" stroke-dasharray="17 12" marker-end="url(#arr-amber)"/>
    </g>
    <circle cx="432" cy="166" r="10" fill="#0f766e"/>
    <text x="84" y="52" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">epi f for f(x)=exp(x)</text>
    <text x="134" y="138" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">horizontal escape</text>
    <text x="360" y="464" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#64748b">x</text>
    <text x="252" y="78" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#64748b">t</text>
  </g>
  <g transform="translate(648 92)">
    <rect x="0" y="0" width="244" height="396" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="26" y="48" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#1e3a8a">Horizon Readout</text>
    <path d="M48 282 H196" stroke="#94a3b8" stroke-width="4"/>
    <path d="M122 332 V86" stroke="#94a3b8" stroke-width="4"/>
    <path d="M122 282 H50 V126 H122 Z" fill="rgba(15,118,110,.14)" stroke="#0f766e" stroke-width="6"/>
    <text x="30" y="360" font-family="STIX Two Text, Georgia, serif" font-size="26" fill="#111827">epi f^{0+}</text>
    <text x="30" y="92" font-family="STIX Two Text, Georgia, serif" font-size="24" fill="#111827">v >= 0</text>
    <text x="32" y="224" font-family="STIX Two Text, Georgia, serif" font-size="24" fill="#111827">d <= 0</text>
  </g>
  <text x="76" y="584" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">The recession function is the epigraph's horizon: (d,v) lies in 0+ epi f exactly when v >= f^{0+}(d).</text>
</svg>
