<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">Affine hull topology</title>
  <desc id="desc">Relative neighborhoods are ambient balls sliced by the affine hull.</desc>
  <defs>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#cbd5e1"/>
    </pattern>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect width="1240" height="620" fill="#ffffff"/>
  <rect x="40" y="38" width="1160" height="520" rx="10" fill="url(#dots)" stroke="#cbd5e1" stroke-width="4"/>
  <path d="M120 445 C330 330 562 238 1120 96" fill="none" stroke="#94a3b8" stroke-width="10" stroke-dasharray="22 18"/>
  <path d="M318 343 C440 286 578 242 782 191" fill="none" stroke="#2563eb" stroke-width="20" stroke-linecap="round"/>
  <ellipse cx="548" cy="266" rx="154" ry="154" fill="#2563eb" opacity=".10" stroke="#2563eb" stroke-width="5"/>
  <path d="M404 318 C455 291 516 268 694 224" fill="none" stroke="#0f766e" stroke-width="16" stroke-linecap="round"/>
  <circle cx="548" cy="266" r="17" fill="#0f766e"/>
  <line x1="548" y1="266" x2="690" y2="228" stroke="#b45309" stroke-width="5" marker-end="url(#arr)"/>
  <text x="718" y="224" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#b45309">small directions allowed only in aff C</text>
  <text x="214" y="476" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">aff C</text>
  <text x="432" y="374" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#2563eb">C</text>
  <text x="568" y="250" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f766e">x</text>
  <text x="78" y="86" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">Relative neighborhood</text>
  <text x="78" y="128" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569">ambient ball intersected with the smallest affine world containing C</text>
</svg>
