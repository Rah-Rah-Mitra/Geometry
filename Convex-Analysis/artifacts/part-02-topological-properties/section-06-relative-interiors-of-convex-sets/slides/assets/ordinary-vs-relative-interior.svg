<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 520" role="img" aria-labelledby="title desc">
  <title id="title">Ordinary interior versus relative interior</title>
  <desc id="desc">Three convex sets: a full square, a line segment, and a point, with relative interiors highlighted inside their affine hulls.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1380" height="520" fill="#ffffff"/>
  <g transform="translate(40 48)">
    <rect x="0" y="0" width="390" height="390" rx="8" fill="url(#grid)" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="112" y="90" width="166" height="166" fill="#eff6ff" stroke="#2563eb" stroke-width="7"/>
    <rect x="144" y="122" width="102" height="102" fill="#2563eb" opacity=".18"/>
    <text x="28" y="426" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Full dimensional square</text>
    <text x="28" y="462" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#475569">int C = ri C inside R2</text>
  </g>
  <g transform="translate(496 48)">
    <rect x="0" y="0" width="390" height="390" rx="8" fill="url(#grid)" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="58" y1="282" x2="332" y2="106" stroke="#94a3b8" stroke-width="5" stroke-dasharray="16 14" marker-end="url(#arrow)"/>
    <line x1="108" y1="250" x2="286" y2="136" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <line x1="139" y1="230" x2="255" y2="156" stroke="#0f766e" stroke-width="14" stroke-linecap="round"/>
    <circle cx="108" cy="250" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="6"/>
    <circle cx="286" cy="136" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="6"/>
    <circle cx="197" cy="193" r="15" fill="#0f766e"/>
    <text x="30" y="426" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Segment in R2</text>
    <text x="30" y="462" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#475569">ordinary interior empty, ri is open segment</text>
  </g>
  <g transform="translate(952 48)">
    <rect x="0" y="0" width="390" height="390" rx="8" fill="url(#grid)" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="196" cy="196" r="102" fill="#f0fdfa" stroke="#0f766e" stroke-width="4" opacity=".52"/>
    <circle cx="196" cy="196" r="20" fill="#0f766e"/>
    <text x="224" y="204" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f766e">{p}</text>
    <text x="30" y="426" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Singleton</text>
    <text x="30" y="462" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#475569">aff C is a point, so ri C = C</text>
  </g>
</svg>
