<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 560" role="img" aria-labelledby="title desc">
  <title id="title">Intersection qualification</title>
  <desc id="desc">Qualified convex intersection with common relative interior point compared with an unqualified boundary-only contact.</desc>
  <rect width="1320" height="560" fill="#ffffff"/>
  <g transform="translate(52 50)">
    <rect width="560" height="410" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="92" y="104" width="372" height="210" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="6"/>
    <path d="M96 348 L482 72" stroke="#0f766e" stroke-width="13" stroke-linecap="round"/>
    <path d="M174 292 L390 138" stroke="#b45309" stroke-width="17" stroke-linecap="round"/>
    <circle cx="282" cy="215" r="15" fill="#b45309"/>
    <text x="38" y="54" font-family="Source Sans 3, Arial, sans-serif" font-size="31" font-weight="700" fill="#1e3a8a">Qualified</text>
    <text x="38" y="386" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569">ri C1 and ri C2 share a point</text>
    <text x="300" y="207" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#b45309">common ri point</text>
  </g>
  <g transform="translate(706 50)">
    <rect width="560" height="410" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="216" cy="210" r="124" fill="#eff6ff" stroke="#2563eb" stroke-width="6"/>
    <circle cx="464" cy="210" r="124" fill="#f0fdfa" stroke="#0f766e" stroke-width="6"/>
    <circle cx="340" cy="210" r="16" fill="#b45309"/>
    <text x="38" y="54" font-family="Source Sans 3, Arial, sans-serif" font-size="31" font-weight="700" fill="#1e3a8a">Boundary-only contact</text>
    <text x="38" y="386" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569">intersection has a relative interior, but the inputs do not share one</text>
    <text x="360" y="201" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#b45309">single point</text>
  </g>
</svg>
