<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Chord continuity control for a convex graph</title>
  <desc id="desc">A convex graph on an interval with secant chords bracketing local oscillation near an interior point.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#B45309"/>
    </marker>
    <linearGradient id="core-fill" x1="0" x2="1">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="560" fill="#FFFFFF"/>
  <rect x="88" y="70" width="812" height="402" fill="url(#core-fill)" stroke="#E2E8F0" stroke-width="2" rx="8"/>
  <g stroke="#E2E8F0" stroke-width="1.3">
    <path d="M120 420 H870"/>
    <path d="M120 360 H870"/>
    <path d="M120 300 H870"/>
    <path d="M120 240 H870"/>
    <path d="M120 180 H870"/>
    <path d="M220 445 V92"/>
    <path d="M360 445 V92"/>
    <path d="M500 445 V92"/>
    <path d="M640 445 V92"/>
    <path d="M780 445 V92"/>
  </g>
  <g stroke="#475569" stroke-width="3">
    <path d="M120 445 H880" marker-end="url(#arrow-blue)"/>
    <path d="M120 445 V92" marker-end="url(#arrow-blue)"/>
  </g>
  <text x="885" y="456" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#475569">x</text>
  <text x="94" y="89" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#475569">f(x)</text>
  <path d="M155 372 C235 349 300 318 365 278 C440 232 500 188 565 154 C650 110 740 99 850 110"
        fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
  <path d="M250 344 L765 103" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/>
  <path d="M355 284 L650 118" stroke="#B45309" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M432 237 L568 151" stroke="#6D28D9" stroke-width="5" stroke-linecap="round"/>
  <g fill="#111827">
    <circle cx="250" cy="344" r="9"/>
    <circle cx="500" cy="188" r="10"/>
    <circle cx="765" cy="103" r="9"/>
    <circle cx="432" cy="237" r="8" fill="#6D28D9"/>
    <circle cx="568" cy="151" r="8" fill="#6D28D9"/>
  </g>
  <rect x="425" y="445" width="150" height="24" fill="#0F766E" opacity="0.18"/>
  <path d="M425 444 V466 M575 444 V466" stroke="#0F766E" stroke-width="3"/>
  <text x="452" y="503" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F766E">local core</text>
  <path d="M500 189 V445" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="512" y="217" font-family="STIX Two Text, Georgia, serif" font-size="32" fill="#111827">x0</text>
  <text x="265" y="332" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">a</text>
  <text x="780" y="97" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">b</text>
  <path d="M555 302 C606 288 662 256 704 214" fill="none" stroke="#B45309" stroke-width="4" marker-end="url(#arrow-amber)"/>
  <text x="615" y="310" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#B45309">secant slopes squeeze</text>
  <text x="590" y="340" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#475569">nearby values cannot jump alone</text>
  <rect x="150" y="102" width="324" height="76" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="172" y="134" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#1E3A8A">Interior point plus endpoints</text>
  <text x="172" y="165" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#475569">one chord gives an upper bound</text>
  <rect x="612" y="385" width="234" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="633" y="421" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">osc_K f &lt;= L_K |x-y|</text>
</svg>
