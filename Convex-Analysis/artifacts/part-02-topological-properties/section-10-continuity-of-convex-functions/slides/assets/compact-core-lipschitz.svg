<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Compact core Lipschitz buffer</title>
  <desc id="desc">A compact subset inside the relative interior of a convex domain, with a buffer supporting uniform secant bounds.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#FFFFFF"/>
  <g transform="translate(80 56)">
    <rect x="0" y="0" width="530" height="430" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M92 80 C170 14 365 18 438 105 C517 199 456 359 300 384 C146 409 35 307 49 193 C56 141 66 104 92 80 Z"
          fill="#EFF6FF" stroke="#2563EB" stroke-width="5"/>
    <path d="M147 143 C200 101 331 100 383 159 C437 221 392 319 288 335 C187 350 111 287 119 211 C123 176 132 157 147 143 Z"
          fill="#DBEAFE" stroke="#60A5FA" stroke-width="4" stroke-dasharray="12 10"/>
    <path d="M190 186 C232 157 309 158 342 197 C374 235 344 291 281 300 C220 309 175 271 178 226 C181 208 183 197 190 186 Z"
          fill="#CCFBF1" stroke="#0F766E" stroke-width="5"/>
    <circle cx="220" cy="236" r="9" fill="#111827"/>
    <circle cx="315" cy="215" r="9" fill="#111827"/>
    <circle cx="390" cy="176" r="9" fill="#B45309"/>
    <path d="M220 236 L315 215" stroke="#111827" stroke-width="4"/>
    <path d="M315 215 L390 176" stroke="#B45309" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-teal)"/>
    <text x="205" y="267" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">x</text>
    <text x="323" y="206" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">y</text>
    <text x="400" y="169" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#B45309">z</text>
    <text x="221" y="389" font-family="Source Sans 3, Arial, sans-serif" font-size="29" font-weight="700" fill="#2563EB">ri(dom f)</text>
    <text x="197" y="337" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F766E">compact core S</text>
    <text x="138" y="123" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#2563EB">S + eps B still inside</text>
  </g>
  <g transform="translate(660 72)">
    <rect x="0" y="0" width="270" height="386" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="24" y="49" font-family="Source Sans 3, Arial, sans-serif" font-size="31" font-weight="700" fill="#1E3A8A">Secant Bound</text>
    <path d="M32 96 H236" stroke="#CBD5E1" stroke-width="2"/>
    <text x="30" y="139" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#111827">y = (1-lambda)x + lambda z</text>
    <text x="30" y="194" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#111827">0 &lt; lambda &lt; 1</text>
    <path d="M44 230 C82 210 119 210 156 230 S224 251 246 227" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="31" y="291" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">|f(y)-f(x)|</text>
    <text x="31" y="330" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">&lt;= L_S |y-x|</text>
    <rect x="26" y="346" width="218" height="28" fill="#0F766E" opacity="0.14"/>
  </g>
  <text x="98" y="535" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748B">Bounded values on a slightly larger set become a uniform slope bound on the inner set.</text>
</svg>
