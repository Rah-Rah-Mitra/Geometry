<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Failure gallery for convex continuity</title>
  <desc id="desc">Four small diagnostic panels showing common failures at boundaries and under missing hypotheses.</desc>
  <rect width="1000" height="560" fill="#FFFFFF"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <text x="72" y="48" font-size="34" font-weight="700" fill="#1E3A8A">Failure Gallery: What The Hypotheses Prevent</text>
  </g>
  <g transform="translate(70 80)">
    <rect x="0" y="0" width="400" height="190" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
    <path d="M38 150 H355 M66 160 V35" stroke="#64748B" stroke-width="2.5"/>
    <path d="M72 146 C130 143 190 125 250 68 C286 35 321 24 348 28" fill="none" stroke="#2563EB" stroke-width="4"/>
    <path d="M74 150 C150 146 220 143 335 141" fill="none" stroke="#0F766E" stroke-width="4"/>
    <path d="M72 148 C119 130 160 101 194 56" fill="none" stroke="#B45309" stroke-width="4" stroke-dasharray="8 7"/>
    <text x="28" y="28" font-size="24" font-weight="700" fill="#B45309">Boundary Tangency</text>
    <text x="30" y="180" font-size="19" fill="#475569">radial limit and tangent limit disagree</text>
  </g>
  <g transform="translate(530 80)">
    <rect x="0" y="0" width="400" height="190" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <path d="M44 150 H350 M76 160 V35" stroke="#64748B" stroke-width="2.5"/>
    <path d="M83 127 C150 118 222 95 329 55" fill="none" stroke="#2563EB" stroke-width="4"/>
    <circle cx="83" cy="127" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <circle cx="83" cy="157" r="7" fill="#B45309"/>
    <path d="M83 130 V154" stroke="#B45309" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="28" y="28" font-size="24" font-weight="700" fill="#1E3A8A">Closure Gap</text>
    <text x="30" y="180" font-size="19" fill="#475569">closed epigraph repairs missing boundary value</text>
  </g>
  <g transform="translate(70 310)">
    <rect x="0" y="0" width="400" height="190" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="2"/>
    <path d="M45 148 H350 M75 158 V35" stroke="#64748B" stroke-width="2.5"/>
    <path d="M88 135 C145 92 220 79 314 74" fill="none" stroke="#0F766E" stroke-width="4"/>
    <path d="M88 135 C155 134 230 126 324 89" fill="none" stroke="#6D28D9" stroke-width="4"/>
    <rect x="56" y="52" width="308" height="105" fill="none" stroke="#B45309" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="28" y="28" font-size="24" font-weight="700" fill="#0F766E">No Common Core</text>
    <text x="30" y="180" font-size="19" fill="#475569">operation rules need a shared relative-interior zone</text>
  </g>
  <g transform="translate(530 310)">
    <rect x="0" y="0" width="400" height="190" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
    <path d="M43 148 H350 M73 158 V35" stroke="#64748B" stroke-width="2.5"/>
    <circle cx="105" cy="122" r="6" fill="#6D28D9"/>
    <circle cx="176" cy="97" r="6" fill="#6D28D9"/>
    <circle cx="253" cy="75" r="6" fill="#6D28D9"/>
    <path d="M95 126 C160 60 226 128 305 56" fill="none" stroke="#B45309" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M95 126 C160 111 225 87 305 56" fill="none" stroke="#2563EB" stroke-width="4"/>
    <text x="28" y="28" font-size="24" font-weight="700" fill="#6D28D9">Sparse Sampling</text>
    <text x="30" y="180" font-size="19" fill="#475569">dense data plus convex bounds drive compact convergence</text>
  </g>
</svg>
