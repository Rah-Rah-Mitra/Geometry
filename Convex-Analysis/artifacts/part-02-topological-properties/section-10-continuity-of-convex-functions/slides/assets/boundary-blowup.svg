<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Boundary blow-up paths</title>
  <desc id="desc">Two approach paths to a boundary point of a convex domain, one radial with finite limit and one tangent with values growing.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#B45309"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#FFFFFF"/>
  <rect x="90" y="68" width="520" height="410" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M214 430 V105" stroke="#475569" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M214 430 H560" stroke="#475569" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M214 430 C250 330 295 257 350 206 C403 157 468 128 552 113 L552 430 Z"
        fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
  <path d="M214 430 L530 163" stroke="#0F766E" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M214 430 C250 405 285 384 322 369 C360 354 395 343 428 337 C457 331 485 328 515 326"
        fill="none" stroke="#B45309" stroke-width="5" stroke-dasharray="11 9" marker-end="url(#arrow-amber)"/>
  <circle cx="214" cy="430" r="11" fill="#111827"/>
  <text x="170" y="461" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">boundary point</text>
  <text x="394" y="193" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#0F766E">radial segment</text>
  <text x="354" y="386" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#B45309">tangent path</text>
  <text x="532" y="459" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#475569">x1</text>
  <text x="170" y="121" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#475569">x2</text>
  <g transform="translate(662 86)">
    <rect x="0" y="0" width="260" height="360" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="28" y="43" font-family="Source Sans 3, Arial, sans-serif" font-size="31" font-weight="700" fill="#1E3A8A">Value Along Path</text>
    <g stroke="#E2E8F0" stroke-width="1.5">
      <path d="M40 292 H225"/>
      <path d="M40 222 H225"/>
      <path d="M40 152 H225"/>
      <path d="M40 82 H225"/>
    </g>
    <path d="M40 300 H230" stroke="#475569" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M40 300 V76" stroke="#475569" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M52 271 C95 269 142 267 218 265" fill="none" stroke="#0F766E" stroke-width="5"/>
    <path d="M55 285 C96 270 132 242 164 194 C192 153 208 116 222 82" fill="none" stroke="#B45309" stroke-width="5"/>
    <text x="57" y="335" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#475569">approach to boundary</text>
    <text x="91" y="255" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F766E">finite</text>
    <text x="137" y="123" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#B45309">blows up</text>
  </g>
  <text x="108" y="520" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748B">Convexity prevents interior jumps, but it does not make every boundary approach equivalent.</text>
</svg>
