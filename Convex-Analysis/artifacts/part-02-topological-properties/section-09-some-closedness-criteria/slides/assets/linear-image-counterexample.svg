<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Linear image counterexample with null recession</title>
  <desc id="desc">Vertical kernel fibers cross a closed epigraph whose projection misses a limiting endpoint.</desc>
  <defs>
    <marker id="liArrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect width="1120" height="620" fill="#ffffff"/>
  <g transform="translate(72 70)">
    <rect x="0" y="0" width="610" height="430" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M72 378H558" stroke="#475569" stroke-width="4" marker-end="url(#liArrow)"/>
    <path d="M104 392V48" stroke="#475569" stroke-width="4" marker-end="url(#liArrow)"/>
    <path d="M126 356 C156 260 206 180 280 142 C354 104 448 92 556 84 L556 46 L126 46 Z" fill="#2563eb" fill-opacity=".13"/>
    <path d="M126 356 C156 260 206 180 280 142 C354 104 448 92 556 84" fill="none" stroke="#2563eb" stroke-width="7"/>
    <g stroke="#b45309" stroke-width="4" stroke-dasharray="12 10">
      <path d="M172 380V110"/>
      <path d="M246 380V120"/>
      <path d="M332 380V100"/>
      <path d="M430 380V86"/>
    </g>
    <path d="M392 310V110" stroke="#0f766e" stroke-width="8" marker-end="url(#liArrow)"/>
    <text x="408" y="198" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f766e">z in ker A</text>
    <text x="118" y="34" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">closed C</text>
    <text x="146" y="408" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#92400e">fibers drift upward</text>
  </g>
  <path d="M724 275H848" stroke="#1e3a8a" stroke-width="6" marker-end="url(#liArrow)"/>
  <g transform="translate(860 168)">
    <rect x="0" y="0" width="205" height="210" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
    <path d="M34 132H176" stroke="#475569" stroke-width="4" marker-end="url(#liArrow)"/>
    <circle cx="46" cy="132" r="10" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <path d="M70 132H176" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
    <text x="34" y="58" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f766e">A(C)</text>
    <text x="34" y="176" font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">endpoint absent</text>
  </g>
  <g transform="translate(84 534)">
    <rect x="0" y="0" width="960" height="48" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
    <text x="22" y="32" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#92400e">Diagnosis: a nonlineal recession direction lies in the kernel, so a convergent image can be produced by points escaping to infinity.</text>
  </g>
</svg>
