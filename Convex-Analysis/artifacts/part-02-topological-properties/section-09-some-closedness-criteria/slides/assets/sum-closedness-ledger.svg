<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Sum closedness recession ledger</title>
  <desc id="desc">A three-row ledger showing safe and unsafe recession-direction cancellation for sums of closed convex sets.</desc>
  <rect width="1120" height="620" fill="#ffffff"/>
  <g transform="translate(54 54)">
    <rect x="0" y="0" width="1012" height="512" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="36" y="54" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">Closedness ledger for C1 + C2</text>
    <g font-family="Source Sans 3, Arial, sans-serif" font-size="24">
      <rect x="36" y="88" width="940" height="58" fill="#eef2ff" stroke="#cbd5e1"/>
      <text x="58" y="126" font-weight="700" fill="#1e3a8a">Recession relation</text>
      <text x="424" y="126" font-weight="700" fill="#1e3a8a">Diagnostic</text>
      <text x="742" y="126" font-weight="700" fill="#1e3a8a">Conclusion</text>
      <rect x="36" y="146" width="940" height="104" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="58" y="188" fill="#111827">rec C1 has no opposite in rec C2</text>
      <path d="M462 206h96" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
      <path d="M570 206h96" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
      <text x="444" y="238" font-size="20" font-weight="600" fill="#64748b">no nonzero cancellation</text>
      <text x="742" y="188" fill="#0f766e" font-weight="700">sum is closed</text>
      <text x="742" y="224" fill="#111827">rec(C1 + C2) = rec C1 + rec C2</text>
      <rect x="36" y="250" width="940" height="104" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="58" y="292" fill="#111827">one summand is bounded</text>
      <circle cx="490" cy="310" r="34" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="5"/>
      <path d="M582 310h96" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
      <text x="444" y="342" font-size="20" font-weight="600" fill="#64748b">bounded means rec = {0}</text>
      <text x="742" y="292" fill="#0f766e" font-weight="700">safe special case</text>
      <text x="742" y="328" fill="#111827">compactness replaces recession risk</text>
      <rect x="36" y="354" width="940" height="116" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="58" y="397" fill="#111827">opposite rays cancel outside lineality</text>
      <path d="M554 414h-100" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
      <path d="M564 414h100" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
      <circle cx="559" cy="414" r="10" fill="#b45309"/>
      <text x="436" y="448" font-size="20" font-weight="600" fill="#92400e">possible escape in fibers</text>
      <text x="742" y="397" fill="#b45309" font-weight="700">closure can fail</text>
      <text x="742" y="433" fill="#111827">use lineality check before adding</text>
    </g>
  </g>
</svg>
