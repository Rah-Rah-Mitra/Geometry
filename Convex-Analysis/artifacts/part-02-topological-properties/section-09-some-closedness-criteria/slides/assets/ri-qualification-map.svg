<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Relative interior qualification map</title>
  <desc id="desc">Domains with a shared relative interior point support closure rules for sums and suprema.</desc>
  <defs>
    <marker id="riArrow" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto">
      <path d="M0,0 L15,7.5 L0,15 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect width="1120" height="620" fill="#ffffff"/>
  <g transform="translate(64 60)">
    <rect x="0" y="0" width="992" height="500" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <g transform="translate(46 46)">
      <ellipse cx="240" cy="210" rx="205" ry="132" fill="#2563eb" fill-opacity=".13" stroke="#2563eb" stroke-width="5"/>
      <ellipse cx="390" cy="210" rx="205" ry="132" fill="#0f766e" fill-opacity=".13" stroke="#0f766e" stroke-width="5"/>
      <ellipse cx="315" cy="240" rx="160" ry="92" fill="#6d28d9" fill-opacity=".10" stroke="#6d28d9" stroke-width="4" stroke-dasharray="12 10"/>
      <circle cx="315" cy="210" r="14" fill="#b45309"/>
      <text x="295" y="195" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">x0</text>
      <text x="78" y="112" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#2563eb">ri dom f1</text>
      <text x="438" y="112" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f766e">ri dom f2</text>
      <text x="178" y="370" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#6d28d9">shared relative-interior anchor</text>
      <path d="M315 210 C426 145 514 103 617 82" fill="none" stroke="#1e3a8a" stroke-width="5" stroke-dasharray="10 10" marker-end="url(#riArrow)"/>
      <text x="500" y="66" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">radial limit from x0</text>
    </g>
    <g transform="translate(676 84)">
      <rect x="0" y="0" width="270" height="132" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
      <text x="22" y="40" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Finite sums</text>
      <text x="22" y="80" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">cl(f + g) = cl f + cl g</text>
      <text x="22" y="112" font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="600" fill="#64748b">with a common ri domain point</text>
      <rect x="0" y="164" width="270" height="132" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="4"/>
      <text x="22" y="204" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f766e">Suprema</text>
      <text x="22" y="244" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">cl sup fi = sup cl fi</text>
      <text x="22" y="276" font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="600" fill="#64748b">when the anchor is finite</text>
      <rect x="0" y="328" width="270" height="86" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="4"/>
      <text x="22" y="363" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#92400e">Role</text>
      <text x="22" y="395" font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="600" fill="#111827">prevents boundary-only contact</text>
    </g>
  </g>
</svg>
