<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">Closed convex set with a nonclosed projection</title>
  <desc id="desc">A hyperbolic epigraph is closed in the plane, but its projection onto the horizontal axis misses zero.</desc>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#1e3a8a"/>
    </marker>
    <linearGradient id="region" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".20"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="660" fill="#ffffff"/>
  <g transform="translate(72 54)">
    <rect x="0" y="0" width="640" height="500" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <g stroke="#e2e8f0" stroke-width="2">
      <path d="M80 0V500M160 0V500M240 0V500M320 0V500M400 0V500M480 0V500M560 0V500"/>
      <path d="M0 80H640M0 160H640M0 240H640M0 320H640M0 400H640"/>
    </g>
    <path d="M62 448H604" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M96 468V50" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M134 430 C156 360 182 286 220 236 C262 181 318 153 604 132 L604 58 L134 58 Z" fill="url(#region)" stroke="none"/>
    <path d="M134 430 C156 360 182 286 220 236 C262 181 318 153 604 132" fill="none" stroke="#2563eb" stroke-width="7"/>
    <path d="M134 430 C156 360 182 286 220 236 C262 181 318 153 604 132" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="10 12"/>
    <circle cx="96" cy="448" r="10" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <path d="M96 448H604" stroke="#0f766e" stroke-width="10" opacity=".28"/>
    <path d="M120 448H604" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
    <text x="123" y="37" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">C = {(u,v): u &gt; 0, uv &gt;= 1}</text>
    <text x="452" y="482" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#475569">u</text>
    <text x="61" y="76" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#475569">v</text>
    <text x="120" y="486" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f766e">A(C) = (0, infinity)</text>
    <text x="18" y="491" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#b45309">0 missing</text>
  </g>
  <g transform="translate(770 110)">
    <rect x="0" y="0" width="286" height="340" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
    <text x="26" y="54" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#92400e">Projection warning</text>
    <text x="26" y="103" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#111827">The plane set is closed.</text>
    <text x="26" y="146" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#111827">The projected axis set</text>
    <text x="26" y="176" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#111827">has an infimum it does</text>
    <text x="26" y="206" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#111827">not attain.</text>
    <path d="M42 260H234" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow)"/>
    <circle cx="52" cy="260" r="11" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <path d="M76 260H234" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
    <text x="44" y="305" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">closure adds the endpoint</text>
  </g>
</svg>
