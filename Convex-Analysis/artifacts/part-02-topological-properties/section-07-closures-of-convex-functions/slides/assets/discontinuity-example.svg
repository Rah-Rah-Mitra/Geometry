<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">A discontinuous convex example repaired by closure</title>
  <desc id="desc">The indicator of an open ray changes value at the origin when the epigraph is closed.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .label{font:700 24px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 19px 'Source Sans 3',Arial,sans-serif;fill:#64748b}
      .math{font:400 25px 'STIX Two Text',Georgia,serif;fill:#111827}
      .axis{stroke:#64748b;stroke-width:3;marker-end:url(#axisArrow)}
      .grid{stroke:#e2e8f0;stroke-width:1}
    </style>
  </defs>
  <rect width="960" height="560" fill="#fff"/>
  <rect x="68" y="62" width="824" height="416" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M126 400 H846 M256 432 V108" class="axis"/>
  <path d="M126 328 H846 M126 256 H846 M126 184 H846 M376 108 V432 M496 108 V432 M616 108 V432 M736 108 V432" class="grid"/>
  <path d="M258 400 H834" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="400" r="15" fill="#fff" stroke="#b45309" stroke-width="6"/>
  <circle cx="256" cy="400" r="7" fill="#fff"/>
  <circle cx="256" cy="400" r="11" fill="#0f766e" transform="translate(0 -48)"/>
  <path d="M256 352 L256 400" stroke="#0f766e" stroke-width="5" stroke-dasharray="8 6"/>
  <text x="112" y="102" class="label">Open-ray indicator</text>
  <text x="302" y="300" class="math">f(x)=0 for x&gt;0</text>
  <text x="302" y="340" class="math">f(x)=+infty for x<=0</text>
  <text x="282" y="438" class="small">original graph has no value at the endpoint</text>
  <text x="286" y="366" class="small">closure inserts the endpoint value 0</text>
  <text x="822" y="432" class="small">x</text>
  <text x="220" y="126" class="small">value</text>
  <g transform="translate(590 118)">
    <rect x="0" y="0" width="246" height="96" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="20" y="34" class="small">Interior samples unchanged</text>
    <text x="20" y="70" class="math">cl f = f on (0,infty)</text>
  </g>
  <g transform="translate(590 236)">
    <rect x="0" y="0" width="246" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="20" y="34" class="small">Boundary value repaired</text>
    <text x="20" y="70" class="math">(cl f)(0)=0</text>
  </g>
</svg>
