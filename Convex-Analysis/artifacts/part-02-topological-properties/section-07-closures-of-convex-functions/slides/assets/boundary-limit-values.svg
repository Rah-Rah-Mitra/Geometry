<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Boundary value from interior radial limits</title>
  <desc id="desc">An interior anchor sends radial segments to boundary points; graph heights approach the closure value.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <style>
      .label{font:700 24px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 19px 'Source Sans 3',Arial,sans-serif;fill:#64748b}
      .math{font:400 24px 'STIX Two Text',Georgia,serif;fill:#111827}
      .axis{stroke:#64748b;stroke-width:3}
      .grid{stroke:#e2e8f0;stroke-width:1}
    </style>
  </defs>
  <rect width="960" height="560" fill="#fff"/>
  <rect x="52" y="62" width="390" height="394" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="516" y="62" width="390" height="394" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <g>
    <ellipse cx="248" cy="258" rx="142" ry="100" fill="#eff6ff" stroke="#2563eb" stroke-width="6"/>
    <ellipse cx="248" cy="258" rx="96" ry="63" fill="#f0fdfa" stroke="#0f766e" stroke-width="4" opacity=".75"/>
    <circle cx="206" cy="264" r="12" fill="#1e3a8a"/>
    <circle cx="374" cy="219" r="14" fill="#b45309"/>
    <line x1="206" y1="264" x2="374" y2="219" stroke="#1e3a8a" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
    <circle cx="314" cy="235" r="10" fill="#0f766e"/>
    <circle cx="348" cy="226" r="10" fill="#0f766e"/>
    <text x="110" y="112" class="label">domain view</text>
    <text x="186" y="296" class="math">x</text>
    <text x="386" y="214" class="math">y</text>
    <text x="244" y="202" class="small">(1-lambda)x + lambda y</text>
    <text x="112" y="416" class="small">approach y from ri(dom f), not from arbitrary exterior points</text>
  </g>
  <g>
    <path d="M568 388 H858 M568 388 V116" class="axis"/>
    <path d="M568 328 H858 M568 268 H858 M568 208 H858 M640 116 V388 M712 116 V388 M784 116 V388" class="grid"/>
    <path d="M588 338 C650 325 706 298 756 250 C794 213 823 174 844 132" fill="none" stroke="#2563eb" stroke-width="7"/>
    <path d="M844 132 L844 388" stroke="#b45309" stroke-width="5" stroke-dasharray="10 8"/>
    <circle cx="844" cy="132" r="13" fill="#b45309"/>
    <circle cx="812" cy="178" r="9" fill="#0f766e"/>
    <circle cx="790" cy="206" r="9" fill="#0f766e"/>
    <circle cx="760" cy="246" r="9" fill="#0f766e"/>
    <text x="584" y="112" class="label">height view</text>
    <text x="744" y="430" class="small">lambda -> 1</text>
    <text x="584" y="430" class="small">lambda = 0</text>
    <text x="652" y="94" class="math">(cl f)(y)=lim f((1-lambda)x+lambda y)</text>
    <text x="626" y="470" class="small">For proper convex functions, one interior anchor recovers every boundary closure value.</text>
  </g>
</svg>
