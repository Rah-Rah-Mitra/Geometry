<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Epigraph closure of a convex function with a missing boundary value</title>
  <desc id="desc">Two coordinate panels compare an open epigraph boundary with its closed epigraph closure.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <marker id="flowArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <style>
      .label{font:700 24px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 19px 'Source Sans 3',Arial,sans-serif;fill:#64748b}
      .math{font:400 23px 'STIX Two Text',Georgia,serif;fill:#111827}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .grid{stroke:#e2e8f0;stroke-width:1}
      .axis{stroke:#64748b;stroke-width:3;marker-end:url(#axisArrow)}
    </style>
  </defs>
  <rect width="960" height="560" fill="#fff"/>
  <rect x="36" y="52" width="390" height="430" rx="8" class="panel"/>
  <rect x="534" y="52" width="390" height="430" rx="8" class="panel"/>
  <g opacity=".8">
    <path d="M84 404 H384 M84 324 H384 M84 244 H384 M84 164 H384 M156 92 V432 M236 92 V432 M316 92 V432" class="grid"/>
    <path d="M582 404 H882 M582 324 H882 M582 244 H882 M582 164 H882 M654 92 V432 M734 92 V432 M814 92 V432" class="grid"/>
  </g>
  <g>
    <line x1="84" y1="404" x2="392" y2="404" class="axis"/>
    <line x1="156" y1="432" x2="156" y2="88" class="axis"/>
    <line x1="582" y1="404" x2="890" y2="404" class="axis"/>
    <line x1="654" y1="432" x2="654" y2="88" class="axis"/>
    <text x="382" y="435" class="small">x</text>
    <text x="128" y="102" class="small">mu</text>
    <text x="880" y="435" class="small">x</text>
    <text x="626" y="102" class="small">mu</text>
  </g>
  <g>
    <path d="M158 403 L384 403 L384 120 L158 120 Z" fill="#2563eb" opacity=".13"/>
    <line x1="158" y1="404" x2="384" y2="404" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <line x1="156" y1="120" x2="156" y2="396" stroke="#2563eb" stroke-width="7" stroke-dasharray="12 11" opacity=".55"/>
    <circle cx="156" cy="404" r="14" fill="#fff" stroke="#b45309" stroke-width="6"/>
    <text x="70" y="44" class="label">epi f misses a limit point</text>
    <text x="190" y="454" class="math">f(x)=0 for x&gt;0</text>
    <text x="184" y="142" class="small">open vertical edge</text>
  </g>
  <g>
    <path d="M654 404 L882 404 L882 120 L654 120 Z" fill="#0f766e" opacity=".13"/>
    <line x1="654" y1="404" x2="882" y2="404" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
    <line x1="654" y1="120" x2="654" y2="404" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
    <circle cx="654" cy="404" r="13" fill="#0f766e"/>
    <text x="570" y="44" class="label">cl epi f supplies the boundary</text>
    <text x="690" y="454" class="math">(cl f)(0)=0</text>
    <text x="684" y="142" class="small">closed vertical edge</text>
  </g>
  <line x1="446" y1="268" x2="512" y2="268" stroke="#1e3a8a" stroke-width="6" marker-end="url(#flowArrow)"/>
  <text x="416" y="238" class="small">take closure</text>
  <text x="94" y="526" class="small">Epigraph closure enlarges the epigraph only at limiting boundary points, so the function can move downward there.</text>
</svg>
