<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Closed hull operation for convex functions</title>
  <desc id="desc">A four-step flow sends a convex function to its epigraph, closes the epigraph, and reads off the lower boundary as the closed hull.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .label{font:700 24px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 19px 'Source Sans 3',Arial,sans-serif;fill:#64748b}
      .math{font:400 24px 'STIX Two Text',Georgia,serif;fill:#111827}
    </style>
  </defs>
  <rect width="960" height="560" fill="#fff"/>
  <g>
    <rect x="56" y="92" width="184" height="132" rx="8" class="box"/>
    <rect x="282" y="92" width="184" height="132" rx="8" class="box"/>
    <rect x="508" y="92" width="184" height="132" rx="8" class="box"/>
    <rect x="734" y="92" width="184" height="132" rx="8" class="box"/>
    <path d="M240 158 H270" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M466 158 H496" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M692 158 H722" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="116" y="142" class="label">f</text>
    <text x="86" y="184" class="small">convex data</text>
    <text x="320" y="142" class="label">epi f</text>
    <text x="314" y="184" class="small">closedness test</text>
    <text x="546" y="142" class="label">cl epi f</text>
    <text x="526" y="184" class="small">topological repair</text>
    <text x="780" y="142" class="label">cl f</text>
    <text x="764" y="184" class="small">lower boundary</text>
  </g>
  <g transform="translate(98 282)">
    <rect x="0" y="0" width="764" height="174" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M58 126 H706" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M58 126 C160 96 268 76 382 74 C496 72 602 94 706 118" fill="none" stroke="#2563eb" stroke-width="7"/>
    <path d="M58 126 C160 96 268 76 382 74 C496 72 602 94 706 118" fill="none" stroke="#0f766e" stroke-width="18" opacity=".12"/>
    <circle cx="58" cy="126" r="11" fill="#0f766e"/>
    <circle cx="706" cy="118" r="11" fill="#0f766e"/>
    <circle cx="382" cy="74" r="11" fill="#2563eb"/>
    <circle cx="26" cy="136" r="12" fill="#fff" stroke="#b45309" stroke-width="5"/>
    <line x1="26" y1="136" x2="58" y2="126" stroke="#b45309" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="92" y="36" class="math">cl f <= f, same infimum, and boundary values may decrease</text>
    <text x="92" y="154" class="small">The closure is not a smoothing rule; it is the lower envelope read from the closed epigraph.</text>
  </g>
</svg>
