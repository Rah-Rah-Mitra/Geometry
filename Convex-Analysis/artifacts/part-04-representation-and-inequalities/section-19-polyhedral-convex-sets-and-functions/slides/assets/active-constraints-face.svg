<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Active constraints select a face of a polyhedron</title>
  <desc id="desc">A polyhedron with a highlighted slanted face where the inequality y less than or equal to x plus 2 is active, and a vertex where two constraints are active.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <style>
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 3; }
      .axis { stroke: #1e3a8a; stroke-width: 4; marker-end: url(#arrow); }
      .poly { fill: rgba(37,99,235,.13); stroke: #2563eb; stroke-width: 6; stroke-linejoin: round; }
      .face { stroke: #b45309; stroke-width: 12; stroke-linecap: round; }
      .edge { stroke: #2563eb; stroke-width: 5; stroke-linecap: round; }
      .helper { stroke: #94a3b8; stroke-width: 4; stroke-dasharray: 12 10; }
      .point { fill: #b45309; stroke: #fff; stroke-width: 6; }
      .point2 { fill: #0f766e; stroke: #fff; stroke-width: 6; }
      .label { font: 700 25px 'Source Sans 3', Arial, sans-serif; fill: #111827; }
      .small { font: 600 20px 'Source Sans 3', Arial, sans-serif; fill: #64748b; }
      .math { font: 400 24px 'STIX Two Text', Georgia, serif; fill: #111827; }
      .head { font: 700 31px 'Source Sans 3', Arial, sans-serif; fill: #1e3a8a; }
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect class="panel" x="44" y="54" width="1112" height="552" rx="10"/>
  <text class="head" x="84" y="108">Faces From Active Inequalities</text>
  <text class="small" x="84" y="140">for P = {x &gt;= 0, y &gt;= 0, y &lt;= x + 2, y &lt;= 5}</text>

  <g transform="translate(92 156)">
    <path class="axis" d="M46 398 H560"/>
    <path class="axis" d="M46 398 V40"/>
    <polygon class="poly" points="46,398 560,398 560,108 278,108 46,282"/>
    <path class="edge" d="M46 398 H560"/>
    <path class="edge" d="M46 398 V282"/>
    <path class="face" d="M46 282 L278 108"/>
    <path class="edge" d="M278 108 H560"/>
    <path class="helper" d="M560 108 V398"/>
    <circle class="point" cx="140" cy="211" r="14"/>
    <circle class="point2" cx="46" cy="282" r="14"/>
    <text class="label" x="154" y="202">relative interior of F</text>
    <text class="math" x="168" y="236">I(x) = { y = x + 2 }</text>
    <text class="label" x="58" y="258">vertex</text>
    <text class="math" x="74" y="292">I(v) = { x = 0, y = x + 2 }</text>
    <text class="small" x="314" y="88">top face: y = 5</text>
    <text class="small" x="300" y="432">bottom face: y = 0</text>
  </g>

  <g transform="translate(740 188)">
    <rect x="0" y="0" width="340" height="310" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="3"/>
    <text class="label" x="24" y="46">Active Set</text>
    <text class="math" x="24" y="92">I(x) = { i : a_i.x = b_i }</text>
    <line x1="24" y1="122" x2="316" y2="122" stroke="#fcd34d" stroke-width="3"/>
    <text class="small" x="24" y="160">same active pattern</text>
    <text class="small" x="24" y="188">inside a relative interior</text>
    <text class="small" x="24" y="228">more active constraints</text>
    <text class="small" x="24" y="256">at lower-dimensional faces</text>
  </g>
  <text class="head" x="84" y="628">A finite inequality list partitions the polyhedron into finitely many faces.</text>
</svg>
