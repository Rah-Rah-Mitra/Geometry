<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Epigraph of a max of affine functions</title>
  <desc id="desc">Three affine functions form a convex piecewise-linear upper envelope. The epigraph is the intersection of the three halfspaces above those affine graphs.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <style>
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 3; }
      .axis { stroke: #1e3a8a; stroke-width: 4; marker-end: url(#arrow-blue); }
      .epi { fill: rgba(37,99,235,.12); stroke: none; }
      .line1 { stroke: #2563eb; stroke-width: 4; stroke-dasharray: 14 10; }
      .line2 { stroke: #0f766e; stroke-width: 4; stroke-dasharray: 14 10; }
      .line3 { stroke: #6d28d9; stroke-width: 4; stroke-dasharray: 14 10; }
      .env { fill: none; stroke: #b45309; stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
      .break { fill: #b45309; stroke: #fff; stroke-width: 5; }
      .label { font: 700 25px 'Source Sans 3', Arial, sans-serif; fill: #111827; }
      .small { font: 600 20px 'Source Sans 3', Arial, sans-serif; fill: #64748b; }
      .math { font: 400 24px 'STIX Two Text', Georgia, serif; fill: #111827; }
      .head { font: 700 31px 'Source Sans 3', Arial, sans-serif; fill: #1e3a8a; }
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect class="panel" x="44" y="54" width="1112" height="552" rx="10"/>
  <text class="head" x="84" y="108">Piecewise-Linear Convex Function</text>
  <text class="small" x="84" y="140">f(x) = max{-x + 3, 0.4x + 0.2, 1.2x - 2.6}</text>

  <g transform="translate(92 156)">
    <path class="axis" d="M62 430 H890"/>
    <path class="axis" d="M62 430 V34"/>
    <polygon class="epi" points="62,34 890,34 890,84 650,246 410,312 302,312 62,82"/>
    <path class="line1" d="M62 82 L650 554"/>
    <path class="line2" d="M62 406 L890 118"/>
    <path class="line3" d="M62 744 L890 84"/>
    <path class="env" d="M62 82 L302 312 L650 246 L890 84"/>
    <circle class="break" cx="302" cy="312" r="13"/>
    <circle class="break" cx="650" cy="246" r="13"/>
    <text class="math" x="118" y="70">ell1(x)</text>
    <text class="math" x="430" y="374">ell2(x)</text>
    <text class="math" x="720" y="150">ell3(x)</text>
    <text class="label" x="386" y="104">epi f = intersection of halfspaces t &gt;= ell_i(x)</text>
    <text class="small" x="258" y="350">active switch</text>
    <text class="small" x="614" y="286">active switch</text>
    <text class="math" x="896" y="446">x</text>
    <text class="math" x="38" y="52">t</text>
  </g>

  <g transform="translate(848 448)">
    <rect x="0" y="0" width="246" height="96" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="3"/>
    <text class="label" x="20" y="40">active pieces</text>
    <text class="small" x="20" y="72">each region has one affine rule</text>
  </g>
</svg>
