<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">H and V representations of the same polyhedron</title>
  <desc id="desc">A two panel diagram showing an unbounded polyhedron as a finite intersection of halfspaces and as the convex hull of three vertices plus one recession ray.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#0f766e"/>
    </marker>
    <style>
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 3; }
      .axis { stroke: #1e3a8a; stroke-width: 4; marker-end: url(#arrow-blue); }
      .poly { fill: rgba(37,99,235,.15); stroke: #2563eb; stroke-width: 6; stroke-linejoin: round; }
      .cut { stroke: #b45309; stroke-width: 5; stroke-linecap: round; }
      .cut2 { stroke: #94a3b8; stroke-width: 4; stroke-dasharray: 12 10; }
      .ray { stroke: #0f766e; stroke-width: 7; stroke-linecap: round; marker-end: url(#arrow-teal); }
      .point { fill: #2563eb; stroke: #fff; stroke-width: 5; }
      .point-hot { fill: #b45309; stroke: #fff; stroke-width: 5; }
      .label { font: 700 25px 'Source Sans 3', Arial, sans-serif; fill: #111827; }
      .small { font: 600 20px 'Source Sans 3', Arial, sans-serif; fill: #64748b; }
      .math { font: 400 24px 'STIX Two Text', Georgia, serif; fill: #111827; }
      .head { font: 700 31px 'Source Sans 3', Arial, sans-serif; fill: #1e3a8a; }
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect class="panel" x="38" y="54" width="526" height="552" rx="10"/>
  <rect class="panel" x="636" y="54" width="526" height="552" rx="10"/>
  <text class="head" x="70" y="100">H-representation</text>
  <text class="small" x="70" y="132">finite halfspace intersection</text>
  <text class="head" x="668" y="100">V-representation</text>
  <text class="small" x="668" y="132">finite vertices plus recession rays</text>

  <g transform="translate(74 140)">
    <path class="axis" d="M36 390 H452"/>
    <path class="axis" d="M36 390 V34"/>
    <polygon class="poly" points="36,390 462,390 462,100 230,100 36,274"/>
    <path class="cut" d="M36 390 H462"/>
    <path class="cut" d="M36 390 V274"/>
    <path class="cut" d="M36 274 L230 100"/>
    <path class="cut" d="M230 100 H462"/>
    <path class="cut2" d="M462 100 V390"/>
    <text class="math" x="54" y="428">y &gt;= 0</text>
    <text class="math" x="68" y="252">x &gt;= 0</text>
    <text class="math" x="216" y="78">y &lt;= 5</text>
    <text class="math" x="82" y="166">y &lt;= x + 2</text>
    <text class="label" x="322" y="238">P = {x : Ax &lt;= b}</text>
    <text class="small" x="306" y="276">one finite list of inequalities</text>
  </g>

  <g transform="translate(672 140)">
    <path class="axis" d="M36 390 H452"/>
    <path class="axis" d="M36 390 V34"/>
    <polygon class="poly" points="36,390 462,390 462,100 230,100 36,274"/>
    <path class="ray" d="M36 390 H442"/>
    <path class="ray" d="M36 274 H270"/>
    <path class="ray" d="M230 100 H442"/>
    <circle class="point" cx="36" cy="390" r="13"/>
    <circle class="point" cx="36" cy="274" r="13"/>
    <circle class="point-hot" cx="230" cy="100" r="13"/>
    <text class="math" x="48" y="420">v1</text>
    <text class="math" x="48" y="264">v2</text>
    <text class="math" x="244" y="94">v3</text>
    <text class="math" x="332" y="82">d</text>
    <text class="label" x="148" y="276">P = conv{v1,v2,v3} + cone{d}</text>
    <text class="small" x="178" y="314">the ray records the unbounded direction</text>
  </g>

  <g transform="translate(254 626)">
    <text class="label" x="0" y="0">same set, two finite certificates</text>
    <path d="M390 -8 H546" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow-blue)"/>
  </g>
</svg>
