<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A polyhedral cone as homogeneous inequalities and finite rays</title>
  <desc id="desc">A pointed cone in the plane shown as an intersection of homogeneous halfspaces and as the conic hull of two extreme rays.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#0f766e"/>
    </marker>
    <style>
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 3; }
      .axis { stroke: #1e3a8a; stroke-width: 4; marker-end: url(#arrow-blue); }
      .cone { fill: rgba(15,118,110,.16); stroke: #0f766e; stroke-width: 6; stroke-linejoin: round; }
      .ray { stroke: #0f766e; stroke-width: 8; stroke-linecap: round; marker-end: url(#arrow-teal); }
      .wall { stroke: #b45309; stroke-width: 5; stroke-linecap: round; }
      .helper { stroke: #94a3b8; stroke-width: 4; stroke-dasharray: 12 10; }
      .label { font: 700 25px 'Source Sans 3', Arial, sans-serif; fill: #111827; }
      .small { font: 600 20px 'Source Sans 3', Arial, sans-serif; fill: #64748b; }
      .math { font: 400 24px 'STIX Two Text', Georgia, serif; fill: #111827; }
      .head { font: 700 31px 'Source Sans 3', Arial, sans-serif; fill: #1e3a8a; }
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect class="panel" x="44" y="54" width="1112" height="552" rx="10"/>
  <text class="head" x="84" y="108">Polyhedral Cone</text>
  <text class="small" x="84" y="140">all bounding hyperplanes pass through the origin</text>

  <g transform="translate(100 148)">
    <path class="axis" d="M70 410 H640"/>
    <path class="axis" d="M70 410 V40"/>
    <polygon class="cone" points="70,410 602,410 602,112"/>
    <path class="ray" d="M70 410 H600"/>
    <path class="ray" d="M70 410 L596 114"/>
    <path class="wall" d="M70 410 H624"/>
    <path class="wall" d="M70 410 L606 108"/>
    <path class="helper" d="M70 410 L624 248"/>
    <circle cx="70" cy="410" r="14" fill="#1e3a8a" stroke="#fff" stroke-width="6"/>
    <text class="math" x="266" y="444">r1 = (1,0)</text>
    <text class="math" x="430" y="176">r2 = (4,3)</text>
    <text class="label" x="164" y="258">K = cone{r1, r2}</text>
  </g>

  <g transform="translate(780 190)">
    <rect x="0" y="0" width="310" height="292" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="3"/>
    <text class="label" x="24" y="46">H-side</text>
    <text class="math" x="24" y="92">y &gt;= 0</text>
    <text class="math" x="24" y="132">4y - 3x &lt;= 0</text>
    <line x1="24" y1="162" x2="286" y2="162" stroke="#99f6e4" stroke-width="3"/>
    <text class="label" x="24" y="206">V-side</text>
    <text class="math" x="24" y="252">lambda1 r1 + lambda2 r2</text>
    <text class="math" x="24" y="282">lambda1, lambda2 &gt;= 0</text>
  </g>
  <text class="head" x="84" y="628">For cones, Weyl-Minkowski becomes homogeneous: inequalities through 0 match finite rays.</text>
</svg>
