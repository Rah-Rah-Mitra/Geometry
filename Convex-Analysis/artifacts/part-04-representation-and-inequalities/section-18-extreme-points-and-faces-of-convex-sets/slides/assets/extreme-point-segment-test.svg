<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Extreme point segment test</title>
  <desc id="desc">A convex polygon shows a vertex that cannot be split by a nontrivial segment and an edge point that can.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#b45309"/>
    </marker>
    <style>
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
      .poly { fill: rgba(37,99,235,.12); stroke: #2563eb; stroke-width: 6; stroke-linejoin: round; }
      .test { stroke: #b45309; stroke-width: 7; stroke-linecap: round; }
      .aux { stroke: #94a3b8; stroke-width: 4; stroke-dasharray: 12 10; }
      .pt-blue { fill: #2563eb; stroke: #fff; stroke-width: 5; }
      .pt-amber { fill: #b45309; stroke: #fff; stroke-width: 5; }
      .label { font: 700 25px 'Source Sans 3', Arial, sans-serif; fill: #111827; }
      .small { font: 600 20px 'Source Sans 3', Arial, sans-serif; fill: #475569; }
      .math { font: 400 26px 'STIX Two Text', Georgia, serif; fill: #111827; }
      .title { font: 700 32px 'Source Sans 3', Arial, sans-serif; fill: #1e3a8a; }
    </style>
  </defs>
  <rect x="36" y="36" width="888" height="548" rx="8" class="panel"/>
  <path d="M158 428 L246 214 L410 126 L656 190 L760 392 L558 496 L306 510 Z" class="poly"/>
  <path d="M246 214 L558 496" class="aux"/>
  <path d="M410 126 L770 74" class="aux"/>
  <path d="M498 174 L712 204" class="test"/>
  <circle cx="410" cy="126" r="15" class="pt-blue"/>
  <circle cx="606" cy="189" r="15" class="pt-amber"/>
  <circle cx="498" cy="174" r="12" fill="#b45309"/>
  <circle cx="712" cy="204" r="12" fill="#b45309"/>
  <line x1="338" y1="116" x2="393" y2="124" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <line x1="812" y1="190" x2="725" y2="202" stroke="#b45309" stroke-width="5" marker-end="url(#arrow-amber)"/>
  <text x="74" y="92" class="title">Segment test for extremality</text>
  <text x="105" y="158" class="label">extreme point</text>
  <text x="104" y="188" class="small">no chord of C has this point</text>
  <text x="104" y="215" class="small">as a relative-interior point</text>
  <text x="560" y="96" class="label">not extreme</text>
  <text x="560" y="126" class="small">the point is split by a segment</text>
  <text x="560" y="156" class="math">x = (1 - lambda)y + lambda z</text>
  <text x="426" y="102" class="math">x</text>
  <text x="482" y="150" class="math">y</text>
  <text x="722" y="232" class="math">z</text>
  <rect x="76" y="474" width="374" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="100" y="513" class="small">A singleton face is exactly an extreme point.</text>
  <rect x="500" y="474" width="354" height="62" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
  <text x="524" y="513" class="small">Interior points of nontrivial faces fail the test.</text>
</svg>
