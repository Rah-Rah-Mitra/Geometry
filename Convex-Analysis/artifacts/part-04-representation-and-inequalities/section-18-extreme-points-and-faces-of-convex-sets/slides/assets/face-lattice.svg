<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">Face lattice of a polygon</title>
  <desc id="desc">A Hasse-style diagram orders a polygon, its edges, its vertices, and the empty face by inclusion.</desc>
  <defs>
    <style>
      .frame { fill: #fff; stroke: #cbd5e1; stroke-width: 3; }
      .edge { stroke: #94a3b8; stroke-width: 4; }
      .edge-hot { stroke: #b45309; stroke-width: 7; }
      .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 3; }
      .node-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 4; }
      .node-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 4; }
      .node-teal { fill: #f0fdfa; stroke: #0f766e; stroke-width: 4; }
      .label { font: 700 23px 'Source Sans 3', Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .small { font: 600 18px 'Source Sans 3', Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .title { font: 700 32px 'Source Sans 3', Arial, sans-serif; fill: #1e3a8a; }
    </style>
  </defs>
  <rect x="38" y="34" width="924" height="592" rx="8" class="frame"/>
  <text x="76" y="88" class="title">Faces form a complete lattice under inclusion</text>
  <line x1="500" y1="154" x2="224" y2="282" class="edge"/>
  <line x1="500" y1="154" x2="408" y2="282" class="edge-hot"/>
  <line x1="500" y1="154" x2="592" y2="282" class="edge"/>
  <line x1="500" y1="154" x2="776" y2="282" class="edge"/>
  <line x1="224" y1="332" x2="224" y2="456" class="edge"/>
  <line x1="408" y1="332" x2="316" y2="456" class="edge-hot"/>
  <line x1="408" y1="332" x2="500" y2="456" class="edge-hot"/>
  <line x1="592" y1="332" x2="500" y2="456" class="edge"/>
  <line x1="592" y1="332" x2="684" y2="456" class="edge"/>
  <line x1="776" y1="332" x2="776" y2="456" class="edge"/>
  <line x1="224" y1="506" x2="500" y2="566" class="edge"/>
  <line x1="316" y1="506" x2="500" y2="566" class="edge-hot"/>
  <line x1="500" y1="506" x2="500" y2="566" class="edge-hot"/>
  <line x1="684" y1="506" x2="500" y2="566" class="edge"/>
  <line x1="776" y1="506" x2="500" y2="566" class="edge"/>
  <rect x="390" y="112" width="220" height="84" rx="8" class="node-blue"/>
  <text x="500" y="148" class="label">C</text>
  <text x="500" y="176" class="small">whole polygon</text>
  <rect x="136" y="270" width="176" height="70" rx="8" class="node"/>
  <text x="224" y="300" class="label">E1</text>
  <text x="224" y="324" class="small">edge face</text>
  <rect x="320" y="270" width="176" height="70" rx="8" class="node-amber"/>
  <text x="408" y="300" class="label">E2</text>
  <text x="408" y="324" class="small">minimal face for p</text>
  <rect x="504" y="270" width="176" height="70" rx="8" class="node"/>
  <text x="592" y="300" class="label">E3</text>
  <text x="592" y="324" class="small">edge face</text>
  <rect x="688" y="270" width="176" height="70" rx="8" class="node"/>
  <text x="776" y="300" class="label">E4</text>
  <text x="776" y="324" class="small">edge face</text>
  <circle cx="224" cy="480" r="42" class="node"/>
  <text x="224" y="488" class="label">v1</text>
  <circle cx="316" cy="480" r="42" class="node-amber"/>
  <text x="316" y="488" class="label">v2</text>
  <circle cx="500" cy="480" r="42" class="node-amber"/>
  <text x="500" y="488" class="label">v3</text>
  <circle cx="684" cy="480" r="42" class="node"/>
  <text x="684" y="488" class="label">v4</text>
  <circle cx="776" cy="480" r="42" class="node"/>
  <text x="776" y="488" class="label">v5</text>
  <rect x="420" y="540" width="160" height="64" rx="8" class="node-teal"/>
  <text x="500" y="579" class="label">empty face</text>
  <text x="500" y="622" class="small">Intersections move downward; joins are least faces above.</text>
</svg>
