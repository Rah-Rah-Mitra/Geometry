<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Exposed face map</title>
  <desc id="desc">A support vector selects the maximizers of a linear functional on a polygon, exposing a face.</desc>
  <defs>
    <marker id="arrow-indigo" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrow-teal" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#0f766e"/>
    </marker>
    <style>
      .frame { fill: #fff; stroke: #cbd5e1; stroke-width: 3; }
      .poly { fill: rgba(37,99,235,.12); stroke: #2563eb; stroke-width: 6; stroke-linejoin: round; }
      .face { stroke: #b45309; stroke-width: 11; stroke-linecap: round; }
      .support { stroke: #b45309; stroke-width: 6; stroke-linecap: round; }
      .level { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 13 10; }
      .label { font: 700 25px 'Source Sans 3', Arial, sans-serif; fill: #111827; }
      .small { font: 600 20px 'Source Sans 3', Arial, sans-serif; fill: #475569; }
      .math { font: 400 25px 'STIX Two Text', Georgia, serif; fill: #111827; }
      .title { font: 700 32px 'Source Sans 3', Arial, sans-serif; fill: #1e3a8a; }
    </style>
  </defs>
  <rect x="36" y="34" width="928" height="572" rx="8" class="frame"/>
  <rect x="70" y="82" width="575" height="412" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <path d="M144 383 L214 205 L366 126 L545 170 L594 326 L454 430 L258 456 Z" class="poly"/>
  <path d="M366 126 L545 170" class="face"/>
  <path d="M304 74 L622 152" class="support"/>
  <path d="M255 146 L573 224" class="level"/>
  <path d="M207 218 L525 296" class="level"/>
  <line x1="238" y1="395" x2="344" y2="266" stroke="#1e3a8a" stroke-width="7" marker-end="url(#arrow-indigo)"/>
  <line x1="516" y1="104" x2="580" y2="44" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow-teal)"/>
  <circle cx="366" cy="126" r="13" fill="#b45309" stroke="#fff" stroke-width="5"/>
  <circle cx="545" cy="170" r="13" fill="#b45309" stroke="#fff" stroke-width="5"/>
  <text x="92" y="124" class="title">F(c) = arg max c.x</text>
  <text x="142" y="520" class="small">The highlighted edge is exposed because all its points share the same support value.</text>
  <text x="350" y="276" class="math">c</text>
  <text x="586" y="62" class="small">support normal</text>
  <text x="462" y="122" class="math">c.x = h_C(c)</text>
  <rect x="690" y="92" width="226" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="715" y="127" class="label">point face</text>
  <text x="715" y="158" class="small">generic c exposes a vertex</text>
  <rect x="690" y="206" width="226" height="86" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
  <text x="715" y="241" class="label">edge face</text>
  <text x="715" y="272" class="small">normal c exposes an edge</text>
  <rect x="690" y="320" width="226" height="86" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
  <text x="715" y="355" class="label">whole set</text>
  <text x="715" y="386" class="small">c = 0 exposes C itself</text>
  <path d="M802 428 C802 498 734 538 692 564" fill="none" stroke="#cbd5e1" stroke-width="4"/>
  <path d="M802 428 C802 498 870 538 912 564" fill="none" stroke="#cbd5e1" stroke-width="4"/>
  <text x="706" y="588" class="small">map directions to active faces</text>
</svg>
