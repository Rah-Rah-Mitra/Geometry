<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Non-exposed warning</title>
  <desc id="desc">A stylized convex hull with an exposed disk face and rim points that are extreme but not isolated by one support plane.</desc>
  <defs>
    <linearGradient id="disk-fill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="warn-arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#b45309"/>
    </marker>
    <style>
      .frame { fill: #fff; stroke: #cbd5e1; stroke-width: 3; }
      .shell { fill: rgba(37,99,235,.10); stroke: #2563eb; stroke-width: 5; }
      .disk { fill: url(#disk-fill); stroke: #2563eb; stroke-width: 5; }
      .rim { fill: none; stroke: #b45309; stroke-width: 7; }
      .plane { fill: rgba(180,83,9,.08); stroke: #b45309; stroke-width: 5; stroke-dasharray: 14 10; }
      .label { font: 700 25px 'Source Sans 3', Arial, sans-serif; fill: #111827; }
      .small { font: 600 20px 'Source Sans 3', Arial, sans-serif; fill: #475569; }
      .math { font: 400 25px 'STIX Two Text', Georgia, serif; fill: #111827; }
      .title { font: 700 32px 'Source Sans 3', Arial, sans-serif; fill: #1e3a8a; }
    </style>
  </defs>
  <rect x="38" y="34" width="924" height="572" rx="8" class="frame"/>
  <text x="76" y="88" class="title">Extreme does not always mean exposed</text>
  <path d="M246 188 C340 96 526 104 674 206 C760 266 770 390 672 470 C528 588 322 552 224 438 C158 360 174 248 246 188 Z" class="shell"/>
  <ellipse cx="636" cy="328" rx="168" ry="222" transform="rotate(8 636 328)" class="disk"/>
  <ellipse cx="636" cy="328" rx="168" ry="222" transform="rotate(8 636 328)" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="12 11"/>
  <path d="M482 246 C564 178 712 184 796 270" class="rim"/>
  <circle cx="482" cy="246" r="16" fill="#b45309" stroke="#fff" stroke-width="6"/>
  <path d="M468 154 L846 210 L796 478 L420 420 Z" class="plane"/>
  <line x1="238" y1="142" x2="454" y2="238" stroke="#b45309" stroke-width="6" marker-end="url(#warn-arrow)"/>
  <text x="92" y="142" class="label">rim point</text>
  <text x="92" y="174" class="small">extreme in the ambient set</text>
  <text x="92" y="204" class="small">but not isolated by a support plane</text>
  <text x="676" y="126" class="label">exposed disk face</text>
  <text x="676" y="158" class="small">the support plane touches all of D</text>
  <rect x="88" y="472" width="820" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
  <text x="116" y="510" class="small">Warning: an exposed face of a face need not be exposed in the original set.</text>
  <text x="116" y="538" class="small">Use exposure as a certificate, not as a synonym for extremality.</text>
</svg>
