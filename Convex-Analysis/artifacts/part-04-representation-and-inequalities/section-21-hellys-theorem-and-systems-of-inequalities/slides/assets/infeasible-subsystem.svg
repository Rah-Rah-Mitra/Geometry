<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Infeasible subsystem certificate</title>
  <desc id="desc">An original half-plane system in the plane where three inequalities already contradict one another, with a multiplier sum equal to one.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 H 0 V 32" fill="none" stroke="#CBD5E1" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="900" height="520" fill="#FFFFFF"/>
  <rect x="38" y="46" width="496" height="410" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <rect x="568" y="46" width="294" height="410" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="58" y="84" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#1E3A8A">Three half-planes already certify infeasibility</text>
  <text x="592" y="84" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#1E3A8A">Multiplier check</text>

  <g transform="translate(76 110)">
    <rect x="0" y="0" width="420" height="308" fill="url(#grid)"/>
    <line x1="210" y1="288" x2="210" y2="20" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="24" y1="206" x2="398" y2="206" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="384" y="230" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#64748B">x</text>
    <text x="224" y="34" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#64748B">y</text>
    <clipPath id="plot-clip"><rect x="0" y="0" width="420" height="308"/></clipPath>
    <g clip-path="url(#plot-clip)">
      <polygon points="210,0 420,0 420,308 210,308" fill="#2563EB" opacity=".13"/>
      <line x1="210" y1="0" x2="210" y2="308" stroke="#2563EB" stroke-width="6"/>
      <polygon points="0,0 420,0 420,206 0,206" fill="#0F766E" opacity=".13"/>
      <line x1="0" y1="206" x2="420" y2="206" stroke="#0F766E" stroke-width="6"/>
      <polygon points="0,0 420,0 420,18 132,306 0,306" fill="#B45309" opacity=".13"/>
      <line x1="132" y1="306" x2="420" y2="18" stroke="#B45309" stroke-width="6"/>
    </g>
    <circle cx="210" cy="206" r="8" fill="#111827"/>
    <text x="222" y="224" font-family="Source Sans 3, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">origin</text>
    <text x="226" y="102" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#2563EB">x >= 0</text>
    <text x="56" y="184" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F766E">y >= 0</text>
    <text x="276" y="70" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#B45309">x + y <= -1</text>
    <path d="M 255 155 C 279 169 290 185 295 205" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="285" y="146" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">no common point</text>
  </g>

  <g transform="translate(594 124)">
    <rect x="0" y="0" width="242" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text x="16" y="30" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">f1(x,y) = -x</text>
    <text x="16" y="58" font-family="Source Sans 3, Arial, sans-serif" font-size="20" fill="#475569">constraint f1 <= 0</text>
    <rect x="0" y="86" width="242" height="70" rx="8" fill="#F0FDFA" stroke="#0F766E"/>
    <text x="16" y="116" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">f2(x,y) = -y</text>
    <text x="16" y="144" font-family="Source Sans 3, Arial, sans-serif" font-size="20" fill="#475569">constraint f2 <= 0</text>
    <rect x="0" y="172" width="242" height="78" rx="8" fill="#FFFBEB" stroke="#B45309"/>
    <text x="16" y="202" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">f3(x,y) = x + y + 1</text>
    <text x="16" y="230" font-family="Source Sans 3, Arial, sans-serif" font-size="20" fill="#475569">constraint f3 <= 0</text>
    <path d="M 121 264 V 294" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="0" y="302" width="242" height="72" rx="8" fill="#EEF2FF" stroke="#1E3A8A"/>
    <text x="16" y="332" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">f1 + f2 + f3 = 1</text>
    <text x="16" y="360" font-family="Source Sans 3, Arial, sans-serif" font-size="20" fill="#475569">positive contradiction certificate</text>
  </g>
</svg>
