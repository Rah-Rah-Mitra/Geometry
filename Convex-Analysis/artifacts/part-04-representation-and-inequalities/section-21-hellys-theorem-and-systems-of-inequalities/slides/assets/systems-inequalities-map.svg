<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Convex inequality systems as intersections</title>
  <desc id="desc">An original concept map connecting convex inequalities, level sets, intersections, Helly subfamilies, and multiplier certificates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#FFFFFF"/>
  <text x="42" y="52" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">Systems of convex inequalities are intersection problems</text>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#111827">
    <rect x="54" y="94" width="228" height="94" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="76" y="130" font-size="24" font-weight="700" fill="#2563EB">Inequality data</text>
    <text x="76" y="162" font-family="STIX Two Text, Georgia, serif">f_i(x) &lt;= alpha_i</text>
    <text x="76" y="186" font-size="20" fill="#475569">or strict f_i(x) &lt; alpha_i</text>

    <rect x="356" y="94" width="228" height="94" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
    <text x="378" y="130" font-size="24" font-weight="700" fill="#0F766E">Convex level sets</text>
    <text x="378" y="162" font-family="STIX Two Text, Georgia, serif">C_i = {x | f_i(x) &lt;= alpha_i}</text>
    <text x="378" y="186" font-size="20" fill="#475569">closed when f_i is closed and weak</text>

    <rect x="660" y="94" width="214" height="94" rx="8" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="682" y="130" font-size="24" font-weight="700" fill="#1E3A8A">Solution set</text>
    <text x="682" y="162" font-family="STIX Two Text, Georgia, serif">C = cap_i C_i</text>
    <text x="682" y="186" font-size="20" fill="#475569">feasible exactly when nonempty</text>

    <line x1="292" y1="141" x2="346" y2="141" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="594" y1="141" x2="650" y2="141" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="54" y="264" width="228" height="104" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
    <text x="76" y="300" font-size="24" font-weight="700" fill="#B45309">Helly compression</text>
    <text x="76" y="332">If finite family is empty,</text>
    <text x="76" y="360">some d+1 subfamily is empty.</text>

    <rect x="356" y="264" width="228" height="104" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
    <text x="378" y="300" font-size="24" font-weight="700" fill="#6D28D9">Multiplier certificate</text>
    <text x="378" y="332" font-family="STIX Two Text, Georgia, serif">sum lambda_i f_i >= 0</text>
    <text x="378" y="360">while all f_i &lt; 0 is impossible.</text>

    <rect x="660" y="264" width="214" height="104" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="682" y="300" font-size="24" font-weight="700" fill="#475569">Equation device</text>
    <text x="682" y="332" font-family="STIX Two Text, Georgia, serif">&lt;b,x&gt; = beta</text>
    <text x="682" y="360">becomes two weak inequalities.</text>

    <path d="M 768 206 V 250 C 768 260 758 268 746 268 H 596" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 660 206 V 226 C 660 248 640 276 594 306" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 168 206 V 254" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <rect x="54" y="412" width="820" height="48" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="76" y="443" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">Inspection rule:</text>
  <text x="216" y="443" font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#475569">a point proves feasibility; a small subfamily or multiplier proves infeasibility.</text>
</svg>
