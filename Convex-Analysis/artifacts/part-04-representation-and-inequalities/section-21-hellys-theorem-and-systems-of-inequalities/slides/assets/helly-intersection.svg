<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Planar Helly intersection and certificate picture</title>
  <desc id="desc">Two original planar diagrams: a convex family with a common point and an infeasible family whose empty intersection is detected by three sets.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 H 0 V 28" fill="none" stroke="#CBD5E1" stroke-width="1" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="900" height="560" fill="#FFFFFF"/>
  <rect x="28" y="48" width="395" height="450" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <rect x="477" y="48" width="395" height="450" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="48" y="86" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#1E3A8A">Feasible convex family</text>
  <text x="497" y="86" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#1E3A8A">Empty family, small witness</text>

  <g transform="translate(44 108)">
    <rect x="0" y="0" width="360" height="304" fill="url(#grid)"/>
    <line x1="20" y1="252" x2="340" y2="252" stroke="#94A3B8" stroke-width="2"/>
    <line x1="54" y1="282" x2="54" y2="22" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="175" cy="148" rx="128" ry="74" fill="#2563EB" opacity=".15" stroke="#2563EB" stroke-width="5"/>
    <ellipse cx="195" cy="149" rx="121" ry="70" fill="#0F766E" opacity=".15" stroke="#0F766E" stroke-width="5" transform="rotate(-28 195 149)"/>
    <ellipse cx="187" cy="143" rx="112" ry="76" fill="#6D28D9" opacity=".13" stroke="#6D28D9" stroke-width="5" transform="rotate(24 187 143)"/>
    <ellipse cx="184" cy="156" rx="115" ry="66" fill="#B45309" opacity=".12" stroke="#B45309" stroke-width="5" transform="rotate(7 184 156)"/>
    <circle cx="184" cy="151" r="10" fill="#111827"/>
    <text x="198" y="145" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#111827">p</text>
    <path d="M 264 56 C 246 84 221 112 193 140" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="218" y="42" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">common point</text>
    <text x="28" y="330" font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#475569">A point verifies all displayed inequalities.</text>
  </g>

  <g transform="translate(493 108)">
    <rect x="0" y="0" width="360" height="304" fill="url(#grid)"/>
    <clipPath id="clip-right"><rect x="0" y="0" width="360" height="304"/></clipPath>
    <g clip-path="url(#clip-right)">
      <polygon points="50,0 360,0 360,304 50,304" fill="#2563EB" opacity=".12"/>
      <line x1="50" y1="-12" x2="50" y2="318" stroke="#2563EB" stroke-width="5"/>
      <polygon points="0,238 360,238 360,304 0,304" fill="#0F766E" opacity=".14"/>
      <line x1="-10" y1="238" x2="372" y2="238" stroke="#0F766E" stroke-width="5"/>
      <polygon points="0,0 322,0 0,322" fill="#B45309" opacity=".13"/>
      <line x1="0" y1="322" x2="322" y2="0" stroke="#B45309" stroke-width="5"/>
      <polygon points="218,112 236,130 206,142" fill="#FFFFFF" stroke="#111827" stroke-width="3"/>
    </g>
    <circle cx="51" cy="238" r="7" fill="#2563EB"/>
    <circle cx="82" cy="238" r="7" fill="#0F766E"/>
    <circle cx="162" cy="160" r="7" fill="#B45309"/>
    <text x="67" y="40" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#2563EB">C1</text>
    <text x="286" y="225" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#0F766E">C2</text>
    <text x="238" y="78" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#B45309">C3</text>
    <path d="M 264 181 C 248 165 229 149 214 140" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="247" y="205" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">gap</text>
    <text x="20" y="330" font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#475569">In R2, emptiness is witnessed by at most 3 sets.</text>
  </g>

  <g transform="translate(52 476)">
    <rect x="0" y="0" width="794" height="46" rx="8" fill="#EEF2FF" stroke="#CBD5E1"/>
    <text x="18" y="30" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#1E3A8A">Helly reading:</text>
    <text x="158" y="30" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#475569">convexity turns a global empty intersection into a finite subfamily certificate.</text>
  </g>
</svg>
