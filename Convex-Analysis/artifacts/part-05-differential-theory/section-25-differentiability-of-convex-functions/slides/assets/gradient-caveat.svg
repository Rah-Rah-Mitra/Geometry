<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="title desc">
  <title id="title">Gradient continuity caveats inside the domain</title>
  <desc id="desc">Dense differentiability and continuity on the differentiability set do not remove boundary normal cones or ridge gaps.</desc>
  <defs>
    <marker id="caveatArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="904" height="524" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <g transform="translate(60 60)">
    <rect x="0" y="0" width="522" height="420" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="260" cy="210" rx="192" ry="136" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
    <path d="M136 298 C184 246 234 216 286 170 C330 132 372 96 426 74" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
    <g fill="#0f766e">
      <circle cx="148" cy="178" r="6"/><circle cx="188" cy="126" r="6"/><circle cx="220" cy="272" r="6"/><circle cx="258" cy="220" r="6"/>
      <circle cx="314" cy="246" r="6"/><circle cx="362" cy="188" r="6"/><circle cx="390" cy="284" r="6"/><circle cx="284" cy="112" r="6"/>
      <circle cx="172" cy="252" r="6"/><circle cx="330" cy="128" r="6"/>
    </g>
    <g stroke="#2563eb" stroke-width="4" marker-end="url(#caveatArrow)">
      <line x1="148" y1="178" x2="178" y2="154"/><line x1="188" y1="126" x2="224" y2="114"/><line x1="220" y1="272" x2="250" y2="252"/>
      <line x1="314" y1="246" x2="348" y2="230"/><line x1="390" y1="284" x2="424" y2="270"/><line x1="284" y1="112" x2="320" y2="102"/>
    </g>
    <line x1="98" y1="334" x2="64" y2="390" stroke="#b45309" stroke-width="5" marker-end="url(#caveatArrow)"/>
    <text x="78" y="394" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">boundary normal cone</text>
    <text x="118" y="54" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">inside int(dom f)</text>
    <text x="300" y="72" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">bad set may be thin</text>
    <text x="154" y="368" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748b">gradient vectors are continuous on D</text>
  </g>
  <g transform="translate(626 78)">
    <rect x="0" y="0" width="250" height="116" rx="12" fill="#eef2ff" stroke="#1e3a8a" stroke-width="3"/>
    <text x="24" y="40" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">Theorem 25.5</text>
    <text x="24" y="72" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">D is dense;</text>
    <text x="24" y="99" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">bad set has measure zero.</text>
  </g>
  <g transform="translate(626 226)">
    <rect x="0" y="0" width="250" height="116" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
    <text x="24" y="40" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f766e">Continuity</text>
    <text x="24" y="72" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">grad f is continuous</text>
    <text x="24" y="99" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">relative to D.</text>
  </g>
  <g transform="translate(626 374)">
    <rect x="0" y="0" width="250" height="116" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <text x="24" y="40" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#b45309">Caveat</text>
    <text x="24" y="72" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">ridges and boundaries</text>
    <text x="24" y="99" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#111827">need separate treatment</text>
  </g>
</svg>
