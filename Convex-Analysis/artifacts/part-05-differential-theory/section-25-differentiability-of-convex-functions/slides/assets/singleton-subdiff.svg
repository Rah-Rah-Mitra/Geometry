<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Singleton subdifferential at a differentiable convex point</title>
  <desc id="desc">A convex curve has one supporting line at a smooth point, and the subdifferential inset collapses to one gradient vector.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0f766e"/>
    </marker>
    <linearGradient id="epiFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".13"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".03"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="884" height="524" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <g transform="translate(70 62)">
    <rect x="0" y="0" width="540" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="62" y1="350" x2="492" y2="350" stroke="#94a3b8" stroke-width="3"/>
    <line x1="104" y1="370" x2="104" y2="58" stroke="#94a3b8" stroke-width="3"/>
    <path d="M88 338 C154 308 198 252 262 164 C326 252 374 308 454 338 L454 68 L88 68 Z" fill="url(#epiFill)"/>
    <path d="M88 338 C154 308 198 252 262 164 C326 252 374 308 454 338" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <line x1="104" y1="374" x2="494" y2="48" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
    <line x1="124" y1="324" x2="454" y2="88" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="9 9"/>
    <circle cx="262" cy="164" r="11" fill="#111827"/>
    <line x1="262" y1="164" x2="354" y2="88" stroke="#2563eb" stroke-width="6" marker-end="url(#arrowBlue)"/>
    <text x="204" y="150" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">x</text>
    <text x="358" y="82" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#2563eb">unique slope</text>
    <text x="118" y="48" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#1e3a8a">one supporting hyperplane</text>
    <text x="356" y="392" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#64748b">graph of f</text>
  </g>
  <g transform="translate(650 82)">
    <rect x="0" y="0" width="218" height="306" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
    <text x="26" y="42" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f766e">subdifferential</text>
    <line x1="42" y1="224" x2="178" y2="224" stroke="#94a3b8" stroke-width="3"/>
    <line x1="110" y1="248" x2="110" y2="82" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="142" cy="126" r="15" fill="#2563eb"/>
    <line x1="110" y1="224" x2="139" y2="131" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowTeal)"/>
    <text x="42" y="262" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">partial f(x)</text>
    <text x="42" y="292" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">= {grad f(x)}</text>
    <text x="56" y="74" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="600" fill="#64748b">all tests pick the same vector</text>
  </g>
  <g transform="translate(618 428)">
    <rect x="0" y="0" width="272" height="70" rx="10" fill="#eef2ff" stroke="#1e3a8a" stroke-width="3"/>
    <text x="24" y="32" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">f(z) >= f(x)</text>
    <text x="24" y="61" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">+ &lt;g,z-x&gt;</text>
  </g>
</svg>
