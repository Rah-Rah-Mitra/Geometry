<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Directional derivatives collapse to a linear map</title>
  <desc id="desc">At a differentiable convex point, every directional derivative agrees with pairing against one gradient vector.</desc>
  <defs>
    <marker id="arrIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="924" height="524" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <g transform="translate(68 72)">
    <rect x="0" y="0" width="360" height="360" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="180" cy="180" r="116" fill="#eff6ff" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="60" y1="180" x2="308" y2="180" stroke="#94a3b8" stroke-width="3"/>
    <line x1="180" y1="300" x2="180" y2="52" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="180" cy="180" r="8" fill="#111827"/>
    <line x1="180" y1="180" x2="282" y2="118" stroke="#2563eb" stroke-width="7" marker-end="url(#arrIndigo)"/>
    <line x1="180" y1="180" x2="95" y2="91" stroke="#0f766e" stroke-width="5" marker-end="url(#arrIndigo)"/>
    <line x1="180" y1="180" x2="117" y2="272" stroke="#0f766e" stroke-width="5" marker-end="url(#arrIndigo)"/>
    <line x1="180" y1="180" x2="282" y2="258" stroke="#0f766e" stroke-width="5" marker-end="url(#arrIndigo)"/>
    <text x="288" y="116" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#2563eb">grad f(x)</text>
    <text x="78" y="78" font-family="STIX Two Text, Georgia, serif" font-size="26" fill="#111827">y</text>
    <text x="92" y="306" font-family="STIX Two Text, Georgia, serif" font-size="26" fill="#111827">-y</text>
    <text x="42" y="342" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#64748b">directions through x</text>
  </g>
  <g transform="translate(512 74)">
    <rect x="0" y="0" width="380" height="246" rx="14" fill="#eef2ff" stroke="#1e3a8a" stroke-width="3"/>
    <text x="28" y="48" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">linear directional law</text>
    <text x="44" y="104" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">f'(x;y) = &lt;g,y&gt;</text>
    <text x="44" y="151" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#111827">g = grad f(x)</text>
    <text x="44" y="196" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">f'(x;y) = -f'(x;-y)</text>
    <text x="44" y="226" font-family="Source Sans 3, Arial, sans-serif" font-size="22" font-weight="600" fill="#64748b">linear exactly when partial f(x) is one point</text>
  </g>
  <g transform="translate(514 362)">
    <rect x="0" y="0" width="378" height="102" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <path d="M28 70 C82 26 138 88 194 42 C246 0 304 38 350 22" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
    <path d="M36 78 L332 32" fill="none" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrAmber)"/>
    <text x="28" y="30" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#b45309">sublinear fan</text>
    <text x="70" y="94" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="600" fill="#64748b">after collapse: one slope</text>
  </g>
</svg>
