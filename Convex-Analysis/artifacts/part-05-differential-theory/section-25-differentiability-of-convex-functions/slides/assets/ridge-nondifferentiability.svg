<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="title desc">
  <title id="title">Nondifferentiable ridge for a maximum of affine pieces</title>
  <desc id="desc">The function max of two affine pieces has a crease where two gradients are active; the subdifferential is their convex hull.</desc>
  <defs>
    <marker id="ridgeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="904" height="524" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <g transform="translate(56 54)">
    <rect x="0" y="0" width="530" height="430" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <polygon points="96,318 282,210 472,300 284,404" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <polygon points="96,318 282,210 298,74 116,188" fill="#f0fdfa" stroke="#0f766e" stroke-width="4"/>
    <polygon points="282,210 472,300 486,164 298,74" fill="#fffbeb" stroke="#b45309" stroke-width="4"/>
    <line x1="282" y1="210" x2="298" y2="74" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
    <line x1="108" y1="360" x2="468" y2="360" stroke="#94a3b8" stroke-width="3"/>
    <line x1="108" y1="360" x2="104" y2="202" stroke="#94a3b8" stroke-width="3"/>
    <line x1="108" y1="360" x2="234" y2="424" stroke="#94a3b8" stroke-width="3"/>
    <text x="320" y="92" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">ridge: x1 = x2</text>
    <text x="138" y="170" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#0f766e">plane x1</text>
    <text x="386" y="196" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#b45309">plane x2</text>
    <text x="86" y="398" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">f(x) = max{x1,x2}</text>
  </g>
  <g transform="translate(636 82)">
    <rect x="0" y="0" width="246" height="298" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="24" y="42" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#1e3a8a">active gradients</text>
    <line x1="54" y1="222" x2="200" y2="222" stroke="#94a3b8" stroke-width="3"/>
    <line x1="54" y1="222" x2="54" y2="76" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="176" cy="222" r="12" fill="#0f766e"/>
    <circle cx="54" cy="100" r="12" fill="#b45309"/>
    <line x1="54" y1="100" x2="176" y2="222" stroke="#2563eb" stroke-width="6"/>
    <circle cx="118" cy="164" r="10" fill="#2563eb"/>
    <text x="154" y="258" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">(1,0)</text>
    <text x="72" y="96" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">(0,1)</text>
    <text x="28" y="268" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">partial f</text>
    <text x="28" y="296" font-family="STIX Two Text, Georgia, serif" font-size="25" fill="#111827">= conv{e1,e2}</text>
  </g>
  <g transform="translate(626 420)">
    <rect x="0" y="0" width="266" height="72" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <text x="22" y="32" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#b45309">no unique support</text>
    <text x="22" y="58" font-family="Source Sans 3, Arial, sans-serif" font-size="23" font-weight="700" fill="#b45309">on the crease</text>
  </g>
  <path d="M584 264 C612 248 626 224 642 188" fill="none" stroke="#b45309" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#ridgeArrow)"/>
</svg>
