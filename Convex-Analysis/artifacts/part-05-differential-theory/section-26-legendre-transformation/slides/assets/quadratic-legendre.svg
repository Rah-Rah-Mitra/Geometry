<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Quadratic Legendre transform</title>
  <desc id="desc">The quadratic f(x)=a x squared over two transforms to f star of p equals p squared over two a.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="28" fill="#FFFFFF"/>
  <rect x="44" y="44" width="1112" height="672" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>

  <g transform="translate(90 92)">
    <rect x="0" y="0" width="450" height="460" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M56 380 H398 M226 410 V50" stroke="#94A3B8" stroke-width="5"/>
    <g stroke="#E2E8F0" stroke-width="2">
      <path d="M76 300 H382 M76 220 H382 M76 140 H382"/>
      <path d="M126 70 V380 M326 70 V380"/>
    </g>
    <path d="M86 354 C133 337 174 278 226 150 C278 278 319 337 366 354" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <path d="M92 395 L362 138" fill="none" stroke="#B45309" stroke-width="5"/>
    <circle cx="286" cy="207" r="11" fill="#B45309"/>
    <text x="62" y="48" font-family="Source Sans 3, Arial, sans-serif" font-size="31" font-weight="700" fill="#1E3A8A">Primal bowl</text>
    <text x="82" y="88" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">f(x) = a x^2 / 2</text>
    <text x="304" y="205" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#B45309">p = a x</text>
    <text x="248" y="402" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#475569">curvature a</text>
  </g>

  <g transform="translate(660 92)">
    <rect x="0" y="0" width="450" height="460" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M56 380 H398 M226 410 V50" stroke="#94A3B8" stroke-width="5"/>
    <g stroke="#E2E8F0" stroke-width="2">
      <path d="M76 300 H382 M76 220 H382 M76 140 H382"/>
      <path d="M126 70 V380 M326 70 V380"/>
    </g>
    <path d="M74 360 C140 341 184 303 226 230 C268 303 312 341 378 360" fill="none" stroke="#0F766E" stroke-width="8" stroke-linecap="round"/>
    <circle cx="308" cy="303" r="11" fill="#B45309"/>
    <text x="70" y="48" font-family="Source Sans 3, Arial, sans-serif" font-size="31" font-weight="700" fill="#1E3A8A">Dual bowl</text>
    <text x="74" y="88" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">f*(p) = p^2 / (2a)</text>
    <text x="255" y="298" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#B45309">x = p / a</text>
    <text x="232" y="402" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#475569">curvature 1/a</text>
  </g>

  <path d="M548 300 C588 300 616 300 650 300" fill="none" stroke="#0F766E" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="260" y="596" width="680" height="78" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="3"/>
  <text x="300" y="645" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#0F766E">Calibration identity: f''(x) f*''(p) = a * (1/a) = 1</text>
</svg>
