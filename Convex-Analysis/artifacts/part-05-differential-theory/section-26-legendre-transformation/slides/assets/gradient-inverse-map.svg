<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Gradient and inverse gradient map</title>
  <desc id="desc">Primal points in C map to slope points in C star by the gradient, and the conjugate gradient returns them.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="28" fill="#FFFFFF"/>
  <rect x="54" y="54" width="1092" height="652" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>

  <g transform="translate(110 130)">
    <rect x="0" y="0" width="380" height="430" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M70 350 H322 M104 378 V58" stroke="#94A3B8" stroke-width="5"/>
    <path d="M98 323 C145 298 177 248 206 190 C238 127 274 88 324 72" fill="none" stroke="#2563EB" stroke-width="7"/>
    <circle cx="190" cy="222" r="11" fill="#B45309"/>
    <circle cx="252" cy="112" r="11" fill="#6D28D9"/>
    <text x="48" y="46" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E3A8A">C: primal coordinates</text>
    <text x="142" y="258" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#B45309">x</text>
    <text x="262" y="104" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#6D28D9">x1</text>
    <text x="182" y="386" font-family="Source Sans 3, Arial, sans-serif" font-size="25" fill="#475569">f on int(dom f)</text>
  </g>

  <g transform="translate(710 130)">
    <rect x="0" y="0" width="380" height="430" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M70 350 H322 M104 378 V58" stroke="#94A3B8" stroke-width="5"/>
    <path d="M102 316 C145 270 178 222 208 172 C236 126 272 91 322 72" fill="none" stroke="#0F766E" stroke-width="7"/>
    <circle cx="205" cy="178" r="11" fill="#B45309"/>
    <circle cx="262" cy="104" r="11" fill="#6D28D9"/>
    <text x="47" y="46" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E3A8A">C*: slope coordinates</text>
    <text x="218" y="190" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#B45309">p</text>
    <text x="274" y="101" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#6D28D9">p1</text>
    <text x="154" y="386" font-family="Source Sans 3, Arial, sans-serif" font-size="25" fill="#475569">f* on int(dom f*)</text>
  </g>

  <path d="M506 284 C574 214 626 214 694 284" fill="none" stroke="#2563EB" stroke-width="8" marker-end="url(#arrow-blue)"/>
  <path d="M694 408 C626 478 574 478 506 408" fill="none" stroke="#0F766E" stroke-width="8" marker-end="url(#arrow-teal)"/>
  <text x="515" y="238" font-family="STIX Two Text, Georgia, serif" font-size="34" fill="#111827">p = grad f(x)</text>
  <text x="504" y="526" font-family="STIX Two Text, Georgia, serif" font-size="34" fill="#111827">x = grad f*(p)</text>
  <rect x="376" y="600" width="448" height="58" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/>
  <text x="408" y="638" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">When hypotheses hold: grad f* = (grad f)^(-1)</text>
</svg>
