<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Legendre tangent map</title>
  <desc id="desc">A convex graph with a tangent line of slope p and the corresponding conjugate point.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/>
    </marker>
    <linearGradient id="soft-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="760" rx="28" fill="#FFFFFF"/>
  <rect x="36" y="36" width="1128" height="688" rx="24" fill="url(#soft-panel)" opacity="0.62"/>
  <g stroke="#E2E8F0" stroke-width="2">
    <path d="M84 120 H1116 M84 200 H1116 M84 280 H1116 M84 360 H1116 M84 440 H1116 M84 520 H1116 M84 600 H1116"/>
    <path d="M160 90 V650 M240 90 V650 M320 90 V650 M400 90 V650 M480 90 V650 M560 90 V650 M720 90 V650 M800 90 V650 M880 90 V650 M960 90 V650 M1040 90 V650"/>
  </g>

  <g transform="translate(88 92)">
    <rect x="0" y="0" width="615" height="520" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M62 446 H565" stroke="#94A3B8" stroke-width="5"/>
    <path d="M88 470 V58" stroke="#94A3B8" stroke-width="5"/>
    <text x="535" y="484" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#475569">x</text>
    <text x="56" y="64" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#475569">y</text>

    <path d="M108 408 C165 394 206 365 244 314 C292 248 342 193 421 160 C462 143 508 132 548 126" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 428 L572 198" fill="none" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
    <path d="M355 262 V446" stroke="#0F766E" stroke-width="4" stroke-dasharray="10 10"/>
    <path d="M88 386 H355" stroke="#0F766E" stroke-width="4" stroke-dasharray="10 10"/>
    <circle cx="355" cy="262" r="11" fill="#B45309"/>
    <circle cx="88" cy="386" r="9" fill="#0F766E"/>

    <text x="376" y="254" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">x, f(x)</text>
    <text x="128" y="412" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F766E">intercept = -f*(p)</text>
    <text x="392" y="345" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#B45309">slope p</text>
    <path d="M408 332 C438 318 462 302 488 282" fill="none" stroke="#B45309" stroke-width="4" marker-end="url(#arrow-teal)"/>

    <text x="182" y="96" font-family="Source Sans 3, Arial, sans-serif" font-size="29" font-weight="700" fill="#1E3A8A">primal graph</text>
    <text x="164" y="132" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">t(z) = p z - f*(p)</text>
  </g>

  <g transform="translate(746 92)">
    <rect x="0" y="0" width="365" height="520" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M60 446 H318" stroke="#94A3B8" stroke-width="5"/>
    <path d="M86 470 V58" stroke="#94A3B8" stroke-width="5"/>
    <text x="292" y="484" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#475569">p</text>
    <text x="42" y="66" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#475569">f*(p)</text>
    <path d="M86 398 C126 360 151 302 180 235 C209 168 245 124 306 92" fill="none" stroke="#0F766E" stroke-width="8" stroke-linecap="round"/>
    <circle cx="206" cy="180" r="11" fill="#B45309"/>
    <path d="M206 180 V446" stroke="#B45309" stroke-width="4" stroke-dasharray="9 9"/>
    <text x="226" y="172" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">p, f*(p)</text>
    <text x="108" y="96" font-family="Source Sans 3, Arial, sans-serif" font-size="29" font-weight="700" fill="#1E3A8A">dual ledger</text>
    <text x="72" y="132" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#111827">f*(p) = p x - f(x)</text>
  </g>

  <path d="M688 342 C713 342 722 342 742 342" fill="none" stroke="#0F766E" stroke-width="6" marker-end="url(#arrow-teal)"/>
  <text x="507" y="690" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">Legendre step: choose x, read slope p = grad f(x), record the tangent intercept.</text>
</svg>
