<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Complete nondecreasing subgradient graph</title>
  <desc id="desc">A piecewise linear convex function and its filled subgradient graph with vertical intervals at corners.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2e8f0" stroke-width="1.4"/>
    </pattern>
    <style>
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}
      .axis{stroke:#94a3b8;stroke-width:3}
      .curve{fill:none;stroke:#2563eb;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
      .graph{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round}
      .jump{stroke:#b45309;stroke-width:9;stroke-linecap:round}
      .pt{fill:#1e3a8a}
      .corner{fill:#b45309}
      .label{font:700 24px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 20px 'Source Sans 3',Arial,sans-serif;fill:#64748b}
      .math{font:400 23px 'STIX Two Text',Georgia,serif;fill:#111827}
    </style>
  </defs>
  <rect width="1100" height="720" fill="#f8fafc"/>
  <rect x="52" y="58" width="470" height="520" rx="8" class="panel"/>
  <rect x="578" y="58" width="470" height="520" rx="8" class="panel"/>
  <rect x="72" y="116" width="430" height="378" fill="url(#grid)"/>
  <rect x="598" y="116" width="430" height="378" fill="url(#grid)"/>
  <text x="72" y="93" class="label">Convex broken line f</text>
  <text x="598" y="93" class="label">Graph of partial f</text>

  <line x1="92" y1="444" x2="486" y2="444" class="axis" marker-end="url(#arrow)"/>
  <line x1="284" y1="478" x2="284" y2="130" class="axis" marker-end="url(#arrow)"/>
  <text x="475" y="474" class="small">x</text>
  <text x="252" y="145" class="small">f(x)</text>
  <polyline points="105,430 212,342 334,312 482,170" class="curve"/>
  <circle cx="212" cy="342" r="10" class="corner"/>
  <circle cx="334" cy="312" r="10" class="corner"/>
  <text x="136" y="323" class="small">slope -1</text>
  <text x="244" y="307" class="small">slope 0.25</text>
  <text x="365" y="252" class="small">slope 1.4</text>
  <path d="M182 386 L232 386" stroke="#b45309" stroke-width="5"/>
  <path d="M306 356 L362 356" stroke="#b45309" stroke-width="5"/>

  <line x1="618" y1="352" x2="1012" y2="352" class="axis" marker-end="url(#arrow)"/>
  <line x1="810" y1="474" x2="810" y2="132" class="axis" marker-end="url(#arrow)"/>
  <text x="1000" y="382" class="small">x</text>
  <text x="778" y="146" class="small">x*</text>
  <line x1="626" y1="432" x2="730" y2="432" class="graph"/>
  <line x1="730" y1="432" x2="730" y2="336" class="jump"/>
  <line x1="730" y1="336" x2="850" y2="336" class="graph"/>
  <line x1="850" y1="336" x2="850" y2="226" class="jump"/>
  <line x1="850" y1="226" x2="1004" y2="226" class="graph"/>
  <circle cx="730" cy="432" r="9" class="corner"/>
  <circle cx="730" cy="336" r="9" class="corner"/>
  <circle cx="850" cy="336" r="9" class="corner"/>
  <circle cx="850" cy="226" r="9" class="corner"/>
  <text x="645" y="463" class="math">partial f(x)={-1}</text>
  <text x="757" y="321" class="math">[ -1, 0.25 ]</text>
  <text x="872" y="211" class="math">[0.25, 1.4]</text>

  <rect x="118" y="606" width="864" height="66" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="3"/>
  <text x="154" y="646" class="math">Every pair on the filled graph satisfies (x-y)(x* - y*) >= 0.</text>
</svg>
