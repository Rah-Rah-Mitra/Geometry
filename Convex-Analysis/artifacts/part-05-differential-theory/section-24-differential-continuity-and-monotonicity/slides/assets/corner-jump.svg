<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Corner jump in a subgradient graph</title>
  <desc id="desc">The absolute value function has a jump from left slope minus one to right slope plus one, filled by a vertical subgradient segment at the corner.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#e2e8f0" stroke-width="1.4"/>
    </pattern>
    <style>
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}
      .axis{stroke:#94a3b8;stroke-width:3}
      .vline{stroke:#b45309;stroke-width:10;stroke-linecap:round}
      .graph{stroke:#2563eb;stroke-width:8;stroke-linecap:round}
      .curve{stroke:#2563eb;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .label{font:700 24px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 20px 'Source Sans 3',Arial,sans-serif;fill:#64748b}
      .math{font:400 23px 'STIX Two Text',Georgia,serif;fill:#111827}
    </style>
  </defs>
  <rect width="1100" height="720" fill="#f8fafc"/>
  <rect x="52" y="58" width="470" height="520" rx="8" class="panel"/>
  <rect x="578" y="58" width="470" height="520" rx="8" class="panel"/>
  <rect x="72" y="116" width="430" height="378" fill="url(#grid)"/>
  <rect x="598" y="116" width="430" height="378" fill="url(#grid)"/>
  <text x="72" y="93" class="label">Function with one corner</text>
  <text x="598" y="93" class="label">Filled jump in partial f</text>
  <line x1="94" y1="444" x2="486" y2="444" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="286" y1="478" x2="286" y2="132" class="axis" marker-end="url(#axis-arrow)"/>
  <polyline points="112,228 286,444 468,228" class="curve"/>
  <circle cx="286" cy="444" r="13" fill="#b45309"/>
  <text x="206" y="246" class="math">slope -1</text>
  <text x="336" y="246" class="math">slope +1</text>
  <text x="260" y="514" class="math">x = 0</text>
  <text x="105" y="548" class="small">f(x)=|x| has no single derivative at the corner.</text>

  <line x1="620" y1="352" x2="1012" y2="352" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="810" y1="474" x2="810" y2="132" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="626" y1="426" x2="810" y2="426" class="graph"/>
  <line x1="810" y1="426" x2="810" y2="238" class="vline"/>
  <line x1="810" y1="238" x2="1004" y2="238" class="graph"/>
  <circle cx="810" cy="426" r="10" fill="#b45309"/>
  <circle cx="810" cy="238" r="10" fill="#b45309"/>
  <text x="648" y="461" class="math">x*=-1</text>
  <text x="884" y="223" class="math">x*=+1</text>
  <text x="828" y="340" class="math">partial f(0)=[-1,1]</text>
  <rect x="648" y="532" width="336" height="54" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="3"/>
  <text x="678" y="566" class="small">The vertical segment is data, not decoration.</text>

  <rect x="122" y="606" width="856" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="154" y="646" class="math">Outer continuity survives: nearby gradients approach the closed set partial f(0).</text>
</svg>
