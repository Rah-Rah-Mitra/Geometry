<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Monotone gradient map for a convex quadratic</title>
  <desc id="desc">Two panels compare points in x-space with their gradients in p-space and highlight the monotone pairing.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#0f766e"/>
    </marker>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    </pattern>
    <style>
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}
      .axis{stroke:#94a3b8;stroke-width:3}
      .label{font:700 24px 'Source Sans 3',Arial,sans-serif;fill:#111827}
      .small{font:600 20px 'Source Sans 3',Arial,sans-serif;fill:#64748b}
      .math{font:400 23px 'STIX Two Text',Georgia,serif;fill:#111827}
    </style>
  </defs>
  <rect width="1100" height="720" fill="#f8fafc"/>
  <rect x="52" y="56" width="470" height="530" rx="8" class="panel"/>
  <rect x="578" y="56" width="470" height="530" rx="8" class="panel"/>
  <rect x="70" y="110" width="434" height="402" fill="url(#grid)" opacity=".85"/>
  <rect x="596" y="110" width="434" height="402" fill="url(#grid)" opacity=".85"/>

  <text x="70" y="91" class="label">x-space: convex level curves</text>
  <text x="596" y="91" class="label">p-space: gradient values</text>

  <line x1="90" y1="312" x2="486" y2="312" class="axis"/>
  <line x1="288" y1="494" x2="288" y2="128" class="axis"/>
  <line x1="616" y1="312" x2="1012" y2="312" class="axis"/>
  <line x1="814" y1="494" x2="814" y2="128" class="axis"/>

  <ellipse cx="288" cy="312" rx="170" ry="92" fill="none" stroke="#bfdbfe" stroke-width="5"/>
  <ellipse cx="288" cy="312" rx="112" ry="60" fill="none" stroke="#93c5fd" stroke-width="5"/>
  <ellipse cx="288" cy="312" rx="58" ry="31" fill="none" stroke="#60a5fa" stroke-width="5"/>
  <path d="M212 388 C242 356 279 338 330 330" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <path d="M196 396 L376 292" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M212 388 L186 417" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow-teal)"/>
  <path d="M376 292 L424 252" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow-teal)"/>
  <circle cx="212" cy="388" r="11" fill="#1e3a8a"/>
  <circle cx="376" cy="292" r="11" fill="#b45309"/>
  <text x="166" y="378" class="math">x0</text>
  <text x="389" y="286" class="math">x1</text>
  <text x="283" y="269" class="small">x1 - x0</text>
  <text x="151" y="453" class="small">grad f(x0)</text>
  <text x="405" y="245" class="small">grad f(x1)</text>

  <ellipse cx="814" cy="312" rx="126" ry="152" fill="none" stroke="#ccfbf1" stroke-width="5"/>
  <ellipse cx="814" cy="312" rx="78" ry="94" fill="none" stroke="#99f6e4" stroke-width="5"/>
  <path d="M722 410 L922 214" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <circle cx="722" cy="410" r="11" fill="#1e3a8a"/>
  <circle cx="922" cy="214" r="11" fill="#b45309"/>
  <text x="642" y="405" class="math">p0 = grad f(x0)</text>
  <text x="879" y="197" class="math">p1</text>
  <text x="806" y="278" class="small">p1 - p0</text>
  <path d="M722 410 C760 358 824 290 922 214" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 10"/>

  <rect x="121" y="606" width="858" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="156" y="646" class="math">Convexity check: &lt;x1 - x0, grad f(x1) - grad f(x0)&gt; >= 0</text>
</svg>
