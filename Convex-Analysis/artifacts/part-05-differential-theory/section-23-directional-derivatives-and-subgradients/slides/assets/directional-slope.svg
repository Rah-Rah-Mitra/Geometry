<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">One-sided directional derivative from shrinking secants</title>
  <desc id="desc">A convex curve with one-sided secant slopes approaching the supporting ray at a base point.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="896" height="556" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <g opacity=".45" stroke="#e2e8f0" stroke-width="2">
    <path d="M90 80 V470"/>
    <path d="M190 80 V470"/>
    <path d="M290 80 V470"/>
    <path d="M390 80 V470"/>
    <path d="M490 80 V470"/>
    <path d="M590 80 V470"/>
    <path d="M690 80 V470"/>
    <path d="M790 80 V470"/>
    <path d="M70 130 H830"/>
    <path d="M70 230 H830"/>
    <path d="M70 330 H830"/>
    <path d="M70 430 H830"/>
  </g>
  <path d="M80 438 H832" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M110 478 V74" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M88 420 C160 370 230 338 298 315 C366 292 432 272 496 247 C584 213 670 162 792 86" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <circle cx="348" cy="300" r="13" fill="#1e3a8a" stroke="#ffffff" stroke-width="6"/>
  <circle cx="488" cy="250" r="10" fill="#b45309" stroke="#ffffff" stroke-width="5"/>
  <circle cx="604" cy="201" r="10" fill="#b45309" stroke="#ffffff" stroke-width="5"/>
  <circle cx="718" cy="132" r="10" fill="#b45309" stroke="#ffffff" stroke-width="5"/>
  <path d="M348 300 L488 250" stroke="#b45309" stroke-width="5" stroke-dasharray="16 12"/>
  <path d="M348 300 L604 201" stroke="#b45309" stroke-width="5" stroke-dasharray="16 12" opacity=".75"/>
  <path d="M348 300 L718 132" stroke="#b45309" stroke-width="5" stroke-dasharray="16 12" opacity=".55"/>
  <path d="M348 300 L526 235" stroke="#0f766e" stroke-width="7" marker-end="url(#arrow-teal)"/>
  <path d="M348 442 H488" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="358" y="283" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">x</text>
  <text x="500" y="238" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">x+lambda y</text>
  <text x="410" y="452" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#111827">y</text>
  <text x="560" y="284" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#0f766e">f'(x; y)</text>
  <text x="144" y="116" font-family="Source Sans 3, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">secants only approach from lambda &gt; 0</text>
  <text x="144" y="154" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#475569">[f(x+lambda y)-f(x)] / lambda decreases to the limit</text>
</svg>
