<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Subdifferential of the absolute value at the cusp</title>
  <desc id="desc">The absolute value graph with three supporting lines at zero and the slope interval from minus one to one.</desc>
  <defs>
    <marker id="tick-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="896" height="556" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <g opacity=".42" stroke="#e2e8f0" stroke-width="2">
    <path d="M120 78 V438"/>
    <path d="M240 78 V438"/>
    <path d="M360 78 V438"/>
    <path d="M480 78 V438"/>
    <path d="M600 78 V438"/>
    <path d="M720 78 V438"/>
    <path d="M840 78 V438"/>
    <path d="M72 118 H846"/>
    <path d="M72 238 H846"/>
    <path d="M72 358 H846"/>
  </g>
  <path d="M74 358 H846" stroke="#94a3b8" stroke-width="4" marker-end="url(#tick-arrow)"/>
  <path d="M450 456 V74" stroke="#94a3b8" stroke-width="4" marker-end="url(#tick-arrow)"/>
  <path d="M138 108 L450 358 L762 108" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166 540 L734 -8" stroke="#0f766e" stroke-width="5" stroke-dasharray="16 12" opacity=".55"/>
  <path d="M124 -18 L776 540" stroke="#0f766e" stroke-width="5" stroke-dasharray="16 12" opacity=".55"/>
  <path d="M112 358 H788" stroke="#b45309" stroke-width="5" stroke-dasharray="16 12"/>
  <circle cx="450" cy="358" r="15" fill="#1e3a8a" stroke="#ffffff" stroke-width="6"/>
  <text x="488" y="386" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#1e3a8a">x = 0</text>
  <text x="120" y="88" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#2563eb">f(t)=|t|</text>
  <text x="576" y="218" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f766e">supporting slopes</text>
  <g transform="translate(180 468)">
    <path d="M0 30 H540" stroke="#1e3a8a" stroke-width="5"/>
    <path d="M0 18 V42" stroke="#1e3a8a" stroke-width="5"/>
    <path d="M270 18 V42" stroke="#1e3a8a" stroke-width="5"/>
    <path d="M540 18 V42" stroke="#1e3a8a" stroke-width="5"/>
    <rect x="0" y="17" width="540" height="26" rx="13" fill="#eef2ff" opacity=".7"/>
    <text x="-15" y="82" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#111827">-1</text>
    <text x="260" y="82" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#111827">0</text>
    <text x="526" y="82" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#111827">1</text>
    <text x="166" y="-8" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#1e3a8a">partial f(0) = [-1,1]</text>
  </g>
</svg>
