<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Subgradient as a supporting hyperplane to an epigraph</title>
  <desc id="desc">A convex epigraph is shaded above a function curve, with an affine supporting line touching at one point.</desc>
  <defs>
    <linearGradient id="epi-fill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".24"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".08"/>
    </linearGradient>
    <marker id="normal-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="896" height="556" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <g opacity=".42" stroke="#e2e8f0" stroke-width="2">
    <path d="M96 90 V478"/>
    <path d="M206 90 V478"/>
    <path d="M316 90 V478"/>
    <path d="M426 90 V478"/>
    <path d="M536 90 V478"/>
    <path d="M646 90 V478"/>
    <path d="M756 90 V478"/>
    <path d="M76 146 H830"/>
    <path d="M76 250 H830"/>
    <path d="M76 354 H830"/>
    <path d="M76 458 H830"/>
  </g>
  <path d="M78 466 H830" stroke="#94a3b8" stroke-width="4"/>
  <path d="M110 486 V78" stroke="#94a3b8" stroke-width="4"/>
  <path d="M110 426 C180 388 250 355 322 330 C400 304 472 284 542 246 C640 192 728 128 814 96 L814 86 L110 86 Z" fill="url(#epi-fill)" stroke="none"/>
  <path d="M110 426 C180 388 250 355 322 330 C400 304 472 284 542 246 C640 192 728 128 814 96" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <path d="M92 394 L808 168" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <circle cx="414" cy="292" r="15" fill="#1e3a8a" stroke="#ffffff" stroke-width="6"/>
  <path d="M414 292 L472 110" stroke="#6d28d9" stroke-width="6" marker-end="url(#normal-arrow)"/>
  <text x="146" y="128" font-family="Source Sans 3, Arial, sans-serif" font-size="31" font-weight="700" fill="#1e3a8a">epi f</text>
  <text x="506" y="146" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#6d28d9">(x*, -1)</text>
  <text x="450" y="323" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#111827">(x, f(x))</text>
  <text x="108" y="366" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#0f766e">f(x)+&lt;x*, z-x&gt;</text>
  <text x="198" y="520" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#475569">a subgradient gives a global affine floor</text>
</svg>
