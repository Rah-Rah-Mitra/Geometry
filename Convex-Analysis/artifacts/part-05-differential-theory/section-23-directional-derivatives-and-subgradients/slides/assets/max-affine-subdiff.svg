<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Subdifferential of a maximum of affine functions</title>
  <desc id="desc">Several affine functions form an upper envelope, and the active slopes generate a convex-hull subdifferential.</desc>
  <rect x="2" y="2" width="896" height="556" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <g opacity=".42" stroke="#e2e8f0" stroke-width="2">
    <path d="M100 78 V438"/>
    <path d="M220 78 V438"/>
    <path d="M340 78 V438"/>
    <path d="M460 78 V438"/>
    <path d="M580 78 V438"/>
    <path d="M700 78 V438"/>
    <path d="M820 78 V438"/>
    <path d="M78 116 H842"/>
    <path d="M78 236 H842"/>
    <path d="M78 356 H842"/>
  </g>
  <path d="M78 356 H842" stroke="#94a3b8" stroke-width="4"/>
  <path d="M450 456 V74" stroke="#94a3b8" stroke-width="4"/>
  <path d="M118 140 L782 500" stroke="#94a3b8" stroke-width="4" stroke-dasharray="18 13" opacity=".7"/>
  <path d="M112 500 L786 114" stroke="#94a3b8" stroke-width="4" stroke-dasharray="18 13" opacity=".7"/>
  <path d="M112 404 L792 294" stroke="#94a3b8" stroke-width="4" stroke-dasharray="18 13" opacity=".7"/>
  <path d="M112 500 L450 356 L786 114" fill="none" stroke="#2563eb" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="450" cy="356" r="15" fill="#1e3a8a" stroke="#ffffff" stroke-width="6"/>
  <text x="478" y="386" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#1e3a8a">active set I(x)</text>
  <text x="112" y="100" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#2563eb">f(z)=max_i (a_i z+b_i)</text>
  <text x="612" y="164" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#64748b">inactive affine piece</text>
  <g transform="translate(145 464)">
    <rect x="0" y="0" width="610" height="72" rx="8" fill="#eef2ff" stroke="#1e3a8a" stroke-width="4"/>
    <text x="30" y="45" font-family="STIX Two Text, Georgia, serif" font-size="30" fill="#1e3a8a">partial f(x) = conv { a_i : i in I(x) }</text>
  </g>
</svg>
