name: Manifest Foundation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  manifest-foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check committed course manifest
        run: python scripts/build_course_manifest.py --check

      - name: Compile manifest builder
        run: python -m py_compile scripts/build_course_manifest.py

      - name: Validate atlas notebook JSON
        run: python -m json.tool index.ipynb > /dev/null

      - name: Check manifest paths
        run: python scripts/check_manifest_paths.py
