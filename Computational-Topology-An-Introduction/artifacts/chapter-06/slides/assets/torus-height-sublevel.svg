<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Torus Height Sweep With Sublevel Sets</title>
  <desc id="desc">Original schematic of a torus height function, four critical values, and the changing homotopy type of sublevel sets.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#1E3A8A"/>
    </marker>
    <linearGradient id="torusFill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CCFBF1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <g opacity="0.45" stroke="#E2E8F0" stroke-width="1">
    <path d="M50 96H1148M50 176H1148M50 256H1148M50 336H1148M50 416H1148M50 496H1148M50 576H1148M50 656H1148"/>
  </g>
  <text x="70" y="68" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Height function on a torus</text>
  <text x="70" y="108" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#475569">Sublevel topology changes only when the sweep crosses a critical value.</text>

  <g transform="translate(78 130)">
    <path d="M125 255C150 120 292 43 443 83C587 121 642 263 553 372C463 481 285 493 178 399C138 364 119 316 125 255Z" fill="url(#torusFill)" stroke="#1E3A8A" stroke-width="5"/>
    <ellipse cx="360" cy="275" rx="139" ry="88" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="5"/>
    <path d="M236 267C264 221 315 196 370 201C426 206 470 241 486 289" fill="none" stroke="#94A3B8" stroke-width="4" stroke-dasharray="12 10"/>
    <path d="M218 283C254 354 371 384 458 327" fill="none" stroke="#2563EB" stroke-width="5"/>
    <path d="M112 366C232 452 433 469 574 343" fill="none" stroke="#0F766E" stroke-width="5" opacity="0.85"/>
    <g stroke="#B45309" stroke-width="3" stroke-dasharray="9 9">
      <line x1="24" y1="406" x2="655" y2="406"/>
      <line x1="24" y1="321" x2="655" y2="321"/>
      <line x1="24" y1="198" x2="655" y2="198"/>
      <line x1="24" y1="99" x2="655" y2="99"/>
    </g>
    <g font-family="STIX Two Text, Georgia, serif" font-size="28" font-style="italic" fill="#111827">
      <circle cx="336" cy="418" r="10" fill="#B45309"/><text x="352" y="427">u</text>
      <circle cx="190" cy="324" r="10" fill="#B45309"/><text x="205" y="333">v</text>
      <circle cx="512" cy="201" r="10" fill="#B45309"/><text x="527" y="210">w</text>
      <circle cx="366" cy="86" r="10" fill="#B45309"/><text x="382" y="95">z</text>
    </g>
    <line x1="690" y1="450" x2="690" y2="60" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="714" y="74" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">height</text>
  </g>

  <g transform="translate(80 588)" font-family="Source Sans 3, Arial, sans-serif">
    <g>
      <rect x="0" y="0" width="225" height="105" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
      <circle cx="61" cy="54" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
      <text x="118" y="44" font-size="24" font-weight="700" fill="#1E3A8A">disk</text>
      <text x="118" y="76" font-size="21" fill="#475569">index 0 starts</text>
    </g>
    <g transform="translate(250 0)">
      <rect x="0" y="0" width="225" height="105" rx="8" fill="#F0FDFA" stroke="#0F766E"/>
      <path d="M44 31H116C139 31 139 77 116 77H44C21 77 21 31 44 31Z" fill="#CCFBF1" stroke="#0F766E" stroke-width="4"/>
      <text x="131" y="44" font-size="24" font-weight="700" fill="#0F766E">cylinder</text>
      <text x="131" y="76" font-size="21" fill="#475569">first 1-cell</text>
    </g>
    <g transform="translate(500 0)">
      <rect x="0" y="0" width="225" height="105" rx="8" fill="#FFFBEB" stroke="#B45309"/>
      <path d="M40 75C38 36 88 21 109 54C131 18 183 34 179 75" fill="none" stroke="#B45309" stroke-width="7" stroke-linecap="round"/>
      <text x="74" y="44" font-size="24" font-weight="700" fill="#B45309">figure-eight</text>
      <text x="74" y="76" font-size="21" fill="#475569">second 1-cell</text>
    </g>
    <g transform="translate(750 0)">
      <rect x="0" y="0" width="225" height="105" rx="8" fill="#F5F3FF" stroke="#6D28D9"/>
      <ellipse cx="70" cy="54" rx="54" ry="31" fill="none" stroke="#6D28D9" stroke-width="5"/>
      <ellipse cx="70" cy="54" rx="21" ry="13" fill="none" stroke="#6D28D9" stroke-width="4"/>
      <text x="137" y="44" font-size="24" font-weight="700" fill="#6D28D9">torus</text>
      <text x="137" y="76" font-size="21" fill="#475569">final 2-cell</text>
    </g>
  </g>
</svg>
