<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Reeb Graph Sweep</title>
  <desc id="desc">Original schematic mapping level-set components of a height function to arcs and nodes in a Reeb graph.</desc>
  <defs>
    <marker id="mapArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="70" y="68" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Reeb graph: compress contours, keep component changes</text>
  <text x="70" y="108" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#475569">Collapse each connected component of each level set to a point; critical contours become graph nodes.</text>

  <g transform="translate(78 152)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="525" height="470" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="24" y="42" font-size="27" font-weight="700" fill="#1E3A8A">level-set components in X</text>
    <path d="M95 270C115 127 252 72 380 125C500 174 515 336 392 395C277 451 92 408 95 270Z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="4"/>
    <ellipse cx="300" cy="274" rx="98" ry="58" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="4"/>
    <g stroke="#2563EB" stroke-width="5" fill="none">
      <path d="M136 172C218 195 341 200 444 173"/>
      <path d="M119 250C202 281 331 283 471 249"/>
      <path d="M137 344C218 318 343 319 444 344"/>
    </g>
    <g stroke="#0F766E" stroke-width="4" fill="none">
      <ellipse cx="299" cy="251" rx="64" ry="24"/>
      <ellipse cx="300" cy="294" rx="72" ry="28"/>
    </g>
    <text x="122" y="438" font-size="22" fill="#475569">same height can have different contour components</text>
  </g>

  <line x1="625" y1="392" x2="720" y2="392" stroke="#64748B" stroke-width="5" marker-end="url(#mapArrow)"/>
  <text x="650" y="370" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#64748B">quotient</text>

  <g transform="translate(742 152)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="385" height="470" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="24" y="42" font-size="27" font-weight="700" fill="#0F766E">Reeb graph R(f)</text>
    <g transform="translate(92 75)" stroke-linecap="round" fill="none">
      <path d="M105 345C105 300 105 268 105 238" stroke="#2563EB" stroke-width="8"/>
      <path d="M105 238C55 206 55 146 105 116" stroke="#2563EB" stroke-width="8"/>
      <path d="M105 238C160 208 160 146 105 116" stroke="#2563EB" stroke-width="8"/>
      <path d="M105 116C105 82 105 52 105 24" stroke="#2563EB" stroke-width="8"/>
      <g fill="#B45309" stroke="#FFFFFF" stroke-width="4">
        <circle cx="105" cy="345" r="13"/>
        <circle cx="105" cy="238" r="13"/>
        <circle cx="105" cy="116" r="13"/>
        <circle cx="105" cy="24" r="13"/>
      </g>
      <g font-size="23" font-weight="700" fill="#475569" stroke="none">
        <text x="132" y="352">min</text>
        <text x="132" y="245">merge</text>
        <text x="132" y="123">split</text>
        <text x="132" y="31">max</text>
      </g>
    </g>
    <text x="32" y="438" font-size="23" fill="#111827">cycle rank = 1 for the torus height graph</text>
  </g>
</svg>
