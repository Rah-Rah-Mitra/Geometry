<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Gradient Flow And Morse-Smale Transversality</title>
  <desc id="desc">Original schematic comparing a non-transverse saddle connection with a transverse Morse-Smale crossing.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#2563EB"/>
    </marker>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="70" y="68" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Gradient flow as topology bookkeeping</text>
  <text x="70" y="108" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#475569">Integral lines organize points by origin and destination; transversality turns that organization into a complex.</text>

  <g transform="translate(70 150)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="510" height="500" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="24" y="44" font-size="28" font-weight="700" fill="#B45309">saddle-to-saddle connection</text>
    <text x="24" y="78" font-size="22" fill="#475569">stable and unstable manifolds share a trajectory</text>
    <g transform="translate(54 105)">
      <ellipse cx="205" cy="205" rx="188" ry="132" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="4"/>
      <path d="M66 278C141 205 272 205 348 278" fill="none" stroke="#2563EB" stroke-width="5" marker-end="url(#blueArrow)"/>
      <path d="M66 132C141 205 272 205 348 132" fill="none" stroke="#2563EB" stroke-width="5" marker-end="url(#blueArrow)"/>
      <path d="M206 318C206 256 206 154 206 94" fill="none" stroke="#0F766E" stroke-width="6" marker-end="url(#tealArrow)"/>
      <path d="M196 318C196 256 196 154 196 94" fill="none" stroke="#B45309" stroke-width="3" stroke-dasharray="9 8"/>
      <circle cx="202" cy="288" r="11" fill="#B45309"/>
      <circle cx="202" cy="128" r="11" fill="#B45309"/>
      <text x="218" y="294" font-size="24" fill="#111827">v</text>
      <text x="218" y="134" font-size="24" fill="#111827">w</text>
      <text x="92" y="370" font-size="22" fill="#475569">boundary is not a clean union of stable cells</text>
    </g>
  </g>

  <g transform="translate(620 150)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="510" height="500" rx="8" fill="#F0FDFA" stroke="#0F766E"/>
    <text x="24" y="44" font-size="28" font-weight="700" fill="#0F766E">Morse-Smale crossing</text>
    <text x="24" y="78" font-size="22" fill="#475569">intersections span the local tangent space</text>
    <g transform="translate(54 105)">
      <ellipse cx="205" cy="205" rx="188" ry="132" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="4"/>
      <path d="M54 294C118 245 177 221 205 205C246 181 295 155 360 112" fill="none" stroke="#2563EB" stroke-width="6" marker-end="url(#blueArrow)"/>
      <path d="M54 116C118 164 177 189 205 205C246 229 295 255 360 298" fill="none" stroke="#2563EB" stroke-width="6" marker-end="url(#blueArrow)"/>
      <path d="M82 205H340" fill="none" stroke="#0F766E" stroke-width="6" marker-end="url(#tealArrow)"/>
      <circle cx="205" cy="205" r="13" fill="#FFFFFF" stroke="#B45309" stroke-width="5"/>
      <text x="220" y="199" font-size="24" fill="#111827">transverse point</text>
      <text x="78" y="370" font-size="22" fill="#475569">stable q-cell meets unstable p-cell in dimension q + p - d</text>
    </g>
  </g>
</svg>
