<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Critical Point Normal Forms</title>
  <desc id="desc">Original contour schematics for minimum, saddle, maximum, and two degenerate critical point failures.</desc>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="70" y="68" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Morse lemma local models</text>
  <text x="70" y="108" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#475569">At a nondegenerate critical point, the quadratic part is the whole local story after changing coordinates.</text>

  <g transform="translate(72 145)" font-family="Source Sans 3, Arial, sans-serif">
    <g>
      <rect x="0" y="0" width="325" height="310" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
      <text x="24" y="44" font-size="28" font-weight="700" fill="#1E3A8A">index 0 minimum</text>
      <g transform="translate(35 76)" fill="none" stroke="#2563EB">
        <ellipse cx="128" cy="103" rx="103" ry="65" stroke-width="4"/>
        <ellipse cx="128" cy="103" rx="67" ry="42" stroke-width="4" opacity="0.75"/>
        <ellipse cx="128" cy="103" rx="32" ry="20" stroke-width="4" opacity="0.55"/>
        <circle cx="128" cy="103" r="8" fill="#B45309" stroke="none"/>
      </g>
      <text x="34" y="268" font-size="25" fill="#111827">f = c + x1^2 + x2^2</text>
    </g>
    <g transform="translate(365 0)">
      <rect x="0" y="0" width="325" height="310" rx="8" fill="#FFFBEB" stroke="#B45309"/>
      <text x="24" y="44" font-size="28" font-weight="700" fill="#B45309">index 1 saddle</text>
      <g transform="translate(35 76)" fill="none" stroke="#B45309" stroke-width="4">
        <path d="M20 20C70 82 178 82 236 20"/>
        <path d="M20 186C70 124 178 124 236 186"/>
        <path d="M20 103H236" stroke="#CBD5E1"/>
        <path d="M128 12V194" stroke="#CBD5E1"/>
        <circle cx="128" cy="103" r="8" fill="#B45309" stroke="none"/>
      </g>
      <text x="33" y="268" font-size="25" fill="#111827">f = c - x1^2 + x2^2</text>
    </g>
    <g transform="translate(730 0)">
      <rect x="0" y="0" width="325" height="310" rx="8" fill="#F5F3FF" stroke="#6D28D9"/>
      <text x="24" y="44" font-size="28" font-weight="700" fill="#6D28D9">index 2 maximum</text>
      <g transform="translate(35 76)" fill="none" stroke="#6D28D9">
        <ellipse cx="128" cy="103" rx="103" ry="65" stroke-width="4"/>
        <ellipse cx="128" cy="103" rx="67" ry="42" stroke-width="4" opacity="0.75"/>
        <ellipse cx="128" cy="103" rx="32" ry="20" stroke-width="4" opacity="0.55"/>
        <circle cx="128" cy="103" r="8" fill="#B45309" stroke="none"/>
      </g>
      <text x="34" y="268" font-size="25" fill="#111827">f = c - x1^2 - x2^2</text>
    </g>
  </g>

  <g transform="translate(92 510)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="468" height="165" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="24" y="42" font-size="28" font-weight="700" fill="#1E3A8A">Hessian test</text>
    <text x="24" y="84" font-size="25" fill="#111827">det H != 0 means the critical point is nondegenerate.</text>
    <text x="24" y="124" font-size="25" fill="#475569">index = number of negative eigenvalues of H.</text>
  </g>
  <g transform="translate(590 510)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="520" height="165" rx="8" fill="#FFFBEB" stroke="#B45309"/>
    <text x="24" y="42" font-size="28" font-weight="700" fill="#B45309">Degenerate failures</text>
    <path d="M270 123C286 47 326 47 342 123" fill="none" stroke="#B45309" stroke-width="5"/>
    <path d="M384 94C416 42 456 42 488 94M384 94C416 146 456 146 488 94" fill="none" stroke="#B45309" stroke-width="4"/>
    <text x="24" y="84" font-size="25" fill="#111827">x^3: flat critical point</text>
    <text x="24" y="124" font-size="25" fill="#111827">x^3 - 3xy^2: multi-saddle</text>
  </g>
</svg>
