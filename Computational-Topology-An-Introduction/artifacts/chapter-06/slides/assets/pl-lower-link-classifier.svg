<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PL Lower Link Classifier</title>
  <desc id="desc">Original schematic classifying PL vertices by the reduced Betti numbers of their lower links.</desc>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="70" y="68" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">PL critical vertices from lower links</text>
  <text x="70" y="108" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#475569">A generic PL function orders vertices; the lower link records what is already present below the next vertex.</text>

  <g transform="translate(70 165)" font-family="Source Sans 3, Arial, sans-serif" font-size="21" fill="#475569">
    <g>
      <rect x="0" y="0" width="255" height="430" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="24" y="40" font-size="27" font-weight="700" fill="#1E3A8A">regular</text>
      <g transform="translate(28 68)">
        <polygon points="100,24 176,68 176,156 100,200 24,156 24,68" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
        <polygon points="100,100 24,68 24,156" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
        <polygon points="100,100 24,156 100,200" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
        <circle cx="100" cy="100" r="12" fill="#B45309"/>
        <path d="M24 68L24 156L100 200" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
      </g>
      <text x="24" y="318">lower link: one interval</text>
      <text x="24" y="356">reduced Betti all zero</text>
      <text x="24" y="394">no topology change</text>
    </g>
    <g transform="translate(285 0)">
      <rect x="0" y="0" width="255" height="430" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
      <text x="24" y="40" font-size="27" font-weight="700" fill="#2563EB">minimum</text>
      <g transform="translate(28 68)">
        <polygon points="100,24 176,68 176,156 100,200 24,156 24,68" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
        <circle cx="100" cy="100" r="12" fill="#B45309"/>
      </g>
      <text x="24" y="318">lower link: empty</text>
      <text x="24" y="356">Betti tilde -1 = 1</text>
      <text x="24" y="394">adds a 0-cell</text>
    </g>
    <g transform="translate(570 0)">
      <rect x="0" y="0" width="255" height="430" rx="8" fill="#FFFBEB" stroke="#B45309"/>
      <text x="24" y="40" font-size="27" font-weight="700" fill="#B45309">saddle</text>
      <g transform="translate(28 68)">
        <polygon points="100,24 176,68 176,156 100,200 24,156 24,68" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
        <polygon points="100,100 24,68 100,24" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
        <polygon points="100,100 176,156 100,200" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
        <circle cx="100" cy="100" r="12" fill="#B45309"/>
        <path d="M24 68L100 24M176 156L100 200" fill="none" stroke="#B45309" stroke-width="7" stroke-linecap="round"/>
      </g>
      <text x="24" y="318">lower link: two pieces</text>
      <text x="24" y="356">Betti tilde 0 = 1</text>
      <text x="24" y="394">attaches a 1-cell</text>
    </g>
    <g transform="translate(855 0)">
      <rect x="0" y="0" width="255" height="430" rx="8" fill="#F5F3FF" stroke="#6D28D9"/>
      <text x="24" y="40" font-size="27" font-weight="700" fill="#6D28D9">maximum</text>
      <g transform="translate(28 68)">
        <polygon points="100,24 176,68 176,156 100,200 24,156 24,68" fill="#F5F3FF" stroke="#6D28D9" stroke-width="3"/>
        <circle cx="100" cy="100" r="12" fill="#B45309"/>
        <path d="M100 24L176 68L176 156L100 200L24 156L24 68Z" fill="none" stroke="#6D28D9" stroke-width="7" stroke-linejoin="round"/>
      </g>
      <text x="24" y="318">lower link: circle</text>
      <text x="24" y="356">Betti tilde 1 = 1</text>
      <text x="24" y="394">attaches a 2-cell</text>
    </g>
  </g>
  <text x="82" y="660" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#1E3A8A">Rule:</text>
  <text x="146" y="660" font-family="Source Sans 3, Arial, sans-serif" font-size="25" fill="#111827">simple PL critical of index q means the lower link has the reduced homology of S^(q-1).</text>
</svg>
