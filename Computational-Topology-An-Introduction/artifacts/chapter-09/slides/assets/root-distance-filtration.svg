<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Root distance filtration</title>
  <desc id="desc">A synthetic root skeleton thickens through distance offsets and records Betti summaries over radius.</desc>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="44" y="58" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">Space Carving And Distance Filtrations</text>
  <g transform="translate(62 116)">
    <rect x="0" y="0" width="520" height="500" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <g fill="none" stroke-linecap="round">
      <path d="M258 426 L258 106" stroke="#CBD5E1" stroke-width="92" opacity="0.35"/>
      <path d="M258 264 L128 154" stroke="#CBD5E1" stroke-width="92" opacity="0.35"/>
      <path d="M258 240 L402 128" stroke="#CBD5E1" stroke-width="92" opacity="0.35"/>
      <path d="M258 328 L154 406" stroke="#CBD5E1" stroke-width="70" opacity="0.35"/>
      <path d="M258 426 L258 106" stroke="#0F766E" stroke-width="10"/>
      <path d="M258 264 L128 154" stroke="#0F766E" stroke-width="10"/>
      <path d="M258 240 L402 128" stroke="#0F766E" stroke-width="10"/>
      <path d="M258 328 L154 406" stroke="#0F766E" stroke-width="10"/>
    </g>
    <g fill="#FFFFFF" stroke="#0F766E" stroke-width="5">
      <circle cx="258" cy="426" r="18"/><circle cx="258" cy="264" r="18"/><circle cx="258" cy="240" r="18"/>
      <circle cx="128" cy="154" r="18"/><circle cx="402" cy="128" r="18"/><circle cx="154" cy="406" r="18"/><circle cx="258" cy="106" r="18"/>
    </g>
    <text x="34" y="466" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#475569">offsets carve a tubular neighborhood around the root skeleton</text>
  </g>
  <g transform="translate(650 116)">
    <rect x="0" y="0" width="486" height="500" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="34" y="50" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">Betti summaries over radius</text>
    <g transform="translate(56 96)">
      <path d="M0 320H370M0 320V30" stroke="#475569" stroke-width="3"/>
      <g stroke="#E2E8F0" stroke-width="1">
        <path d="M0 260H370M0 200H370M0 140H370M0 80H370"/>
        <path d="M74 30V320M148 30V320M222 30V320M296 30V320"/>
      </g>
      <path d="M0 260 L72 228 L126 202 L190 170 L252 150 L310 146 L370 146" fill="none" stroke="#2563EB" stroke-width="6"/>
      <path d="M0 310 L76 310 L126 278 L190 278 L252 250 L310 250 L370 244" fill="none" stroke="#B45309" stroke-width="6"/>
      <path d="M0 300 L74 300 L148 292 L222 286 L296 286 L370 286" fill="none" stroke="#6D28D9" stroke-width="6"/>
      <text x="8" y="22" font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#475569">count</text>
      <text x="312" y="354" font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#475569">radius</text>
    </g>
    <g font-family="Source Sans 3, Arial, sans-serif" font-size="23">
      <text x="78" y="448" fill="#2563EB">beta0 components merge</text>
      <text x="78" y="482" fill="#B45309">beta1 loops are late and sparse</text>
    </g>
  </g>
</svg>
