<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Reusable application pipeline map</title>
  <desc id="desc">Four application rows pass through data, function, filtration, diagram, simplification, and decision stages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748B"/>
    </marker>
    <linearGradient id="softBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <g stroke="#E2E8F0" stroke-width="1">
    <path d="M0 96H1200M0 194H1200M0 292H1200M0 390H1200M0 488H1200M0 586H1200"/>
    <path d="M190 80V640M355 80V640M520 80V640M685 80V640M850 80V640M1015 80V640"/>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <text x="44" y="55" fill="#1E3A8A" font-size="32" font-weight="700">One Pattern Behind Four Applications</text>
    <text x="216" y="116" fill="#1E3A8A" font-size="24" font-weight="700">Data</text>
    <text x="380" y="116" fill="#1E3A8A" font-size="24" font-weight="700">Function</text>
    <text x="534" y="116" fill="#1E3A8A" font-size="24" font-weight="700">Filtration</text>
    <text x="704" y="116" fill="#1E3A8A" font-size="24" font-weight="700">Diagram</text>
    <text x="870" y="116" fill="#1E3A8A" font-size="24" font-weight="700">Simplify</text>
    <text x="1032" y="116" fill="#1E3A8A" font-size="24" font-weight="700">Decision</text>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="22">
    <g transform="translate(0 0)">
      <rect x="30" y="146" width="132" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
      <text x="48" y="182" fill="#111827" font-weight="700">Gene signal</text>
      <text x="214" y="180" fill="#111827">time samples</text>
      <text x="376" y="180" fill="#111827">expression height</text>
      <text x="538" y="180" fill="#111827">sublevel sweep</text>
      <text x="706" y="180" fill="#111827">peak pairs</text>
      <text x="872" y="180" fill="#111827">cancel noise</text>
      <text x="1038" y="180" fill="#111827">rank genes</text>
    </g>
    <g transform="translate(0 98)">
      <rect x="30" y="146" width="132" height="58" rx="8" fill="#F0FDFA" stroke="#0F766E"/>
      <text x="48" y="182" fill="#111827" font-weight="700">Docking</text>
      <text x="214" y="180" fill="#111827">two surfaces</text>
      <text x="376" y="180" fill="#111827">normal elevation</text>
      <text x="538" y="180" fill="#111827">height sweep</text>
      <text x="706" y="180" fill="#111827">critical events</text>
      <text x="872" y="180" fill="#111827">match contacts</text>
      <text x="1038" y="180" fill="#111827">score fits</text>
    </g>
    <g transform="translate(0 196)">
      <rect x="30" y="146" width="132" height="58" rx="8" fill="#FFFBEB" stroke="#B45309"/>
      <text x="48" y="182" fill="#111827" font-weight="700">Image</text>
      <text x="214" y="180" fill="#111827">pixels/voxels</text>
      <text x="376" y="180" fill="#111827">intensity field</text>
      <text x="538" y="180" fill="#111827">watershed graph</text>
      <text x="706" y="180" fill="#111827">merge pairs</text>
      <text x="872" y="180" fill="#111827">remove basins</text>
      <text x="1038" y="180" fill="#111827">segments</text>
    </g>
    <g transform="translate(0 294)">
      <rect x="30" y="146" width="132" height="58" rx="8" fill="#F5F3FF" stroke="#6D28D9"/>
      <text x="48" y="182" fill="#111827" font-weight="700">Roots</text>
      <text x="214" y="180" fill="#111827">skeleton cloud</text>
      <text x="376" y="180" fill="#111827">distance / local</text>
      <text x="538" y="180" fill="#111827">offset growth</text>
      <text x="706" y="180" fill="#111827">Betti traces</text>
      <text x="872" y="180" fill="#111827">prune artifacts</text>
      <text x="1038" y="180" fill="#111827">architecture</text>
    </g>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)" opacity="0.85">
    <path d="M330 175H354"/>
    <path d="M495 175H519"/>
    <path d="M660 175H684"/>
    <path d="M825 175H849"/>
    <path d="M990 175H1014"/>
    <path d="M330 273H354"/>
    <path d="M495 273H519"/>
    <path d="M660 273H684"/>
    <path d="M825 273H849"/>
    <path d="M990 273H1014"/>
    <path d="M330 371H354"/>
    <path d="M495 371H519"/>
    <path d="M660 371H684"/>
    <path d="M825 371H849"/>
    <path d="M990 371H1014"/>
    <path d="M330 469H354"/>
    <path d="M495 469H519"/>
    <path d="M660 469H684"/>
    <path d="M825 469H849"/>
    <path d="M990 469H1014"/>
  </g>
  <g transform="translate(50 596)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="1090" height="64" rx="8" fill="url(#softBlue)" stroke="#CBD5E1"/>
    <text x="24" y="40" fill="#475569" font-size="23">Design rule: every applied claim names the measured function, the filtration, the topological summary, and the decision threshold.</text>
  </g>
</svg>
