<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Persistence-guided watershed cleanup</title>
  <desc id="desc">An oversegmented watershed graph is simplified by merging low-persistence basins before retaining stable regions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="44" y="58" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">Watershed Graph Before And After Cleanup</text>
  <g transform="translate(58 122)">
    <rect x="0" y="0" width="470" height="474" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="28" y="42" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#1E3A8A">Before cleanup</text>
    <g fill="none" stroke-width="5">
      <path d="M90 144 C156 74 250 78 330 132 C386 170 402 252 354 310 C284 390 152 376 86 296 C48 248 46 190 90 144Z" fill="#EFF6FF" stroke="#2563EB"/>
      <path d="M145 182 C194 130 264 130 314 178 C262 210 212 248 170 314 C132 274 120 222 145 182Z" fill="#F0FDFA" stroke="#0F766E"/>
      <path d="M314 178 C378 218 372 292 306 338 C274 286 252 238 314 178Z" fill="#FFFBEB" stroke="#B45309"/>
      <path d="M170 314 C212 248 262 210 314 178" stroke="#1E3A8A"/>
      <path d="M170 314 C220 346 260 356 306 338" stroke="#1E3A8A"/>
    </g>
    <g fill="#FFFFFF" stroke="#111827" stroke-width="3">
      <circle cx="145" cy="225" r="15"/><circle cx="252" cy="204" r="15"/><circle cx="318" cy="270" r="15"/><circle cx="232" cy="322" r="15"/>
    </g>
    <g font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#111827">
      <text x="112" y="225">m1</text><text x="266" y="202">m2</text><text x="334" y="273">m3</text><text x="198" y="356">m4</text>
    </g>
  </g>
  <path d="M552 360H636" stroke="#64748B" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(672 122)">
    <rect x="0" y="0" width="470" height="474" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="28" y="42" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#0F766E">After persistence merges</text>
    <path d="M90 144 C156 74 250 78 330 132 C386 170 402 252 354 310 C284 390 152 376 86 296 C48 248 46 190 90 144Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="5"/>
    <path d="M145 182 C194 130 264 130 314 178 C342 220 332 306 270 342 C214 374 146 334 122 272 C106 230 116 198 145 182Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/>
    <path d="M314 178 C378 218 372 292 306 338 C274 286 252 238 314 178Z" fill="#F0FDFA" stroke="#0F766E" stroke-width="5"/>
    <g fill="#FFFFFF" stroke="#111827" stroke-width="3">
      <circle cx="205" cy="248" r="18"/><circle cx="318" cy="270" r="18"/>
    </g>
    <g font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#111827">
      <text x="166" y="424">weak basins m2 and m4 merged into m1</text>
      <text x="332" y="273">m3</text>
    </g>
  </g>
</svg>
