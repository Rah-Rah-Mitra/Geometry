<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Elevation event types</title>
  <desc id="desc">Critical events for curve and surface elevation are shown as births, joins, tunnel events, and caps.</desc>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="44" y="58" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">Curve And Surface Elevation Events</text>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <g transform="translate(62 126)">
      <rect x="0" y="0" width="320" height="450" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
      <text x="24" y="42" font-size="28" font-weight="700" fill="#1E3A8A">Curve</text>
      <path d="M48 330 C92 106 162 108 210 322 C230 410 268 408 286 326" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
      <g stroke="#B45309" stroke-width="3" stroke-dasharray="8 7">
        <path d="M116 110H280"/><path d="M210 322H280"/><path d="M258 384H280"/>
      </g>
      <circle cx="116" cy="110" r="10" fill="#B45309"/>
      <circle cx="210" cy="322" r="10" fill="#0F766E"/>
      <circle cx="258" cy="384" r="10" fill="#0F766E"/>
      <text x="34" y="400" font-size="23" fill="#475569">alternating extrema pair into lifetimes</text>
    </g>
    <g transform="translate(440 126)">
      <rect x="0" y="0" width="320" height="450" rx="8" fill="#F0FDFA" stroke="#0F766E"/>
      <text x="24" y="42" font-size="28" font-weight="700" fill="#0F766E">Surface</text>
      <ellipse cx="156" cy="256" rx="110" ry="72" fill="#FFFFFF" stroke="#0F766E" stroke-width="5"/>
      <ellipse cx="156" cy="256" rx="54" ry="28" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
      <path d="M52 260 C62 160 124 96 202 122 C254 140 282 198 266 280" fill="none" stroke="#2563EB" stroke-width="5"/>
      <circle cx="104" cy="148" r="10" fill="#2563EB"/>
      <circle cx="156" cy="256" r="10" fill="#B45309"/>
      <circle cx="254" cy="284" r="10" fill="#6D28D9"/>
      <text x="35" y="400" font-size="23" fill="#475569">saddles alter components or tunnels</text>
    </g>
    <g transform="translate(818 126)">
      <rect x="0" y="0" width="320" height="450" rx="8" fill="#FFFBEB" stroke="#B45309"/>
      <text x="24" y="42" font-size="28" font-weight="700" fill="#B45309">Ledger</text>
      <g font-size="24" fill="#111827">
        <text x="34" y="112">0.12 birth component</text>
        <text x="34" y="172">0.31 join weak pocket</text>
        <text x="34" y="232">0.57 tunnel appears</text>
        <text x="34" y="292">0.86 cap closes cavity</text>
      </g>
      <g stroke="#CBD5E1" stroke-width="2">
        <path d="M30 134H290M30 194H290M30 254H290M30 314H290"/>
      </g>
      <text x="34" y="392" font-size="23" fill="#475569">events are compared across candidate directions</text>
    </g>
  </g>
</svg>
