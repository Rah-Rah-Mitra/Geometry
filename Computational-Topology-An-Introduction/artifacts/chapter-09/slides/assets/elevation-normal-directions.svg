<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Elevation from normal directions</title>
  <desc id="desc">Protein surfaces are compared by normal-direction elevation functions, with ambiguous directions recorded as a check.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#B45309"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="44" y="58" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">Elevation Functions From Candidate Normal Directions</text>
  <g transform="translate(72 112)">
    <rect x="0" y="0" width="520" height="500" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path d="M94 314 C130 188 224 128 338 164 C456 202 462 336 378 400 C290 464 118 430 94 314Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="5"/>
    <path d="M174 278 C208 202 270 190 326 226 C384 264 356 350 284 366 C222 380 148 344 174 278Z" fill="#FFFFFF" stroke="#93C5FD" stroke-width="3"/>
    <path d="M300 184 L342 92" stroke="#2563EB" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <path d="M405 260 L500 238" stroke="#2563EB" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <path d="M182 386 L126 454" stroke="#2563EB" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <text x="46" y="466" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#475569">surface A: height h_v(p)=&lt;p,v&gt;</text>
    <text x="348" y="100" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#2563EB">v</text>
  </g>
  <g transform="translate(638 112)">
    <rect x="0" y="0" width="490" height="500" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <ellipse cx="240" cy="214" rx="148" ry="148" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    <ellipse cx="240" cy="214" rx="148" ry="48" fill="none" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M92 214 C140 156 190 130 240 66 C290 130 340 156 388 214 C340 272 290 298 240 362 C190 298 140 272 92 214Z" fill="#F0FDFA" stroke="#0F766E" stroke-width="4" opacity="0.85"/>
    <path d="M240 214 L240 66" stroke="#0F766E" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <path d="M240 214 L374 154" stroke="#B45309" stroke-width="5" marker-end="url(#arrowAmber)"/>
    <path d="M240 214 L360 272" stroke="#B45309" stroke-width="5" marker-end="url(#arrowAmber)"/>
    <path d="M374 154 C392 190 390 238 360 272" fill="none" stroke="#B45309" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="48" y="430" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#475569">ambiguous normals create competing elevation orderings</text>
    <text x="260" y="82" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#0F766E">chosen direction</text>
    <text x="310" y="318" font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#B45309">near tie</text>
  </g>
</svg>
