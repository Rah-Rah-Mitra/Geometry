<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Local homology window signatures for roots</title>
  <desc id="desc">Four toy windows around root architecture points show regular, tip, branch, and crossing signatures.</desc>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="44" y="58" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">Local Homology Windows For Root Architecture</text>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <g transform="translate(62 120)">
      <rect x="0" y="0" width="250" height="440" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="24" y="42" font-size="27" font-weight="700" fill="#1E3A8A">Regular</text>
      <circle cx="125" cy="190" r="82" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
      <path d="M58 248 L190 116" stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>
      <circle cx="125" cy="190" r="9" fill="#B45309"/>
      <text x="31" y="348" font-size="24" fill="#111827">rank signature</text>
      <text x="31" y="388" font-size="24" fill="#475569">beta0=2, beta1=0</text>
    </g>
    <g transform="translate(340 120)">
      <rect x="0" y="0" width="250" height="440" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="24" y="42" font-size="27" font-weight="700" fill="#0F766E">Tip</text>
      <circle cx="125" cy="190" r="82" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
      <path d="M125 190 L198 116" stroke="#0F766E" stroke-width="9" stroke-linecap="round"/>
      <circle cx="125" cy="190" r="9" fill="#B45309"/>
      <text x="31" y="348" font-size="24" fill="#111827">rank signature</text>
      <text x="31" y="388" font-size="24" fill="#475569">beta0=1, beta1=0</text>
    </g>
    <g transform="translate(618 120)">
      <rect x="0" y="0" width="250" height="440" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="24" y="42" font-size="27" font-weight="700" fill="#B45309">Branch</text>
      <circle cx="125" cy="190" r="82" fill="#FFFBEB" stroke="#B45309" stroke-width="4"/>
      <path d="M125 190 L62 252M125 190 L125 104M125 190 L194 256" stroke="#B45309" stroke-width="9" stroke-linecap="round"/>
      <circle cx="125" cy="190" r="9" fill="#111827"/>
      <text x="31" y="348" font-size="24" fill="#111827">rank signature</text>
      <text x="31" y="388" font-size="24" fill="#475569">beta0=3, beta1=0</text>
    </g>
    <g transform="translate(896 120)">
      <rect x="0" y="0" width="250" height="440" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="24" y="42" font-size="27" font-weight="700" fill="#6D28D9">Crossing</text>
      <circle cx="125" cy="190" r="82" fill="#F5F3FF" stroke="#6D28D9" stroke-width="4"/>
      <path d="M58 256 L192 122M58 122 L192 256" stroke="#6D28D9" stroke-width="9" stroke-linecap="round"/>
      <circle cx="125" cy="190" r="9" fill="#111827"/>
      <text x="31" y="348" font-size="24" fill="#111827">rank signature</text>
      <text x="31" y="388" font-size="24" fill="#475569">beta0=4, beta1=0</text>
    </g>
  </g>
  <text x="88" y="636" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#475569">The window sees exits through the boundary; rank changes separate tips, regular segments, and branching points.</text>
</svg>
