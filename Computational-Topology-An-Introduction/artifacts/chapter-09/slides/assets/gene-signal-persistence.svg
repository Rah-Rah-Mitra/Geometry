<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Gene signal persistence simplification</title>
  <desc id="desc">A periodic expression signal is paired into persistence intervals; small oscillations are cancelled while dominant oscillations remain.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <text x="44" y="58" font-size="32" font-weight="700" fill="#1E3A8A">Expression Signal To Persistence Features</text>
    <text x="74" y="118" font-size="24" fill="#475569">toy time course</text>
    <text x="726" y="118" font-size="24" fill="#475569">birth/death ledger</text>
  </g>
  <g transform="translate(70 130)">
    <rect x="0" y="0" width="570" height="470" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <g stroke="#E2E8F0" stroke-width="1">
      <path d="M60 70H525M60 145H525M60 220H525M60 295H525M60 370H525"/>
      <path d="M120 48V408M200 48V408M280 48V408M360 48V408M440 48V408M520 48V408"/>
    </g>
    <path d="M60 370H530" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M60 410V48" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M60 286 C100 146 135 120 176 262 C218 408 255 380 296 202 C337 40 383 70 426 226 C469 374 492 334 530 250" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
    <path d="M60 286 C100 146 135 120 176 262 C218 408 255 380 296 202 C337 40 383 70 426 226 C469 374 492 334 530 250" fill="none" stroke="#93C5FD" stroke-width="15" stroke-linecap="round" opacity="0.22"/>
    <g fill="#B45309" stroke="#FFFFFF" stroke-width="3">
      <circle cx="130" cy="135" r="10"/>
      <circle cx="250" cy="385" r="10"/>
      <circle cx="355" cy="62" r="10"/>
      <circle cx="478" cy="340" r="10"/>
    </g>
    <g stroke="#B45309" stroke-width="2" stroke-dasharray="9 8">
      <path d="M130 135H550"/>
      <path d="M250 385H550"/>
      <path d="M355 62H550"/>
      <path d="M478 340H550"/>
    </g>
    <g font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#111827">
      <text x="108" y="124">max A</text>
      <text x="220" y="418">min A</text>
      <text x="330" y="48">max B</text>
      <text x="488" y="376">min B</text>
    </g>
  </g>
  <g transform="translate(700 130)">
    <rect x="0" y="0" width="430" height="470" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="34" y="52" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#1E3A8A">Persistence pairs</text>
    <g transform="translate(40 88)" font-family="Source Sans 3, Arial, sans-serif">
      <rect x="0" y="0" width="350" height="72" rx="6" fill="#EFF6FF" stroke="#2563EB"/>
      <rect x="0" y="98" width="350" height="72" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="0" y="196" width="350" height="72" rx="6" fill="#F0FDFA" stroke="#0F766E"/>
      <text x="18" y="44" font-size="24" fill="#111827">dominant: persistence 1.42</text>
      <text x="18" y="142" font-size="24" fill="#111827">shoulder: persistence 0.18</text>
      <text x="18" y="240" font-size="24" fill="#111827">phase gap: 11.8 hours</text>
    </g>
    <g transform="translate(56 402)">
      <path d="M0 0H300" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 0H246" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 32H300" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 32H42" stroke="#B45309" stroke-width="10" stroke-linecap="round"/>
      <text x="0" y="-22" font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#475569">keep if persistence exceeds 0.30</text>
    </g>
  </g>
</svg>
