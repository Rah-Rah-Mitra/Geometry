<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Extended persistence diagram reflections</title>
  <desc id="desc">Ordinary, extended, and relative subdiagrams with main diagonal, minor diagonal, and central reflection maps.</desc>
  <rect width="1120" height="560" fill="#FFFFFF"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <text x="54" y="58" font-size="34" font-weight="700" fill="#111827">Extended persistence reflection bookkeeping</text>
    <text x="54" y="92" font-size="23" fill="#475569">The same paired critical values are reorganized as ordinary, extended, and relative points.</text>
  </g>
  <g transform="translate(74 130)" font-family="Source Sans 3, Arial, sans-serif">
    <g id="diagram1">
      <rect x="0" y="0" width="285" height="285" fill="#F8FAFC" stroke="#CBD5E1"/>
      <line x1="28" y1="258" x2="258" y2="28" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8"/>
      <circle cx="80" cy="174" r="12" fill="#2563EB"/>
      <circle cx="126" cy="106" r="12" fill="#2563EB"/>
      <circle cx="190" cy="214" r="12" fill="#94A3B8"/>
      <text x="18" y="320" font-size="25" font-weight="700" fill="#2563EB">Ord_p(f)</text>
      <text x="166" y="38" font-size="20" fill="#64748B">above diagonal</text>
    </g>
    <g transform="translate(386 0)">
      <rect x="0" y="0" width="285" height="285" fill="#F8FAFC" stroke="#CBD5E1"/>
      <line x1="28" y1="258" x2="258" y2="28" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8"/>
      <line x1="28" y1="28" x2="258" y2="258" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8 8"/>
      <circle cx="92" cy="96" r="12" fill="#0F766E"/>
      <circle cx="188" cy="190" r="12" fill="#0F766E"/>
      <circle cx="144" cy="144" r="12" fill="#B45309"/>
      <text x="18" y="320" font-size="25" font-weight="700" fill="#0F766E">Ext_p(f)</text>
      <text x="64" y="40" font-size="20" fill="#64748B">can cross diagonal</text>
    </g>
    <g transform="translate(772 0)">
      <rect x="0" y="0" width="285" height="285" fill="#F8FAFC" stroke="#CBD5E1"/>
      <line x1="28" y1="258" x2="258" y2="28" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8"/>
      <circle cx="174" cy="80" r="12" fill="#6D28D9"/>
      <circle cx="106" cy="126" r="12" fill="#6D28D9"/>
      <circle cx="214" cy="190" r="12" fill="#94A3B8"/>
      <text x="18" y="320" font-size="25" font-weight="700" fill="#6D28D9">Rel_p(f)</text>
      <text x="130" y="260" font-size="20" fill="#64748B">below diagonal</text>
    </g>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="23" fill="#111827">
    <rect x="112" y="486" width="900" height="50" rx="8" fill="#EEF2FF" stroke="#CBD5E1"/>
    <text x="138" y="519">Main diagonal: (a,b) -> (b,a). Minor diagonal for -f: (a,b) -> (-b,-a). Central: (a,b) -> (-a,-b).</text>
  </g>
</svg>
