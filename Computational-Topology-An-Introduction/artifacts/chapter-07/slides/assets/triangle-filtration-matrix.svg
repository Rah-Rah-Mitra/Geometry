<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Triangle filtration boundary matrix</title>
  <desc id="desc">A triangle filtration with dummy reduced chain element, boundary matrix, and persistence pairs marked by lowest pivots.</desc>
  <rect width="1180" height="620" fill="#FFFFFF"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <text x="42" y="58" font-size="34" font-weight="700" fill="#111827">Triangle worked example over F2</text>
    <text x="42" y="93" font-size="23" fill="#475569">Order: dummy, vertices, edges, face. Dark cells are lowest pivots after reduction.</text>
  </g>
  <g transform="translate(62 140)">
    <polygon points="130,20 34,188 226,188" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <line x1="130" y1="20" x2="130" y2="188" stroke="#0F766E" stroke-width="4"/>
    <circle cx="130" cy="20" r="13" fill="#2563EB"/>
    <circle cx="34" cy="188" r="13" fill="#2563EB"/>
    <circle cx="226" cy="188" r="13" fill="#2563EB"/>
    <g font-size="24" font-weight="700" fill="#111827">
      <text x="143" y="27">3</text>
      <text x="5" y="214">1</text>
      <text x="237" y="214">2</text>
      <text x="74" y="107" fill="#0F766E">5</text>
      <text x="173" y="107" fill="#0F766E">6</text>
      <text x="122" y="215" fill="#0F766E">4</text>
      <text x="120" y="141" fill="#B45309">7</text>
    </g>
    <rect x="0" y="246" width="268" height="124" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="18" y="282" font-size="23" font-weight="700" fill="#1E3A8A">Pairs</text>
    <text x="18" y="318" font-size="22" fill="#111827">(0,1), (2,4), (3,5), (6,7)</text>
    <text x="18" y="350" font-size="20" fill="#475569">zero column 6 births the 1-cycle</text>
  </g>
  <g transform="translate(430 120)" font-family="Source Sans 3, Arial, sans-serif">
    <text x="0" y="0" font-size="24" font-weight="700" fill="#1E3A8A">Reduced boundary matrix R</text>
    <g transform="translate(0 36)">
      <rect x="0" y="0" width="384" height="384" fill="#F8FAFC" stroke="#CBD5E1"/>
      <g stroke="#E2E8F0" stroke-width="2">
        <line x1="48" y1="0" x2="48" y2="384"/><line x1="96" y1="0" x2="96" y2="384"/>
        <line x1="144" y1="0" x2="144" y2="384"/><line x1="192" y1="0" x2="192" y2="384"/>
        <line x1="240" y1="0" x2="240" y2="384"/><line x1="288" y1="0" x2="288" y2="384"/>
        <line x1="336" y1="0" x2="336" y2="384"/>
        <line x1="0" y1="48" x2="384" y2="48"/><line x1="0" y1="96" x2="384" y2="96"/>
        <line x1="0" y1="144" x2="384" y2="144"/><line x1="0" y1="192" x2="384" y2="192"/>
        <line x1="0" y1="240" x2="384" y2="240"/><line x1="0" y1="288" x2="384" y2="288"/>
        <line x1="0" y1="336" x2="384" y2="336"/>
      </g>
      <g fill="#94A3B8">
        <rect x="54" y="6" width="36" height="36" rx="4"/>
        <rect x="198" y="102" width="36" height="36" rx="4"/>
        <rect x="246" y="150" width="36" height="36" rx="4"/>
        <rect x="342" y="294" width="36" height="36" rx="4"/>
        <rect x="246" y="54" width="36" height="36" rx="4"/>
        <rect x="342" y="198" width="36" height="36" rx="4"/>
        <rect x="342" y="246" width="36" height="36" rx="4"/>
      </g>
      <g fill="#1E3A8A">
        <rect x="54" y="6" width="36" height="36" rx="4"/>
        <rect x="198" y="102" width="36" height="36" rx="4"/>
        <rect x="246" y="150" width="36" height="36" rx="4"/>
        <rect x="342" y="294" width="36" height="36" rx="4"/>
      </g>
      <g font-size="18" fill="#475569" font-weight="700">
        <text x="17" y="-10">0</text><text x="65" y="-10">1</text><text x="113" y="-10">2</text><text x="161" y="-10">3</text>
        <text x="209" y="-10">4</text><text x="257" y="-10">5</text><text x="305" y="-10">6</text><text x="353" y="-10">7</text>
        <text x="-26" y="30">0</text><text x="-26" y="78">1</text><text x="-26" y="126">2</text><text x="-26" y="174">3</text>
        <text x="-26" y="222">4</text><text x="-26" y="270">5</text><text x="-26" y="318">6</text><text x="-26" y="366">7</text>
      </g>
    </g>
  </g>
  <g transform="translate(868 130)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="262" height="366" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="22" y="38" font-size="25" font-weight="700" fill="#1E3A8A">Diagram points</text>
    <text x="22" y="82" font-size="22" fill="#111827">Dgm -1: (0, 1)</text>
    <text x="22" y="122" font-size="22" fill="#111827">Dgm 0: (2, 4), (3, 5)</text>
    <text x="22" y="162" font-size="22" fill="#111827">Dgm 1: (6, 7)</text>
    <line x1="22" y1="194" x2="238" y2="194" stroke="#CBD5E1"/>
    <text x="22" y="235" font-size="22" fill="#475569">positive simplex:</text>
    <text x="22" y="267" font-size="22" fill="#0F766E">zero reduced column</text>
    <text x="22" y="312" font-size="22" fill="#475569">negative simplex:</text>
    <text x="22" y="344" font-size="22" fill="#B45309">nonzero pivot column</text>
  </g>
</svg>
