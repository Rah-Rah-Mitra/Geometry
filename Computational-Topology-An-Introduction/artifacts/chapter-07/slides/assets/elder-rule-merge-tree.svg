<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Elder rule merge tree</title>
  <desc id="desc">A stylized merge tree decomposed into monotone paths. Older branches continue at mergers and younger branches terminate.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1E3A8A"/>
    </marker>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="980" height="520" fill="url(#bg)"/>
  <g stroke="#E2E8F0" stroke-width="2">
    <line x1="70" y1="430" x2="920" y2="430"/>
    <line x1="70" y1="340" x2="920" y2="340"/>
    <line x1="70" y1="250" x2="920" y2="250"/>
    <line x1="70" y1="160" x2="920" y2="160"/>
    <line x1="70" y1="70" x2="920" y2="70"/>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#64748B" font-weight="700">
    <text x="30" y="436">a1</text>
    <text x="30" y="346">a2</text>
    <text x="30" y="256">a3</text>
    <text x="30" y="166">a4</text>
    <text x="30" y="76">a5</text>
    <text x="760" y="486">threshold increases upward</text>
  </g>
  <line x1="90" y1="455" x2="90" y2="62" stroke="#1E3A8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="22" y="48" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#1E3A8A" font-weight="700">f</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 430 C220 355,250 310,300 250 C338 205,375 186,420 160 C475 128,522 103,580 70" stroke="#2563EB" stroke-width="13"/>
    <path d="M410 430 C402 365,420 313,470 250 C505 206,548 185,580 160" stroke="#0F766E" stroke-width="13"/>
    <path d="M650 430 C650 350,625 300,580 250 C545 210,545 188,580 160" stroke="#B45309" stroke-width="13"/>
    <path d="M755 430 C710 354,682 300,650 250 C615 205,600 170,580 70" stroke="#6D28D9" stroke-width="13" opacity=".78"/>
  </g>
  <g fill="#FFFFFF" stroke-width="5">
    <circle cx="210" cy="430" r="14" stroke="#2563EB"/>
    <circle cx="410" cy="430" r="14" stroke="#0F766E"/>
    <circle cx="650" cy="430" r="14" stroke="#B45309"/>
    <circle cx="755" cy="430" r="14" stroke="#6D28D9"/>
    <circle cx="580" cy="160" r="16" stroke="#1E3A8A"/>
    <circle cx="580" cy="70" r="16" stroke="#1E3A8A"/>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#111827" font-weight="700">
    <text x="170" y="466">oldest birth</text>
    <text x="372" y="466">later birth</text>
    <text x="612" y="466">younger</text>
    <text x="723" y="466">younger</text>
    <text x="612" y="166">merge</text>
    <text x="606" y="76">root</text>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#475569">
    <rect x="130" y="96" width="300" height="84" rx="8" fill="#EFF6FF" stroke="#CBD5E1"/>
    <text x="152" y="130" font-weight="700" fill="#2563EB">Elder rule</text>
    <text x="152" y="162">at a merge, the older path survives</text>
    <rect x="640" y="102" width="270" height="88" rx="8" fill="#FFFBEB" stroke="#CBD5E1"/>
    <text x="664" y="136" font-weight="700" fill="#B45309">Death time</text>
    <text x="664" y="168">younger branch ends here</text>
  </g>
  <path d="M642 180 C622 180,606 172,590 162" fill="none" stroke="#B45309" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
</svg>
