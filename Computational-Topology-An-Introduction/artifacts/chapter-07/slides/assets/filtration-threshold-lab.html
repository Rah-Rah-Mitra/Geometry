<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filtration Threshold Lab</title>
  <style>
    body { margin: 24px; font-family: "Source Sans 3", Arial, sans-serif; color: #111827; background: #ffffff; }
    main { max-width: 940px; }
    h1 { font-size: 34px; margin: 0 0 8px; }
    p { font-size: 20px; line-height: 1.45; color: #475569; }
    input { width: 520px; }
    .readout { font-size: 22px; font-weight: 700; color: #1E3A8A; }
    svg { display: block; width: 760px; height: 360px; border: 1px solid #CBD5E1; border-radius: 8px; background: #F8FAFC; }
    .future { opacity: .18; }
  </style>
</head>
<body>
<main>
  <h1>Filtration Threshold Lab</h1>
  <p>Move the threshold. A simplex appears only after all of its faces have appeared, so every visible state is a subcomplex.</p>
  <label class="readout">threshold a = <span id="value">4</span></label><br>
  <input id="threshold" type="range" min="1" max="7" value="4" step="1" aria-label="filtration threshold">
  <svg viewBox="0 0 760 360" role="img" aria-label="Triangle filtration lab">
    <g id="face" data-time="7" class="future"><polygon points="380,56 214,286 546,286" fill="#2563EB" opacity=".16" stroke="#2563EB" stroke-width="4"/></g>
    <g id="e4" data-time="4" class="future"><line x1="214" y1="286" x2="546" y2="286" stroke="#0F766E" stroke-width="8" stroke-linecap="round"/></g>
    <g id="e5" data-time="5" class="future"><line x1="214" y1="286" x2="380" y2="56" stroke="#0F766E" stroke-width="8" stroke-linecap="round"/></g>
    <g id="e6" data-time="6" class="future"><line x1="546" y1="286" x2="380" y2="56" stroke="#0F766E" stroke-width="8" stroke-linecap="round"/></g>
    <g id="v1" data-time="1" class="future"><circle cx="214" cy="286" r="18" fill="#2563EB"/><text x="186" y="326" font-size="24" font-weight="700" fill="#111827">1</text></g>
    <g id="v2" data-time="2" class="future"><circle cx="546" cy="286" r="18" fill="#2563EB"/><text x="548" y="326" font-size="24" font-weight="700" fill="#111827">2</text></g>
    <g id="v3" data-time="3" class="future"><circle cx="380" cy="56" r="18" fill="#2563EB"/><text x="390" y="48" font-size="24" font-weight="700" fill="#111827">3</text></g>
    <text id="status" x="28" y="48" font-size="24" font-weight="700" fill="#1E3A8A">K(4): two components, no 1-cycle</text>
  </svg>
</main>
<script>
  const slider = document.getElementById("threshold");
  const value = document.getElementById("value");
  const status = document.getElementById("status");
  const messages = {
    1: "K(1): one vertex",
    2: "K(2): two components",
    3: "K(3): three components",
    4: "K(4): two components, no 1-cycle",
    5: "K(5): one component, no 1-cycle",
    6: "K(6): one component, one 1-cycle",
    7: "K(7): filled triangle, no 1-cycle"
  };
  function update() {
    const t = Number(slider.value);
    value.textContent = String(t);
    status.textContent = messages[t];
    document.querySelectorAll("[data-time]").forEach((node) => {
      node.classList.toggle("future", Number(node.dataset.time) > t);
    });
  }
  slider.addEventListener("input", update);
  update();
</script>
</body>
</html>
