<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Lower and upper star block matrix</title>
  <desc id="desc">A block matrix for extended persistence with lower-star ascending matrix A, permutation block P, zero block, and upper-star descending matrix B.</desc>
  <rect width="1120" height="560" fill="#FFFFFF"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <text x="54" y="58" font-size="34" font-weight="700" fill="#111827">Lower-star / upper-star block matrix</text>
    <text x="54" y="92" font-size="23" fill="#475569">Ascending ordinary pairs, coning extended pairs, descending relative pairs in one reduction.</text>
  </g>
  <g transform="translate(118 130)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="360" height="360" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="0" y="0" width="180" height="180" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <rect x="180" y="0" width="180" height="180" fill="#F5F3FF" stroke="#6D28D9" stroke-width="4"/>
    <rect x="0" y="180" width="180" height="180" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="180" y="180" width="180" height="180" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="70" y="98" font-size="54" font-weight="700" fill="#2563EB">A</text>
    <text x="250" y="98" font-size="54" font-weight="700" fill="#6D28D9">P</text>
    <text x="72" y="278" font-size="54" font-weight="700" fill="#94A3B8">0</text>
    <text x="250" y="278" font-size="54" font-weight="700" fill="#0F766E">B</text>
    <g font-size="21" fill="#475569" font-weight="700">
      <text x="-80" y="34">St- v1</text><text x="-82" y="166">St- vn</text><text x="-82" y="222">St+ vn</text><text x="-80" y="352">St+ v1</text>
      <text x="16" y="-22">St- v1</text><text x="130" y="-22">St- vn</text><text x="210" y="-22">St+ vn</text><text x="318" y="-22">St+ v1</text>
    </g>
  </g>
  <g transform="translate(590 142)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="0" width="420" height="330" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="28" y="46" font-size="25" font-weight="700" fill="#1E3A8A">Quadrant interpretation</text>
    <text x="28" y="92" font-size="23" fill="#111827">A: ordinary subdiagram</text>
    <text x="28" y="132" font-size="23" fill="#111827">P: extended subdiagram</text>
    <text x="28" y="172" font-size="23" fill="#111827">B: relative subdiagram</text>
    <line x1="28" y1="200" x2="392" y2="200" stroke="#CBD5E1"/>
    <text x="28" y="242" font-size="23" fill="#475569">The cone kills every essential</text>
    <text x="28" y="278" font-size="23" fill="#475569">class, so all births are paired.</text>
  </g>
</svg>
