<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Sparse list reduction</title>
  <desc id="desc">A sparse persistence implementation represented as lists moving from right to left after collisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1E3A8A"/>
    </marker>
  </defs>
  <rect width="1080" height="520" fill="#FFFFFF"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <text x="58" y="58" font-size="34" font-weight="700" fill="#111827">Sparse implementation: columns become lists</text>
    <text x="58" y="92" font-size="23" fill="#475569">A collision at top(L) adds an older reduced list; duplicates cancel over F2.</text>
  </g>
  <g transform="translate(76 150)" font-family="Source Sans 3, Arial, sans-serif">
    <g fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2">
      <rect x="0" y="0" width="72" height="72"/><rect x="72" y="0" width="72" height="72"/><rect x="144" y="0" width="72" height="72"/>
      <rect x="216" y="0" width="72" height="72"/><rect x="288" y="0" width="72" height="72"/><rect x="360" y="0" width="72" height="72"/>
      <rect x="432" y="0" width="72" height="72"/><rect x="504" y="0" width="72" height="72"/><rect x="576" y="0" width="72" height="72"/>
      <rect x="648" y="0" width="72" height="72"/>
    </g>
    <g font-size="22" font-weight="700" fill="#64748B">
      <text x="28" y="46">1</text><text x="100" y="46">2</text><text x="172" y="46">i</text><text x="244" y="46">k</text>
      <text x="316" y="46">l</text><text x="388" y="46">j</text><text x="460" y="46">.</text><text x="532" y="46">.</text><text x="604" y="46">.</text><text x="674" y="46">m</text>
    </g>
    <g stroke="#1E3A8A" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M396 94 C362 130,316 142,248 148" marker-end="url(#arrow)"/>
      <path d="M248 182 C218 222,178 234,110 240" marker-end="url(#arrow)" stroke="#0F766E"/>
    </g>
    <g fill="#EFF6FF" stroke="#2563EB" stroke-width="2">
      <rect x="378" y="102" width="52" height="156" rx="8"/>
      <rect x="230" y="156" width="52" height="126" rx="8"/>
      <rect x="88" y="250" width="52" height="92" rx="8"/>
    </g>
    <g font-size="21" font-weight="700" fill="#111827" text-anchor="middle">
      <text x="404" y="136">w</text><text x="404" y="178">v</text><text x="404" y="220">u</text>
      <text x="256" y="194">v</text><text x="256" y="236">u</text>
      <text x="114" y="288">u</text><text x="114" y="326">r</text>
    </g>
    <rect x="560" y="134" width="360" height="182" rx="8" fill="#FFFBEB" stroke="#CBD5E1"/>
    <text x="586" y="176" font-size="24" font-weight="700" fill="#B45309">Collision invariant</text>
    <text x="586" y="214" font-size="22" fill="#111827">top index strictly decreases</text>
    <text x="586" y="250" font-size="22" fill="#111827">work is charged to nested</text>
    <text x="586" y="286" font-size="22" fill="#111827">birth-death intervals</text>
  </g>
</svg>
