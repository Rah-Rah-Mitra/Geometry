<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Spectral sequence rank grid</title>
  <desc id="desc">A spectral sequence grid showing vertical, horizontal, and diagonal phase maps with rank counts matching persistence at least r.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1E3A8A"/>
    </marker>
  </defs>
  <rect width="1120" height="560" fill="#FFFFFF"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <text x="54" y="58" font-size="34" font-weight="700" fill="#111827">Spectral sequence summary</text>
    <text x="54" y="92" font-size="23" fill="#475569">Diagonal matrix phases reorganize the same persistence pairs by increasing index persistence.</text>
  </g>
  <g transform="translate(94 136)" font-family="Source Sans 3, Arial, sans-serif">
    <g stroke="#CBD5E1" stroke-width="2" fill="#F8FAFC">
      <rect x="0" y="0" width="96" height="70" rx="6"/><rect x="110" y="0" width="96" height="70" rx="6"/><rect x="220" y="0" width="96" height="70" rx="6"/><rect x="330" y="0" width="96" height="70" rx="6"/><rect x="440" y="0" width="96" height="70" rx="6"/>
      <rect x="0" y="88" width="96" height="70" rx="6"/><rect x="110" y="88" width="96" height="70" rx="6"/><rect x="220" y="88" width="96" height="70" rx="6"/><rect x="330" y="88" width="96" height="70" rx="6"/><rect x="440" y="88" width="96" height="70" rx="6"/>
      <rect x="0" y="176" width="96" height="70" rx="6"/><rect x="110" y="176" width="96" height="70" rx="6"/><rect x="220" y="176" width="96" height="70" rx="6"/><rect x="330" y="176" width="96" height="70" rx="6"/><rect x="440" y="176" width="96" height="70" rx="6"/>
      <rect x="0" y="264" width="96" height="70" rx="6"/><rect x="110" y="264" width="96" height="70" rx="6"/><rect x="220" y="264" width="96" height="70" rx="6"/><rect x="330" y="264" width="96" height="70" rx="6"/><rect x="440" y="264" width="96" height="70" rx="6"/>
    </g>
    <g font-size="21" text-anchor="middle" fill="#111827" font-weight="700">
      <text x="48" y="42">E0</text><text x="158" y="42">E0</text><text x="268" y="42">E0</text><text x="378" y="42">E0</text><text x="488" y="42">E0</text>
      <text x="48" y="130">E1</text><text x="158" y="130">E1</text><text x="268" y="130">E1</text><text x="378" y="130">E1</text><text x="488" y="130">E1</text>
      <text x="48" y="218">E2</text><text x="158" y="218">E2</text><text x="268" y="218">E2</text><text x="378" y="218">E2</text><text x="488" y="218">E2</text>
      <text x="48" y="306">Einf</text><text x="158" y="306">Einf</text><text x="268" y="306">Einf</text><text x="378" y="306">Einf</text><text x="488" y="306">Einf</text>
    </g>
    <path d="M48 70 L48 88" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M488 123 L426 123" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M488 211 C414 190,382 170,316 158" stroke="#B45309" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="584" y="60" font-size="24" font-weight="700" fill="#2563EB">r = 0: vertical homology</text>
    <text x="584" y="114" font-size="24" font-weight="700" fill="#0F766E">r = 1: horizontal maps</text>
    <text x="584" y="168" font-size="24" font-weight="700" fill="#B45309">r = 2: two-left, one-up</text>
    <rect x="584" y="212" width="410" height="132" rx="8" fill="#EEF2FF" stroke="#CBD5E1"/>
    <text x="610" y="254" font-size="24" font-weight="700" fill="#1E3A8A">Rank tracker</text>
    <text x="610" y="292" font-size="22" fill="#111827">sum rank E_r along dimension d</text>
    <text x="610" y="328" font-size="22" fill="#111827">= # diagram points with persistence >= r</text>
  </g>
</svg>
