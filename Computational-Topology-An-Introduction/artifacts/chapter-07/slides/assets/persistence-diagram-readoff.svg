<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Persistence diagram read-off</title>
  <desc id="desc">A persistence diagram with a shaded upper-left quadrant used to read a persistent Betti number.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <pattern id="diagDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#CBD5E1"/>
    </pattern>
  </defs>
  <rect width="980" height="520" fill="#FFFFFF"/>
  <rect x="122" y="58" width="660" height="360" fill="url(#diagDots)" opacity=".35"/>
  <line x1="128" y1="422" x2="818" y2="422" stroke="#475569" stroke-width="4" marker-end="url(#axisArrow)"/>
  <line x1="128" y1="422" x2="128" y2="44" stroke="#475569" stroke-width="4" marker-end="url(#axisArrow)"/>
  <line x1="138" y1="412" x2="720" y2="68" stroke="#94A3B8" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="744" y="85" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#64748B" font-weight="700">death = birth</text>
  <rect x="128" y="90" width="405" height="198" fill="#2563EB" opacity=".10" stroke="#2563EB" stroke-width="3"/>
  <line x1="533" y1="90" x2="533" y2="422" stroke="#2563EB" stroke-width="4"/>
  <line x1="128" y1="288" x2="818" y2="288" stroke="#2563EB" stroke-width="4" stroke-dasharray="10 10"/>
  <circle cx="268" cy="196" r="16" fill="#2563EB"/>
  <circle cx="384" cy="160" r="16" fill="#0F766E"/>
  <circle cx="492" cy="258" r="16" fill="#B45309"/>
  <circle cx="604" cy="226" r="16" fill="#6D28D9"/>
  <circle cx="352" cy="326" r="16" fill="#94A3B8"/>
  <circle cx="570" cy="132" r="16" fill="#2563EB" opacity=".45"/>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#111827" font-weight="700">
    <text x="795" y="464">birth</text>
    <text x="50" y="56">death</text>
    <text x="510" y="458">a_k</text>
    <text x="76" y="296">a_l</text>
    <text x="196" y="78" fill="#1E3A8A">count points in this quadrant</text>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="22" fill="#475569">
    <text x="178" y="472">closed on birth side: birth <= a_k</text>
    <text x="576" y="316">open on death side: death > a_l</text>
    <text x="690" y="386">not counted</text>
  </g>
  <path d="M602 300 C635 316,658 340,685 370" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#axisArrow)"/>
  <rect x="720" y="156" width="205" height="104" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="742" y="192" font-family="Source Sans 3, Arial, sans-serif" font-size="24" fill="#1E3A8A" font-weight="700">Formula</text>
  <text x="742" y="230" font-family="STIX Two Text, Georgia, serif" font-size="28" fill="#111827">beta(k,l) = # quadrant</text>
</svg>
