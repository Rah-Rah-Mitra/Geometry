<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc">
  <title id="title">Axiom dependency graph for Chow products</title>
  <desc id="desc">A directed graph showing how rational equivalence, moving lemma, pushforward, pullback, diagonal, projection formula, and local multiplicity feed the Chow ring product.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1260" height="640" fill="#ffffff"/>
  <g stroke="#cbd5e1" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M206 160 C330 120, 446 126, 560 194"/>
    <path d="M206 308 C324 318, 432 294, 560 246"/>
    <path d="M206 456 C330 502, 448 468, 560 302"/>
    <path d="M700 248 H862"/>
    <path d="M1000 248 C1088 248, 1120 318, 1040 394"/>
    <path d="M874 414 C748 438, 688 386, 658 320"/>
    <path d="M560 500 C596 434, 610 372, 612 322"/>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700">
    <rect x="58" y="102" width="236" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="88" y="143" fill="#1e3a8a">rational</text>
    <text x="88" y="174" fill="#1e3a8a">equivalence</text>
    <rect x="58" y="260" width="236" height="94" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
    <text x="87" y="303" fill="#0f766e">moving lemma</text>
    <text x="87" y="334" fill="#0f766e">proper meeting</text>
    <rect x="58" y="418" width="236" height="94" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <text x="87" y="461" fill="#92400e">Tor local</text>
    <text x="87" y="492" fill="#92400e">multiplicity</text>
    <rect x="520" y="190" width="220" height="126" rx="8" fill="#eef2ff" stroke="#1e3a8a" stroke-width="4"/>
    <text x="572" y="235" fill="#1e3a8a">product</text>
    <text x="554" y="268" fill="#1e3a8a">in A(X)</text>
    <text x="553" y="300" fill="#475569" font-size="22">codim adds</text>
    <rect x="848" y="190" width="216" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="894" y="234" fill="#475569">diagonal</text>
    <text x="880" y="267" fill="#475569">pullback</text>
    <rect x="840" y="370" width="260" height="104" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    <text x="884" y="413" fill="#475569">projection</text>
    <text x="884" y="446" fill="#475569">formula</text>
    <rect x="480" y="472" width="274" height="92" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
    <text x="517" y="513" fill="#6d28d9">push / pull</text>
    <text x="517" y="544" fill="#6d28d9">functoriality</text>
  </g>
  <text x="78" y="594" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#475569">Chow multiplication is a compatibility theorem: movement, local algebra, and functorial maps must agree.</text>
</svg>
