<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc">
  <title id="title">Self-intersection through the normal bundle</title>
  <desc id="desc">A schematic of a subvariety Y inside X with normal directions and the formula i star i lower star of one equals the top Chern class of the normal bundle.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="1260" height="640" fill="#ffffff"/>
  <rect x="54" y="70" width="624" height="480" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="82" y="122" font-family="Source Sans 3, Arial, sans-serif" font-size="35" font-weight="700" fill="#1e3a8a">Geometry inside X</text>
  <ellipse cx="362" cy="334" rx="236" ry="126" fill="url(#surface)" stroke="#2563eb" stroke-width="5"/>
  <path d="M160 342 C250 270, 384 264, 542 324" fill="none" stroke="#0f766e" stroke-width="8"/>
  <path d="M238 304 L208 238" stroke="#b45309" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M352 286 L352 210" stroke="#b45309" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M476 304 L526 238" stroke="#b45309" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="140" y="422" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f766e">Y</text>
  <text x="514" y="446" font-family="Source Sans 3, Arial, sans-serif" font-size="28" font-weight="700" fill="#2563eb">X</text>
  <text x="300" y="204" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#92400e">normal directions</text>
  <g transform="translate(744 94)">
    <rect x="0" y="0" width="444" height="410" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="30" y="60" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">Self-intersection recipe</text>
    <line x1="42" y1="104" x2="384" y2="104" stroke="#e2e8f0" stroke-width="3"/>
    <text x="42" y="158" font-family="STIX Two Text, Georgia, serif" font-size="35" fill="#111827">i: Y -> X</text>
    <text x="42" y="220" font-family="STIX Two Text, Georgia, serif" font-size="35" fill="#111827">N = normal bundle</text>
    <text x="42" y="292" font-family="STIX Two Text, Georgia, serif" font-size="38" fill="#111827">i* i<tspan baseline-shift="sub" font-size="27">*</tspan>(1) = c<tspan baseline-shift="sub" font-size="27">r</tspan>(N)</text>
    <rect x="42" y="330" width="350" height="48" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="62" y="362" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f766e">top Chern class is the obstruction</text>
  </g>
  <path d="M676 334 H732" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="92" y="594" font-family="Source Sans 3, Arial, sans-serif" font-size="26" font-weight="700" fill="#475569">Pull the pushed fundamental class back to Y, and the normal bundle records the excess self-meeting.</text>
</svg>
