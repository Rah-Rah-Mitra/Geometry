<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc">
  <title id="title">Exit map from intersection theory to complements</title>
  <desc id="desc">A branching map from Chow rings and HRR to positivity, Hodge index, Grothendieck Riemann Roch, and singular variants.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1260" height="640" fill="#ffffff"/>
  <rect x="472" y="238" width="316" height="126" rx="10" fill="#eef2ff" stroke="#1e3a8a" stroke-width="4"/>
  <text x="526" y="287" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">Chow + Chern</text>
  <text x="534" y="326" font-family="Source Sans 3, Arial, sans-serif" font-size="27" font-weight="700" fill="#475569">top-degree HRR</text>
  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M480 264 C338 164, 258 134, 150 126"/>
    <path d="M486 342 C348 444, 246 496, 138 516"/>
    <path d="M788 264 C924 152, 1028 116, 1142 122"/>
    <path d="M784 342 C918 448, 1014 494, 1140 514"/>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-weight="700">
    <rect x="48" y="70" width="344" height="120" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
    <text x="82" y="116" font-size="30" fill="#0f766e">positivity</text>
    <text x="82" y="154" font-size="25" fill="#475569">Nakai-Moishezon: D^r.Y &gt; 0</text>
    <rect x="48" y="456" width="344" height="120" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <text x="82" y="502" font-size="30" fill="#92400e">Hodge sign</text>
    <text x="82" y="540" font-size="25" fill="#475569">(-1)^k Y^2 &gt; 0 after primitivity</text>
    <rect x="868" y="70" width="344" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="902" y="116" font-size="30" fill="#1e3a8a">GRR</text>
    <text x="902" y="154" font-size="25" fill="#475569">ch(f!x)=f*(ch(x)td(Tf))</text>
    <rect x="868" y="456" width="344" height="120" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
    <text x="902" y="502" font-size="30" fill="#6d28d9">singular variants</text>
    <text x="902" y="540" font-size="25" fill="#475569">new hypotheses, same bookkeeping</text>
  </g>
  <text x="170" y="618" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#475569">The appendix is an entrance ramp: once cycles can be multiplied, ampleness, signs, and functorial RR become visible.</text>
</svg>
