<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc">
  <title id="title">Naive and Tor-corrected local intersection multiplicity</title>
  <desc id="desc">A two-panel schematic comparing a naive quotient length with the alternating Tor correction for local intersection multiplicity.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#64748b"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1260" height="640" fill="#ffffff"/>
  <rect x="42" y="52" width="540" height="504" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
  <rect x="678" y="52" width="540" height="504" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="74" y="105" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#92400e">Naive length can miscount</text>
  <text x="710" y="105" font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">Tor resolves the excess</text>
  <g transform="translate(84 144)">
    <rect x="0" y="0" width="456" height="270" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40 212 C108 120, 186 94, 286 124 C346 142, 392 108, 430 48" fill="none" stroke="#2563eb" stroke-width="8"/>
    <path d="M56 56 C126 126, 182 170, 254 180 C326 190, 382 216, 424 242" fill="none" stroke="#0f766e" stroke-width="8"/>
    <ellipse cx="248" cy="176" rx="58" ry="28" fill="#b45309" fill-opacity="0.13" stroke="#b45309" stroke-width="4" stroke-dasharray="10 8"/>
    <circle cx="248" cy="176" r="9" fill="#b45309"/>
    <text x="60" y="249" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#2563eb">A/a</text>
    <text x="348" y="70" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f766e">A/b</text>
    <text x="190" y="144" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">embedded overlap</text>
  </g>
  <g transform="translate(84 442)">
    <rect x="0" y="0" width="456" height="70" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
    <text x="24" y="44" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">length<tspan baseline-shift="sub" font-size="23">A</tspan>(A/(a+b))</text>
  </g>
  <g transform="translate(720 144)">
    <rect x="0" y="0" width="456" height="270" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40 212 C108 120, 186 94, 286 124 C346 142, 392 108, 430 48" fill="none" stroke="#2563eb" stroke-width="8"/>
    <path d="M56 56 C126 126, 182 170, 254 180 C326 190, 382 216, 424 242" fill="none" stroke="#0f766e" stroke-width="8"/>
    <circle cx="248" cy="176" r="11" fill="#1e3a8a"/>
    <circle cx="248" cy="176" r="52" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="4"/>
    <path d="M138 224 L212 188" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="34" y="244" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#475569">free resolution</text>
    <text x="284" y="164" font-family="Source Sans 3, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">local term</text>
  </g>
  <g transform="translate(720 442)">
    <rect x="0" y="0" width="456" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="22" y="44" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">sum<tspan baseline-shift="sub" font-size="22">i</tspan> (-1)<tspan baseline-shift="super" font-size="22">i</tspan> length Tor<tspan baseline-shift="sub" font-size="21">i</tspan><tspan font-size="24">(A/a,A/b)</tspan></text>
  </g>
  <path d="M596 300 H658" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="500" y="604" font-family="Source Sans 3, Arial, sans-serif" font-size="25" font-weight="700" fill="#475569">The corrected term is local, algebraic, and stable under the axioms.</text>
</svg>
