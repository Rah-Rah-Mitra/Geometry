<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 640" role="img" aria-labelledby="title desc">
  <title id="title">Morphisms reverse rings</title>
  <desc id="desc">A ring map A to B induces a scheme morphism Spec B to Spec A.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563EB"/>
    </marker>
    <marker id="tealArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="590" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="34" font-weight="700">
    <rect x="155" y="115" width="420" height="150" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="365" y="178" text-anchor="middle" fill="#2563EB">rings</text>
    <text x="365" y="226" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" fill="#111827">A -> B</text>
    <path d="M590 190 H910" stroke="#2563EB" stroke-width="6" marker-end="url(#blueArrow)"/>
    <rect x="925" y="115" width="420" height="150" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="1135" y="178" text-anchor="middle" fill="#2563EB">algebra map</text>
    <text x="1135" y="226" text-anchor="middle" font-size="28" fill="#475569">functions pull back</text>
    <rect x="155" y="365" width="420" height="150" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="365" y="428" text-anchor="middle" fill="#0F766E">schemes</text>
    <text x="365" y="476" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" fill="#111827">Spec B -> Spec A</text>
    <path d="M910 440 H590" stroke="#0F766E" stroke-width="6" marker-end="url(#tealArrow)"/>
    <rect x="925" y="365" width="420" height="150" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="1135" y="428" text-anchor="middle" fill="#0F766E">point map</text>
    <text x="1135" y="476" text-anchor="middle" font-size="28" fill="#475569">q maps to preimage in A</text>
  </g>
  <text x="750" y="318" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="40" fill="#1E3A8A">Hom(Spec B, Spec A) = Hom(A, B)</text>
</svg>
