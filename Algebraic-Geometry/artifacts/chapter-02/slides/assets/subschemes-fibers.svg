<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Subschemes products and fibers</title>
  <desc id="desc">Closed subscheme from quotient A/I and a fiber product square.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="670" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <rect x="90" y="105" width="570" height="500" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="375" y="165" text-anchor="middle" font-size="34" font-weight="700" fill="#2563EB">Closed Subscheme</text>
    <rect x="185" y="260" width="380" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <text x="375" y="330" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="38" fill="#111827">Spec(A/I)</text>
    <path d="M375 390 V465" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="185" y="480" width="380" height="80" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <text x="375" y="533" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="36" fill="#111827">Spec A</text>
    <text x="375" y="220" text-anchor="middle" font-size="26" fill="#475569">ideal I cuts functions, not only points</text>
    <rect x="840" y="105" width="570" height="500" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="1125" y="165" text-anchor="middle" font-size="34" font-weight="700" fill="#0F766E">Fiber Product Square</text>
    <g font-family="STIX Two Text, Georgia, serif" font-size="36" fill="#111827">
      <text x="975" y="280" text-anchor="middle">X x_S Y</text>
      <text x="1265" y="280" text-anchor="middle">Y</text>
      <text x="975" y="500" text-anchor="middle">X</text>
      <text x="1265" y="500" text-anchor="middle">S</text>
    </g>
    <path d="M1040 270 H1195" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M975 300 V440" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1040 490 H1195" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1265 300 V440" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="1125" y="588" text-anchor="middle" font-size="26" fill="#475569">pull two families over the same base</text>
  </g>
</svg>
