<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Differentials and cusp relation</title>
  <desc id="desc">Universal derivation identity with a worked differential relation for y squared minus x cubed.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="670" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <g transform="translate(110 95)">
    <rect x="0" y="0" width="560" height="520" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    <g transform="translate(72 55)">
      <line x1="40" y1="350" x2="420" y2="350" stroke="#CBD5E1" stroke-width="3"/>
      <line x1="90" y1="395" x2="90" y2="35" stroke="#CBD5E1" stroke-width="3"/>
      <path d="M91 350 C110 349, 139 340, 168 313 C222 263, 250 213, 300 145 C328 107, 362 74, 412 58" fill="none" stroke="#2563EB" stroke-width="8"/>
      <circle cx="210" cy="275" r="12" fill="#B45309"/>
      <text x="232" y="268" font-family="Source Sans 3, Arial" font-size="26" fill="#111827">(1,1)</text>
      <path d="M175 306 L280 228" stroke="#0F766E" stroke-width="5" stroke-dasharray="10 8"/>
      <text x="40" y="30" font-family="Source Sans 3, Arial" font-size="27" font-weight="700" fill="#2563EB">y^2 = x^3</text>
    </g>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <rect x="760" y="105" width="610" height="170" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="1065" y="162" text-anchor="middle" font-size="32" font-weight="700" fill="#2563EB">Universal Property</text>
    <text x="1065" y="226" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="37" fill="#111827">Der_A(B,M) = Hom_B(Omega_{B/A}, M)</text>
    <rect x="760" y="335" width="610" height="245" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="1065" y="392" text-anchor="middle" font-size="32" font-weight="700" fill="#0F766E">Relation Check</text>
    <text x="1065" y="452" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="36" fill="#111827">d(y^2 - x^3) = 2y dy - 3x^2 dx</text>
    <path d="M1065 470 V502" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="1065" y="548" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="36" fill="#111827">at (1,1): -3 dx + 2 dy = 0</text>
  </g>
</svg>
