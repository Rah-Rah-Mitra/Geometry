<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Scheme theoretic grammar proof pattern</title>
  <desc id="desc">A cycle of local affine checks, gluing, and invariant preservation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="600" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <circle cx="750" cy="325" r="210" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="160" y="245" width="330" height="160" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="325" y="305" text-anchor="middle" font-size="31" font-weight="700" fill="#2563EB">1. Affine Check</text>
    <text x="325" y="356" text-anchor="middle" font-size="26" fill="#111827">compute on Spec A</text>
    <rect x="585" y="88" width="330" height="160" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="750" y="148" text-anchor="middle" font-size="31" font-weight="700" fill="#0F766E">2. Sheaf Glue</text>
    <text x="750" y="199" text-anchor="middle" font-size="26" fill="#111827">match on overlaps</text>
    <rect x="1010" y="245" width="330" height="160" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="4"/>
    <text x="1175" y="305" text-anchor="middle" font-size="31" font-weight="700" fill="#6D28D9">3. Preserve</text>
    <text x="1175" y="356" text-anchor="middle" font-size="26" fill="#111827">invariant survives maps</text>
    <rect x="585" y="440" width="330" height="130" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="4"/>
    <text x="750" y="493" text-anchor="middle" font-size="31" font-weight="700" fill="#B45309">4. Global Claim</text>
    <text x="750" y="538" text-anchor="middle" font-size="25" fill="#111827">independent of cover</text>
    <path d="M490 292 C545 215, 565 178, 585 168" stroke="#1E3A8A" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <path d="M915 168 C985 195, 1015 240, 1010 292" stroke="#1E3A8A" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <path d="M1120 410 C1022 510, 965 522, 915 505" stroke="#1E3A8A" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <path d="M585 505 C488 500, 430 445, 405 405" stroke="#1E3A8A" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <text x="750" y="325" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="38" fill="#1E3A8A">local-to-global grammar</text>
  </g>
</svg>
