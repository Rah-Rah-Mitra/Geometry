<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Separatedness and the diagonal</title>
  <desc id="desc">Doubled origin as a non-separated failure and diagonal closed immersion as the remedy.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="670" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <rect x="80" y="95" width="610" height="520" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="4"/>
    <text x="385" y="155" text-anchor="middle" font-size="34" font-weight="700" fill="#B45309">Doubled Origin Failure</text>
    <line x1="160" y1="340" x2="610" y2="340" stroke="#1E3A8A" stroke-width="7"/>
    <line x1="160" y1="435" x2="610" y2="435" stroke="#1E3A8A" stroke-width="7"/>
    <circle cx="385" cy="340" r="18" fill="#FFFFFF" stroke="#B45309" stroke-width="6"/>
    <circle cx="385" cy="435" r="18" fill="#FFFFFF" stroke="#B45309" stroke-width="6"/>
    <text x="432" y="322" font-size="28" fill="#111827">0_a</text>
    <text x="432" y="466" font-size="28" fill="#111827">0_b</text>
    <path d="M220 340 C320 280, 450 280, 550 340" fill="none" stroke="#0F766E" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M220 435 C320 495, 450 495, 550 435" fill="none" stroke="#0F766E" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="385" y="540" text-anchor="middle" font-size="27" fill="#111827">two origins cannot be separated by the diagonal</text>
    <rect x="810" y="95" width="610" height="520" rx="14" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="4"/>
    <text x="1115" y="155" text-anchor="middle" font-size="34" font-weight="700" fill="#1E3A8A">Separated Criterion</text>
    <rect x="928" y="245" width="360" height="270" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M960 485 L1255 265" stroke="#2563EB" stroke-width="8"/>
    <circle cx="1022" cy="438" r="13" fill="#2563EB"/>
    <circle cx="1145" cy="345" r="13" fill="#2563EB"/>
    <text x="1108" y="560" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="36" fill="#111827">Delta_X : X -> X x_S X</text>
    <path d="M1110 218 V245" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="1115" y="205" text-anchor="middle" font-size="27" fill="#475569">closed image controls uniqueness</text>
  </g>
</svg>
