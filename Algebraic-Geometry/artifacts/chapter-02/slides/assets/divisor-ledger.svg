<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Divisor ledger</title>
  <desc id="desc">A ledger connecting Weil divisors, principal divisors, Cartier data, Picard classes, and degree zero check.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="670" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <rect x="92" y="95" width="300" height="160" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="242" y="152" text-anchor="middle" font-size="31" font-weight="700" fill="#2563EB">Weil</text>
    <text x="242" y="205" text-anchor="middle" font-size="25" fill="#111827">sum n_Z [Z]</text>
    <rect x="445" y="95" width="300" height="160" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="595" y="152" text-anchor="middle" font-size="31" font-weight="700" fill="#0F766E">Principal</text>
    <text x="595" y="205" text-anchor="middle" font-size="25" fill="#111827">div(f)</text>
    <rect x="798" y="95" width="300" height="160" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="4"/>
    <text x="948" y="152" text-anchor="middle" font-size="31" font-weight="700" fill="#B45309">Cartier</text>
    <text x="948" y="205" text-anchor="middle" font-size="25" fill="#111827">local equations</text>
    <rect x="1151" y="95" width="300" height="160" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="4"/>
    <text x="1301" y="152" text-anchor="middle" font-size="31" font-weight="700" fill="#6D28D9">Pic</text>
    <text x="1301" y="205" text-anchor="middle" font-size="25" fill="#111827">line bundles</text>
    <path d="M397 175 H430" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M750 175 H783" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1103 175 H1136" stroke="#1E3A8A" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="190" y="355" width="1120" height="230" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="230" y1="425" x2="1270" y2="425" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="230" y1="495" x2="1270" y2="495" stroke="#CBD5E1" stroke-width="3"/>
    <text x="280" y="400" font-size="27" font-weight="700" fill="#1E3A8A">toy check on P1</text>
    <text x="300" y="470" font-family="STIX Two Text, Georgia, serif" font-size="34" fill="#111827">div(t) = [0] - [infinity]</text>
    <text x="300" y="540" font-family="STIX Two Text, Georgia, serif" font-size="34" fill="#111827">deg div(t) = 1 - 1 = 0</text>
    <text x="1040" y="540" font-size="28" font-weight="700" fill="#0F766E">principal divisor degree zero</text>
  </g>
</svg>
