<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Projective morphisms from sections</title>
  <desc id="desc">Global sections of an invertible sheaf define a map to projective space away from base points.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
    <marker id="amberArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#B45309"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="670" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <rect x="95" y="135" width="390" height="190" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="290" y="198" text-anchor="middle" font-size="32" font-weight="700" fill="#2563EB">invertible sheaf</text>
    <text x="290" y="255" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="38" fill="#111827">L, sections s_0,...,s_n</text>
    <path d="M500 230 H715" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="730" y="135" width="300" height="190" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="880" y="198" text-anchor="middle" font-size="32" font-weight="700" fill="#0F766E">map</text>
    <text x="880" y="255" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="38" fill="#111827">X -> P^n</text>
    <path d="M1045 230 H1260" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="1275" y="135" width="155" height="190" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="4"/>
    <text x="1352" y="198" text-anchor="middle" font-size="30" font-weight="700" fill="#1E3A8A">coords</text>
    <text x="1352" y="255" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="34" fill="#111827">[s_i]</text>
    <rect x="165" y="445" width="470" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <text x="400" y="507" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="37" fill="#111827">D_+(f) = Spec S_(f)</text>
    <text x="400" y="552" text-anchor="middle" font-size="26" fill="#475569">affine chart in projective space</text>
    <rect x="865" y="445" width="470" height="150" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="4"/>
    <text x="1100" y="507" text-anchor="middle" font-size="31" font-weight="700" fill="#B45309">base-point failure</text>
    <text x="1100" y="552" text-anchor="middle" font-size="26" fill="#111827">all sections vanish, no projective coordinate</text>
    <path d="M780 522 H850" stroke="#B45309" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#amberArrow)"/>
  </g>
</svg>
