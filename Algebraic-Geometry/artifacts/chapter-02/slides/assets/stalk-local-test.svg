<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Stalk local test diagram</title>
  <desc id="desc">Nested neighborhoods around a point feed a directed colimit stalk, then a stalkwise isomorphism test.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
    <marker id="tealArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="670" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <g transform="translate(110 100)">
    <ellipse cx="260" cy="250" rx="250" ry="165" fill="#EFF6FF" stroke="#2563EB" stroke-width="5"/>
    <ellipse cx="260" cy="250" rx="165" ry="105" fill="#DBEAFE" stroke="#2563EB" stroke-width="4" opacity="0.9"/>
    <ellipse cx="260" cy="250" rx="82" ry="50" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <circle cx="260" cy="250" r="12" fill="#B45309"/>
    <text x="285" y="246" font-family="STIX Two Text, Georgia, serif" font-size="34" font-style="italic" fill="#111827">x</text>
    <text x="48" y="126" font-family="Source Sans 3, Arial" font-size="34" font-weight="700" fill="#2563EB">U</text>
    <text x="370" y="194" font-family="Source Sans 3, Arial" font-size="30" font-weight="700" fill="#2563EB">V</text>
    <text x="210" y="340" font-family="Source Sans 3, Arial" font-size="26" fill="#475569">all neighborhoods of x</text>
    <path d="M540 245 H705" stroke="#1E3A8A" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(795 105)" font-family="Source Sans 3, Arial, sans-serif">
    <rect x="0" y="35" width="545" height="190" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <text x="272" y="90" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">directed colimit</text>
    <text x="272" y="150" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="42" fill="#1E3A8A">F_x = colim F(U)</text>
    <text x="272" y="194" text-anchor="middle" font-size="25" fill="#475569">germs identify sections that agree near x</text>
    <path d="M272 230 V330" stroke="#0F766E" stroke-width="5" fill="none" marker-end="url(#tealArrow)"/>
    <rect x="0" y="350" width="545" height="210" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="3"/>
    <text x="272" y="405" text-anchor="middle" font-size="34" font-weight="700" fill="#0F766E">stalkwise isomorphism test</text>
    <text x="272" y="466" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="38" fill="#111827">phi: F -> G</text>
    <text x="272" y="516" text-anchor="middle" font-size="28" fill="#111827">is an isomorphism iff every phi_x is</text>
  </g>
</svg>
