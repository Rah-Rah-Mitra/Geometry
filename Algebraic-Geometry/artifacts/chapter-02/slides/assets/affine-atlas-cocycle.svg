<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Affine atlas and cocycle diagram</title>
  <desc id="desc">Three affine charts overlap pairwise and satisfy a cocycle condition on triple overlap.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="670" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <g opacity="0.92">
    <circle cx="555" cy="330" r="210" fill="#EFF6FF" stroke="#2563EB" stroke-width="5"/>
    <circle cx="775" cy="330" r="210" fill="#F0FDFA" stroke="#0F766E" stroke-width="5"/>
    <circle cx="665" cy="500" r="210" fill="#F5F3FF" stroke="#6D28D9" stroke-width="5"/>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700">
    <text x="438" y="214" fill="#2563EB">U_i = Spec A_i</text>
    <text x="795" y="214" fill="#0F766E">U_j = Spec A_j</text>
    <text x="540" y="644" fill="#6D28D9">U_k = Spec A_k</text>
  </g>
  <g font-family="STIX Two Text, Georgia, serif" font-size="34" fill="#111827">
    <text x="632" y="330">U_i cap U_j</text>
    <text x="518" y="475">U_i cap U_k</text>
    <text x="740" y="475">U_j cap U_k</text>
  </g>
  <circle cx="665" cy="400" r="44" fill="#FFFFFF" stroke="#B45309" stroke-width="5"/>
  <text x="665" y="410" text-anchor="middle" font-family="Source Sans 3, Arial" font-size="26" font-weight="700" fill="#B45309">triple</text>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <rect x="92" y="92" width="345" height="180" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    <text x="265" y="142" text-anchor="middle" font-size="30" font-weight="700" fill="#1E3A8A">Glue Rule</text>
    <text x="265" y="194" text-anchor="middle" font-size="27" fill="#111827">overlaps are affine</text>
    <text x="265" y="238" text-anchor="middle" font-size="27" fill="#111827">transition maps agree</text>
    <path d="M440 185 H520" stroke="#1E3A8A" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <rect x="1062" y="92" width="345" height="180" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="3"/>
    <text x="1235" y="142" text-anchor="middle" font-size="30" font-weight="700" fill="#1E3A8A">Cocycle</text>
    <text x="1235" y="195" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="31" fill="#111827">phi_ik = phi_jk phi_ij</text>
    <text x="1235" y="238" text-anchor="middle" font-size="25" fill="#475569">on triple overlap</text>
  </g>
</svg>
