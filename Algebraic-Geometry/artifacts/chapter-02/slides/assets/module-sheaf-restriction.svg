<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Modules become sheaves</title>
  <desc id="desc">A module M over A becomes a sheaf on Spec A with local sections M_f over principal opens.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="600" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <rect x="90" y="155" width="330" height="190" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="255" y="222" text-anchor="middle" font-size="34" font-weight="700" fill="#2563EB">module</text>
    <text x="255" y="286" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="46" fill="#111827">M</text>
    <path d="M430 250 H590" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="600" y="155" width="330" height="190" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="4"/>
    <text x="765" y="222" text-anchor="middle" font-size="34" font-weight="700" fill="#1E3A8A">sheaf</text>
    <text x="765" y="286" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="46" fill="#111827">M~</text>
    <path d="M940 250 H1100" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="1110" y="155" width="330" height="190" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="1275" y="222" text-anchor="middle" font-size="34" font-weight="700" fill="#0F766E">principal open</text>
    <text x="1275" y="286" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="42" fill="#111827">M_f on D(f)</text>
    <rect x="185" y="430" width="1130" height="92" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <text x="750" y="488" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="42" fill="#111827">Gamma(Spec A, M~) = M,    Gamma(D(f), M~) = M_f</text>
  </g>
</svg>
