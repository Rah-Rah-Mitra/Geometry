<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Chapter II section map strip</title>
  <desc id="desc">Nine connected blocks mapping sheaves through formal schemes.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
    <linearGradient id="soft" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="0.55" stop-color="#F0FDFA"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="1560" height="390" rx="18" fill="url(#soft)" stroke="#CBD5E1" stroke-width="3"/>
  <path d="M95 226 H1500" fill="none" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arrow)"/>
  <g font-family="Source Sans 3, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(135 110)">
      <circle r="38" fill="#2563EB"/><text y="10" font-size="30" font-weight="700" fill="#fff">1</text>
      <text y="96" font-size="27" font-weight="700" fill="#111827">Sheaves</text>
      <text y="130" font-size="20" fill="#475569">local sections</text>
    </g>
    <g transform="translate(305 110)">
      <circle r="38" fill="#2563EB"/><text y="10" font-size="30" font-weight="700" fill="#fff">2</text>
      <text y="96" font-size="27" font-weight="700" fill="#111827">Spec A</text>
      <text y="130" font-size="20" fill="#475569">prime points</text>
    </g>
    <g transform="translate(475 110)">
      <circle r="38" fill="#0F766E"/><text y="10" font-size="30" font-weight="700" fill="#fff">3</text>
      <text y="96" font-size="27" font-weight="700" fill="#111827">Properties</text>
      <text y="130" font-size="20" fill="#475569">reduced, integral</text>
    </g>
    <g transform="translate(645 110)">
      <circle r="38" fill="#0F766E"/><text y="10" font-size="30" font-weight="700" fill="#fff">4</text>
      <text y="96" font-size="27" font-weight="700" fill="#111827">Maps</text>
      <text y="130" font-size="20" fill="#475569">separated/proper</text>
    </g>
    <g transform="translate(815 110)">
      <circle r="38" fill="#B45309"/><text y="10" font-size="30" font-weight="700" fill="#fff">5</text>
      <text y="96" font-size="27" font-weight="700" fill="#111827">Modules</text>
      <text y="130" font-size="20" fill="#475569">quasi-coherent</text>
    </g>
    <g transform="translate(985 110)">
      <circle r="38" fill="#B45309"/><text y="10" font-size="30" font-weight="700" fill="#fff">6</text>
      <text y="96" font-size="27" font-weight="700" fill="#111827">Divisors</text>
      <text y="130" font-size="20" fill="#475569">codim one</text>
    </g>
    <g transform="translate(1155 110)">
      <circle r="38" fill="#6D28D9"/><text y="10" font-size="30" font-weight="700" fill="#fff">7</text>
      <text y="96" font-size="27" font-weight="700" fill="#111827">Projective</text>
      <text y="130" font-size="20" fill="#475569">sections give maps</text>
    </g>
    <g transform="translate(1325 110)">
      <circle r="38" fill="#6D28D9"/><text y="10" font-size="30" font-weight="700" fill="#fff">8</text>
      <text y="96" font-size="27" font-weight="700" fill="#111827">Differentials</text>
      <text y="130" font-size="20" fill="#475569">first order tests</text>
    </g>
    <g transform="translate(1490 110)">
      <circle r="38" fill="#1E3A8A"/><text y="10" font-size="30" font-weight="700" fill="#fff">9</text>
      <text y="96" font-size="27" font-weight="700" fill="#111827">Formal</text>
      <text y="130" font-size="20" fill="#475569">all thickenings</text>
    </g>
  </g>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <rect x="110" y="314" width="1380" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="800" y="349" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A8A">local algebra becomes geometry, then global geometry is rebuilt by gluing</text>
  </g>
</svg>
