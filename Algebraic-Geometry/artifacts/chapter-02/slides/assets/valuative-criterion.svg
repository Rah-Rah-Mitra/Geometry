<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Valuative criterion shape</title>
  <desc id="desc">A generic map from Spec K lifts across Spec R to X over Y, distinguishing existence and uniqueness.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1E3A8A"/>
    </marker>
    <marker id="dashedArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#B45309"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="1450" height="670" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <g font-family="Source Sans 3, Arial, sans-serif">
    <rect x="165" y="130" width="375" height="120" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="352" y="203" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="40" fill="#111827">Spec K</text>
    <rect x="165" y="465" width="375" height="120" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/>
    <text x="352" y="538" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="40" fill="#111827">Spec R</text>
    <rect x="960" y="130" width="375" height="120" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="1148" y="203" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="40" fill="#111827">X</text>
    <rect x="960" y="465" width="375" height="120" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
    <text x="1148" y="538" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="40" fill="#111827">Y</text>
    <path d="M540 190 H945" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M352 250 V450" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M1148 250 V450" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M540 525 H945" stroke="#1E3A8A" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M552 482 C705 360, 780 280, 948 212" stroke="#B45309" stroke-width="6" fill="none" stroke-dasharray="14 10" marker-end="url(#dashedArrow)"/>
    <text x="750" y="350" text-anchor="middle" font-size="32" font-weight="700" fill="#B45309">lift?</text>
    <rect x="570" y="602" width="360" height="62" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="3"/>
    <text x="750" y="642" text-anchor="middle" font-size="27" fill="#111827">proper = existence; separated = uniqueness</text>
  </g>
</svg>
