<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 20px 28px; }
  .row { display: flex; align-items: baseline; gap: 32px; margin-bottom: 6px; }
  .size { font-size: 11px; color: #94A3B8; font-weight: 600; min-width: 52px; letter-spacing: 0.03em; }
</style>
</head>
<body>
  <div class="row">
    <span class="size">52px / 700</span>
    <span style="font-size:36px;font-weight:700;color:#111827;letter-spacing:-0.01em;">Slide Title</span>
  </div>
  <div class="row">
    <span class="size">44px / 700</span>
    <span style="font-size:30px;font-weight:700;color:#1E3A8A;">Section Header</span>
  </div>
  <div class="row">
    <span class="size">30px / 400</span>
    <span style="font-size:22px;font-weight:400;color:#475569;">Subtitle — secondary context</span>
  </div>
  <div class="row">
    <span class="size">22px / 600</span>
    <span style="font-size:16px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:0.04em;">Label · Caption</span>
  </div>
</body>
</html>
