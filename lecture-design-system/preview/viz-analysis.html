<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Function Plots</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Axes -->
          <line x1="20" y1="100" x2="150" y2="100" stroke="#CBD5E1" stroke-width="1"/><line x1="20" y1="10" x2="20" y2="100" stroke="#CBD5E1" stroke-width="1"/>
          <text x="148" y="96" font-size="8" fill="#94A3B8" font-weight="600" font-family="Source Sans 3">x</text>
          <text x="23" y="16" font-size="8" fill="#94A3B8" font-weight="600" font-family="Source Sans 3">y</text>
          <!-- sin curve -->
          <path d="M20 60 Q40 20 60 60 Q80 100 100 60 Q120 20 140 60" fill="none" stroke="#2563EB" stroke-width="1.8"/>
          <!-- Grid lines -->
          <line x1="20" y1="60" x2="150" y2="60" stroke="#E2E8F0" stroke-width="0.5" stroke-dasharray="3 2"/>
          <text x="6" y="63" font-size="7" fill="#94A3B8" font-family="Source Sans 3">0</text>
          <!-- Period markers -->
          <line x1="60" y1="98" x2="60" y2="102" stroke="#94A3B8" stroke-width="0.8"/>
          <line x1="100" y1="98" x2="100" y2="102" stroke="#94A3B8" stroke-width="0.8"/>
          <line x1="140" y1="98" x2="140" y2="102" stroke="#94A3B8" stroke-width="0.8"/>
          <text x="56" y="112" font-size="7" fill="#94A3B8" font-family="STIX Two Text" font-style="italic">π</text>
          <text x="94" y="112" font-size="7" fill="#94A3B8" font-family="STIX Two Text" font-style="italic">2π</text>
        </svg>
        <div class="cell-label">Sinusoidal Function</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Axes centered -->
          <line x1="10" y1="65" x2="150" y2="65" stroke="#CBD5E1" stroke-width="1"/><line x1="80" y1="5" x2="80" y2="115" stroke="#CBD5E1" stroke-width="1"/>
          <!-- Exponential -->
          <path d="M10 62 Q30 60 50 55 Q65 48 75 38 Q82 28 90 16" fill="none" stroke="#2563EB" stroke-width="1.8"/>
          <!-- Logarithm -->
          <path d="M82 115 Q85 95 90 82 Q100 68 120 62 Q140 58 155 56" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="4 2"/>
          <!-- y=x reference -->
          <line x1="15" y1="110" x2="145" y2="10" stroke="#E2E8F0" stroke-width="0.7" stroke-dasharray="2 2"/>
          <text x="92" y="18" font-size="9" fill="#2563EB" font-weight="600" font-family="STIX Two Text" font-style="italic">eˣ</text>
          <text x="130" y="52" font-size="9" fill="#0F766E" font-weight="600" font-family="STIX Two Text" font-style="italic">ln x</text>
          <text x="136" y="22" font-size="8" fill="#94A3B8" font-family="Source Sans 3">y=x</text>
        </svg>
        <div class="cell-label">Inverse Functions</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Limits & Continuity</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- ε-δ diagram -->
          <line x1="15" y1="105" x2="150" y2="105" stroke="#CBD5E1" stroke-width="1"/><line x1="25" y1="10" x2="25" y2="105" stroke="#CBD5E1" stroke-width="1"/>
          <!-- Horizontal ε band -->
          <rect x="25" y="30" width="125" height="30" fill="rgba(37,99,235,0.06)" stroke="none"/>
          <line x1="25" y1="30" x2="150" y2="30" stroke="#2563EB" stroke-width="0.7" stroke-dasharray="3 2"/>
          <line x1="25" y1="60" x2="150" y2="60" stroke="#2563EB" stroke-width="0.7" stroke-dasharray="3 2"/>
          <line x1="25" y1="45" x2="150" y2="45" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="2 2"/>
          <!-- Vertical δ band -->
          <rect x="70" y="10" width="25" height="95" fill="rgba(15,118,110,0.06)" stroke="none"/>
          <line x1="70" y1="10" x2="70" y2="105" stroke="#0F766E" stroke-width="0.7" stroke-dasharray="3 2"/>
          <line x1="95" y1="10" x2="95" y2="105" stroke="#0F766E" stroke-width="0.7" stroke-dasharray="3 2"/>
          <!-- Function curve through the box -->
          <path d="M30 90 Q50 65 70 50 Q83 42 95 35 Q115 25 140 18" fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
          <!-- Labels -->
          <text x="8" y="48" font-size="8" fill="#2563EB" font-weight="600" font-family="STIX Two Text" font-style="italic">L</text>
          <text x="4" y="34" font-size="7" fill="#2563EB" font-family="Source Sans 3">L+ε</text>
          <text x="4" y="64" font-size="7" fill="#2563EB" font-family="Source Sans 3">L−ε</text>
          <text x="77" y="115" font-size="8" fill="#0F766E" font-weight="600" font-family="STIX Two Text" font-style="italic">a</text>
          <text x="65" y="115" font-size="7" fill="#0F766E" font-family="Source Sans 3">−δ</text>
          <text x="93" y="115" font-size="7" fill="#0F766E" font-family="Source Sans 3">+δ</text>
        </svg>
        <div class="cell-label">ε-δ Definition of Limit</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Sequence convergence -->
          <line x1="15" y1="105" x2="150" y2="105" stroke="#CBD5E1" stroke-width="1"/><line x1="15" y1="10" x2="15" y2="105" stroke="#CBD5E1" stroke-width="1"/>
          <!-- Limit line -->
          <line x1="15" y1="40" x2="150" y2="40" stroke="#B45309" stroke-width="0.8" stroke-dasharray="4 2"/>
          <text x="3" y="43" font-size="8" fill="#B45309" font-weight="600" font-family="STIX Two Text" font-style="italic">L</text>
          <!-- ε band -->
          <rect x="15" y="30" width="135" height="20" fill="rgba(180,83,9,0.05)"/>
          <!-- Sequence points -->
          <circle cx="25" cy="85" r="2.5" fill="#2563EB"/><circle cx="38" cy="25" r="2.5" fill="#2563EB"/>
          <circle cx="51" cy="65" r="2.5" fill="#2563EB"/><circle cx="64" cy="32" r="2.5" fill="#2563EB"/>
          <circle cx="77" cy="52" r="2.5" fill="#2563EB"/><circle cx="90" cy="36" r="2.5" fill="#2563EB"/>
          <circle cx="103" cy="44" r="2.5" fill="#2563EB"/><circle cx="116" cy="38" r="2.5" fill="#2563EB"/>
          <circle cx="129" cy="41" r="2.5" fill="#2563EB"/><circle cx="142" cy="39" r="2.5" fill="#2563EB"/>
          <text x="18" y="98" font-size="7" fill="#64748B" font-family="STIX Two Text" font-style="italic">a₁</text>
          <text x="130" y="98" font-size="7" fill="#64748B" font-family="STIX Two Text" font-style="italic">aₙ</text>
        </svg>
        <div class="cell-label">Sequence Convergence</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Integration</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Riemann sum -->
          <line x1="20" y1="100" x2="150" y2="100" stroke="#CBD5E1" stroke-width="1"/><line x1="20" y1="10" x2="20" y2="100" stroke="#CBD5E1" stroke-width="1"/>
          <!-- Rectangles -->
          <rect x="30" y="60" width="15" height="40" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="0.6"/>
          <rect x="45" y="42" width="15" height="58" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="0.6"/>
          <rect x="60" y="30" width="15" height="70" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="0.6"/>
          <rect x="75" y="24" width="15" height="76" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="0.6"/>
          <rect x="90" y="22" width="15" height="78" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="0.6"/>
          <rect x="105" y="28" width="15" height="72" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="0.6"/>
          <rect x="120" y="40" width="15" height="60" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="0.6"/>
          <!-- Smooth curve on top -->
          <path d="M30 62 Q50 38 75 22 Q100 18 120 30 Q135 45 140 58" fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
          <!-- a, b markers -->
          <text x="27" y="112" font-size="8" fill="#0F766E" font-weight="600" font-family="STIX Two Text" font-style="italic">a</text>
          <text x="130" y="112" font-size="8" fill="#0F766E" font-weight="600" font-family="STIX Two Text" font-style="italic">b</text>
        </svg>
        <div class="cell-label">Riemann Sum</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Area between curves -->
          <line x1="15" y1="100" x2="150" y2="100" stroke="#CBD5E1" stroke-width="1"/><line x1="15" y1="10" x2="15" y2="100" stroke="#CBD5E1" stroke-width="1"/>
          <!-- Shaded region between -->
          <path d="M35 65 Q55 40 80 32 Q105 28 130 38 L130 72 Q105 58 80 62 Q55 68 35 80 Z" fill="rgba(15,118,110,0.12)" stroke="none"/>
          <!-- Upper curve f -->
          <path d="M35 65 Q55 40 80 32 Q105 28 130 38" fill="none" stroke="#2563EB" stroke-width="1.5"/>
          <!-- Lower curve g -->
          <path d="M35 80 Q55 68 80 62 Q105 58 130 72" fill="none" stroke="#0F766E" stroke-width="1.5"/>
          <text x="85" y="26" font-size="9" fill="#2563EB" font-weight="600" font-family="STIX Two Text" font-style="italic">f(x)</text>
          <text x="100" y="85" font-size="9" fill="#0F766E" font-weight="600" font-family="STIX Two Text" font-style="italic">g(x)</text>
          <!-- Vertical bounds -->
          <line x1="35" y1="65" x2="35" y2="100" stroke="#B45309" stroke-width="0.7" stroke-dasharray="2 2"/>
          <line x1="130" y1="38" x2="130" y2="100" stroke="#B45309" stroke-width="0.7" stroke-dasharray="2 2"/>
          <text x="32" y="112" font-size="8" fill="#B45309" font-weight="600" font-family="STIX Two Text" font-style="italic">a</text>
          <text x="127" y="112" font-size="8" fill="#B45309" font-weight="600" font-family="STIX Two Text" font-style="italic">b</text>
        </svg>
        <div class="cell-label">Area Between Curves</div>
      </div>
    </div>
  </div>
</body>
</html>
