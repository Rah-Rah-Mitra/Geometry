<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 24px 28px; display: flex; align-items: center; gap: 24px; }
  .icon-tile {
    width: 56px; height: 56px; border-radius: 10px; background: #087568;
    display: grid; place-items: center;
  }
  .icon-tile svg { width: 28px; height: 28px; }
  .brand-text { display: flex; flex-direction: column; gap: 2px; }
  .brand-name { font-size: 20px; font-weight: 700; color: #15211d; }
  .brand-sub { font-size: 13px; color: #5d6b66; }
  .divider { width: 1px; height: 48px; background: #d8e0da; }
  .badge-row { display: flex; gap: 10px; }
  .use-badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; }
  .use-portal { background: #edf2ef; color: #087568; }
  .use-slides { background: #EEF2FF; color: #1E3A8A; }
</style>
</head>
<body>
  <div class="icon-tile">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 17v30l16-7 16 7V17l-16 7-16-7Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M32 24v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="brand-text">
    <div class="brand-name">Geometry Atlas</div>
    <div class="brand-sub">Visualization-first notebooks</div>
  </div>
  <div class="divider"></div>
  <div class="badge-row">
    <span class="use-badge use-portal">Web Portal</span>
    <span class="use-badge use-slides">Lecture Slides</span>
  </div>
</body>
</html>
