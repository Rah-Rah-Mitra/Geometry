<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Combinatorial Structures</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 130" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Pascal's triangle (5 rows) -->
          <text x="75" y="16" font-size="11" fill="#1E3A8A" font-weight="700" text-anchor="middle" font-family="Source Sans 3">1</text>
          <text x="60" y="36" font-size="11" fill="#2563EB" font-weight="600" text-anchor="middle" font-family="Source Sans 3">1</text>
          <text x="90" y="36" font-size="11" fill="#2563EB" font-weight="600" text-anchor="middle" font-family="Source Sans 3">1</text>
          <text x="45" y="56" font-size="11" fill="#111827" text-anchor="middle" font-family="Source Sans 3">1</text>
          <text x="75" y="56" font-size="11" fill="#0F766E" font-weight="700" text-anchor="middle" font-family="Source Sans 3">2</text>
          <text x="105" y="56" font-size="11" fill="#111827" text-anchor="middle" font-family="Source Sans 3">1</text>
          <text x="30" y="76" font-size="11" fill="#111827" text-anchor="middle" font-family="Source Sans 3">1</text>
          <text x="60" y="76" font-size="11" fill="#111827" text-anchor="middle" font-family="Source Sans 3">3</text>
          <text x="90" y="76" font-size="11" fill="#111827" text-anchor="middle" font-family="Source Sans 3">3</text>
          <text x="120" y="76" font-size="11" fill="#111827" text-anchor="middle" font-family="Source Sans 3">1</text>
          <text x="15" y="96" font-size="11" fill="#111827" text-anchor="middle" font-family="Source Sans 3">1</text>
          <text x="45" y="96" font-size="11" fill="#111827" text-anchor="middle" font-family="Source Sans 3">4</text>
          <text x="75" y="96" font-size="11" fill="#B45309" font-weight="700" text-anchor="middle" font-family="Source Sans 3">6</text>
          <text x="105" y="96" font-size="11" fill="#111827" text-anchor="middle" font-family="Source Sans 3">4</text>
          <text x="135" y="96" font-size="11" fill="#111827" text-anchor="middle" font-family="Source Sans 3">1</text>
          <!-- Highlight lines -->
          <line x1="60" y1="29" x2="75" y2="49" stroke="#0F766E" stroke-width="0.6" opacity="0.4"/>
          <line x1="90" y1="29" x2="75" y2="49" stroke="#0F766E" stroke-width="0.6" opacity="0.4"/>
          <text x="50" y="120" font-size="8" fill="#64748B" font-family="Source Sans 3">C(n,k) = C(n-1,k-1) + C(n-1,k)</text>
        </svg>
        <div class="cell-label">Pascal's Triangle</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 130" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Young tableau -->
          <rect x="25" y="15" width="25" height="22" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1"/>
          <rect x="50" y="15" width="25" height="22" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1"/>
          <rect x="75" y="15" width="25" height="22" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1"/>
          <rect x="100" y="15" width="25" height="22" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1"/>
          <rect x="25" y="37" width="25" height="22" fill="rgba(15,118,110,0.1)" stroke="#0F766E" stroke-width="1"/>
          <rect x="50" y="37" width="25" height="22" fill="rgba(15,118,110,0.1)" stroke="#0F766E" stroke-width="1"/>
          <rect x="25" y="59" width="25" height="22" fill="rgba(109,40,217,0.1)" stroke="#6D28D9" stroke-width="1"/>
          <!-- Numbers -->
          <text x="34" y="31" font-size="12" fill="#1E3A8A" font-weight="700" text-anchor="middle" font-family="Source Sans 3">1</text>
          <text x="59" y="31" font-size="12" fill="#1E3A8A" font-weight="700" text-anchor="middle" font-family="Source Sans 3">2</text>
          <text x="84" y="31" font-size="12" fill="#1E3A8A" font-weight="700" text-anchor="middle" font-family="Source Sans 3">4</text>
          <text x="109" y="31" font-size="12" fill="#1E3A8A" font-weight="700" text-anchor="middle" font-family="Source Sans 3">7</text>
          <text x="34" y="53" font-size="12" fill="#0F766E" font-weight="700" text-anchor="middle" font-family="Source Sans 3">3</text>
          <text x="59" y="53" font-size="12" fill="#0F766E" font-weight="700" text-anchor="middle" font-family="Source Sans 3">5</text>
          <text x="34" y="75" font-size="12" fill="#6D28D9" font-weight="700" text-anchor="middle" font-family="Source Sans 3">6</text>
          <!-- Partition label -->
          <text x="45" y="100" font-size="9" fill="#64748B" font-family="Source Sans 3" font-weight="600">λ = (4, 2, 1)</text>
          <text x="45" y="115" font-size="8" fill="#94A3B8" font-family="Source Sans 3">Standard Young Tableau</text>
        </svg>
        <div class="cell-label">Young Tableau</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Permutations & Probability</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Permutation cycle notation: (1 3 4)(2 5) -->
          <defs><marker id="pc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
          <marker id="pc2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker></defs>
          <!-- 3-cycle (1,3,4) -->
          <circle cx="35" cy="35" r="14" fill="none" stroke="#2563EB" stroke-width="0.6" stroke-dasharray="2 1.5"/>
          <circle cx="85" cy="25" r="14" fill="none" stroke="#2563EB" stroke-width="0" />
          <circle cx="60" cy="75" r="14" fill="none" stroke="#2563EB" stroke-width="0" />
          <!-- Nodes -->
          <circle cx="35" cy="35" r="12" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <text x="31" y="39" font-size="13" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">1</text>
          <circle cx="85" cy="25" r="12" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <text x="81" y="29" font-size="13" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">3</text>
          <circle cx="60" cy="75" r="12" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <text x="56" y="79" font-size="13" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">4</text>
          <!-- Arrows between -->
          <path d="M47 30 Q60 18 73 24" fill="none" stroke="#2563EB" stroke-width="1.2" marker-end="url(#pc)"/>
          <path d="M88 37 Q82 55 72 68" fill="none" stroke="#2563EB" stroke-width="1.2" marker-end="url(#pc)"/>
          <path d="M48 75 Q38 60 35 48" fill="none" stroke="#2563EB" stroke-width="1.2" marker-end="url(#pc)"/>
          <!-- 2-cycle (2,5) -->
          <circle cx="125" cy="45" r="12" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1"/>
          <text x="121" y="49" font-size="13" fill="#0F766E" font-weight="700" font-family="Source Sans 3">2</text>
          <circle cx="125" cy="85" r="12" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1"/>
          <text x="121" y="89" font-size="13" fill="#0F766E" font-weight="700" font-family="Source Sans 3">5</text>
          <path d="M120 57 Q112 65 120 73" fill="none" stroke="#0F766E" stroke-width="1.2" marker-end="url(#pc2)"/>
          <path d="M130 73 Q138 65 130 57" fill="none" stroke="#0F766E" stroke-width="1.2" marker-end="url(#pc2)"/>
          <text x="30" y="105" font-size="9" fill="#64748B" font-family="Source Sans 3">σ = (1 3 4)(2 5)</text>
        </svg>
        <div class="cell-label">Permutation Cycles</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Probability tree -->
          <defs><marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
          <circle cx="20" cy="55" r="4" fill="#1E3A8A"/>
          <!-- Branch 1: H -->
          <line x1="24" y1="53" x2="65" y2="25" stroke="#475569" stroke-width="1"/>
          <circle cx="70" cy="22" r="4" fill="#2563EB"/>
          <text x="38" y="32" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">½</text>
          <text x="78" y="18" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">H</text>
          <!-- Branch 2: T -->
          <line x1="24" y1="57" x2="65" y2="88" stroke="#475569" stroke-width="1"/>
          <circle cx="70" cy="88" r="4" fill="#0F766E"/>
          <text x="38" y="82" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">½</text>
          <text x="78" y="84" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">T</text>
          <!-- Sub-branches from H -->
          <line x1="74" y1="20" x2="115" y2="12" stroke="#475569" stroke-width="0.8"/>
          <circle cx="118" cy="11" r="3" fill="#2563EB"/><text x="124" y="14" font-size="8" fill="#111827" font-family="Source Sans 3">HH</text>
          <line x1="74" y1="24" x2="115" y2="35" stroke="#475569" stroke-width="0.8"/>
          <circle cx="118" cy="35" r="3" fill="#0F766E"/><text x="124" y="38" font-size="8" fill="#111827" font-family="Source Sans 3">HT</text>
          <!-- Sub-branches from T -->
          <line x1="74" y1="86" x2="115" y2="78" stroke="#475569" stroke-width="0.8"/>
          <circle cx="118" cy="77" r="3" fill="#2563EB"/><text x="124" y="80" font-size="8" fill="#111827" font-family="Source Sans 3">TH</text>
          <line x1="74" y1="90" x2="115" y2="100" stroke="#475569" stroke-width="0.8"/>
          <circle cx="118" cy="100" r="3" fill="#0F766E"/><text x="124" y="103" font-size="8" fill="#111827" font-family="Source Sans 3">TT</text>
          <text x="42" y="118" font-size="8" fill="#64748B" font-family="Source Sans 3">Sample space Ω</text>
        </svg>
        <div class="cell-label">Probability Tree</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Distributions & Markov</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Normal distribution bell curve -->
          <line x1="15" y1="90" x2="150" y2="90" stroke="#CBD5E1" stroke-width="1"/>
          <path d="M20 88 Q40 87 55 82 Q65 75 72 58 Q78 30 82 18 Q86 30 88 58 Q95 75 105 82 Q120 87 140 88" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1.5"/>
          <!-- Mean line -->
          <line x1="82" y1="15" x2="82" y2="90" stroke="#1E3A8A" stroke-width="0.7" stroke-dasharray="3 2"/>
          <text x="78" y="12" font-size="8" fill="#1E3A8A" font-weight="600" font-family="STIX Two Text" font-style="italic">μ</text>
          <!-- σ markers -->
          <line x1="60" y1="88" x2="60" y2="92" stroke="#B45309" stroke-width="0.8"/><text x="53" y="100" font-size="7" fill="#B45309" font-family="Source Sans 3">μ-σ</text>
          <line x1="104" y1="88" x2="104" y2="92" stroke="#B45309" stroke-width="0.8"/><text x="98" y="100" font-size="7" fill="#B45309" font-family="Source Sans 3">μ+σ</text>
        </svg>
        <div class="cell-label">Normal Distribution</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Markov chain: 2-state -->
          <defs><marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E3A8A"/></marker></defs>
          <circle cx="50" cy="55" r="22" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1.5"/>
          <text x="42" y="60" font-size="14" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">S₁</text>
          <circle cx="120" cy="55" r="22" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1.5"/>
          <text x="112" y="60" font-size="14" fill="#0F766E" font-weight="700" font-family="Source Sans 3">S₂</text>
          <!-- S1 → S2 -->
          <path d="M72 48 Q90 30 100 42" fill="none" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#mk)"/>
          <text x="78" y="30" font-size="9" fill="#B45309" font-weight="600" font-family="Source Sans 3">0.3</text>
          <!-- S2 → S1 -->
          <path d="M98 64 Q85 80 72 66" fill="none" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#mk)"/>
          <text x="78" y="85" font-size="9" fill="#B45309" font-weight="600" font-family="Source Sans 3">0.4</text>
          <!-- Self loops -->
          <path d="M34 38 Q20 15 50 32" fill="none" stroke="#94A3B8" stroke-width="0.8" marker-end="url(#mk)"/>
          <text x="22" y="22" font-size="8" fill="#94A3B8" font-family="Source Sans 3">0.7</text>
          <path d="M136 38 Q150 15 120 32" fill="none" stroke="#94A3B8" stroke-width="0.8" marker-end="url(#mk)"/>
          <text x="138" y="22" font-size="8" fill="#94A3B8" font-family="Source Sans 3">0.6</text>
        </svg>
        <div class="cell-label">Markov Chain</div>
      </div>
    </div>
  </div>
</body>
</html>
