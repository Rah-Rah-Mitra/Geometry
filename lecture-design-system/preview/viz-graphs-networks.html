<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Simple Graphs</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- K4 complete graph -->
          <line x1="75" y1="15" x2="25" y2="55" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="75" y1="15" x2="125" y2="55" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="75" y1="15" x2="75" y2="95" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="25" y1="55" x2="125" y2="55" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="25" y1="55" x2="75" y2="95" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="125" y1="55" x2="75" y2="95" stroke="#CBD5E1" stroke-width="1.2"/>
          <circle cx="75" cy="15" r="5" fill="#2563EB"/><circle cx="25" cy="55" r="5" fill="#2563EB"/>
          <circle cx="125" cy="55" r="5" fill="#2563EB"/><circle cx="75" cy="95" r="5" fill="#2563EB"/>
        </svg>
        <div class="cell-label">Complete K₄</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Bipartite -->
          <line x1="30" y1="20" x2="100" y2="20" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="30" y1="20" x2="120" y2="55" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="30" y1="55" x2="100" y2="20" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="30" y1="55" x2="120" y2="55" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="30" y1="90" x2="100" y2="90" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="30" y1="90" x2="120" y2="55" stroke="#CBD5E1" stroke-width="1"/>
          <circle cx="30" cy="20" r="5" fill="#2563EB"/><circle cx="30" cy="55" r="5" fill="#2563EB"/><circle cx="30" cy="90" r="5" fill="#2563EB"/>
          <circle cx="100" cy="20" r="5" fill="#0F766E"/><circle cx="120" cy="55" r="5" fill="#0F766E"/><circle cx="100" cy="90" r="5" fill="#0F766E"/>
        </svg>
        <div class="cell-label">Bipartite</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Directed & Weighted</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="da" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E3A8A"/></marker></defs>
          <line x1="30" y1="25" x2="72" y2="25" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#da)"/>
          <line x1="80" y1="30" x2="118" y2="70" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#da)"/>
          <line x1="120" y1="85" x2="38" y2="85" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#da)"/>
          <line x1="28" y1="80" x2="28" y2="32" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#da)"/>
          <circle cx="28" cy="25" r="5" fill="#2563EB"/><text x="18" y="18" font-size="10" fill="#2563EB" font-weight="700" font-family="Source Sans 3">v₁</text>
          <circle cx="80" cy="25" r="5" fill="#2563EB"/><text x="70" y="18" font-size="10" fill="#2563EB" font-weight="700" font-family="Source Sans 3">v₂</text>
          <circle cx="125" cy="82" r="5" fill="#2563EB"/><text x="130" y="80" font-size="10" fill="#2563EB" font-weight="700" font-family="Source Sans 3">v₃</text>
          <circle cx="28" cy="85" r="5" fill="#2563EB"/><text x="18" y="100" font-size="10" fill="#2563EB" font-weight="700" font-family="Source Sans 3">v₄</text>
        </svg>
        <div class="cell-label">Directed (Digraph)</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <line x1="30" y1="30" x2="120" y2="30" stroke="#CBD5E1" stroke-width="1.5"/>
          <line x1="120" y1="30" x2="120" y2="90" stroke="#CBD5E1" stroke-width="1.5"/>
          <line x1="30" y1="30" x2="75" y2="90" stroke="#CBD5E1" stroke-width="1.5"/>
          <line x1="75" y1="90" x2="120" y2="90" stroke="#CBD5E1" stroke-width="1.5"/>
          <text x="68" y="24" font-size="10" fill="#B45309" font-weight="700" font-family="Source Sans 3">3</text>
          <text x="124" y="64" font-size="10" fill="#B45309" font-weight="700" font-family="Source Sans 3">7</text>
          <text x="40" y="68" font-size="10" fill="#B45309" font-weight="700" font-family="Source Sans 3">5</text>
          <text x="92" y="98" font-size="10" fill="#B45309" font-weight="700" font-family="Source Sans 3">2</text>
          <circle cx="30" cy="30" r="5" fill="#1E3A8A"/><circle cx="120" cy="30" r="5" fill="#1E3A8A"/>
          <circle cx="120" cy="90" r="5" fill="#1E3A8A"/><circle cx="75" cy="90" r="5" fill="#1E3A8A"/>
        </svg>
        <div class="cell-label">Weighted Graph</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Trees & Special Graphs</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Binary tree -->
          <line x1="75" y1="15" x2="40" y2="45" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="75" y1="15" x2="110" y2="45" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="40" y1="45" x2="22" y2="75" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="40" y1="45" x2="58" y2="75" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="110" y1="45" x2="92" y2="75" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="22" y1="75" x2="14" y2="100" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="22" y1="75" x2="30" y2="100" stroke="#CBD5E1" stroke-width="1"/>
          <circle cx="75" cy="15" r="4" fill="#1E3A8A"/>
          <circle cx="40" cy="45" r="4" fill="#2563EB"/><circle cx="110" cy="45" r="4" fill="#2563EB"/>
          <circle cx="22" cy="75" r="4" fill="#0F766E"/><circle cx="58" cy="75" r="4" fill="#0F766E"/><circle cx="92" cy="75" r="4" fill="#0F766E"/>
          <circle cx="14" cy="100" r="3" fill="#64748B"/><circle cx="30" cy="100" r="3" fill="#64748B"/>
        </svg>
        <div class="cell-label">Rooted Tree</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Petersen-like: cycle + inner star -->
          <circle cx="75" cy="55" r="40" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
          <circle cx="75" cy="55" r="20" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
          <!-- Outer pentagon -->
          <line x1="75" y1="15" x2="113" y2="41" stroke="#CBD5E1" stroke-width="1"/><line x1="113" y1="41" x2="99" y2="82" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="99" y1="82" x2="51" y2="82" stroke="#CBD5E1" stroke-width="1"/><line x1="51" y1="82" x2="37" y2="41" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="37" y1="41" x2="75" y2="15" stroke="#CBD5E1" stroke-width="1"/>
          <!-- Inner pentagram -->
          <line x1="75" y1="35" x2="56" y2="72" stroke="#2563EB" stroke-width="0.8"/><line x1="56" y1="72" x2="94" y2="48" stroke="#2563EB" stroke-width="0.8"/>
          <line x1="94" y1="48" x2="56" y2="48" stroke="#2563EB" stroke-width="0.8"/><line x1="56" y1="48" x2="94" y2="72" stroke="#2563EB" stroke-width="0.8"/>
          <line x1="94" y1="72" x2="75" y2="35" stroke="#2563EB" stroke-width="0.8"/>
          <!-- Spokes -->
          <line x1="75" y1="15" x2="75" y2="35" stroke="#94A3B8" stroke-width="0.8"/><line x1="113" y1="41" x2="94" y2="48" stroke="#94A3B8" stroke-width="0.8"/>
          <line x1="99" y1="82" x2="94" y2="72" stroke="#94A3B8" stroke-width="0.8"/><line x1="51" y1="82" x2="56" y2="72" stroke="#94A3B8" stroke-width="0.8"/>
          <line x1="37" y1="41" x2="56" y2="48" stroke="#94A3B8" stroke-width="0.8"/>
          <!-- Vertices -->
          <circle cx="75" cy="15" r="4" fill="#1E3A8A"/><circle cx="113" cy="41" r="4" fill="#1E3A8A"/><circle cx="99" cy="82" r="4" fill="#1E3A8A"/>
          <circle cx="51" cy="82" r="4" fill="#1E3A8A"/><circle cx="37" cy="41" r="4" fill="#1E3A8A"/>
          <circle cx="75" cy="35" r="3" fill="#2563EB"/><circle cx="94" cy="48" r="3" fill="#2563EB"/><circle cx="94" cy="72" r="3" fill="#2563EB"/>
          <circle cx="56" cy="72" r="3" fill="#2563EB"/><circle cx="56" cy="48" r="3" fill="#2563EB"/>
        </svg>
        <div class="cell-label">Petersen Graph</div>
      </div>
    </div>
  </div>
</body>
</html>
