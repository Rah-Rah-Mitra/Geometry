<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Group Tables & Structure</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 130" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Cayley table Z/4Z -->
          <rect x="5" y="5" width="140" height="120" rx="3" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
          <text x="12" y="22" font-size="10" fill="#64748B" font-weight="700" font-family="Source Sans 3">+</text>
          <text x="42" y="22" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">0</text>
          <text x="72" y="22" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">1</text>
          <text x="102" y="22" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">2</text>
          <text x="132" y="22" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">3</text>
          <line x1="5" y1="28" x2="145" y2="28" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="30" y1="5" x2="30" y2="125" stroke="#CBD5E1" stroke-width="1"/>
          <!-- Row 0 --><text x="12" y="46" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">0</text>
          <text x="42" y="46" font-size="10" fill="#111827" font-family="Source Sans 3">0</text><text x="72" y="46" font-size="10" fill="#111827" font-family="Source Sans 3">1</text>
          <text x="102" y="46" font-size="10" fill="#111827" font-family="Source Sans 3">2</text><text x="132" y="46" font-size="10" fill="#111827" font-family="Source Sans 3">3</text>
          <!-- Row 1 --><text x="12" y="66" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">1</text>
          <text x="42" y="66" font-size="10" fill="#111827" font-family="Source Sans 3">1</text><text x="72" y="66" font-size="10" fill="#111827" font-family="Source Sans 3">2</text>
          <text x="102" y="66" font-size="10" fill="#111827" font-family="Source Sans 3">3</text><text x="132" y="66" font-size="10" fill="#0F766E" font-weight="600" font-family="Source Sans 3">0</text>
          <!-- Row 2 --><text x="12" y="86" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">2</text>
          <text x="42" y="86" font-size="10" fill="#111827" font-family="Source Sans 3">2</text><text x="72" y="86" font-size="10" fill="#111827" font-family="Source Sans 3">3</text>
          <text x="102" y="86" font-size="10" fill="#0F766E" font-weight="600" font-family="Source Sans 3">0</text><text x="132" y="86" font-size="10" fill="#111827" font-family="Source Sans 3">1</text>
          <!-- Row 3 --><text x="12" y="106" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">3</text>
          <text x="42" y="106" font-size="10" fill="#111827" font-family="Source Sans 3">3</text><text x="72" y="106" font-size="10" fill="#0F766E" font-weight="600" font-family="Source Sans 3">0</text>
          <text x="102" y="106" font-size="10" fill="#111827" font-family="Source Sans 3">1</text><text x="132" y="106" font-size="10" fill="#111827" font-family="Source Sans 3">2</text>
        </svg>
        <div class="cell-label">Cayley Table (ℤ/4ℤ, +)</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 130" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Subgroup lattice of Z/12Z -->
          <line x1="75" y1="15" x2="35" y2="45" stroke="#CBD5E1" stroke-width="1"/><line x1="75" y1="15" x2="75" y2="45" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="75" y1="15" x2="115" y2="45" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="35" y1="45" x2="35" y2="75" stroke="#CBD5E1" stroke-width="1"/><line x1="35" y1="45" x2="75" y2="75" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="75" y1="45" x2="35" y2="75" stroke="#CBD5E1" stroke-width="1"/><line x1="75" y1="45" x2="115" y2="75" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="115" y1="45" x2="75" y2="75" stroke="#CBD5E1" stroke-width="1"/><line x1="115" y1="45" x2="115" y2="75" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="35" y1="75" x2="75" y2="105" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="75" y1="75" x2="75" y2="105" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="115" y1="75" x2="75" y2="105" stroke="#CBD5E1" stroke-width="1"/>
          <circle cx="75" cy="15" r="4" fill="#1E3A8A"/><text x="82" y="19" font-size="9" fill="#1E3A8A" font-weight="600" font-family="Source Sans 3">ℤ₁₂</text>
          <circle cx="35" cy="45" r="4" fill="#2563EB"/><text x="10" y="49" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">⟨2⟩</text>
          <circle cx="75" cy="45" r="4" fill="#2563EB"/><text x="80" y="42" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">⟨3⟩</text>
          <circle cx="115" cy="45" r="4" fill="#2563EB"/><text x="120" y="49" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">⟨4⟩</text>
          <circle cx="35" cy="75" r="4" fill="#0F766E"/><text x="10" y="79" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">⟨6⟩</text>
          <circle cx="75" cy="75" r="4" fill="#0F766E"/><text x="80" y="72" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">⟨4⟩∩⟨3⟩</text>
          <circle cx="115" cy="75" r="4" fill="#0F766E"/><text x="120" y="79" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">⟨4⟩</text>
          <circle cx="75" cy="105" r="4" fill="#6D28D9"/><text x="82" y="109" font-size="9" fill="#6D28D9" font-weight="600" font-family="Source Sans 3">{0}</text>
        </svg>
        <div class="cell-label">Subgroup Lattice</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Commutative Diagrams</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 100" width="140" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="ca" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E3A8A"/></marker></defs>
          <!-- Square diagram -->
          <line x1="30" y1="20" x2="110" y2="20" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#ca)"/>
          <line x1="30" y1="80" x2="110" y2="80" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#ca)"/>
          <line x1="22" y1="28" x2="22" y2="72" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#ca)"/>
          <line x1="120" y1="28" x2="120" y2="72" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#ca)"/>
          <text x="16" y="16" font-size="12" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">A</text>
          <text x="118" y="16" font-size="12" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">B</text>
          <text x="16" y="93" font-size="12" fill="#0F766E" font-weight="700" font-family="STIX Two Text" font-style="italic">C</text>
          <text x="118" y="93" font-size="12" fill="#0F766E" font-weight="700" font-family="STIX Two Text" font-style="italic">D</text>
          <text x="62" y="15" font-size="10" fill="#475569" font-weight="600" font-family="STIX Two Text" font-style="italic">f</text>
          <text x="62" y="76" font-size="10" fill="#475569" font-weight="600" font-family="STIX Two Text" font-style="italic">h</text>
          <text x="8" y="54" font-size="10" fill="#475569" font-weight="600" font-family="STIX Two Text" font-style="italic">g</text>
          <text x="125" y="54" font-size="10" fill="#475569" font-weight="600" font-family="STIX Two Text" font-style="italic">k</text>
        </svg>
        <div class="cell-label">Commutative Square</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 90" width="140" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="ea" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E3A8A"/></marker>
          <marker id="ea2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 2L10 5L0 8z" fill="#1E3A8A"/></marker></defs>
          <!-- Exact sequence: 0 → A → B → C → 0 -->
          <text x="8" y="48" font-size="11" fill="#64748B" font-weight="600" font-family="Source Sans 3">0</text>
          <line x1="18" y1="44" x2="32" y2="44" stroke="#1E3A8A" stroke-width="1" marker-end="url(#ea)"/>
          <text x="36" y="48" font-size="12" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">A</text>
          <line x1="48" y1="44" x2="68" y2="44" stroke="#1E3A8A" stroke-width="1" marker-end="url(#ea)"/>
          <text x="54" y="38" font-size="9" fill="#475569" font-family="STIX Two Text" font-style="italic">ι</text>
          <text x="72" y="48" font-size="12" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">B</text>
          <line x1="84" y1="44" x2="104" y2="44" stroke="#1E3A8A" stroke-width="1" marker-end="url(#ea)"/>
          <text x="89" y="38" font-size="9" fill="#475569" font-family="STIX Two Text" font-style="italic">π</text>
          <text x="108" y="48" font-size="12" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">C</text>
          <line x1="120" y1="44" x2="138" y2="44" stroke="#1E3A8A" stroke-width="1" marker-end="url(#ea)"/>
          <text x="142" y="48" font-size="11" fill="#64748B" font-weight="600" font-family="Source Sans 3">0</text>
          <text x="30" y="72" font-size="9" fill="#B45309" font-weight="600" font-family="Source Sans 3">im ι = ker π</text>
        </svg>
        <div class="cell-label">Short Exact Sequence</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Ring & Field Diagrams</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 100" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Tower of field extensions -->
          <line x1="75" y1="15" x2="75" y2="35" stroke="#CBD5E1" stroke-width="1.5"/>
          <line x1="75" y1="45" x2="75" y2="60" stroke="#CBD5E1" stroke-width="1.5"/>
          <line x1="75" y1="70" x2="75" y2="85" stroke="#CBD5E1" stroke-width="1.5"/>
          <text x="55" y="15" font-size="11" fill="#1E3A8A" font-weight="700" font-family="STIX Two Text" font-style="italic">ℂ</text>
          <text x="55" y="42" font-size="11" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">ℝ</text>
          <text x="55" y="68" font-size="11" fill="#0F766E" font-weight="700" font-family="STIX Two Text" font-style="italic">ℚ</text>
          <text x="55" y="95" font-size="11" fill="#6D28D9" font-weight="700" font-family="STIX Two Text" font-style="italic">ℤ</text>
          <text x="82" y="28" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">[ℂ:ℝ]=2</text>
          <text x="82" y="55" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">[ℝ:ℚ]=∞</text>
        </svg>
        <div class="cell-label">Field Extension Tower</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 100" width="140" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="qa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E3A8A"/></marker></defs>
          <!-- Quotient group diagram -->
          <ellipse cx="45" cy="50" rx="30" ry="40" fill="rgba(37,99,235,0.06)" stroke="#2563EB" stroke-width="1"/>
          <ellipse cx="115" cy="50" rx="25" ry="35" fill="rgba(15,118,110,0.06)" stroke="#0F766E" stroke-width="1"/>
          <line x1="78" y1="50" x2="86" y2="50" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#qa)"/>
          <!-- Cosets in G -->
          <ellipse cx="45" cy="32" rx="18" ry="10" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="0.6" stroke-dasharray="2 1.5"/>
          <ellipse cx="45" cy="52" rx="18" ry="10" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="0.6" stroke-dasharray="2 1.5"/>
          <ellipse cx="45" cy="72" rx="18" ry="10" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="0.6" stroke-dasharray="2 1.5"/>
          <!-- Points in G/N -->
          <circle cx="110" cy="35" r="3" fill="#0F766E"/><circle cx="115" cy="50" r="3" fill="#0F766E"/><circle cx="120" cy="65" r="3" fill="#0F766E"/>
          <text x="35" y="13" font-size="10" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">G</text>
          <text x="102" y="16" font-size="10" fill="#0F766E" font-weight="700" font-family="STIX Two Text" font-style="italic">G/N</text>
          <text x="78" y="44" font-size="9" fill="#475569" font-weight="600" font-family="STIX Two Text" font-style="italic">π</text>
        </svg>
        <div class="cell-label">Quotient Map G → G/N</div>
      </div>
    </div>
  </div>
</body>
</html>
