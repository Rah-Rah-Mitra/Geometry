<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Number Lines & Intervals</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 60" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Integer number line -->
          <line x1="10" y1="30" x2="150" y2="30" stroke="#CBD5E1" stroke-width="1.2"/>
          <!-- Tick marks -->
          <line x1="20" y1="26" x2="20" y2="34" stroke="#475569" stroke-width="1"/><text x="17" y="46" font-size="9" fill="#475569" font-family="Source Sans 3">-3</text>
          <line x1="40" y1="26" x2="40" y2="34" stroke="#475569" stroke-width="1"/><text x="37" y="46" font-size="9" fill="#475569" font-family="Source Sans 3">-2</text>
          <line x1="60" y1="26" x2="60" y2="34" stroke="#475569" stroke-width="1"/><text x="57" y="46" font-size="9" fill="#475569" font-family="Source Sans 3">-1</text>
          <line x1="80" y1="26" x2="80" y2="34" stroke="#1E3A8A" stroke-width="1.5"/><text x="78" y="46" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">0</text>
          <line x1="100" y1="26" x2="100" y2="34" stroke="#475569" stroke-width="1"/><text x="98" y="46" font-size="9" fill="#475569" font-family="Source Sans 3">1</text>
          <line x1="120" y1="26" x2="120" y2="34" stroke="#475569" stroke-width="1"/><text x="118" y="46" font-size="9" fill="#475569" font-family="Source Sans 3">2</text>
          <line x1="140" y1="26" x2="140" y2="34" stroke="#475569" stroke-width="1"/><text x="138" y="46" font-size="9" fill="#475569" font-family="Source Sans 3">3</text>
          <!-- Highlighted segment [−1, 2] -->
          <line x1="60" y1="30" x2="120" y2="30" stroke="#2563EB" stroke-width="3"/>
          <circle cx="60" cy="30" r="3.5" fill="#2563EB"/><circle cx="120" cy="30" r="3.5" fill="white" stroke="#2563EB" stroke-width="1.5"/>
          <text x="72" y="20" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">[−1, 2)</text>
        </svg>
        <div class="cell-label">Number Line Interval</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 60" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Divisibility chain -->
          <circle cx="20" cy="30" r="12" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1"/><text x="16" y="34" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">1</text>
          <line x1="33" y1="30" x2="43" y2="30" stroke="#CBD5E1" stroke-width="1"/>
          <circle cx="55" cy="30" r="12" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1"/><text x="51" y="34" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">2</text>
          <line x1="68" y1="30" x2="78" y2="30" stroke="#CBD5E1" stroke-width="1"/>
          <circle cx="90" cy="30" r="12" fill="rgba(15,118,110,0.1)" stroke="#0F766E" stroke-width="1"/><text x="86" y="34" font-size="10" fill="#0F766E" font-weight="700" font-family="Source Sans 3">6</text>
          <line x1="103" y1="30" x2="113" y2="30" stroke="#CBD5E1" stroke-width="1"/>
          <circle cx="125" cy="30" r="12" fill="rgba(109,40,217,0.1)" stroke="#6D28D9" stroke-width="1"/><text x="119" y="34" font-size="9" fill="#6D28D9" font-weight="700" font-family="Source Sans 3">12</text>
          <text x="35" y="18" font-size="7" fill="#94A3B8" font-family="Source Sans 3">|</text>
          <text x="70" y="18" font-size="7" fill="#94A3B8" font-family="Source Sans 3">|</text>
          <text x="105" y="18" font-size="7" fill="#94A3B8" font-family="Source Sans 3">|</text>
          <text x="50" y="55" font-size="8" fill="#64748B" font-family="Source Sans 3">1 | 2 | 6 | 12</text>
        </svg>
        <div class="cell-label">Divisibility Chain</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Modular Arithmetic & Sieves</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 130" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Modular arithmetic clock (mod 7) -->
          <circle cx="80" cy="60" r="45" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
          <!-- Numbers 0-6 around the clock -->
          <text x="76" y="22" font-size="12" fill="#1E3A8A" font-weight="700" text-anchor="middle" font-family="Source Sans 3">0</text>
          <text x="113" y="30" font-size="12" fill="#111827" text-anchor="middle" font-family="Source Sans 3">1</text>
          <text x="126" y="62" font-size="12" fill="#111827" text-anchor="middle" font-family="Source Sans 3">2</text>
          <text x="113" y="93" font-size="12" fill="#0F766E" font-weight="700" text-anchor="middle" font-family="Source Sans 3">3</text>
          <text x="80" y="110" font-size="12" fill="#111827" text-anchor="middle" font-family="Source Sans 3">4</text>
          <text x="47" y="93" font-size="12" fill="#111827" text-anchor="middle" font-family="Source Sans 3">5</text>
          <text x="34" y="62" font-size="12" fill="#111827" text-anchor="middle" font-family="Source Sans 3">6</text>
          <!-- Dots on circle -->
          <circle cx="80" cy="16" r="3" fill="#1E3A8A"/><circle cx="115" cy="26" r="2.5" fill="#475569"/>
          <circle cx="125" cy="58" r="2.5" fill="#475569"/><circle cx="115" cy="88" r="3" fill="#0F766E"/>
          <circle cx="80" cy="104" r="2.5" fill="#475569"/><circle cx="45" cy="88" r="2.5" fill="#475569"/>
          <circle cx="35" cy="58" r="2.5" fill="#475569"/>
          <!-- Arrow showing +3 -->
          <path d="M84 16 Q115 10 118 28" fill="none" stroke="#B45309" stroke-width="1.2"/>
          <text x="100" y="9" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">+3</text>
          <text x="55" y="128" font-size="8" fill="#64748B" font-family="Source Sans 3">ℤ/7ℤ</text>
        </svg>
        <div class="cell-label">Modular Clock (ℤ/7ℤ)</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 130" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Sieve of Eratosthenes grid (partial) -->
          <text x="5" y="10" font-size="8" fill="#64748B" font-weight="600" font-family="Source Sans 3">Sieve of Eratosthenes</text>
          <!-- 5×6 grid: 1-30 -->
          <text x="12" y="32" font-size="9" fill="#94A3B8" font-family="Source Sans 3" text-decoration="line-through">1</text>
          <text x="36" y="32" font-size="9" fill="#2563EB" font-weight="700" font-family="Source Sans 3">2</text>
          <text x="60" y="32" font-size="9" fill="#0F766E" font-weight="700" font-family="Source Sans 3">3</text>
          <text x="82" y="32" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">4</text>
          <text x="104" y="32" font-size="9" fill="#B45309" font-weight="700" font-family="Source Sans 3">5</text>
          <text x="128" y="32" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">6</text>
          <text x="12" y="50" font-size="9" fill="#6D28D9" font-weight="700" font-family="Source Sans 3">7</text>
          <text x="36" y="50" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">8</text>
          <text x="60" y="50" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">9</text>
          <text x="80" y="50" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">10</text>
          <text x="104" y="50" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">11</text>
          <text x="126" y="50" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">12</text>
          <text x="10" y="68" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">13</text>
          <text x="34" y="68" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">14</text>
          <text x="58" y="68" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">15</text>
          <text x="80" y="68" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">16</text>
          <text x="104" y="68" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">17</text>
          <text x="126" y="68" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">18</text>
          <text x="10" y="86" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">19</text>
          <text x="34" y="86" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">20</text>
          <text x="58" y="86" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">21</text>
          <text x="80" y="86" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">22</text>
          <text x="104" y="86" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">23</text>
          <text x="126" y="86" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">24</text>
          <text x="10" y="104" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">25</text>
          <text x="34" y="104" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">26</text>
          <text x="58" y="104" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">27</text>
          <text x="80" y="104" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">28</text>
          <text x="104" y="104" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">29</text>
          <text x="126" y="104" font-size="9" fill="#CBD5E1" font-family="Source Sans 3">30</text>
          <!-- Legend -->
          <circle cx="15" cy="122" r="3" fill="#2563EB"/><text x="22" y="125" font-size="7" fill="#64748B" font-family="Source Sans 3">prime</text>
          <circle cx="60" cy="122" r="3" fill="#CBD5E1"/><text x="67" y="125" font-size="7" fill="#64748B" font-family="Source Sans 3">composite</text>
        </svg>
        <div class="cell-label">Sieve of Eratosthenes</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Factor Structures</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Factor lattice of 30 -->
          <line x1="80" y1="10" x2="35" y2="35" stroke="#CBD5E1" stroke-width="0.8"/><line x1="80" y1="10" x2="80" y2="35" stroke="#CBD5E1" stroke-width="0.8"/><line x1="80" y1="10" x2="125" y2="35" stroke="#CBD5E1" stroke-width="0.8"/>
          <line x1="35" y1="35" x2="25" y2="65" stroke="#CBD5E1" stroke-width="0.8"/><line x1="35" y1="35" x2="60" y2="65" stroke="#CBD5E1" stroke-width="0.8"/>
          <line x1="80" y1="35" x2="25" y2="65" stroke="#CBD5E1" stroke-width="0.8"/><line x1="80" y1="35" x2="100" y2="65" stroke="#CBD5E1" stroke-width="0.8"/>
          <line x1="125" y1="35" x2="60" y2="65" stroke="#CBD5E1" stroke-width="0.8"/><line x1="125" y1="35" x2="100" y2="65" stroke="#CBD5E1" stroke-width="0.8"/>
          <line x1="25" y1="65" x2="60" y2="95" stroke="#CBD5E1" stroke-width="0.8"/><line x1="60" y1="65" x2="60" y2="95" stroke="#CBD5E1" stroke-width="0.8"/><line x1="100" y1="65" x2="60" y2="95" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- Nodes -->
          <circle cx="80" cy="10" r="4" fill="#1E3A8A"/><text x="86" y="14" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">30</text>
          <circle cx="35" cy="35" r="4" fill="#2563EB"/><text x="16" y="33" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">15</text>
          <circle cx="80" cy="35" r="4" fill="#2563EB"/><text x="85" y="33" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">10</text>
          <circle cx="125" cy="35" r="4" fill="#2563EB"/><text x="130" y="33" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">6</text>
          <circle cx="25" cy="65" r="4" fill="#0F766E"/><text x="8" y="63" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">5</text>
          <circle cx="60" cy="65" r="4" fill="#0F766E"/><text x="65" y="63" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">3</text>
          <circle cx="100" cy="65" r="4" fill="#0F766E"/><text x="105" y="63" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">2</text>
          <circle cx="60" cy="95" r="4" fill="#6D28D9"/><text x="66" y="99" font-size="9" fill="#6D28D9" font-weight="600" font-family="Source Sans 3">1</text>
        </svg>
        <div class="cell-label">Divisor Lattice of 30</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- GCD computation (Euclidean algorithm steps) -->
          <text x="10" y="16" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">gcd(48, 18)</text>
          <text x="10" y="34" font-size="9" fill="#111827" font-family="Source Sans 3">48 = 2 × 18 + <tspan fill="#2563EB" font-weight="700">12</tspan></text>
          <text x="10" y="50" font-size="9" fill="#111827" font-family="Source Sans 3">18 = 1 × 12 + <tspan fill="#2563EB" font-weight="700">6</tspan></text>
          <text x="10" y="66" font-size="9" fill="#111827" font-family="Source Sans 3">12 = 2 × 6 + <tspan fill="#0F766E" font-weight="700">0</tspan></text>
          <line x1="10" y1="72" x2="140" y2="72" stroke="#E2E8F0" stroke-width="0.5"/>
          <text x="10" y="86" font-size="10" fill="#0F766E" font-weight="700" font-family="Source Sans 3">∴ gcd(48, 18) = 6</text>
          <!-- Visual: bar comparison -->
          <rect x="10" y="94" width="96" height="6" fill="rgba(37,99,235,0.15)" stroke="#2563EB" stroke-width="0.5" rx="1"/>
          <text x="110" y="100" font-size="7" fill="#2563EB" font-family="Source Sans 3">48</text>
          <rect x="10" y="102" width="36" height="6" fill="rgba(15,118,110,0.15)" stroke="#0F766E" stroke-width="0.5" rx="1"/>
          <text x="50" y="108" font-size="7" fill="#0F766E" font-family="Source Sans 3">18</text>
        </svg>
        <div class="cell-label">Euclidean Algorithm</div>
      </div>
    </div>
  </div>
</body>
</html>
