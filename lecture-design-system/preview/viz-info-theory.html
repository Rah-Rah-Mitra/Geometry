<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Entropy &amp; Information Measures</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Information Venn: H(X), H(Y), I(X;Y) -->
          <circle cx="60" cy="60" r="42" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1.2"/>
          <circle cx="100" cy="60" r="42" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1.2"/>
          <!-- Region labels -->
          <text x="28" y="58" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">H(X|Y)</text>
          <text x="68" y="54" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">I(X;Y)</text>
          <text x="110" y="58" font-size="8" fill="#0F766E" font-weight="600" font-family="Source Sans 3">H(Y|X)</text>
          <!-- Outer labels -->
          <text x="35" y="22" font-size="9" fill="#2563EB" font-weight="700" font-family="Source Sans 3">H(X)</text>
          <text x="105" y="22" font-size="9" fill="#0F766E" font-weight="700" font-family="Source Sans 3">H(Y)</text>
          <!-- Joint entropy bracket -->
          <line x1="15" y1="108" x2="145" y2="108" stroke="#B45309" stroke-width="0.8"/>
          <line x1="15" y1="105" x2="15" y2="111" stroke="#B45309" stroke-width="0.8"/>
          <line x1="145" y1="105" x2="145" y2="111" stroke="#B45309" stroke-width="0.8"/>
          <text x="60" y="118" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">H(X,Y)</text>
        </svg>
        <div class="cell-label">Information Venn Diagram</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Binary entropy function -->
          <line x1="15" y1="100" x2="150" y2="100" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="15" y1="10" x2="15" y2="100" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- H(p) curve -->
          <path d="M16 100 Q25 70 40 42 Q55 24 75 16 Q80 15 85 16 Q105 24 120 42 Q135 70 144 100" fill="none" stroke="#2563EB" stroke-width="1.8"/>
          <!-- Peak at p=0.5 -->
          <line x1="80" y1="15" x2="80" y2="100" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="2 2"/>
          <circle cx="80" cy="15" r="2.5" fill="#2563EB"/>
          <!-- Axis labels -->
          <text x="12" y="112" font-size="7" fill="#64748B" font-family="Source Sans 3">0</text>
          <text x="76" y="112" font-size="7" fill="#64748B" font-family="Source Sans 3">0.5</text>
          <text x="140" y="112" font-size="7" fill="#64748B" font-family="Source Sans 3">1</text>
          <text x="3" y="18" font-size="7" fill="#64748B" font-family="Source Sans 3">1</text>
          <text x="85" y="12" font-size="7" fill="#2563EB" font-weight="600" font-family="Source Sans 3">max = 1 bit</text>
          <text x="60" y="80" font-size="8" fill="#1E3A8A" font-weight="600" font-family="Source Sans 3">H(p)</text>
        </svg>
        <div class="cell-label">Binary Entropy Function</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Channels &amp; Coding</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Binary symmetric channel -->
          <defs><marker id="ica" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
          <!-- Input -->
          <circle cx="25" cy="30" r="12" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <text x="21" y="34" font-size="11" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">0</text>
          <circle cx="25" cy="80" r="12" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <text x="21" y="84" font-size="11" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">1</text>
          <!-- Output -->
          <circle cx="135" cy="30" r="12" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1"/>
          <text x="131" y="34" font-size="11" fill="#0F766E" font-weight="700" font-family="Source Sans 3">0</text>
          <circle cx="135" cy="80" r="12" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1"/>
          <text x="131" y="84" font-size="11" fill="#0F766E" font-weight="700" font-family="Source Sans 3">1</text>
          <!-- Correct paths -->
          <line x1="38" y1="30" x2="121" y2="30" stroke="#475569" stroke-width="1" marker-end="url(#ica)"/>
          <text x="68" y="25" font-size="8" fill="#0F766E" font-weight="600" font-family="Source Sans 3">1-p</text>
          <line x1="38" y1="80" x2="121" y2="80" stroke="#475569" stroke-width="1" marker-end="url(#ica)"/>
          <text x="68" y="76" font-size="8" fill="#0F766E" font-weight="600" font-family="Source Sans 3">1-p</text>
          <!-- Error paths (crossed) -->
          <line x1="38" y1="35" x2="121" y2="75" stroke="#B45309" stroke-width="0.8" marker-end="url(#ica)" stroke-dasharray="3 2"/>
          <line x1="38" y1="75" x2="121" y2="35" stroke="#B45309" stroke-width="0.8" marker-end="url(#ica)" stroke-dasharray="3 2"/>
          <text x="72" y="50" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">p</text>
          <text x="72" y="68" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">p</text>
          <!-- Capacity -->
          <text x="25" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">C = 1 - H(p) bits</text>
        </svg>
        <div class="cell-label">Binary Symmetric Channel</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Channel capacity vs SNR -->
          <line x1="15" y1="90" x2="150" y2="90" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="15" y1="10" x2="15" y2="90" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- Shannon capacity curve: C = log2(1 + SNR) -->
          <path d="M16 88 Q25 75 40 58 Q60 40 80 30 Q100 22 120 17 Q140 14 150 12" fill="none" stroke="#2563EB" stroke-width="1.8"/>
          <!-- Shannon limit line -->
          <line x1="15" y1="88" x2="50" y2="55" stroke="#B45309" stroke-width="1" stroke-dasharray="3 2"/>
          <text x="30" y="50" font-size="7" fill="#B45309" font-family="Source Sans 3">-1.6 dB limit</text>
          <!-- Labels -->
          <text x="60" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">SNR (dB)</text>
          <text x="4" y="50" font-size="7" fill="#64748B" font-family="Source Sans 3" transform="rotate(-90,8,50)">C (bits/s/Hz)</text>
          <text x="90" y="22" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">Shannon</text>
          <text x="90" y="32" font-size="7" fill="#64748B" font-family="Source Sans 3">log2(1+SNR)</text>
        </svg>
        <div class="cell-label">Channel Capacity vs SNR</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Source Coding &amp; KL Divergence</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- KL divergence: two distributions -->
          <line x1="10" y1="90" x2="150" y2="90" stroke="#CBD5E1" stroke-width="1"/>
          <!-- P distribution -->
          <path d="M20 88 Q35 78 50 55 Q60 32 70 22 Q75 18 80 22 Q90 32 100 55 Q115 78 130 88" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1.5"/>
          <!-- Q distribution (shifted) -->
          <path d="M45 88 Q55 80 65 62 Q75 40 85 28 Q90 24 95 28 Q105 40 115 62 Q125 80 140 88" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="4 2"/>
          <!-- Labels -->
          <text x="30" y="40" font-size="9" fill="#2563EB" font-weight="700" font-family="Source Sans 3">P</text>
          <text x="118" y="50" font-size="9" fill="#0F766E" font-weight="700" font-family="Source Sans 3">Q</text>
          <!-- KL annotation -->
          <text x="25" y="106" font-size="7" fill="#1E3A8A" font-weight="600" font-family="Source Sans 3">KL(P||Q) = sum P log(P/Q)</text>
        </svg>
        <div class="cell-label">KL Divergence</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Rate-distortion tradeoff -->
          <line x1="15" y1="95" x2="150" y2="95" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="15" y1="10" x2="15" y2="95" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- R(D) curve -->
          <path d="M16 15 Q20 18 28 30 Q40 50 55 65 Q75 78 100 86 Q125 90 148 92" fill="none" stroke="#2563EB" stroke-width="1.8"/>
          <!-- Achievable region -->
          <path d="M16 15 Q20 18 28 30 Q40 50 55 65 Q75 78 100 86 Q125 90 148 92 L148 10 L16 10 Z" fill="rgba(37,99,235,0.05)" stroke="none"/>
          <text x="80" y="40" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">achievable</text>
          <text x="40" y="88" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">not achievable</text>
          <!-- Axis labels -->
          <text x="70" y="108" font-size="7" fill="#64748B" font-family="Source Sans 3">distortion D</text>
          <text x="4" y="55" font-size="7" fill="#64748B" font-family="Source Sans 3" transform="rotate(-90,8,55)">rate R</text>
          <text x="20" y="22" font-size="8" fill="#1E3A8A" font-weight="600" font-family="Source Sans 3">R(D)</text>
        </svg>
        <div class="cell-label">Rate-Distortion Function</div>
      </div>
    </div>
  </div>
</body>
</html>
