<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Distributions</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Chi-squared distribution -->
          <line x1="15" y1="90" x2="150" y2="90" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="15" y1="10" x2="15" y2="90" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- k=2 -->
          <path d="M16 20 Q20 40 30 60 Q50 82 80 87 Q120 89 148 89" fill="none" stroke="#2563EB" stroke-width="1.5"/>
          <!-- k=4 -->
          <path d="M16 88 Q25 70 35 50 Q45 38 55 35 Q70 40 90 65 Q120 82 148 87" fill="none" stroke="#0F766E" stroke-width="1.5"/>
          <!-- k=8 -->
          <path d="M16 89 Q30 88 45 80 Q60 55 75 38 Q85 32 95 35 Q115 50 135 72 Q145 80 148 84" fill="none" stroke="#B45309" stroke-width="1.5"/>
          <!-- Legend -->
          <line x1="100" y1="14" x2="115" y2="14" stroke="#2563EB" stroke-width="1.5"/><text x="118" y="17" font-size="7" fill="#2563EB" font-family="Source Sans 3" font-weight="600">k=2</text>
          <line x1="100" y1="24" x2="115" y2="24" stroke="#0F766E" stroke-width="1.5"/><text x="118" y="27" font-size="7" fill="#0F766E" font-family="Source Sans 3" font-weight="600">k=4</text>
          <line x1="100" y1="34" x2="115" y2="34" stroke="#B45309" stroke-width="1.5"/><text x="118" y="37" font-size="7" fill="#B45309" font-family="Source Sans 3" font-weight="600">k=8</text>
          <text x="70" y="104" font-size="8" fill="#64748B" font-family="Source Sans 3">x</text>
        </svg>
        <div class="cell-label">Chi-Squared Distribution</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Student t vs Normal -->
          <line x1="10" y1="90" x2="150" y2="90" stroke="#CBD5E1" stroke-width="1"/>
          <!-- Normal (narrow) -->
          <path d="M15 88 Q30 86 45 78 Q60 55 70 30 Q75 18 80 18 Q85 18 90 30 Q100 55 115 78 Q130 86 145 88" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1.5"/>
          <!-- t-distribution (fatter tails) -->
          <path d="M10 85 Q25 82 40 75 Q55 58 68 38 Q75 28 80 28 Q85 28 92 38 Q105 58 120 75 Q135 82 150 85" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 2"/>
          <!-- Labels -->
          <text x="96" y="24" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">N(0,1)</text>
          <text x="105" y="40" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">t(3)</text>
          <!-- Tail annotation -->
          <path d="M130 80 L140 75" stroke="#B45309" stroke-width="0.6"/>
          <text x="128" y="72" font-size="6" fill="#B45309" font-family="Source Sans 3">heavier tail</text>
        </svg>
        <div class="cell-label">Student-t vs Normal</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Regression &amp; Confidence</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Linear regression with CI band -->
          <line x1="15" y1="95" x2="150" y2="95" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="15" y1="10" x2="15" y2="95" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- CI band -->
          <path d="M20 82 Q50 62 80 50 Q110 38 145 22" fill="none" stroke="none"/>
          <path d="M20 88 Q50 72 80 60 Q110 50 145 38 L145 12 Q110 26 80 38 Q50 50 20 72 Z" fill="rgba(37,99,235,0.08)" stroke="none"/>
          <!-- Regression line -->
          <line x1="20" y1="80" x2="145" y2="25" stroke="#2563EB" stroke-width="1.5"/>
          <!-- Data points -->
          <circle cx="25" cy="78" r="2.5" fill="#1E3A8A"/><circle cx="35" cy="72" r="2.5" fill="#1E3A8A"/>
          <circle cx="45" cy="68" r="2.5" fill="#1E3A8A"/><circle cx="55" cy="58" r="2.5" fill="#1E3A8A"/>
          <circle cx="65" cy="62" r="2.5" fill="#1E3A8A"/><circle cx="78" cy="50" r="2.5" fill="#1E3A8A"/>
          <circle cx="88" cy="48" r="2.5" fill="#1E3A8A"/><circle cx="100" cy="40" r="2.5" fill="#1E3A8A"/>
          <circle cx="112" cy="38" r="2.5" fill="#1E3A8A"/><circle cx="125" cy="30" r="2.5" fill="#1E3A8A"/>
          <circle cx="138" cy="28" r="2.5" fill="#1E3A8A"/>
          <!-- Residual example -->
          <line x1="55" y1="58" x2="55" y2="65" stroke="#B45309" stroke-width="0.8" stroke-dasharray="2 1"/>
          <text x="58" y="65" font-size="6" fill="#B45309" font-family="Source Sans 3">residual</text>
          <text x="100" y="106" font-size="8" fill="#64748B" font-family="Source Sans 3">95% CI band</text>
        </svg>
        <div class="cell-label">Linear Regression + CI</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Hypothesis testing: rejection regions -->
          <line x1="10" y1="85" x2="150" y2="85" stroke="#CBD5E1" stroke-width="1"/>
          <!-- Bell curve -->
          <path d="M12 84 Q25 82 38 76 Q52 60 65 38 Q72 22 80 18 Q88 22 95 38 Q108 60 122 76 Q135 82 148 84" fill="rgba(37,99,235,0.06)" stroke="#2563EB" stroke-width="1.2"/>
          <!-- Rejection region left -->
          <path d="M12 84 Q18 83 24 82 Q30 78 36 74 L36 85 L12 85 Z" fill="rgba(180,83,9,0.2)" stroke="none"/>
          <!-- Rejection region right -->
          <path d="M124 74 Q130 78 136 82 Q142 83 148 84 L148 85 L124 85 Z" fill="rgba(180,83,9,0.2)" stroke="none"/>
          <!-- Critical values -->
          <line x1="36" y1="74" x2="36" y2="90" stroke="#B45309" stroke-width="1" stroke-dasharray="2 1.5"/>
          <line x1="124" y1="74" x2="124" y2="90" stroke="#B45309" stroke-width="1" stroke-dasharray="2 1.5"/>
          <text x="24" y="100" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">-z*</text>
          <text x="118" y="100" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">+z*</text>
          <!-- Labels -->
          <text x="60" y="70" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">fail to reject</text>
          <text x="5" y="72" font-size="6" fill="#B45309" font-weight="600" font-family="Source Sans 3">reject</text>
          <text x="130" y="72" font-size="6" fill="#B45309" font-weight="600" font-family="Source Sans 3">reject</text>
          <!-- H0 -->
          <text x="70" y="14" font-size="8" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">H0: mu = mu0</text>
        </svg>
        <div class="cell-label">Two-Tailed Hypothesis Test</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Bayesian &amp; Estimation</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Bayes: prior x likelihood = posterior -->
          <line x1="10" y1="88" x2="150" y2="88" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- Prior (wide) -->
          <path d="M10 86 Q30 80 50 65 Q65 50 75 46 Q85 50 100 65 Q120 80 140 86" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 2"/>
          <!-- Likelihood (shifted) -->
          <path d="M40 87 Q55 82 70 65 Q80 42 90 30 Q100 42 110 65 Q125 82 145 87" fill="none" stroke="#0F766E" stroke-width="1.2"/>
          <!-- Posterior (between, narrower) -->
          <path d="M35 87 Q50 82 65 68 Q75 45 85 32 Q92 38 100 55 Q112 75 130 85" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1.8"/>
          <!-- Labels -->
          <text x="15" y="60" font-size="8" fill="#94A3B8" font-weight="600" font-family="Source Sans 3">prior</text>
          <text x="115" y="52" font-size="8" fill="#0F766E" font-weight="600" font-family="Source Sans 3">likelihood</text>
          <text x="60" y="26" font-size="8" fill="#2563EB" font-weight="700" font-family="Source Sans 3">posterior</text>
          <text x="20" y="104" font-size="7" fill="#64748B" font-family="Source Sans 3">p(x|D) = p(D|x)p(x) / p(D)</text>
        </svg>
        <div class="cell-label">Bayesian Update</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- QQ plot -->
          <line x1="20" y1="95" x2="145" y2="95" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="20" y1="10" x2="20" y2="95" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- Reference line -->
          <line x1="25" y1="90" x2="140" y2="15" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 2"/>
          <!-- Points following the line mostly -->
          <circle cx="30" cy="86" r="2" fill="#2563EB"/><circle cx="38" cy="80" r="2" fill="#2563EB"/>
          <circle cx="45" cy="74" r="2" fill="#2563EB"/><circle cx="52" cy="70" r="2" fill="#2563EB"/>
          <circle cx="58" cy="64" r="2" fill="#2563EB"/><circle cx="66" cy="58" r="2" fill="#2563EB"/>
          <circle cx="74" cy="52" r="2" fill="#2563EB"/><circle cx="82" cy="46" r="2" fill="#2563EB"/>
          <circle cx="90" cy="40" r="2" fill="#2563EB"/><circle cx="98" cy="35" r="2" fill="#2563EB"/>
          <!-- Tail deviations -->
          <circle cx="108" cy="32" r="2" fill="#B45309"/><circle cx="118" cy="22" r="2" fill="#B45309"/>
          <circle cx="130" cy="14" r="2" fill="#B45309"/>
          <text x="52" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">theoretical quantiles</text>
          <text x="4" y="55" font-size="7" fill="#64748B" font-family="Source Sans 3" transform="rotate(-90,8,55)">sample quantiles</text>
          <text x="115" y="40" font-size="6" fill="#B45309" font-family="Source Sans 3">tail deviation</text>
        </svg>
        <div class="cell-label">Q-Q Plot</div>
      </div>
    </div>
  </div>
</body>
</html>
