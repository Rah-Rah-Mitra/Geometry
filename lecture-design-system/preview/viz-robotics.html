<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">State Estimation</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Kalman filter: predict-update cycle -->
          <defs><marker id="kfa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E3A8A"/></marker></defs>
          <!-- Predict box -->
          <rect x="10" y="30" width="55" height="35" rx="4" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <text x="18" y="44" font-size="7" fill="#2563EB" font-weight="700" font-family="Source Sans 3">PREDICT</text>
          <text x="15" y="56" font-size="6" fill="#475569" font-family="Source Sans 3">x = Fx + Bu</text>
          <text x="15" y="63" font-size="6" fill="#475569" font-family="Source Sans 3">P = FPF'+Q</text>
          <!-- Update box -->
          <rect x="95" y="30" width="55" height="35" rx="4" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1"/>
          <text x="105" y="44" font-size="7" fill="#0F766E" font-weight="700" font-family="Source Sans 3">UPDATE</text>
          <text x="100" y="56" font-size="6" fill="#475569" font-family="Source Sans 3">K = PH'(HPH'+R)^-1</text>
          <text x="100" y="63" font-size="6" fill="#475569" font-family="Source Sans 3">x = x + K(z-Hx)</text>
          <!-- Arrows -->
          <line x1="66" y1="42" x2="93" y2="42" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#kfa)"/>
          <path d="M122 66 Q122 90 80 90 Q38 90 38 66" fill="none" stroke="#1E3A8A" stroke-width="1" marker-end="url(#kfa)"/>
          <!-- Measurement input -->
          <line x1="122" y1="20" x2="122" y2="28" stroke="#B45309" stroke-width="1" marker-end="url(#kfa)"/>
          <text x="110" y="16" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">z (meas)</text>
          <!-- Loop label -->
          <text x="62" y="86" font-size="7" fill="#1E3A8A" font-weight="600" font-family="Source Sans 3">repeat</text>
          <text x="35" y="110" font-size="7" fill="#64748B" font-family="Source Sans 3">Linear Kalman Filter</text>
        </svg>
        <div class="cell-label">Kalman Filter Cycle</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Covariance ellipses: predict grows, update shrinks -->
          <!-- Axes -->
          <line x1="10" y1="60" x2="150" y2="60" stroke="#E2E8F0" stroke-width="0.5"/>
          <line x1="80" y1="5" x2="80" y2="115" stroke="#E2E8F0" stroke-width="0.5"/>
          <!-- Prior (large, gray) -->
          <ellipse cx="72" cy="55" rx="45" ry="30" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 2" transform="rotate(-15,72,55)"/>
          <text x="18" y="32" font-size="7" fill="#94A3B8" font-weight="600" font-family="Source Sans 3">prior P-</text>
          <!-- Measurement ellipse -->
          <ellipse cx="90" cy="52" rx="20" ry="38" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="3 2" transform="rotate(10,90,52)"/>
          <text x="112" y="25" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">meas R</text>
          <!-- Posterior (small, solid) -->
          <ellipse cx="82" cy="52" rx="16" ry="14" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1.5" transform="rotate(-5,82,52)"/>
          <circle cx="82" cy="52" r="2.5" fill="#2563EB"/>
          <text x="62" y="72" font-size="7" fill="#2563EB" font-weight="700" font-family="Source Sans 3">posterior P+</text>
          <text x="30" y="108" font-size="7" fill="#64748B" font-family="Source Sans 3">covariance intersection</text>
        </svg>
        <div class="cell-label">Covariance Ellipses</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Factor Graphs &amp; SLAM</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Factor graph -->
          <defs><marker id="fga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
          <!-- Variable nodes (circles) -->
          <circle cx="25" cy="30" r="12" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1.2"/>
          <text x="18" y="34" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">x1</text>
          <circle cx="75" cy="30" r="12" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1.2"/>
          <text x="68" y="34" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">x2</text>
          <circle cx="125" cy="30" r="12" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1.2"/>
          <text x="118" y="34" font-size="9" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">x3</text>
          <!-- Landmark -->
          <circle cx="75" cy="90" r="12" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1.2"/>
          <text x="69" y="94" font-size="9" fill="#0F766E" font-weight="700" font-family="Source Sans 3">L1</text>
          <!-- Factor nodes (squares) -->
          <rect x="44" y="22" width="12" height="12" rx="1" fill="#1E3A8A"/>
          <rect x="94" y="22" width="12" height="12" rx="1" fill="#1E3A8A"/>
          <!-- Observation factors -->
          <rect x="44" y="58" width="12" height="12" rx="1" fill="#B45309"/>
          <rect x="94" y="58" width="12" height="12" rx="1" fill="#B45309"/>
          <!-- Prior factor -->
          <rect x="5" y="22" width="8" height="12" rx="1" fill="#6D28D9"/>
          <!-- Edges -->
          <line x1="14" y1="28" x2="13" y2="28" stroke="#475569" stroke-width="0.8"/>
          <line x1="37" y1="28" x2="44" y2="28" stroke="#475569" stroke-width="0.8"/>
          <line x1="56" y1="28" x2="63" y2="28" stroke="#475569" stroke-width="0.8"/>
          <line x1="87" y1="28" x2="94" y2="28" stroke="#475569" stroke-width="0.8"/>
          <line x1="106" y1="28" x2="113" y2="28" stroke="#475569" stroke-width="0.8"/>
          <line x1="50" y1="34" x2="50" y2="58" stroke="#475569" stroke-width="0.8"/>
          <line x1="100" y1="34" x2="100" y2="58" stroke="#475569" stroke-width="0.8"/>
          <line x1="50" y1="70" x2="68" y2="82" stroke="#475569" stroke-width="0.8"/>
          <line x1="100" y1="70" x2="82" y2="82" stroke="#475569" stroke-width="0.8"/>
          <!-- Legend -->
          <circle cx="15" y="106" r="4" fill="none" stroke="#2563EB" stroke-width="0.8" cx="15" cy="104"/>
          <text x="22" y="107" font-size="6" fill="#64748B" font-family="Source Sans 3">variable</text>
          <rect x="55" y="100" width="6" height="6" fill="#1E3A8A" rx="1"/>
          <text x="64" y="107" font-size="6" fill="#64748B" font-family="Source Sans 3">factor</text>
        </svg>
        <div class="cell-label">Factor Graph (SLAM)</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Coordinate frames / transforms -->
          <defs>
            <marker id="rfx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#2563EB"/></marker>
            <marker id="rfy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#0F766E"/></marker>
            <marker id="rfz" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#B45309"/></marker>
          </defs>
          <!-- World frame -->
          <line x1="25" y1="80" x2="65" y2="80" stroke="#2563EB" stroke-width="1.5" marker-end="url(#rfx)"/>
          <line x1="25" y1="80" x2="25" y2="40" stroke="#0F766E" stroke-width="1.5" marker-end="url(#rfy)"/>
          <line x1="25" y1="80" x2="10" y2="95" stroke="#B45309" stroke-width="1" marker-end="url(#rfz)"/>
          <text x="67" y="84" font-size="7" fill="#2563EB" font-weight="600" font-family="Source Sans 3">x</text>
          <text x="27" y="38" font-size="7" fill="#0F766E" font-weight="600" font-family="Source Sans 3">y</text>
          <text x="30" y="92" font-size="8" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">W</text>
          <!-- Body frame (rotated) -->
          <line x1="105" y1="55" x2="140" y2="42" stroke="#2563EB" stroke-width="1.5" marker-end="url(#rfx)"/>
          <line x1="105" y1="55" x2="92" y2="22" stroke="#0F766E" stroke-width="1.5" marker-end="url(#rfy)"/>
          <line x1="105" y1="55" x2="95" y2="68" stroke="#B45309" stroke-width="1" marker-end="url(#rfz)"/>
          <text x="142" y="44" font-size="7" fill="#2563EB" font-weight="600" font-family="Source Sans 3">x'</text>
          <text x="85" y="20" font-size="7" fill="#0F766E" font-weight="600" font-family="Source Sans 3">y'</text>
          <text x="108" y="68" font-size="8" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">B</text>
          <!-- Transform arrow -->
          <path d="M50 60 Q70 35 95 48" fill="none" stroke="#6D28D9" stroke-width="1.2" stroke-dasharray="3 2"/>
          <text x="58" y="38" font-size="7" fill="#6D28D9" font-weight="600" font-family="Source Sans 3">T_WB</text>
          <!-- SE(3) label -->
          <text x="30" y="108" font-size="7" fill="#64748B" font-family="Source Sans 3">T in SE(3) = {(R,t) | R in SO(3)}</text>
        </svg>
        <div class="cell-label">Coordinate Frames (SE3)</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Sensors &amp; Uncertainty</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Particle filter -->
          <!-- True state path -->
          <path d="M15 80 Q40 60 65 50 Q90 42 115 55 Q135 65 145 72" fill="none" stroke="#2563EB" stroke-width="1.2"/>
          <!-- Particles scattered around path -->
          <circle cx="18" cy="78" r="1.5" fill="#94A3B8"/><circle cx="22" cy="82" r="1.5" fill="#94A3B8"/><circle cx="14" cy="76" r="1.5" fill="#94A3B8"/>
          <circle cx="20" cy="84" r="1.5" fill="#94A3B8"/><circle cx="16" cy="72" r="1.5" fill="#94A3B8"/>
          <circle cx="40" cy="58" r="1.5" fill="#94A3B8"/><circle cx="44" cy="64" r="1.5" fill="#94A3B8"/>
          <circle cx="38" cy="55" r="1.5" fill="#94A3B8"/><circle cx="36" cy="62" r="1.5" fill="#94A3B8"/><circle cx="42" cy="68" r="1.5" fill="#94A3B8"/>
          <!-- After resampling: tighter cluster -->
          <circle cx="90" cy="40" r="2" fill="#0F766E"/><circle cx="92" cy="44" r="2" fill="#0F766E"/>
          <circle cx="88" cy="42" r="2" fill="#0F766E"/><circle cx="94" cy="38" r="2" fill="#0F766E"/>
          <circle cx="86" cy="45" r="2" fill="#0F766E"/><circle cx="91" cy="36" r="2" fill="#0F766E"/>
          <circle cx="93" cy="46" r="2" fill="#0F766E"/>
          <!-- Measurement -->
          <circle cx="90" cy="35" r="4" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="2 1.5"/>
          <text x="96" y="32" font-size="6" fill="#B45309" font-family="Source Sans 3">z</text>
          <!-- Labels -->
          <text x="8" y="100" font-size="7" fill="#94A3B8" font-family="Source Sans 3">spread</text>
          <text x="80" y="100" font-size="7" fill="#0F766E" font-family="Source Sans 3">resampled</text>
          <text x="40" y="16" font-size="8" fill="#1E3A8A" font-weight="600" font-family="Source Sans 3">Particle Filter</text>
        </svg>
        <div class="cell-label">Particle Filter</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Pose graph: robot trajectory -->
          <defs><marker id="pga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs>
          <!-- Trajectory -->
          <path d="M20 85 L50 60 L85 50 L120 60 L140 40" fill="none" stroke="#2563EB" stroke-width="1.2"/>
          <!-- Pose nodes with orientation triangles -->
          <polygon points="20,85 16,91 24,91" fill="#1E3A8A" transform="rotate(-45,20,85)"/>
          <polygon points="50,60 46,66 54,66" fill="#1E3A8A" transform="rotate(-30,50,60)"/>
          <polygon points="85,50 81,56 89,56" fill="#1E3A8A" transform="rotate(-10,85,50)"/>
          <polygon points="120,60 116,66 124,66" fill="#1E3A8A" transform="rotate(20,120,60)"/>
          <polygon points="140,40 136,46 144,46" fill="#1E3A8A" transform="rotate(-30,140,40)"/>
          <!-- Loop closure constraint -->
          <path d="M50 58 Q85 20 120 58" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="3 2"/>
          <text x="72" y="22" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">loop closure</text>
          <!-- Landmark observations -->
          <circle cx="70" cy="85" r="5" fill="rgba(15,118,110,0.15)" stroke="#0F766E" stroke-width="1"/>
          <text x="66" y="88" font-size="7" fill="#0F766E" font-weight="700" font-family="Source Sans 3">L</text>
          <line x1="50" y1="62" x2="68" y2="82" stroke="#94A3B8" stroke-width="0.6" stroke-dasharray="2 1.5"/>
          <line x1="85" y1="52" x2="72" y2="82" stroke="#94A3B8" stroke-width="0.6" stroke-dasharray="2 1.5"/>
          <text x="25" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">pose graph optimization</text>
        </svg>
        <div class="cell-label">Pose Graph (SLAM)</div>
      </div>
    </div>
  </div>
</body>
</html>
