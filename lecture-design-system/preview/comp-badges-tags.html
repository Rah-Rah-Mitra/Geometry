<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 18px 24px; }
  .label { font-size: 11px; color: #94A3B8; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }
  .section { margin-bottom: 14px; }
  .section:last-child { margin-bottom: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px;
    border: 1px solid #d8e0da; border-radius: 6px; font-size: 12px; font-weight: 500;
    color: #15211d; background: #fff;
  }
  .badge svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
  .tag {
    display: inline-block; padding: 4px 10px; border-radius: 6px;
    font-size: 12px; font-weight: 500;
  }
  .tag-soft { background: #edf2ef; color: #5d6b66; }
  .tag-accent { background: #087568; color: #fff; }
  .tag-border { background: #fff; border: 1px solid #d8e0da; color: #5d6b66; }
  .diff-badge {
    padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
    background: #edf2ef; color: #5d6b66;
  }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Runtime Badges</div>
    <div class="row">
      <span class="badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>Colab</span>
      <span class="badge"><svg viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>GitHub</span>
      <span class="badge"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download</span>
      <span class="badge"><svg viewBox="0 0 24 24"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>JupyterLite</span>
    </div>
  </div>
  <div class="section">
    <div class="label">Topic Tags</div>
    <div class="row">
      <span class="tag tag-soft">euclidean</span>
      <span class="tag tag-soft">differential</span>
      <span class="tag tag-accent">projective</span>
      <span class="tag tag-soft">topology</span>
      <span class="tag tag-border">manifolds</span>
      <span class="tag tag-soft">+3</span>
    </div>
  </div>
  <div class="section">
    <div class="label">Difficulty</div>
    <div class="row">
      <span class="diff-badge">Undergraduate</span>
      <span class="diff-badge">Graduate</span>
      <span class="diff-badge">Advanced</span>
    </div>
  </div>
</body>
</html>
