<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Spectral Distributions</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Wigner semicircle law -->
          <line x1="10" y1="95" x2="150" y2="95" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="80" y1="10" x2="80" y2="95" stroke="#E2E8F0" stroke-width="0.5" stroke-dasharray="2 2"/>
          <!-- Semicircle density -->
          <path d="M20 95 Q30 80 45 55 Q55 35 70 22 Q78 18 80 17 Q82 18 90 22 Q105 35 115 55 Q130 80 140 95" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1.8"/>
          <!-- Histogram bars behind -->
          <rect x="28" y="78" width="8" height="17" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <rect x="38" y="62" width="8" height="33" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <rect x="48" y="45" width="8" height="50" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <rect x="58" y="32" width="8" height="63" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <rect x="68" y="22" width="8" height="73" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <rect x="78" y="20" width="8" height="75" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <rect x="88" y="24" width="8" height="71" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <rect x="98" y="35" width="8" height="60" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <rect x="108" y="50" width="8" height="45" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <rect x="118" y="68" width="8" height="27" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <rect x="128" y="82" width="8" height="13" fill="rgba(30,58,138,0.12)" stroke="none" rx="1"/>
          <!-- Axis labels -->
          <text x="16" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">-2</text>
          <text x="78" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">0</text>
          <text x="136" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">+2</text>
          <text x="26" y="14" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">p(x) = (2/pi)sqrt(1-x^2)</text>
        </svg>
        <div class="cell-label">Wigner Semicircle Law</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Marchenko-Pastur distribution -->
          <line x1="10" y1="95" x2="150" y2="95" stroke="#CBD5E1" stroke-width="1"/>
          <!-- MP density (gamma=0.5) -->
          <path d="M25 95 Q28 60 35 38 Q42 28 50 32 Q60 40 70 50 Q85 62 100 72 Q115 80 130 86 Q140 90 142 95" fill="rgba(15,118,110,0.1)" stroke="#0F766E" stroke-width="1.8"/>
          <!-- Axis markers -->
          <line x1="25" y1="93" x2="25" y2="97" stroke="#475569" stroke-width="0.8"/>
          <text x="18" y="106" font-size="7" fill="#475569" font-family="Source Sans 3">a-</text>
          <line x1="142" y1="93" x2="142" y2="97" stroke="#475569" stroke-width="0.8"/>
          <text x="136" y="106" font-size="7" fill="#475569" font-family="Source Sans 3">a+</text>
          <!-- Labels -->
          <text x="60" y="18" font-size="8" fill="#0F766E" font-weight="600" font-family="Source Sans 3">Marchenko-Pastur</text>
          <text x="80" y="30" font-size="7" fill="#64748B" font-family="Source Sans 3">gamma = p/n</text>
          <!-- Bulk + edge notation -->
          <path d="M25 88 L28 84" stroke="#B45309" stroke-width="0.6"/>
          <text x="8" y="82" font-size="6" fill="#B45309" font-family="Source Sans 3">edge</text>
          <text x="70" y="78" font-size="7" fill="#0F766E" font-family="Source Sans 3">bulk</text>
        </svg>
        <div class="cell-label">Marchenko-Pastur Law</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Eigenvalue Statistics</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Level spacing / repulsion -->
          <line x1="10" y1="85" x2="150" y2="85" stroke="#CBD5E1" stroke-width="1"/>
          <!-- Eigenvalues on a line (GOE repulsion) -->
          <line x1="15" y1="45" x2="145" y2="45" stroke="#2563EB" stroke-width="1.5"/>
          <circle cx="22" cy="45" r="3.5" fill="#1E3A8A"/><circle cx="38" cy="45" r="3.5" fill="#1E3A8A"/>
          <circle cx="55" cy="45" r="3.5" fill="#1E3A8A"/><circle cx="72" cy="45" r="3.5" fill="#1E3A8A"/>
          <circle cx="90" cy="45" r="3.5" fill="#1E3A8A"/><circle cx="108" cy="45" r="3.5" fill="#1E3A8A"/>
          <circle cx="126" cy="45" r="3.5" fill="#1E3A8A"/><circle cx="140" cy="45" r="3.5" fill="#1E3A8A"/>
          <!-- Poisson (random, clustered) -->
          <line x1="15" y1="70" x2="145" y2="70" stroke="#B45309" stroke-width="1"/>
          <circle cx="18" cy="70" r="3" fill="#B45309" opacity="0.7"/><circle cx="22" cy="70" r="3" fill="#B45309" opacity="0.7"/>
          <circle cx="48" cy="70" r="3" fill="#B45309" opacity="0.7"/><circle cx="50" cy="70" r="3" fill="#B45309" opacity="0.7"/>
          <circle cx="52" cy="70" r="3" fill="#B45309" opacity="0.7"/>
          <circle cx="88" cy="70" r="3" fill="#B45309" opacity="0.7"/>
          <circle cx="115" cy="70" r="3" fill="#B45309" opacity="0.7"/><circle cx="118" cy="70" r="3" fill="#B45309" opacity="0.7"/>
          <circle cx="140" cy="70" r="3" fill="#B45309" opacity="0.7"/>
          <!-- Labels -->
          <text x="10" y="35" font-size="8" fill="#1E3A8A" font-weight="600" font-family="Source Sans 3">GOE (repulsion)</text>
          <text x="10" y="65" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">Poisson (no repulsion)</text>
          <!-- Spacing histogram hint -->
          <text x="30" y="100" font-size="7" fill="#64748B" font-family="Source Sans 3">uniform spacing vs. clustering</text>
        </svg>
        <div class="cell-label">Eigenvalue Repulsion</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Tracy-Widom distribution -->
          <line x1="10" y1="88" x2="150" y2="88" stroke="#CBD5E1" stroke-width="1"/>
          <!-- TW density (asymmetric, left-skewed) -->
          <path d="M15 87 Q25 86 35 84 Q45 78 55 65 Q65 42 75 25 Q82 18 88 20 Q95 28 102 45 Q108 60 112 72 Q118 80 125 84 Q135 87 148 87" fill="rgba(109,40,217,0.1)" stroke="#6D28D9" stroke-width="1.8"/>
          <!-- Mean marker -->
          <line x1="82" y1="16" x2="82" y2="92" stroke="#6D28D9" stroke-width="0.7" stroke-dasharray="3 2"/>
          <!-- Labels -->
          <text x="20" y="16" font-size="8" fill="#6D28D9" font-weight="600" font-family="Source Sans 3">Tracy-Widom (TW1)</text>
          <text x="60" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">largest eigenvalue</text>
          <!-- Skewness arrow -->
          <text x="25" y="72" font-size="6" fill="#475569" font-family="Source Sans 3">left skew</text>
        </svg>
        <div class="cell-label">Tracy-Widom Distribution</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Matrix Ensembles</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Matrix ensemble diagram: GOE/GUE/GSE -->
          <rect x="15" y="15" width="40" height="40" rx="3" fill="rgba(37,99,235,0.06)" stroke="#2563EB" stroke-width="1"/>
          <text x="22" y="40" font-size="11" fill="#2563EB" font-weight="700" font-family="Source Sans 3">GOE</text>
          <text x="18" y="68" font-size="7" fill="#64748B" font-family="Source Sans 3">real sym.</text>
          <text x="22" y="78" font-size="7" fill="#2563EB" font-weight="600" font-family="Source Sans 3">beta=1</text>
          <rect x="65" y="15" width="40" height="40" rx="3" fill="rgba(15,118,110,0.06)" stroke="#0F766E" stroke-width="1"/>
          <text x="72" y="40" font-size="11" fill="#0F766E" font-weight="700" font-family="Source Sans 3">GUE</text>
          <text x="68" y="68" font-size="7" fill="#64748B" font-family="Source Sans 3">Hermitian</text>
          <text x="72" y="78" font-size="7" fill="#0F766E" font-weight="600" font-family="Source Sans 3">beta=2</text>
          <rect x="115" y="15" width="40" height="40" rx="3" fill="rgba(109,40,217,0.06)" stroke="#6D28D9" stroke-width="1"/>
          <text x="122" y="40" font-size="11" fill="#6D28D9" font-weight="700" font-family="Source Sans 3">GSE</text>
          <text x="115" y="68" font-size="7" fill="#64748B" font-family="Source Sans 3">quaternion</text>
          <text x="122" y="78" font-size="7" fill="#6D28D9" font-weight="600" font-family="Source Sans 3">beta=4</text>
          <!-- Common property -->
          <line x1="15" y1="90" x2="155" y2="90" stroke="#E2E8F0" stroke-width="0.5"/>
          <text x="20" y="102" font-size="7" fill="#64748B" font-family="Source Sans 3">all: Gaussian entries, invariant under conjugation</text>
        </svg>
        <div class="cell-label">Classical Ensembles</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Free probability / addition -->
          <rect x="10" y="20" width="28" height="28" rx="2" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="0.8"/>
          <text x="17" y="38" font-size="11" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">A</text>
          <text x="42" y="38" font-size="12" fill="#475569" font-family="Source Sans 3">+</text>
          <rect x="52" y="20" width="28" height="28" rx="2" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="0.8"/>
          <text x="60" y="38" font-size="11" fill="#0F766E" font-weight="700" font-family="STIX Two Text" font-style="italic">B</text>
          <!-- Arrow -->
          <defs><marker id="rma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
          <line x1="84" y1="34" x2="98" y2="34" stroke="#475569" stroke-width="1" marker-end="url(#rma)"/>
          <!-- Result spectrum -->
          <line x1="100" y1="50" x2="155" y2="50" stroke="#CBD5E1" stroke-width="0.8"/>
          <path d="M102 48 Q110 35 118 24 Q125 18 128 18 Q131 18 138 24 Q145 35 152 48" fill="rgba(180,83,9,0.1)" stroke="#B45309" stroke-width="1.2"/>
          <text x="115" y="14" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">A+B spectrum</text>
          <!-- Formula -->
          <text x="10" y="72" font-size="7" fill="#1E3A8A" font-weight="600" font-family="Source Sans 3">Free convolution:</text>
          <text x="10" y="84" font-size="8" fill="#475569" font-family="Source Sans 3">R(A+B) = R(A) + R(B)</text>
          <text x="10" y="96" font-size="7" fill="#64748B" font-family="Source Sans 3">R-transform is additive</text>
        </svg>
        <div class="cell-label">Free Probability Addition</div>
      </div>
    </div>
  </div>
</body>
</html>
