<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Phase Portraits</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 120" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Stable node (sink) -->
          <line x1="10" y1="60" x2="140" y2="60" stroke="#E2E8F0" stroke-width="0.5"/>
          <line x1="75" y1="5" x2="75" y2="115" stroke="#E2E8F0" stroke-width="0.5"/>
          <defs><marker id="ppa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs>
          <!-- Trajectories spiraling in -->
          <line x1="20" y1="20" x2="55" y2="48" stroke="#2563EB" stroke-width="0.8" marker-end="url(#ppa)"/>
          <line x1="130" y1="20" x2="95" y2="48" stroke="#2563EB" stroke-width="0.8" marker-end="url(#ppa)"/>
          <line x1="20" y1="100" x2="55" y2="72" stroke="#2563EB" stroke-width="0.8" marker-end="url(#ppa)"/>
          <line x1="130" y1="100" x2="95" y2="72" stroke="#2563EB" stroke-width="0.8" marker-end="url(#ppa)"/>
          <line x1="20" y1="60" x2="55" y2="60" stroke="#2563EB" stroke-width="0.8" marker-end="url(#ppa)"/>
          <line x1="130" y1="60" x2="95" y2="60" stroke="#2563EB" stroke-width="0.8" marker-end="url(#ppa)"/>
          <line x1="75" y1="15" x2="75" y2="42" stroke="#2563EB" stroke-width="0.8" marker-end="url(#ppa)"/>
          <line x1="75" y1="105" x2="75" y2="78" stroke="#2563EB" stroke-width="0.8" marker-end="url(#ppa)"/>
          <!-- Fixed point -->
          <circle cx="75" cy="60" r="4" fill="#0F766E"/>
          <text x="82" y="58" font-size="8" fill="#0F766E" font-weight="700" font-family="Source Sans 3">stable</text>
          <text x="45" y="112" font-size="7" fill="#64748B" font-family="Source Sans 3">eigenvalues: Re &lt; 0</text>
        </svg>
        <div class="cell-label">Stable Node (Sink)</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 120" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Saddle point -->
          <line x1="10" y1="60" x2="140" y2="60" stroke="#E2E8F0" stroke-width="0.5"/>
          <line x1="75" y1="5" x2="75" y2="115" stroke="#E2E8F0" stroke-width="0.5"/>
          <defs><marker id="sa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
          <marker id="sb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs>
          <!-- Stable manifold (incoming) -->
          <line x1="20" y1="20" x2="58" y2="48" stroke="#0F766E" stroke-width="1" marker-end="url(#sa)"/>
          <line x1="130" y1="100" x2="92" y2="72" stroke="#0F766E" stroke-width="1" marker-end="url(#sa)"/>
          <!-- Unstable manifold (outgoing) -->
          <line x1="92" y1="48" x2="130" y2="20" stroke="#B45309" stroke-width="1" marker-end="url(#sb)"/>
          <line x1="58" y1="72" x2="20" y2="100" stroke="#B45309" stroke-width="1" marker-end="url(#sb)"/>
          <!-- Hyperbolic trajectories -->
          <path d="M20 40 Q45 50 58 56 Q68 59 75 60" fill="none" stroke="#94A3B8" stroke-width="0.6"/>
          <path d="M130 80 Q105 70 92 64 Q82 61 75 60" fill="none" stroke="#94A3B8" stroke-width="0.6"/>
          <!-- Saddle point -->
          <circle cx="75" cy="60" r="4" fill="white" stroke="#B45309" stroke-width="1.5"/>
          <text x="82" y="56" font-size="8" fill="#B45309" font-weight="700" font-family="Source Sans 3">saddle</text>
          <text x="25" y="16" font-size="7" fill="#0F766E" font-weight="600" font-family="Source Sans 3">stable</text>
          <text x="105" y="16" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">unstable</text>
          <text x="35" y="112" font-size="7" fill="#64748B" font-family="Source Sans 3">eigenvalues: mixed sign</text>
        </svg>
        <div class="cell-label">Saddle Point</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Stability &amp; Bifurcation</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Limit cycle -->
          <line x1="10" y1="60" x2="150" y2="60" stroke="#E2E8F0" stroke-width="0.5"/>
          <line x1="80" y1="5" x2="80" y2="115" stroke="#E2E8F0" stroke-width="0.5"/>
          <!-- Limit cycle (ellipse) -->
          <ellipse cx="80" cy="60" rx="45" ry="35" fill="none" stroke="#2563EB" stroke-width="1.8"/>
          <!-- Spiral in from outside -->
          <path d="M15 30 Q30 15 60 20 Q100 10 130 30 Q145 45 135 65 Q125 85 95 95 Q65 100 45 85 Q30 70 45 50 Q55 40 72 35 Q90 32 105 42 Q118 52 112 68 Q105 78 88 80 Q75 78 70 70 Q68 63 75 58" fill="none" stroke="#94A3B8" stroke-width="0.6"/>
          <!-- Spiral out from inside -->
          <path d="M80 55 Q85 50 92 50 Q100 52 100 60 Q98 70 88 72 Q76 72 73 63 Q72 55 80 50 Q90 46 100 50 Q108 56 107 68" fill="none" stroke="#0F766E" stroke-width="0.6"/>
          <!-- Direction arrow on cycle -->
          <text x="120" y="42" font-size="7" fill="#2563EB" font-weight="600" font-family="Source Sans 3">stable limit cycle</text>
          <!-- Center -->
          <circle cx="80" cy="60" r="2" fill="#B45309"/>
          <text x="55" y="112" font-size="7" fill="#64748B" font-family="Source Sans 3">Poincare-Bendixson</text>
        </svg>
        <div class="cell-label">Limit Cycle</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Pitchfork bifurcation diagram -->
          <line x1="15" y1="60" x2="150" y2="60" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="80" y1="10" x2="80" y2="110" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- Stable branch before bifurcation -->
          <line x1="15" y1="60" x2="80" y2="60" stroke="#2563EB" stroke-width="1.8"/>
          <!-- Unstable branch after bifurcation -->
          <line x1="80" y1="60" x2="145" y2="60" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 2"/>
          <!-- Two stable branches after -->
          <path d="M80 60 Q100 48 120 35 Q135 25 148 18" fill="none" stroke="#2563EB" stroke-width="1.8"/>
          <path d="M80 60 Q100 72 120 85 Q135 95 148 102" fill="none" stroke="#2563EB" stroke-width="1.8"/>
          <!-- Bifurcation point -->
          <circle cx="80" cy="60" r="4" fill="#0F766E"/>
          <!-- Labels -->
          <text x="140" y="56" font-size="7" fill="#64748B" font-family="Source Sans 3">mu</text>
          <text x="82" y="18" font-size="7" fill="#64748B" font-family="Source Sans 3">x*</text>
          <text x="85" y="72" font-size="7" fill="#0F766E" font-weight="600" font-family="Source Sans 3">critical</text>
          <!-- Legend -->
          <line x1="15" y1="108" x2="28" y2="108" stroke="#2563EB" stroke-width="1.5"/><text x="31" y="111" font-size="7" fill="#2563EB" font-family="Source Sans 3">stable</text>
          <line x1="70" y1="108" x2="83" y2="108" stroke="#B45309" stroke-width="1.2" stroke-dasharray="3 2"/><text x="86" y="111" font-size="7" fill="#B45309" font-family="Source Sans 3">unstable</text>
        </svg>
        <div class="cell-label">Pitchfork Bifurcation</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Vector Fields &amp; Flow</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Simple vector field -->
          <defs><marker id="vfa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L8 5L0 9z" fill="#2563EB"/></marker></defs>
          <!-- Grid of arrows -->
          <line x1="20" y1="90" x2="30" y2="80" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="50" y1="90" x2="58" y2="78" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="80" y1="90" x2="85" y2="78" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="110" y1="90" x2="112" y2="78" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="20" y1="60" x2="32" y2="52" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="50" y1="60" x2="60" y2="50" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="80" y1="60" x2="88" y2="48" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="110" y1="60" x2="115" y2="48" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="20" y1="30" x2="34" y2="25" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="50" y1="30" x2="62" y2="22" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="80" y1="30" x2="90" y2="20" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <line x1="110" y1="30" x2="118" y2="18" stroke="#2563EB" stroke-width="0.8" marker-end="url(#vfa)"/>
          <text x="30" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">dx/dt = F(x,y)</text>
        </svg>
        <div class="cell-label">Vector Field</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Spiral (stable focus) -->
          <line x1="10" y1="55" x2="140" y2="55" stroke="#E2E8F0" stroke-width="0.5"/>
          <line x1="75" y1="5" x2="75" y2="105" stroke="#E2E8F0" stroke-width="0.5"/>
          <!-- Spiral trajectory -->
          <path d="M130 40 Q120 15 90 20 Q55 22 45 45 Q38 65 50 80 Q65 92 85 85 Q102 78 105 62 Q106 48 92 40 Q80 35 70 42 Q62 48 65 58 Q68 65 75 67 Q82 66 84 60 Q84 55 80 53 Q76 52 75 55" fill="none" stroke="#2563EB" stroke-width="1.2"/>
          <!-- Center -->
          <circle cx="75" cy="55" r="3" fill="#0F766E"/>
          <text x="80" y="50" font-size="7" fill="#0F766E" font-weight="600" font-family="Source Sans 3">focus</text>
          <text x="30" y="104" font-size="7" fill="#64748B" font-family="Source Sans 3">complex eigenvalues</text>
        </svg>
        <div class="cell-label">Stable Spiral (Focus)</div>
      </div>
    </div>
  </div>
</body>
</html>
