<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; padding: 20px 28px; font-family: 'Source Sans 3', sans-serif; }
  .label { font-size: 11px; color: #94A3B8; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }
  .code-block {
    font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6;
    background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px;
    padding: 14px 18px; color: #111827; margin-bottom: 14px;
  }
  .inline-demo { font-size: 15px; color: #111827; line-height: 1.7; }
  .inline-code {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    background: #F8FAFC; padding: 2px 7px; border-radius: 4px; color: #111827;
  }
  .kw { color: #6D28D9; }
  .fn { color: #2563EB; }
  .str { color: #0F766E; }
  .cm { color: #94A3B8; }
</style>
</head>
<body>
  <div class="label">Code Block — JetBrains Mono, 24px</div>
  <pre class="code-block"><span class="cm"># Compute the perpendicular bisector</span>
<span class="kw">def</span> <span class="fn">bisector</span>(A, B):
    mid = (A + B) / <span class="str">2</span>
    <span class="kw">return</span> mid, <span class="fn">normal</span>(B - A)</pre>
  <div class="label">Inline Code</div>
  <p class="inline-demo">
    Call <span class="inline-code">bisector(P, Q)</span> to get the midpoint and normal direction vector.
  </p>
</body>
</html>
