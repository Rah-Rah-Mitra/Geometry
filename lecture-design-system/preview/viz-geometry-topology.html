<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Surfaces & Manifolds</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Torus cross-section style -->
          <ellipse cx="80" cy="55" rx="60" ry="35" fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
          <!-- Inner hole (front arc) -->
          <path d="M55 55 Q65 42 80 42 Q95 42 105 55" fill="none" stroke="#1E3A8A" stroke-width="1.2"/>
          <!-- Inner hole (back arc, dashed) -->
          <path d="M55 55 Q65 68 80 68 Q95 68 105 55" fill="none" stroke="#1E3A8A" stroke-width="0.8" stroke-dasharray="3 2"/>
          <!-- Tangent plane patch -->
          <polygon points="105,42 130,32 140,48 115,58" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="0.7"/>
          <!-- Normal vector -->
          <defs><marker id="tn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#B45309"/></marker></defs>
          <line x1="122" y1="45" x2="135" y2="18" stroke="#B45309" stroke-width="1" marker-end="url(#tn)"/>
          <!-- Point -->
          <circle cx="110" cy="48" r="2.5" fill="#2563EB"/>
          <text x="106" y="80" font-size="8" fill="#64748B" font-family="Source Sans 3">χ(T²) = 0</text>
        </svg>
        <div class="cell-label">Torus with Tangent Plane</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Fundamental polygon: square identification for torus -->
          <rect x="30" y="15" width="100" height="80" fill="rgba(37,99,235,0.04)" stroke="#CBD5E1" stroke-width="0.5"/>
          <!-- Top edge (→) -->
          <line x1="30" y1="15" x2="130" y2="15" stroke="#2563EB" stroke-width="2"/>
          <polygon points="82,11 82,19 90,15" fill="#2563EB"/>
          <text x="55" y="10" font-size="9" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">a</text>
          <!-- Bottom edge (→) -->
          <line x1="30" y1="95" x2="130" y2="95" stroke="#2563EB" stroke-width="2"/>
          <polygon points="82,91 82,99 90,95" fill="#2563EB"/>
          <text x="55" y="108" font-size="9" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">a</text>
          <!-- Left edge (↑) -->
          <line x1="30" y1="95" x2="30" y2="15" stroke="#0F766E" stroke-width="2"/>
          <polygon points="26,53 34,53 30,45" fill="#0F766E"/>
          <text x="16" y="58" font-size="9" fill="#0F766E" font-weight="700" font-family="STIX Two Text" font-style="italic">b</text>
          <!-- Right edge (↑) -->
          <line x1="130" y1="95" x2="130" y2="15" stroke="#0F766E" stroke-width="2"/>
          <polygon points="126,53 134,53 130,45" fill="#0F766E"/>
          <text x="136" y="58" font-size="9" fill="#0F766E" font-weight="700" font-family="STIX Two Text" font-style="italic">b</text>
        </svg>
        <div class="cell-label">Fundamental Polygon (Torus)</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Knots & Curvature</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Trefoil knot (simplified) -->
          <path d="M75 20 Q110 20 110 45 Q110 65 85 65 Q60 65 60 45 Q60 20 75 20" fill="none" stroke="#2563EB" stroke-width="2"/>
          <path d="M40 85 Q40 55 65 55" fill="none" stroke="#2563EB" stroke-width="2"/>
          <path d="M75 70 Q90 90 110 85 Q130 80 120 60" fill="none" stroke="#2563EB" stroke-width="2"/>
          <path d="M50 40 Q35 55 35 75 Q35 95 55 95 Q70 95 75 80" fill="none" stroke="#2563EB" stroke-width="2"/>
          <!-- Crossings (white gaps for over/under) -->
          <circle cx="65" cy="55" r="5" fill="white" stroke="none"/>
          <path d="M60 50 Q65 55 70 60" fill="none" stroke="#2563EB" stroke-width="2"/>
          <circle cx="90" cy="70" r="5" fill="white" stroke="none"/>
          <path d="M85 65 Q90 70 95 75" fill="none" stroke="#2563EB" stroke-width="2"/>
          <text x="55" y="108" font-size="9" fill="#64748B" font-family="Source Sans 3" font-weight="600">3₁ trefoil</text>
        </svg>
        <div class="cell-label">Trefoil Knot</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 120" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Gaussian curvature: positive, zero, negative -->
          <!-- Sphere patch (K > 0) -->
          <path d="M15 60 Q35 25 55 60" fill="none" stroke="#2563EB" stroke-width="1.8"/>
          <path d="M20 55 Q35 40 50 55" fill="none" stroke="#2563EB" stroke-width="0.8" stroke-dasharray="2 1.5"/>
          <text x="23" y="78" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">K &gt; 0</text>
          <!-- Cylinder (K = 0) -->
          <path d="M60 45 L60 75 M95 45 L95 75" stroke="#0F766E" stroke-width="1.5"/>
          <ellipse cx="77" cy="45" rx="18" ry="7" fill="none" stroke="#0F766E" stroke-width="1.5"/>
          <path d="M60 75 Q77 82 95 75" fill="none" stroke="#0F766E" stroke-width="1.5"/>
          <path d="M60 75 Q77 68 95 75" fill="none" stroke="#0F766E" stroke-width="0.7" stroke-dasharray="2 1.5"/>
          <text x="65" y="98" font-size="8" fill="#0F766E" font-weight="600" font-family="Source Sans 3">K = 0</text>
          <!-- Saddle (K < 0) -->
          <path d="M105 50 Q120 30 135 50" fill="none" stroke="#B45309" stroke-width="1.5"/>
          <path d="M110 40 Q120 55 130 40" fill="none" stroke="#B45309" stroke-width="1.5"/>
          <text x="107" y="70" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">K &lt; 0</text>
          <text x="25" y="110" font-size="8" fill="#64748B" font-family="Source Sans 3">sphere</text>
          <text x="65" y="110" font-size="8" fill="#64748B" font-family="Source Sans 3">cylinder</text>
          <text x="107" y="110" font-size="8" fill="#64748B" font-family="Source Sans 3">saddle</text>
        </svg>
        <div class="cell-label">Gaussian Curvature Signs</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Constructions & Transformations</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Möbius strip (stylized) -->
          <path d="M30 55 Q30 25 75 25 Q120 25 120 55 Q120 85 75 85 Q50 85 40 70" fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
          <path d="M40 70 Q35 62 38 55 Q42 48 55 42" fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
          <!-- "Twist" cross lines -->
          <line x1="38" y1="50" x2="44" y2="68" stroke="#2563EB" stroke-width="0.8"/>
          <line x1="42" y1="48" x2="48" y2="66" stroke="#2563EB" stroke-width="0.8"/>
          <line x1="46" y1="44" x2="52" y2="62" stroke="#2563EB" stroke-width="0.8"/>
          <!-- Surface shading lines -->
          <path d="M55 30 Q75 20 95 30" fill="none" stroke="rgba(37,99,235,0.2)" stroke-width="0.6"/>
          <path d="M100 35 Q115 45 115 55" fill="none" stroke="rgba(37,99,235,0.2)" stroke-width="0.6"/>
          <text x="45" y="105" font-size="8" fill="#64748B" font-family="Source Sans 3" font-weight="600">non-orientable, χ = 0</text>
        </svg>
        <div class="cell-label">Möbius Strip</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <!-- Stereographic projection -->
          <circle cx="75" cy="55" r="40" fill="none" stroke="#1E3A8A" stroke-width="1.2"/>
          <!-- North pole -->
          <circle cx="75" cy="15" r="3" fill="#B45309"/>
          <text x="80" y="14" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">N</text>
          <!-- Point on sphere -->
          <circle cx="100" cy="40" r="2.5" fill="#2563EB"/>
          <text x="104" y="38" font-size="8" fill="#2563EB" font-weight="600" font-family="STIX Two Text" font-style="italic">P</text>
          <!-- Projection line -->
          <line x1="75" y1="15" x2="130" y2="95" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="3 2"/>
          <!-- Projection plane (horizontal line at equator) -->
          <line x1="15" y1="95" x2="145" y2="95" stroke="#0F766E" stroke-width="1"/>
          <!-- Projected point -->
          <circle cx="130" cy="95" r="2.5" fill="#0F766E"/>
          <text x="125" y="108" font-size="8" fill="#0F766E" font-weight="600" font-family="STIX Two Text" font-style="italic">P'</text>
          <text x="22" y="105" font-size="8" fill="#0F766E" font-family="Source Sans 3" font-weight="600">ℝ (or ℂ)</text>
        </svg>
        <div class="cell-label">Stereographic Projection</div>
      </div>
    </div>
  </div>
</body>
</html>
