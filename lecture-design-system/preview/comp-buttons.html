<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 20px 24px; }
  .label { font-size: 11px; color: #94A3B8; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; height: 36px;
    border-radius: 6px; font-size: 13px; font-weight: 600; border: 1px solid;
    font-family: inherit; cursor: pointer; transition: all 0.15s;
  }
  .btn-primary { background: #087568; color: #fff; border-color: #087568; }
  .btn-primary:hover { background: #075f55; }
  .btn-secondary { background: #fff; color: #15211d; border-color: #d8e0da; }
  .btn-secondary:hover { border-color: #087568; color: #087568; }
  .btn-accent-slide { background: #1E3A8A; color: #fff; border-color: #1E3A8A; }
  .btn-outline-slide { background: #fff; color: #111827; border-color: #CBD5E1; }
  .btn-outline-slide:hover { border-color: #2563EB; color: #2563EB; }
  .btn-sm { height: 30px; font-size: 12px; padding: 0 10px; }
  .icon { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="label">Portal Buttons</div>
  <div class="row">
    <button class="btn btn-primary">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Browse courses
    </button>
    <button class="btn btn-secondary">
      <svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      Start dashboard
    </button>
    <button class="btn btn-secondary btn-sm">Details</button>
  </div>
  <div class="label">Slide Buttons</div>
  <div class="row">
    <button class="btn btn-accent-slide">Deep Indigo Primary</button>
    <button class="btn btn-outline-slide">Slate Outline</button>
  </div>
</body>
</html>
