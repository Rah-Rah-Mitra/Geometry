<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Proof Trees & Deduction</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Natural deduction tree -->
          <!-- Leaves -->
          <text x="15" y="20" font-size="9" fill="#2563EB" font-weight="600" font-family="STIX Two Text" font-style="italic">[A]¹</text>
          <text x="60" y="20" font-size="9" fill="#2563EB" font-weight="600" font-family="STIX Two Text" font-style="italic">A→B</text>
          <!-- Inference line -->
          <line x1="10" y1="24" x2="100" y2="24" stroke="#1E3A8A" stroke-width="1"/>
          <text x="103" y="22" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">→E</text>
          <!-- B -->
          <text x="45" y="40" font-size="9" fill="#111827" font-weight="600" font-family="STIX Two Text" font-style="italic">B</text>
          <!-- Second branch -->
          <text x="115" y="20" font-size="9" fill="#2563EB" font-weight="600" font-family="STIX Two Text" font-style="italic">B→C</text>
          <line x1="30" y1="44" x2="145" y2="44" stroke="#1E3A8A" stroke-width="1"/>
          <text x="147" y="42" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">→E</text>
          <!-- C -->
          <text x="80" y="60" font-size="9" fill="#111827" font-weight="600" font-family="STIX Two Text" font-style="italic">C</text>
          <!-- Discharge -->
          <line x1="60" y1="64" x2="110" y2="64" stroke="#1E3A8A" stroke-width="1"/>
          <text x="112" y="62" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">→I, 1</text>
          <!-- Conclusion -->
          <text x="68" y="80" font-size="9" fill="#0F766E" font-weight="700" font-family="STIX Two Text" font-style="italic">A→C</text>
          <text x="30" y="100" font-size="8" fill="#64748B" font-family="Source Sans 3">Hypothetical syllogism</text>
        </svg>
        <div class="cell-label">Natural Deduction Tree</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Induction diagram -->
          <defs><marker id="ia" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs>
          <!-- Base case -->
          <rect x="10" y="15" width="45" height="28" rx="4" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1"/>
          <text x="18" y="26" font-size="7" fill="#0F766E" font-weight="700" font-family="Source Sans 3">BASE</text>
          <text x="18" y="38" font-size="9" fill="#111827" font-family="STIX Two Text" font-style="italic">P(0) ✓</text>
          <!-- Arrow -->
          <line x1="56" y1="30" x2="68" y2="30" stroke="#2563EB" stroke-width="1" marker-end="url(#ia)"/>
          <!-- Inductive step -->
          <rect x="72" y="10" width="80" height="40" rx="4" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <text x="80" y="22" font-size="7" fill="#2563EB" font-weight="700" font-family="Source Sans 3">INDUCTIVE STEP</text>
          <text x="80" y="38" font-size="9" fill="#111827" font-family="STIX Two Text" font-style="italic">P(k)→P(k+1)</text>
          <!-- Chain of dominoes -->
          <line x1="20" y1="58" x2="20" y2="85" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>
          <line x1="40" y1="55" x2="40" y2="82" stroke="#2563EB" stroke-width="2" stroke-linecap="round" transform="rotate(-10,40,82)"/>
          <line x1="60" y1="52" x2="60" y2="79" stroke="#2563EB" stroke-width="2" stroke-linecap="round" transform="rotate(-15,60,79)"/>
          <line x1="80" y1="50" x2="80" y2="77" stroke="#2563EB" stroke-width="2" stroke-linecap="round" transform="rotate(-20,80,77)"/>
          <line x1="100" y1="48" x2="100" y2="75" stroke="#2563EB" stroke-width="2" stroke-linecap="round" transform="rotate(-25,100,75)"/>
          <line x1="120" y1="50" x2="120" y2="77" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
          <line x1="135" y1="50" x2="135" y2="77" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
          <!-- Labels -->
          <text x="16" y="96" font-size="7" fill="#0F766E" font-family="Source Sans 3">n=0</text>
          <text x="36" y="96" font-size="7" fill="#2563EB" font-family="Source Sans 3">1</text>
          <text x="56" y="96" font-size="7" fill="#2563EB" font-family="Source Sans 3">2</text>
          <text x="76" y="96" font-size="7" fill="#2563EB" font-family="Source Sans 3">3</text>
          <text x="126" y="96" font-size="7" fill="#94A3B8" font-family="Source Sans 3">…</text>
          <text x="40" y="112" font-size="8" fill="#64748B" font-family="Source Sans 3">∀n∈ℕ, P(n)</text>
        </svg>
        <div class="cell-label">Mathematical Induction</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Logic Gates & Automata</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Logic circuit: (A ∧ B) ∨ C -->
          <!-- AND gate -->
          <line x1="10" y1="25" x2="35" y2="25" stroke="#475569" stroke-width="1"/>
          <line x1="10" y1="45" x2="35" y2="45" stroke="#475569" stroke-width="1"/>
          <rect x="35" y="15" width="30" height="40" rx="3" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <text x="43" y="40" font-size="10" fill="#2563EB" font-weight="700" font-family="Source Sans 3">∧</text>
          <line x1="65" y1="35" x2="85" y2="35" stroke="#475569" stroke-width="1"/>
          <!-- OR gate -->
          <line x1="10" y1="85" x2="85" y2="85" stroke="#475569" stroke-width="1"/>
          <rect x="85" y="35" width="30" height="60" rx="3" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1"/>
          <text x="93" y="70" font-size="10" fill="#0F766E" font-weight="700" font-family="Source Sans 3">∨</text>
          <line x1="115" y1="65" x2="145" y2="65" stroke="#475569" stroke-width="1"/>
          <!-- Labels -->
          <text x="2" y="28" font-size="10" fill="#1E3A8A" font-weight="700" font-family="STIX Two Text" font-style="italic">A</text>
          <text x="2" y="48" font-size="10" fill="#1E3A8A" font-weight="700" font-family="STIX Two Text" font-style="italic">B</text>
          <text x="2" y="88" font-size="10" fill="#1E3A8A" font-weight="700" font-family="STIX Two Text" font-style="italic">C</text>
          <text x="130" y="60" font-size="9" fill="#B45309" font-weight="600" font-family="Source Sans 3">out</text>
          <text x="25" y="112" font-size="8" fill="#64748B" font-family="Source Sans 3">(A ∧ B) ∨ C</text>
        </svg>
        <div class="cell-label">Logic Circuit</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Finite automaton (DFA) -->
          <defs><marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E3A8A"/></marker></defs>
          <!-- Start arrow -->
          <line x1="5" y1="55" x2="22" y2="55" stroke="#1E3A8A" stroke-width="1.2" marker-end="url(#fa)"/>
          <!-- State q0 -->
          <circle cx="40" cy="55" r="16" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1.5"/>
          <text x="32" y="59" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">q₀</text>
          <!-- State q1 -->
          <circle cx="110" cy="55" r="16" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1.5"/>
          <circle cx="110" cy="55" r="13" fill="none" stroke="#0F766E" stroke-width="0.8"/>
          <text x="102" y="59" font-size="10" fill="#0F766E" font-weight="700" font-family="Source Sans 3">q₁</text>
          <!-- q0 → q1 -->
          <path d="M56 50 Q75 30 94 48" fill="none" stroke="#1E3A8A" stroke-width="1" marker-end="url(#fa)"/>
          <text x="68" y="32" font-size="9" fill="#B45309" font-weight="600" font-family="Source Sans 3">1</text>
          <!-- q1 → q0 -->
          <path d="M94 62 Q75 80 56 62" fill="none" stroke="#1E3A8A" stroke-width="1" marker-end="url(#fa)"/>
          <text x="68" y="86" font-size="9" fill="#B45309" font-weight="600" font-family="Source Sans 3">0</text>
          <!-- Self loops -->
          <path d="M30 40 Q20 18 42 38" fill="none" stroke="#94A3B8" stroke-width="0.8" marker-end="url(#fa)"/>
          <text x="20" y="20" font-size="8" fill="#94A3B8" font-family="Source Sans 3">0</text>
          <path d="M120 40 Q130 18 108 38" fill="none" stroke="#94A3B8" stroke-width="0.8" marker-end="url(#fa)"/>
          <text x="128" y="20" font-size="8" fill="#94A3B8" font-family="Source Sans 3">1</text>
          <text x="30" y="102" font-size="8" fill="#64748B" font-family="Source Sans 3">accepts odd # of 1s</text>
        </svg>
        <div class="cell-label">Deterministic Finite Automaton</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Contradiction & Cases</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 100" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Proof by contradiction flow -->
          <defs><marker id="cf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
          <rect x="40" y="5" width="80" height="20" rx="3" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <text x="50" y="19" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">Assume ¬P</text>
          <line x1="80" y1="25" x2="80" y2="35" stroke="#475569" stroke-width="1" marker-end="url(#cf)"/>
          <rect x="25" y="38" width="110" height="20" rx="3" fill="rgba(37,99,235,0.04)" stroke="#CBD5E1" stroke-width="1"/>
          <text x="42" y="52" font-size="9" fill="#475569" font-family="Source Sans 3">⋮ logical steps ⋮</text>
          <line x1="80" y1="58" x2="80" y2="68" stroke="#475569" stroke-width="1" marker-end="url(#cf)"/>
          <rect x="30" y="70" width="100" height="22" rx="3" fill="rgba(180,83,9,0.08)" stroke="#B45309" stroke-width="1.2"/>
          <text x="46" y="85" font-size="10" fill="#B45309" font-weight="700" font-family="Source Sans 3">Contradiction ⊥</text>
          <text x="50" y="100" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">∴ P is true</text>
        </svg>
        <div class="cell-label">Proof by Contradiction</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 100" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Case analysis tree -->
          <defs><marker id="cs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
          <rect x="40" y="5" width="80" height="20" rx="3" fill="rgba(30,58,138,0.08)" stroke="#1E3A8A" stroke-width="1"/>
          <text x="52" y="19" font-size="9" fill="#1E3A8A" font-weight="600" font-family="Source Sans 3">Prove P(x)</text>
          <!-- Branches -->
          <line x1="60" y1="25" x2="30" y2="45" stroke="#475569" stroke-width="1" marker-end="url(#cs)"/>
          <line x1="80" y1="25" x2="80" y2="45" stroke="#475569" stroke-width="1" marker-end="url(#cs)"/>
          <line x1="100" y1="25" x2="130" y2="45" stroke="#475569" stroke-width="1" marker-end="url(#cs)"/>
          <!-- Cases -->
          <rect x="8" y="48" width="48" height="18" rx="3" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="0.8"/>
          <text x="14" y="61" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">Case 1: x&gt;0</text>
          <rect x="58" y="48" width="48" height="18" rx="3" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="0.8"/>
          <text x="63" y="61" font-size="8" fill="#0F766E" font-weight="600" font-family="Source Sans 3">Case 2: x=0</text>
          <rect x="108" y="48" width="48" height="18" rx="3" fill="rgba(109,40,217,0.08)" stroke="#6D28D9" stroke-width="0.8"/>
          <text x="113" y="61" font-size="8" fill="#6D28D9" font-weight="600" font-family="Source Sans 3">Case 3: x&lt;0</text>
          <!-- Results -->
          <text x="22" y="80" font-size="8" fill="#2563EB" font-family="Source Sans 3">P(x) ✓</text>
          <text x="72" y="80" font-size="8" fill="#0F766E" font-family="Source Sans 3">P(x) ✓</text>
          <text x="122" y="80" font-size="8" fill="#6D28D9" font-family="Source Sans 3">P(x) ✓</text>
          <line x1="10" y1="85" x2="150" y2="85" stroke="#E2E8F0" stroke-width="0.5"/>
          <text x="50" y="96" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">∴ ∀x, P(x)</text>
        </svg>
        <div class="cell-label">Proof by Cases</div>
      </div>
    </div>
  </div>
</body>
</html>
