<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #f6f8f7; padding: 20px 24px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch {
    width: 80px; height: 56px; border-radius: 8px; display: flex; align-items: flex-end;
    padding: 6px 8px; font-size: 11px; font-weight: 600;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .label { font-size: 11px; color: #5d6b66; margin-bottom: 4px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .section { margin-bottom: 16px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Portal Surfaces</div>
    <div class="row">
      <div class="swatch" style="background:#f6f8f7;color:#5d6b66;">Bg #f6f8f7</div>
      <div class="swatch" style="background:#ffffff;color:#5d6b66;">Surface #fff</div>
      <div class="swatch" style="background:#edf2ef;color:#5d6b66;">Soft #edf2ef</div>
      <div class="swatch" style="background:#d8e0da;color:#5d6b66;">Line #d8e0da</div>
    </div>
  </div>
  <div class="section">
    <div class="label">Portal Text & Accent</div>
    <div class="row">
      <div class="swatch" style="background:#15211d;color:#fff;">Ink #15211d</div>
      <div class="swatch" style="background:#5d6b66;color:#fff;">Muted #5d6b66</div>
      <div class="swatch" style="background:#087568;color:#fff;">Accent #087568</div>
      <div class="swatch" style="background:#075f55;color:#fff;">Strong #075f55</div>
      <div class="swatch" style="background:#9a5b00;color:#fff;">Warn #9a5b00</div>
    </div>
  </div>
</body>
</html>
