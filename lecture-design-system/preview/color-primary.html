<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 20px 24px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch {
    width: 80px; height: 56px; border-radius: 8px; display: flex; align-items: flex-end;
    padding: 6px 8px; font-size: 11px; font-weight: 600;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .label { font-size: 11px; color: #64748B; margin-bottom: 4px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .section { margin-bottom: 16px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Slide Backgrounds</div>
    <div class="row">
      <div class="swatch" style="background:#FFFFFF;color:#475569;">White #FFF</div>
      <div class="swatch" style="background:#F8FAFC;color:#475569;">Alt #F8FAFC</div>
    </div>
  </div>
  <div class="section">
    <div class="label">Text Hierarchy</div>
    <div class="row">
      <div class="swatch" style="background:#111827;color:#fff;">Ink #111827</div>
      <div class="swatch" style="background:#475569;color:#fff;">Muted #475569</div>
      <div class="swatch" style="background:#64748B;color:#fff;">Dim #64748B</div>
    </div>
  </div>
  <div class="section">
    <div class="label">Academic Accents</div>
    <div class="row">
      <div class="swatch" style="background:#1E3A8A;color:#fff;">Indigo #1E3A8A</div>
      <div class="swatch" style="background:#2563EB;color:#fff;">Blue #2563EB</div>
      <div class="swatch" style="background:#0F766E;color:#fff;">Teal #0F766E</div>
      <div class="swatch" style="background:#B45309;color:#fff;">Amber #B45309</div>
      <div class="swatch" style="background:#6D28D9;color:#fff;">Violet #6D28D9</div>
      <div class="swatch" style="background:#CBD5E1;color:#475569;">Slate #CBD5E1</div>
    </div>
  </div>
</body>
</html>
