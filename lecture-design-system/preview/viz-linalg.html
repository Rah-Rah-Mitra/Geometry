<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Vectors &amp; Transformations</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 120" width="130" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="va" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9z" fill="#2563EB"/></marker>
            <marker id="vb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9z" fill="#0F766E"/></marker>
            <marker id="vc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9z" fill="#B45309"/></marker>
          </defs>
          <!-- Axes -->
          <line x1="25" y1="95" x2="140" y2="95" stroke="#E2E8F0" stroke-width="0.8"/>
          <line x1="25" y1="10" x2="25" y2="95" stroke="#E2E8F0" stroke-width="0.8"/>
          <!-- Vector u -->
          <line x1="25" y1="95" x2="95" y2="45" stroke="#2563EB" stroke-width="1.8" marker-end="url(#va)"/>
          <text x="65" y="58" font-size="11" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">u</text>
          <!-- Vector v -->
          <line x1="25" y1="95" x2="65" y2="85" stroke="#0F766E" stroke-width="1.8" marker-end="url(#vb)"/>
          <text x="48" y="82" font-size="11" fill="#0F766E" font-weight="700" font-family="STIX Two Text" font-style="italic">v</text>
          <!-- Sum u+v -->
          <line x1="25" y1="95" x2="130" y2="35" stroke="#B45309" stroke-width="1.5" marker-end="url(#vc)" stroke-dasharray="4 2"/>
          <text x="92" y="30" font-size="10" fill="#B45309" font-weight="600" font-family="STIX Two Text" font-style="italic">u+v</text>
          <!-- Parallelogram -->
          <line x1="95" y1="45" x2="130" y2="35" stroke="#94A3B8" stroke-width="0.7" stroke-dasharray="3 2"/>
          <line x1="65" y1="85" x2="130" y2="35" stroke="#94A3B8" stroke-width="0.7" stroke-dasharray="3 2"/>
        </svg>
        <div class="cell-label">Vector Addition</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 120" width="130" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="te" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#2563EB"/></marker>
            <marker id="tf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#0F766E"/></marker>
          </defs>
          <!-- Original grid (light) -->
          <line x1="25" y1="100" x2="140" y2="100" stroke="#E2E8F0" stroke-width="0.5"/>
          <line x1="25" y1="10" x2="25" y2="100" stroke="#E2E8F0" stroke-width="0.5"/>
          <line x1="25" y1="70" x2="140" y2="70" stroke="#E2E8F0" stroke-width="0.3"/>
          <line x1="25" y1="40" x2="140" y2="40" stroke="#E2E8F0" stroke-width="0.3"/>
          <line x1="63" y1="10" x2="63" y2="100" stroke="#E2E8F0" stroke-width="0.3"/>
          <line x1="101" y1="10" x2="101" y2="100" stroke="#E2E8F0" stroke-width="0.3"/>
          <!-- Transformed grid (sheared) -->
          <line x1="25" y1="100" x2="55" y2="10" stroke="rgba(37,99,235,0.2)" stroke-width="0.7"/>
          <line x1="63" y1="100" x2="93" y2="10" stroke="rgba(37,99,235,0.2)" stroke-width="0.7"/>
          <line x1="101" y1="100" x2="131" y2="10" stroke="rgba(37,99,235,0.2)" stroke-width="0.7"/>
          <line x1="25" y1="100" x2="140" y2="100" stroke="rgba(37,99,235,0.3)" stroke-width="0.7"/>
          <line x1="35" y1="70" x2="140" y2="70" stroke="rgba(37,99,235,0.2)" stroke-width="0.7"/>
          <line x1="45" y1="40" x2="140" y2="40" stroke="rgba(37,99,235,0.2)" stroke-width="0.7"/>
          <!-- Basis vectors -->
          <line x1="25" y1="100" x2="60" y2="100" stroke="#0F766E" stroke-width="1.8" marker-end="url(#tf)"/>
          <line x1="25" y1="100" x2="35" y2="68" stroke="#2563EB" stroke-width="1.8" marker-end="url(#te)"/>
          <text x="38" y="112" font-size="9" fill="#0F766E" font-weight="700" font-family="Source Sans 3">T(e<tspan font-size="7" dy="3">1</tspan><tspan dy="-3">)</tspan></text>
          <text x="36" y="64" font-size="9" fill="#2563EB" font-weight="700" font-family="Source Sans 3">T(e<tspan font-size="7" dy="3">2</tspan><tspan dy="-3">)</tspan></text>
        </svg>
        <div class="cell-label">Linear Transformation (Shear)</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Eigenspaces &amp; Matrix Decomposition</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 120" width="130" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="ea1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#2563EB"/></marker>
            <marker id="ea2v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#0F766E"/></marker>
            <marker id="ea3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#B45309"/></marker>
            <marker id="ea4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#6D28D9"/></marker>
          </defs>
          <!-- Axes -->
          <line x1="10" y1="60" x2="140" y2="60" stroke="#E2E8F0" stroke-width="0.5"/>
          <line x1="75" y1="5" x2="75" y2="115" stroke="#E2E8F0" stroke-width="0.5"/>
          <!-- Eigenline 1 -->
          <line x1="25" y1="95" x2="125" y2="25" stroke="rgba(37,99,235,0.15)" stroke-width="12"/>
          <line x1="75" y1="60" x2="105" y2="38" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ea1)"/>
          <line x1="75" y1="60" x2="120" y2="27" stroke="#B45309" stroke-width="1.2" marker-end="url(#ea3)" stroke-dasharray="3 2"/>
          <!-- Eigenline 2 -->
          <line x1="20" y1="30" x2="130" y2="90" stroke="rgba(15,118,110,0.12)" stroke-width="12"/>
          <line x1="75" y1="60" x2="105" y2="78" stroke="#0F766E" stroke-width="1.5" marker-end="url(#ea2v)"/>
          <line x1="75" y1="60" x2="90" y2="69" stroke="#6D28D9" stroke-width="1.2" marker-end="url(#ea4)" stroke-dasharray="3 2"/>
          <!-- Labels — spaced apart to avoid overlap -->
          <text x="108" y="32" font-size="10" fill="#2563EB" font-weight="700" font-family="Source Sans 3">v1</text>
          <text x="122" y="18" font-size="9" fill="#B45309" font-weight="600" font-family="Source Sans 3">Av1</text>
          <text x="108" y="86" font-size="10" fill="#0F766E" font-weight="700" font-family="Source Sans 3">v2</text>
          <text x="80" y="68" font-size="9" fill="#6D28D9" font-weight="600" font-family="Source Sans 3">Av2</text>
        </svg>
        <div class="cell-label">Eigenvectors &amp; Eigenvalues</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Matrix as a block diagram -->
          <rect x="10" y="15" width="40" height="40" rx="2" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <text x="22" y="40" font-size="14" fill="#2563EB" font-weight="700" font-family="STIX Two Text" font-style="italic">A</text>
          <text x="55" y="38" font-size="12" fill="#475569" font-family="Source Sans 3">=</text>
          <!-- U -->
          <rect x="65" y="10" width="24" height="50" rx="2" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="0.8"/>
          <text x="71" y="40" font-size="11" fill="#0F766E" font-weight="700" font-family="STIX Two Text" font-style="italic">U</text>
          <!-- Sigma -->
          <rect x="92" y="15" width="30" height="40" rx="2" fill="rgba(180,83,9,0.08)" stroke="#B45309" stroke-width="0.8"/>
          <text x="100" y="40" font-size="12" fill="#B45309" font-weight="700" font-family="STIX Two Text">&#x03A3;</text>
          <!-- V^T -->
          <rect x="125" y="20" width="30" height="30" rx="2" fill="rgba(109,40,217,0.08)" stroke="#6D28D9" stroke-width="0.8"/>
          <text x="131" y="40" font-size="10" fill="#6D28D9" font-weight="700" font-family="STIX Two Text" font-style="italic">V</text>
          <text x="141" y="33" font-size="7" fill="#6D28D9" font-weight="700" font-family="Source Sans 3">T</text>
          <!-- Dimension annotations -->
          <text x="17" y="68" font-size="7" fill="#64748B" font-family="Source Sans 3">m x n</text>
          <text x="68" y="68" font-size="7" fill="#64748B" font-family="Source Sans 3">m x m</text>
          <text x="95" y="68" font-size="7" fill="#64748B" font-family="Source Sans 3">m x n</text>
          <text x="130" y="62" font-size="7" fill="#64748B" font-family="Source Sans 3">n x n</text>
          <!-- Sigma detail -->
          <text x="10" y="85" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">&#x03A3; = diag(</text>
          <text x="55" y="85" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">&#x03C3;</text>
          <text x="62" y="87" font-size="6" fill="#B45309" font-weight="600" font-family="Source Sans 3">1</text>
          <text x="68" y="85" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">&gt;= &#x03C3;</text>
          <text x="88" y="87" font-size="6" fill="#B45309" font-weight="600" font-family="Source Sans 3">2</text>
          <text x="93" y="85" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">&gt;= ... &gt;= 0)</text>
        </svg>
        <div class="cell-label">SVD Decomposition</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Subspaces</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="na" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#B45309"/></marker>
          </defs>
          <!-- Perspective parallelogram for plane -->
          <polygon points="20,85 75,35 140,55 85,95" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <!-- Axes -->
          <line x1="75" y1="65" x2="130" y2="80" stroke="#94A3B8" stroke-width="0.7"/>
          <text x="132" y="82" font-size="8" fill="#94A3B8" font-family="STIX Two Text" font-style="italic">x</text>
          <line x1="75" y1="65" x2="75" y2="15" stroke="#94A3B8" stroke-width="0.7"/>
          <text x="78" y="14" font-size="8" fill="#94A3B8" font-family="STIX Two Text" font-style="italic">z</text>
          <line x1="75" y1="65" x2="30" y2="85" stroke="#94A3B8" stroke-width="0.7"/>
          <text x="22" y="88" font-size="8" fill="#94A3B8" font-family="STIX Two Text" font-style="italic">y</text>
          <!-- Normal vector -->
          <line x1="75" y1="65" x2="92" y2="28" stroke="#B45309" stroke-width="1.2" marker-end="url(#na)"/>
          <text x="95" y="30" font-size="9" fill="#B45309" font-weight="700" font-family="Source Sans 3">n</text>
          <circle cx="75" cy="65" r="2.5" fill="#1E3A8A"/>
          <text x="48" y="106" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">W = ker(n .)</text>
        </svg>
        <div class="cell-label">Subspace (Plane) in R3</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 150 110" width="130" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#1E3A8A"/></marker>
            <marker id="pb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="#0F766E"/></marker>
          </defs>
          <!-- Subspace W line -->
          <line x1="15" y1="85" x2="140" y2="45" stroke="#2563EB" stroke-width="1.2"/>
          <text x="130" y="40" font-size="9" fill="#2563EB" font-weight="600" font-family="STIX Two Text" font-style="italic">W</text>
          <!-- Vector v -->
          <line x1="40" y1="80" x2="95" y2="20" stroke="#1E3A8A" stroke-width="1.5" marker-end="url(#pa)"/>
          <text x="98" y="18" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">v</text>
          <!-- Projection -->
          <line x1="40" y1="80" x2="85" y2="57" stroke="#0F766E" stroke-width="1.5" marker-end="url(#pb)"/>
          <text x="48" y="63" font-size="8" fill="#0F766E" font-weight="600" font-family="Source Sans 3">proj v</text>
          <!-- Perpendicular drop -->
          <line x1="95" y1="20" x2="85" y2="57" stroke="#B45309" stroke-width="0.8" stroke-dasharray="3 2"/>
          <!-- Right angle marker as two short lines -->
          <line x1="88" y1="49" x2="92" y2="52" stroke="#B45309" stroke-width="0.7"/>
          <line x1="92" y1="52" x2="89" y2="56" stroke="#B45309" stroke-width="0.7"/>
        </svg>
        <div class="cell-label">Orthogonal Projection</div>
      </div>
    </div>
  </div>
</body>
</html>
