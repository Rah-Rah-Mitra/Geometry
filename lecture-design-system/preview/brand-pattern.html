<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #94A3B8; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
  .patterns { display: flex; gap: 10px; }
  .pattern-tile {
    width: 100px; height: 80px; border-radius: 8px; border: 1px solid #E2E8F0;
    overflow: hidden; position: relative; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .pattern-tile svg { width: 100%; height: 100%; position: absolute; inset: 0; }
  .pattern-label { font-size: 10px; color: #64748B; font-weight: 600; position: relative; z-index: 1; background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="label">Slide Background Patterns (3–6% opacity)</div>
  <div class="patterns">
    <div class="pattern-tile">
      <svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="10" y1="70" x2="90" y2="70" stroke="#1E3A8A" stroke-width="0.5" opacity="0.05"/>
        <line x1="10" y1="70" x2="10" y2="10" stroke="#1E3A8A" stroke-width="0.5" opacity="0.05"/>
        <line x1="10" y1="70" x2="50" y2="10" stroke="#1E3A8A" stroke-width="0.7" opacity="0.05"/>
        <line x1="50" y1="10" x2="90" y2="70" stroke="#1E3A8A" stroke-width="0.7" opacity="0.05"/>
        <line x1="10" y1="70" x2="90" y2="70" stroke="#1E3A8A" stroke-width="0.7" opacity="0.05"/>
        <circle cx="50" cy="10" r="2" fill="#1E3A8A" opacity="0.05"/>
        <circle cx="10" cy="70" r="2" fill="#1E3A8A" opacity="0.05"/>
        <circle cx="90" cy="70" r="2" fill="#1E3A8A" opacity="0.05"/>
      </svg>
      <span class="pattern-label">Triangle</span>
    </div>
    <div class="pattern-tile">
      <svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="40" r="28" stroke="#1E3A8A" stroke-width="0.7" opacity="0.04"/>
        <circle cx="50" cy="40" r="18" stroke="#1E3A8A" stroke-width="0.5" opacity="0.04"/>
        <line x1="50" y1="8" x2="50" y2="72" stroke="#1E3A8A" stroke-width="0.4" opacity="0.04"/>
        <line x1="18" y1="40" x2="82" y2="40" stroke="#1E3A8A" stroke-width="0.4" opacity="0.04"/>
      </svg>
      <span class="pattern-label">Compass</span>
    </div>
    <div class="pattern-tile">
      <svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="20" x2="100" y2="20" stroke="#1E3A8A" stroke-width="0.4" opacity="0.04"/>
        <line x1="0" y1="40" x2="100" y2="40" stroke="#1E3A8A" stroke-width="0.4" opacity="0.04"/>
        <line x1="0" y1="60" x2="100" y2="60" stroke="#1E3A8A" stroke-width="0.4" opacity="0.04"/>
        <line x1="20" y1="0" x2="20" y2="80" stroke="#1E3A8A" stroke-width="0.4" opacity="0.04"/>
        <line x1="40" y1="0" x2="40" y2="80" stroke="#1E3A8A" stroke-width="0.4" opacity="0.04"/>
        <line x1="60" y1="0" x2="60" y2="80" stroke="#1E3A8A" stroke-width="0.4" opacity="0.04"/>
        <line x1="80" y1="0" x2="80" y2="80" stroke="#1E3A8A" stroke-width="0.4" opacity="0.04"/>
      </svg>
      <span class="pattern-label">Grid</span>
    </div>
    <div class="pattern-tile">
      <svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 60 Q 30 10, 50 40 Q 70 70, 90 20" stroke="#1E3A8A" stroke-width="0.7" opacity="0.05" fill="none"/>
        <path d="M10 40 Q 40 5, 70 50 Q 85 65, 95 35" stroke="#1E3A8A" stroke-width="0.5" opacity="0.04" fill="none"/>
      </svg>
      <span class="pattern-label">Curves</span>
    </div>
    <div class="pattern-tile">
      <svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="20,10 80,10 90,40 70,70 30,70 10,40" stroke="#1E3A8A" stroke-width="0.6" opacity="0.04" fill="none"/>
        <polygon points="35,20 65,20 75,40 60,58 40,58 25,40" stroke="#1E3A8A" stroke-width="0.4" opacity="0.04" fill="none"/>
      </svg>
      <span class="pattern-label">Tessellation</span>
    </div>
  </div>
</body>
</html>
