<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #f6f8f7; padding: 16px 20px; }
  .search-bar {
    display: flex; align-items: center; gap: 10px; height: 40px;
    background: #f6f8f7; border: 1px solid #d8e0da; border-radius: 6px;
    padding: 0 12px; margin-bottom: 12px;
  }
  .search-bar svg { width: 16px; height: 16px; stroke: #5d6b66; fill: none; stroke-width: 2; }
  .search-bar input {
    border: none; background: transparent; font-family: inherit; font-size: 13px;
    color: #15211d; outline: none; flex: 1;
  }
  .search-bar input::placeholder { color: #5d6b66; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .filter-select {
    height: 32px; padding: 0 10px; border: 1px solid #d8e0da; border-radius: 6px;
    background: #f6f8f7; font-family: inherit; font-size: 12px; font-weight: 500;
    color: #15211d; cursor: pointer;
  }
  .filter-check {
    display: inline-flex; align-items: center; gap: 6px; height: 32px;
    padding: 0 10px; border: 1px solid #d8e0da; border-radius: 6px;
    background: #f6f8f7; font-size: 12px; font-weight: 600; color: #5d6b66;
  }
  .filter-check input { accent-color: #087568; }
  .clear-btn {
    display: inline-flex; align-items: center; gap: 5px; height: 32px;
    padding: 0 10px; border: 1px solid #d8e0da; border-radius: 6px;
    background: #fff; font-family: inherit; font-size: 12px; font-weight: 600;
    color: #5d6b66; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="search-bar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="Search titles, tracks, runtimes, and tags" />
  </div>
  <div class="filters">
    <select class="filter-select"><option>Track</option></select>
    <select class="filter-select"><option>Difficulty</option></select>
    <select class="filter-select"><option>Runtime</option></select>
    <label class="filter-check"><input type="checkbox" /> Colab</label>
    <label class="filter-check"><input type="checkbox" /> JupyterLite</label>
    <button class="clear-btn">
      <svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Clear
    </button>
  </div>
</body>
</html>
