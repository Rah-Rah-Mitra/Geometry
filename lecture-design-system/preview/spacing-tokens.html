<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 20px 24px; }
  .label { font-size: 11px; color: #94A3B8; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
  .tokens { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 18px; }
  .token {
    background: #1E3A8A; border-radius: 4px; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
  }
  .token span { font-size: 10px; color: #94A3B8; margin-top: 4px; font-weight: 600; }
  .margins { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .margin-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; background: #F8FAFC; border: 1px solid #E2E8F0;
    border-radius: 6px; font-size: 12px; color: #475569; font-weight: 600;
  }
  .margin-tag .bar { height: 12px; background: #2563EB; border-radius: 2px; opacity: 0.6; }
</style>
</head>
<body>
  <div class="label">Spacing Scale</div>
  <div class="tokens">
    <div><div class="token" style="width:16px;height:16px;"></div><span>8 xs</span></div>
    <div><div class="token" style="width:20px;height:24px;"></div><span>16 sm</span></div>
    <div><div class="token" style="width:24px;height:32px;"></div><span>24 md</span></div>
    <div><div class="token" style="width:28px;height:44px;"></div><span>40 lg</span></div>
    <div><div class="token" style="width:32px;height:60px;"></div><span>64 xl</span></div>
    <div><div class="token" style="width:36px;height:76px;"></div><span>96 2xl</span></div>
  </div>
  <div class="label">Slide Margins (1920×1080)</div>
  <div class="margins">
    <div class="margin-tag"><div class="bar" style="width:24px;"></div>Top 80px</div>
    <div class="margin-tag"><div class="bar" style="width:28px;"></div>Sides 96px</div>
    <div class="margin-tag"><div class="bar" style="width:20px;"></div>Bottom 64px</div>
  </div>
</body>
</html>
