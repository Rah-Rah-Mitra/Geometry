<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Gradient Methods</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Contour plot with gradient descent path -->
          <!-- Contour ellipses -->
          <ellipse cx="95" cy="65" rx="55" ry="35" fill="none" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(-20,95,65)"/>
          <ellipse cx="95" cy="65" rx="40" ry="24" fill="none" stroke="#CBD5E1" stroke-width="0.8" transform="rotate(-20,95,65)"/>
          <ellipse cx="95" cy="65" rx="25" ry="14" fill="none" stroke="#94A3B8" stroke-width="0.8" transform="rotate(-20,95,65)"/>
          <ellipse cx="95" cy="65" rx="10" ry="5" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="0.8" transform="rotate(-20,95,65)"/>
          <!-- GD path -->
          <defs><marker id="gda" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs>
          <path d="M30 30 L50 55 L70 48 L82 58 L90 60 L93 63" fill="none" stroke="#B45309" stroke-width="1.2" marker-end="url(#gda)"/>
          <circle cx="30" cy="30" r="3" fill="#B45309"/>
          <text x="15" y="26" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">start</text>
          <!-- Minimum -->
          <circle cx="95" cy="64" r="2.5" fill="#2563EB"/>
          <text x="100" y="62" font-size="7" fill="#2563EB" font-weight="600" font-family="Source Sans 3">x*</text>
          <!-- Gradient arrow at a point -->
          <text x="20" y="112" font-size="7" fill="#64748B" font-family="Source Sans 3">x(k+1) = x(k) - alpha * grad f</text>
        </svg>
        <div class="cell-label">Gradient Descent on Contours</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Newton vs GD convergence -->
          <line x1="15" y1="100" x2="150" y2="100" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="15" y1="10" x2="15" y2="100" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- GD: linear convergence (slow) -->
          <path d="M20 20 Q40 30 60 50 Q80 65 100 75 Q120 82 140 86" fill="none" stroke="#B45309" stroke-width="1.5"/>
          <!-- Newton: quadratic (fast) -->
          <path d="M20 20 Q30 50 40 72 Q48 82 55 86 Q60 88 70 89" fill="none" stroke="#2563EB" stroke-width="1.5"/>
          <!-- Labels -->
          <text x="100" y="72" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">GD (linear)</text>
          <text x="72" y="86" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">Newton (quadratic)</text>
          <!-- Axis labels -->
          <text x="70" y="112" font-size="7" fill="#64748B" font-family="Source Sans 3">iteration k</text>
          <text x="4" y="55" font-size="7" fill="#64748B" font-family="Source Sans 3" transform="rotate(-90,8,55)">log error</text>
        </svg>
        <div class="cell-label">Convergence Rates</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Convexity &amp; Constraints</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Convex vs non-convex -->
          <!-- Convex set -->
          <path d="M20 70 Q25 30 50 25 Q70 22 80 40 Q85 60 75 75 Q55 80 20 70" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1.2"/>
          <!-- Line segment inside (proof of convexity) -->
          <circle cx="35" cy="45" r="2.5" fill="#2563EB"/><circle cx="68" cy="55" r="2.5" fill="#2563EB"/>
          <line x1="35" y1="45" x2="68" y2="55" stroke="#2563EB" stroke-width="1" stroke-dasharray="2 1.5"/>
          <text x="35" y="90" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">convex</text>
          <!-- Non-convex set -->
          <path d="M100 70 Q105 30 120 25 Q135 22 145 40 Q140 52 125 48 Q115 55 130 75 Q115 80 100 70" fill="rgba(180,83,9,0.08)" stroke="#B45309" stroke-width="1.2"/>
          <!-- Line going outside -->
          <circle cx="110" cy="42" r="2.5" fill="#B45309"/><circle cx="135" cy="58" r="2.5" fill="#B45309"/>
          <line x1="110" y1="42" x2="135" y2="58" stroke="#B45309" stroke-width="1" stroke-dasharray="2 1.5"/>
          <!-- Part outside -->
          <circle cx="125" cy="51" r="1.5" fill="white" stroke="#B45309" stroke-width="0.8"/>
          <text x="105" y="90" font-size="8" fill="#B45309" font-weight="600" font-family="Source Sans 3">non-convex</text>
        </svg>
        <div class="cell-label">Convex vs Non-Convex Sets</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Lagrangian / KKT: constrained optimization -->
          <!-- Objective contours -->
          <ellipse cx="55" cy="40" rx="35" ry="22" fill="none" stroke="#E2E8F0" stroke-width="0.6" transform="rotate(-15,55,40)"/>
          <ellipse cx="55" cy="40" rx="50" ry="32" fill="none" stroke="#E2E8F0" stroke-width="0.6" transform="rotate(-15,55,40)"/>
          <ellipse cx="55" cy="40" rx="65" ry="42" fill="none" stroke="#E2E8F0" stroke-width="0.6" transform="rotate(-15,55,40)"/>
          <!-- Constraint boundary -->
          <path d="M90 15 Q110 40 100 70 Q92 90 85 100" fill="none" stroke="#0F766E" stroke-width="1.8"/>
          <text x="105" y="50" font-size="7" fill="#0F766E" font-weight="600" font-family="Source Sans 3">g(x)=0</text>
          <!-- Optimal point (tangency) -->
          <circle cx="96" cy="52" r="3.5" fill="#B45309"/>
          <text x="85" y="64" font-size="7" fill="#B45309" font-weight="700" font-family="Source Sans 3">x*</text>
          <!-- Gradient arrows at optimal -->
          <defs><marker id="la" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
          <marker id="lb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker></defs>
          <line x1="96" y1="52" x2="115" y2="42" stroke="#2563EB" stroke-width="1" marker-end="url(#la)"/>
          <text x="118" y="40" font-size="6" fill="#2563EB" font-family="Source Sans 3">grad f</text>
          <line x1="96" y1="52" x2="112" y2="44" stroke="#0F766E" stroke-width="0.8" marker-end="url(#lb)" stroke-dasharray="2 1"/>
          <!-- KKT formula -->
          <text x="10" y="100" font-size="7" fill="#64748B" font-family="Source Sans 3">grad f = lambda * grad g (KKT)</text>
        </svg>
        <div class="cell-label">Lagrange / KKT Conditions</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">LP &amp; Duality</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Linear programming feasible region -->
          <line x1="15" y1="95" x2="150" y2="95" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="15" y1="10" x2="15" y2="95" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- Feasible polytope -->
          <polygon points="30,90 30,45 65,25 110,35 120,70 90,90" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1.2"/>
          <!-- Objective direction -->
          <defs><marker id="oa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs>
          <line x1="55" y1="60" x2="80" y2="40" stroke="#B45309" stroke-width="1.2" marker-end="url(#oa)"/>
          <text x="82" y="38" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">max c'x</text>
          <!-- Optimal vertex -->
          <circle cx="110" cy="35" r="4" fill="#0F766E"/>
          <text x="114" y="32" font-size="7" fill="#0F766E" font-weight="700" font-family="Source Sans 3">x*</text>
          <!-- Iso-objective lines -->
          <line x1="85" y1="75" x2="115" y2="55" stroke="#B45309" stroke-width="0.5" stroke-dasharray="2 1.5"/>
          <line x1="95" y1="70" x2="125" y2="50" stroke="#B45309" stroke-width="0.5" stroke-dasharray="2 1.5"/>
          <text x="40" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">optimum at vertex</text>
        </svg>
        <div class="cell-label">Linear Programming</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Strong duality gap diagram -->
          <line x1="15" y1="95" x2="150" y2="95" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="15" y1="10" x2="15" y2="95" stroke="#CBD5E1" stroke-width="0.8"/>
          <!-- Primal (decreasing) -->
          <path d="M25 25 Q50 30 75 42 Q100 55 125 62 Q140 66 148 68" fill="none" stroke="#2563EB" stroke-width="1.5"/>
          <!-- Dual (increasing) -->
          <path d="M25 85 Q50 78 75 68 Q100 60 125 58 Q140 56 148 55" fill="none" stroke="#0F766E" stroke-width="1.5"/>
          <!-- Gap -->
          <line x1="80" y1="44" x2="80" y2="66" stroke="#B45309" stroke-width="1"/>
          <line x1="77" y1="44" x2="83" y2="44" stroke="#B45309" stroke-width="0.8"/>
          <line x1="77" y1="66" x2="83" y2="66" stroke="#B45309" stroke-width="0.8"/>
          <text x="84" y="58" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">gap</text>
          <!-- Convergence point -->
          <circle cx="148" cy="62" r="3" fill="#1E3A8A"/>
          <text x="130" y="78" font-size="7" fill="#1E3A8A" font-weight="600" font-family="Source Sans 3">strong duality</text>
          <!-- Labels -->
          <text x="28" y="20" font-size="8" fill="#2563EB" font-weight="600" font-family="Source Sans 3">primal</text>
          <text x="28" y="92" font-size="8" fill="#0F766E" font-weight="600" font-family="Source Sans 3">dual</text>
        </svg>
        <div class="cell-label">Duality Gap</div>
      </div>
    </div>
  </div>
</body>
</html>
