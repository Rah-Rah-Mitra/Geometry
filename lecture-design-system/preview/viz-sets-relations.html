<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Venn Diagrams</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="55" r="38" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1.2"/>
          <circle cx="100" cy="55" r="38" fill="rgba(15,118,110,0.1)" stroke="#0F766E" stroke-width="1.2"/>
          <text x="42" y="58" font-size="13" fill="#2563EB" font-weight="700" font-family="Source Sans 3">A</text>
          <text x="110" y="58" font-size="13" fill="#0F766E" font-weight="700" font-family="Source Sans 3">B</text>
        </svg>
        <div class="cell-label">2-Set Venn</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <circle cx="65" cy="48" r="32" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1"/>
          <circle cx="95" cy="48" r="32" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1"/>
          <circle cx="80" cy="75" r="32" fill="rgba(109,40,217,0.08)" stroke="#6D28D9" stroke-width="1"/>
          <text x="44" y="42" font-size="11" fill="#2563EB" font-weight="700" font-family="Source Sans 3">A</text>
          <text x="108" y="42" font-size="11" fill="#0F766E" font-weight="700" font-family="Source Sans 3">B</text>
          <text x="73" y="96" font-size="11" fill="#6D28D9" font-weight="700" font-family="Source Sans 3">C</text>
        </svg>
        <div class="cell-label">3-Set Venn</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Euler & Hasse Diagrams</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="80" cy="55" rx="68" ry="45" fill="rgba(30,58,138,0.05)" stroke="#CBD5E1" stroke-width="1"/>
          <text x="135" y="22" font-size="10" fill="#64748B" font-weight="600" font-family="Source Sans 3">U</text>
          <ellipse cx="60" cy="50" rx="35" ry="25" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1"/>
          <ellipse cx="60" cy="50" rx="18" ry="14" fill="rgba(37,99,235,0.15)" stroke="#1E3A8A" stroke-width="1"/>
          <text x="55" y="54" font-size="10" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">A</text>
          <text x="82" y="44" font-size="10" fill="#2563EB" font-weight="700" font-family="Source Sans 3">B</text>
          <circle cx="120" cy="60" r="14" fill="rgba(180,83,9,0.1)" stroke="#B45309" stroke-width="1"/>
          <text x="116" y="64" font-size="10" fill="#B45309" font-weight="700" font-family="Source Sans 3">C</text>
        </svg>
        <div class="cell-label">Euler (A ⊂ B, C disjoint)</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Hasse diagram for P({a,b}) -->
          <line x1="80" y1="20" x2="40" y2="55" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="80" y1="20" x2="120" y2="55" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="40" y1="55" x2="80" y2="90" stroke="#CBD5E1" stroke-width="1.2"/>
          <line x1="120" y1="55" x2="80" y2="90" stroke="#CBD5E1" stroke-width="1.2"/>
          <circle cx="80" cy="20" r="5" fill="#1E3A8A"/>
          <circle cx="40" cy="55" r="5" fill="#2563EB"/>
          <circle cx="120" cy="55" r="5" fill="#2563EB"/>
          <circle cx="80" cy="90" r="5" fill="#0F766E"/>
          <text x="88" y="24" font-size="10" fill="#1E3A8A" font-weight="600" font-family="STIX Two Text" font-style="italic">{a,b}</text>
          <text x="14" y="59" font-size="10" fill="#2563EB" font-weight="600" font-family="STIX Two Text" font-style="italic">{a}</text>
          <text x="128" y="59" font-size="10" fill="#2563EB" font-weight="600" font-family="STIX Two Text" font-style="italic">{b}</text>
          <text x="88" y="95" font-size="10" fill="#0F766E" font-weight="600" font-family="STIX Two Text" font-style="italic">∅</text>
          <text x="58" y="115" font-size="9" fill="#64748B" font-family="Source Sans 3" font-weight="600">ordered by ⊆</text>
        </svg>
        <div class="cell-label">Hasse (Power Set)</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Relations & Partitions</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 100" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Equivalence classes -->
          <ellipse cx="40" cy="50" rx="28" ry="35" fill="rgba(37,99,235,0.08)" stroke="#2563EB" stroke-width="1" stroke-dasharray="3 2"/>
          <ellipse cx="90" cy="50" rx="22" ry="35" fill="rgba(15,118,110,0.08)" stroke="#0F766E" stroke-width="1" stroke-dasharray="3 2"/>
          <ellipse cx="135" cy="50" rx="20" ry="35" fill="rgba(109,40,217,0.08)" stroke="#6D28D9" stroke-width="1" stroke-dasharray="3 2"/>
          <circle cx="35" cy="35" r="3" fill="#2563EB"/><circle cx="45" cy="50" r="3" fill="#2563EB"/><circle cx="35" cy="65" r="3" fill="#2563EB"/>
          <circle cx="88" cy="40" r="3" fill="#0F766E"/><circle cx="92" cy="60" r="3" fill="#0F766E"/>
          <circle cx="130" cy="38" r="3" fill="#6D28D9"/><circle cx="140" cy="55" r="3" fill="#6D28D9"/><circle cx="130" cy="65" r="3" fill="#6D28D9"/>
          <text x="25" y="92" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">[a]</text>
          <text x="80" y="92" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">[b]</text>
          <text x="125" y="92" font-size="9" fill="#6D28D9" font-weight="600" font-family="Source Sans 3">[c]</text>
        </svg>
        <div class="cell-label">Equivalence Classes</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 100" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Relation as arrow diagram -->
          <circle cx="30" cy="25" r="4" fill="#2563EB"/><text x="20" y="18" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">1</text>
          <circle cx="30" cy="50" r="4" fill="#2563EB"/><text x="20" y="43" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">2</text>
          <circle cx="30" cy="75" r="4" fill="#2563EB"/><text x="20" y="68" font-size="9" fill="#2563EB" font-weight="600" font-family="Source Sans 3">3</text>
          <circle cx="130" cy="25" r="4" fill="#0F766E"/><text x="137" y="29" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">a</text>
          <circle cx="130" cy="50" r="4" fill="#0F766E"/><text x="137" y="54" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">b</text>
          <circle cx="130" cy="75" r="4" fill="#0F766E"/><text x="137" y="79" font-size="9" fill="#0F766E" font-weight="600" font-family="Source Sans 3">c</text>
          <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
          <line x1="35" y1="25" x2="124" y2="25" stroke="#475569" stroke-width="1" marker-end="url(#ah)"/>
          <line x1="35" y1="50" x2="124" y2="25" stroke="#475569" stroke-width="1" marker-end="url(#ah)"/>
          <line x1="35" y1="50" x2="124" y2="75" stroke="#475569" stroke-width="1" marker-end="url(#ah)"/>
          <line x1="35" y1="75" x2="124" y2="50" stroke="#475569" stroke-width="1" marker-end="url(#ah)"/>
          <text x="65" y="95" font-size="9" fill="#64748B" font-family="Source Sans 3" font-weight="600">R ⊆ A × B</text>
        </svg>
        <div class="cell-label">Binary Relation</div>
      </div>
    </div>
  </div>
</body>
</html>
