<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }
  .label { font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
  .cell-label { font-size: 10px; font-weight: 600; color: #475569; margin-top: 4px; text-align: center; }
  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Camera Models &amp; Epipolar Geometry</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Pinhole camera model -->
          <!-- Optical axis -->
          <line x1="15" y1="60" x2="145" y2="60" stroke="#E2E8F0" stroke-width="0.5" stroke-dasharray="2 2"/>
          <!-- Camera center -->
          <circle cx="25" cy="60" r="4" fill="#1E3A8A"/>
          <text x="15" y="52" font-size="7" fill="#1E3A8A" font-weight="700" font-family="Source Sans 3">C</text>
          <!-- Image plane -->
          <line x1="60" y1="25" x2="60" y2="95" stroke="#2563EB" stroke-width="1.5"/>
          <text x="50" y="20" font-size="7" fill="#2563EB" font-weight="600" font-family="Source Sans 3">image</text>
          <!-- 3D point -->
          <circle cx="130" cy="30" r="3" fill="#0F766E"/>
          <text x="134" y="28" font-size="7" fill="#0F766E" font-weight="700" font-family="Source Sans 3">P</text>
          <!-- Projection ray -->
          <line x1="25" y1="60" x2="130" y2="30" stroke="#94A3B8" stroke-width="0.8"/>
          <!-- Image point -->
          <circle cx="60" cy="51" r="2.5" fill="#B45309"/>
          <text x="63" y="48" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">p</text>
          <!-- Focal length -->
          <line x1="25" y1="68" x2="60" y2="68" stroke="#6D28D9" stroke-width="0.6"/>
          <line x1="25" y1="66" x2="25" y2="70" stroke="#6D28D9" stroke-width="0.6"/>
          <line x1="60" y1="66" x2="60" y2="70" stroke="#6D28D9" stroke-width="0.6"/>
          <text x="36" y="76" font-size="7" fill="#6D28D9" font-weight="600" font-family="Source Sans 3">f</text>
          <!-- Formula -->
          <text x="20" y="108" font-size="7" fill="#64748B" font-family="Source Sans 3">p = K[R|t]P, K = [f 0 cx; ...]</text>
        </svg>
        <div class="cell-label">Pinhole Camera Model</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 120" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Epipolar geometry -->
          <!-- Left camera -->
          <polygon points="10,85 20,65 30,85" fill="rgba(37,99,235,0.1)" stroke="#2563EB" stroke-width="1"/>
          <text x="14" y="96" font-size="7" fill="#2563EB" font-weight="700" font-family="Source Sans 3">C1</text>
          <!-- Right camera -->
          <polygon points="125,85 135,65 145,85" fill="rgba(15,118,110,0.1)" stroke="#0F766E" stroke-width="1"/>
          <text x="129" y="96" font-size="7" fill="#0F766E" font-weight="700" font-family="Source Sans 3">C2</text>
          <!-- 3D point -->
          <circle cx="80" cy="15" r="3" fill="#B45309"/>
          <text x="85" y="14" font-size="7" fill="#B45309" font-weight="700" font-family="Source Sans 3">X</text>
          <!-- Rays from cameras to point -->
          <line x1="20" y1="70" x2="80" y2="15" stroke="#2563EB" stroke-width="0.8"/>
          <line x1="135" y1="70" x2="80" y2="15" stroke="#0F766E" stroke-width="0.8"/>
          <!-- Baseline -->
          <line x1="20" y1="75" x2="135" y2="75" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="3 2"/>
          <!-- Epipoles -->
          <circle cx="20" cy="75" r="2" fill="#1E3A8A"/><circle cx="135" cy="75" r="2" fill="#1E3A8A"/>
          <text x="8" y="72" font-size="6" fill="#1E3A8A" font-family="Source Sans 3">e1</text>
          <text x="139" y="72" font-size="6" fill="#1E3A8A" font-family="Source Sans 3">e2</text>
          <!-- Epipolar plane shading -->
          <polygon points="20,75 80,15 135,75" fill="rgba(180,83,9,0.05)" stroke="none"/>
          <!-- Formula -->
          <text x="35" y="110" font-size="7" fill="#64748B" font-family="Source Sans 3">x'Fx = 0 (epipolar constraint)</text>
        </svg>
        <div class="cell-label">Epipolar Geometry</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Multi-View &amp; Reconstruction</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Bundle adjustment diagram -->
          <!-- Camera poses -->
          <polygon points="15,75 22,60 29,75" fill="rgba(37,99,235,0.15)" stroke="#2563EB" stroke-width="0.8"/>
          <polygon points="55,80 62,65 69,80" fill="rgba(37,99,235,0.15)" stroke="#2563EB" stroke-width="0.8"/>
          <polygon points="100,78 107,63 114,78" fill="rgba(37,99,235,0.15)" stroke="#2563EB" stroke-width="0.8"/>
          <polygon points="130,70 137,55 144,70" fill="rgba(37,99,235,0.15)" stroke="#2563EB" stroke-width="0.8"/>
          <!-- 3D points -->
          <circle cx="40" cy="25" r="3" fill="#0F766E"/><circle cx="80" cy="18" r="3" fill="#0F766E"/>
          <circle cx="110" cy="22" r="3" fill="#0F766E"/><circle cx="60" cy="35" r="3" fill="#0F766E"/>
          <circle cx="95" cy="30" r="3" fill="#0F766E"/>
          <!-- Observation rays -->
          <line x1="22" y1="62" x2="40" y2="27" stroke="#94A3B8" stroke-width="0.4"/><line x1="22" y1="62" x2="60" y2="37" stroke="#94A3B8" stroke-width="0.4"/>
          <line x1="62" y1="67" x2="40" y2="27" stroke="#94A3B8" stroke-width="0.4"/><line x1="62" y1="67" x2="80" y2="20" stroke="#94A3B8" stroke-width="0.4"/>
          <line x1="62" y1="67" x2="60" y2="37" stroke="#94A3B8" stroke-width="0.4"/>
          <line x1="107" y1="65" x2="80" y2="20" stroke="#94A3B8" stroke-width="0.4"/><line x1="107" y1="65" x2="95" y2="32" stroke="#94A3B8" stroke-width="0.4"/>
          <line x1="107" y1="65" x2="110" y2="24" stroke="#94A3B8" stroke-width="0.4"/>
          <line x1="137" y1="57" x2="110" y2="24" stroke="#94A3B8" stroke-width="0.4"/><line x1="137" y1="57" x2="95" y2="32" stroke="#94A3B8" stroke-width="0.4"/>
          <!-- Label -->
          <text x="15" y="100" font-size="7" fill="#64748B" font-family="Source Sans 3">min sum ||proj(Xi, Cj) - xij||^2</text>
        </svg>
        <div class="cell-label">Bundle Adjustment</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Homography: plane-to-plane mapping -->
          <!-- Source plane -->
          <polygon points="10,45 55,25 65,65 20,85" fill="rgba(37,99,235,0.06)" stroke="#2563EB" stroke-width="1"/>
          <!-- Grid on source -->
          <line x1="20" y1="38" x2="60" y2="30" stroke="#2563EB" stroke-width="0.4"/>
          <line x1="25" y1="55" x2="62" y2="45" stroke="#2563EB" stroke-width="0.4"/>
          <line x1="30" y1="72" x2="64" y2="58" stroke="#2563EB" stroke-width="0.4"/>
          <line x1="22" y1="42" x2="27" y2="78" stroke="#2563EB" stroke-width="0.4"/>
          <line x1="38" y1="34" x2="45" y2="72" stroke="#2563EB" stroke-width="0.4"/>
          <line x1="53" y1="28" x2="62" y2="62" stroke="#2563EB" stroke-width="0.4"/>
          <!-- Dest plane -->
          <polygon points="90,40 145,30 150,80 95,90" fill="rgba(15,118,110,0.06)" stroke="#0F766E" stroke-width="1"/>
          <!-- Grid on dest (warped) -->
          <line x1="95" y1="46" x2="147" y2="36" stroke="#0F766E" stroke-width="0.4"/>
          <line x1="96" y1="62" x2="148" y2="52" stroke="#0F766E" stroke-width="0.4"/>
          <line x1="97" y1="78" x2="149" y2="68" stroke="#0F766E" stroke-width="0.4"/>
          <line x1="100" y1="42" x2="98" y2="88" stroke="#0F766E" stroke-width="0.4"/>
          <line x1="120" y1="36" x2="122" y2="84" stroke="#0F766E" stroke-width="0.4"/>
          <line x1="140" y1="32" x2="146" y2="76" stroke="#0F766E" stroke-width="0.4"/>
          <!-- Arrow -->
          <defs><marker id="ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs>
          <path d="M62 45 Q76 38 88 42" fill="none" stroke="#B45309" stroke-width="1.2" marker-end="url(#ha)"/>
          <text x="68" y="34" font-size="8" fill="#B45309" font-weight="700" font-family="Source Sans 3">H</text>
          <!-- Formula -->
          <text x="25" y="106" font-size="7" fill="#64748B" font-family="Source Sans 3">x' ~ Hx, H in GL(3) / scale</text>
        </svg>
        <div class="cell-label">Homography Mapping</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="label">Lens &amp; Distortion</div>
    <div class="grid">
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Radial distortion: barrel vs pincushion -->
          <!-- Undistorted grid -->
          <rect x="15" y="15" width="55" height="55" fill="none" stroke="#CBD5E1" stroke-width="0.8"/>
          <line x1="15" y1="33" x2="70" y2="33" stroke="#CBD5E1" stroke-width="0.4"/><line x1="15" y1="51" x2="70" y2="51" stroke="#CBD5E1" stroke-width="0.4"/>
          <line x1="33" y1="15" x2="33" y2="70" stroke="#CBD5E1" stroke-width="0.4"/><line x1="51" y1="15" x2="51" y2="70" stroke="#CBD5E1" stroke-width="0.4"/>
          <text x="30" y="82" font-size="7" fill="#64748B" font-family="Source Sans 3">undistorted</text>
          <!-- Barrel distortion -->
          <path d="M90,18 Q95,15 110,15 Q125,15 130,18" fill="none" stroke="#2563EB" stroke-width="0.8"/>
          <path d="M90,68 Q95,72 110,72 Q125,72 130,68" fill="none" stroke="#2563EB" stroke-width="0.8"/>
          <path d="M88,20 Q85,30 85,42 Q85,55 88,65" fill="none" stroke="#2563EB" stroke-width="0.8"/>
          <path d="M132,20 Q135,30 135,42 Q135,55 132,65" fill="none" stroke="#2563EB" stroke-width="0.8"/>
          <!-- Internal barrel lines -->
          <path d="M90,36 Q95,34 110,34 Q125,34 130,36" fill="none" stroke="#2563EB" stroke-width="0.4"/>
          <path d="M90,52 Q95,54 110,54 Q125,54 130,52" fill="none" stroke="#2563EB" stroke-width="0.4"/>
          <path d="M102,18 Q100,30 100,42 Q100,55 102,68" fill="none" stroke="#2563EB" stroke-width="0.4"/>
          <path d="M118,18 Q120,30 120,42 Q120,55 118,68" fill="none" stroke="#2563EB" stroke-width="0.4"/>
          <text x="95" y="82" font-size="7" fill="#2563EB" font-weight="600" font-family="Source Sans 3">barrel (k1&lt;0)</text>
          <!-- Formula -->
          <text x="15" y="100" font-size="7" fill="#64748B" font-family="Source Sans 3">r' = r(1 + k1*r^2 + k2*r^4)</text>
        </svg>
        <div class="cell-label">Radial Distortion</div>
      </div>
      <div class="cell">
        <svg viewBox="0 0 160 110" width="140" xmlns="http://www.w3.org/2000/svg">
          <!-- Stereo rectification -->
          <!-- Left image -->
          <rect x="10" y="15" width="55" height="40" rx="2" fill="rgba(37,99,235,0.04)" stroke="#2563EB" stroke-width="1"/>
          <!-- Epipolar lines (horizontal after rectification) -->
          <line x1="10" y1="28" x2="65" y2="28" stroke="#B45309" stroke-width="0.5"/>
          <line x1="10" y1="38" x2="65" y2="38" stroke="#B45309" stroke-width="0.5"/>
          <line x1="10" y1="48" x2="65" y2="48" stroke="#B45309" stroke-width="0.5"/>
          <!-- Feature point -->
          <circle cx="40" cy="38" r="3" fill="#2563EB"/>
          <!-- Right image -->
          <rect x="95" y="15" width="55" height="40" rx="2" fill="rgba(15,118,110,0.04)" stroke="#0F766E" stroke-width="1"/>
          <line x1="95" y1="28" x2="150" y2="28" stroke="#B45309" stroke-width="0.5"/>
          <line x1="95" y1="38" x2="150" y2="38" stroke="#B45309" stroke-width="0.5"/>
          <line x1="95" y1="48" x2="150" y2="48" stroke="#B45309" stroke-width="0.5"/>
          <!-- Matching point (same row) -->
          <circle cx="120" cy="38" r="3" fill="#0F766E"/>
          <!-- Disparity arrow -->
          <line x1="40" y1="62" x2="40" y2="68" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="1 1"/>
          <line x1="120" y1="62" x2="120" y2="68" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="1 1"/>
          <line x1="40" y1="72" x2="120" y2="72" stroke="#6D28D9" stroke-width="1"/>
          <line x1="40" y1="70" x2="40" y2="74" stroke="#6D28D9" stroke-width="0.8"/>
          <line x1="120" y1="70" x2="120" y2="74" stroke="#6D28D9" stroke-width="0.8"/>
          <text x="68" y="70" font-size="7" fill="#6D28D9" font-weight="600" font-family="Source Sans 3">disparity d</text>
          <!-- Formula -->
          <text x="25" y="90" font-size="7" fill="#64748B" font-family="Source Sans 3">depth Z = f * B / d</text>
          <text x="25" y="102" font-size="7" fill="#B45309" font-weight="600" font-family="Source Sans 3">epipolar lines horizontal</text>
        </svg>
        <div class="cell-label">Stereo Rectification</div>
      </div>
    </div>
  </div>
</body>
</html>
