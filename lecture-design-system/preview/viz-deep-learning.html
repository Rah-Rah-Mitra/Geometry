<!DOCTYPE html>

<head>

<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 20px; }

  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
</style>
</head>

          <rect x="112" y="62" width="9" height="9" rx="1" fill="rgba(180,83,9,0.15)"/>
          <rect x="122" y="62" width="9" height="9" rx="1" fill="rgba(180,83,9,0.08)"/>
          <rect x="102" y="72" width="9" height="9" rx="1" fill="rgba(180,83,9,0.12)"/>
          <rect x="112" y="72" width="9" height="9" rx="1" fill="rgba(180,83,9,0.30)"/>
          <rect x="122" y="72" width="9" height="9" rx="1" fill="rgba(180,83,9,0.18)"/>

        </svg>

  <div class="section">
    <div class="label">Training &amp; Loss Landscapes</div>

      <div class="cell">

          <text x="58" y="44" font-size="7" fill="#0F766E" font-weight="700" font-family="Source Sans 3">Wx</text>
