<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 16px 24px; }
  .box {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 8px;
    border-left: 4px solid; margin-bottom: 8px; font-size: 13px;
  }
  .box:last-child { margin-bottom: 0; }
  .tag { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; min-width: 80px; }
  .desc { color: #475569; font-size: 12px; }
</style>
</head>
<body>
  <div class="box" style="background:#EFF6FF;border-left-color:#2563EB;">
    <span class="tag" style="color:#2563EB;">Definition</span>
    <span class="desc">Blue tint + blue left rule</span>
  </div>
  <div class="box" style="background:#EEF2FF;border-left-color:#1E3A8A;">
    <span class="tag" style="color:#1E3A8A;">Theorem</span>
    <span class="desc">Indigo tint + deep indigo rule</span>
  </div>
  <div class="box" style="background:#F8FAFC;border-left-color:#94A3B8;">
    <span class="tag" style="color:#94A3B8;">Proof</span>
    <span class="desc">Slate tint + neutral rule</span>
  </div>
  <div class="box" style="background:#F0FDFA;border-left-color:#0F766E;">
    <span class="tag" style="color:#0F766E;">Example</span>
    <span class="desc">Teal tint + teal rule</span>
  </div>
  <div class="box" style="background:#FFFBEB;border-left-color:#B45309;">
    <span class="tag" style="color:#B45309;">Warning</span>
    <span class="desc">Amber tint + amber rule</span>
  </div>
  <div class="box" style="background:#F5F3FF;border-left-color:#6D28D9;">
    <span class="tag" style="color:#6D28D9;">Exercise</span>
    <span class="desc">Violet tint + violet rule</span>
  </div>
  <div class="box" style="background:#F8FAFC;border-left-color:#CBD5E1;">
    <span class="tag" style="color:#94A3B8;">Remark</span>
    <span class="desc">Muted tint + slate rule</span>
  </div>
</body>
</html>
