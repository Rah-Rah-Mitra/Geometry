<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #f6f8f7; padding: 16px 20px; }
  .cards { display: flex; gap: 12px; }
  .card {
    flex: 1; background: #fff; border: 1px solid #d8e0da; border-radius: 8px;
    padding: 14px; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  }
  .card-track { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #087568; letter-spacing: 0.02em; }
  .card-title { font-size: 15px; font-weight: 600; color: #15211d; margin-top: 8px; line-height: 1.3; }
  .card-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: #5d6b66; }
  .card-meta span { display: flex; align-items: center; gap: 4px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px;
    background: #fff; border: 1px solid #d8e0da; border-radius: 6px;
    font-size: 11px; font-weight: 500; color: #15211d;
  }
  .tag { display: inline-block; padding: 3px 8px; background: #edf2ef; border-radius: 6px; font-size: 11px; font-weight: 500; color: #5d6b66; }
  .tags { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="cards">
    <div class="card">
      <div class="card-track">Foundations</div>
      <div class="card-title">The Four Pillars of Geometry</div>
      <div class="card-meta">
        <span>8 notebooks</span>
        <span>Undergraduate</span>
      </div>
      <div class="tags">
        <span class="tag">euclidean</span>
        <span class="tag">projective</span>
        <span class="tag">transformations</span>
      </div>
    </div>
    <div class="card">
      <div class="card-track">Differential</div>
      <div class="card-title">Curves and Surfaces</div>
      <div class="card-meta">
        <span>12 notebooks</span>
        <span>Graduate</span>
      </div>
      <div class="tags">
        <span class="tag">curvature</span>
        <span class="tag">manifolds</span>
      </div>
    </div>
  </div>
</body>
</html>
