<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: #fff; padding: 20px 24px; }
  .label { font-size: 11px; color: #94A3B8; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
  .section { margin-bottom: 18px; }
  .section:last-child { margin-bottom: 0; }
  .radii-row { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .radius-box { width: 48px; height: 48px; background: #EEF2FF; border: 2px solid #1E3A8A; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #1E3A8A; }
  .shadow-row { display: flex; gap: 16px; }
  .shadow-card { width: 120px; height: 56px; background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #475569; font-weight: 600; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Corner Radii</div>
    <div class="radii-row">
      <div class="radius-box" style="border-radius:4px;">4</div>
      <div class="radius-box" style="border-radius:6px;">6</div>
      <div class="radius-box" style="border-radius:8px;">8</div>
      <div class="radius-box" style="border-radius:12px;">12</div>
    </div>
  </div>
  <div class="section">
    <div class="label">Shadows</div>
    <div class="shadow-row">
      <div class="shadow-card" style="box-shadow:0 1px 2px 0 rgb(0 0 0 / 0.05);">shadow-sm</div>
      <div class="shadow-card" style="box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);">shadow-md</div>
      <div class="shadow-card" style="box-shadow:none;border:1px solid #d8e0da;">flat (border)</div>
    </div>
  </div>
</body>
</html>
